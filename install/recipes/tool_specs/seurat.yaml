  category: spatial_analysis
- name: seurat_spatial_qc_cluster
  category: spatial_analysis
- name: seurat_spatial_feature_plot
  category: spatial_analysis
- name: seurat_spatial_dimplot
  category: spatial_analysis
- name: seurat_spatial_variable_features
  category: spatial_analysis
