# svca_worker imports h5py, numpy, pandas and scipy, and worker_utils (stdlib-only). This recipe was
# the whole 958-line spatialomicsgym_e1 (Biomni-E1) env the tool borrows on the capture host, and
# that freeze could not be installed: torchvision 0.24.1 requires torch 2.9.1 against
# torch==2.2.0+cpu, and selenium 4.38.0 requires urllib3>=2.5 against urllib3==1.26.20. These are
# the E1 env's versions of the four packages the worker runs (hunt 2026-09-30, u38d-specs-c-5).
channels:
  - conda-forge
dependencies:
  - python=3.11.14
  - h5py=3.15.1
  - numpy=2.2.6
  - pandas=2.3.3
  - scipy=1.16.3
