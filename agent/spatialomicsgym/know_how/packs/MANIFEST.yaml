        short_description: >-
          Direct use of scvi-tools models (scVI, scANVI, DestVI, totalVI, MultiVI, spatial). Not needed
          for the platform's own deconvolution, integration or annotation tools, which wrap these; pick
          only when the task names scvi-tools or a model.
        # hunt 2026-09-30, u13k2-packs-9: the DestVI workflow ran into KeyError (no counts layer after
