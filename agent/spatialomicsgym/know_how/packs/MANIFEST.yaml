# The tier-2 know-how packs: what was merged, from where, under which licence, with which edits.
#
# This file drives spatialomicsgym/know_how/merge_packs.py. Nothing under packs/ is edited by hand;
# a change is made here, the script is re-run against clones pinned at the commits below, and the
# recorded digest (RECORDED_PACK_DIGEST in the corpus lens, KNOW_HOW_PACKS_HASH in BASELINE.md) is
# re-recorded in the same commit. The two intakes under docs/audit/wave_a/ are the evidence for
# every admission and every refusal named here; DECISIONS.md D-045/D-046/D-056 (and the D-056
# addendum of 2026-09-20, which removed four documents after an audit and a live measurement) are
# the decisions.
#
# Deliberately absent from this file: the strings of the eighteen excluded identifiers. They live
# in merge_packs.EXCLUDED_IDENTIFIERS (outside packs/) and are recorded with their evidence in
# CHINA_EXCLUSION_REPO.md section 19. Everything under packs/ -- this manifest included -- is
# scanned for them, so this record names what it excludes by intake row, not by name.
schema: 1

packs:
  sciagent:
    display_name: SciAgent-Skills
    upstream: https://github.com/jaechang-hits/SciAgent-Skills
