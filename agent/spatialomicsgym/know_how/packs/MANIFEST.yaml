      - name: degenerate-input-filtering
        source: skills/scientific-computing/degenerate-input-filtering/SKILL.md
        dest: sciagent/degenerate-input-filtering.md
        # hunt 2026-09-30, u13k2-packs-8: count removed features out of the features (columns), and report
        #   all-NaN and constant columns separately -- the old code divided removed genes by the sample count
        # hunt 2026-09-30, u13k2-packs-14: no routing to the never-merged statistical-analysis skill
        replace:
          - old: |-
              import pandas as pd
              import numpy as np

              def filter_degenerate(data, context="features"):
                  """Filter degenerate data points and report what was removed.

                  Always call this BEFORE statistical analysis.
                  """
                  n_before = len(data)

                  # Filter based on data type
                  if isinstance(data, pd.DataFrame):
                      # Remove constant columns (zero variance)
                      non_constant = data.loc[:, data.nunique() > 1]
                      # Remove all-NaN columns
                      non_nan = non_constant.dropna(axis=1, how='all')
                      filtered = non_nan
                  elif isinstance(data, list):
                      # Remove None, empty, and zero-length items
                      filtered = [x for x in data if x is not None and len(x) > 0]
                  else:
                      filtered = data

                  n_after = len(filtered) if not isinstance(filtered, pd.DataFrame) else filtered.shape[1]
                  n_removed = n_before if not isinstance(data, pd.DataFrame) else data.shape[1]
                  n_removed = n_removed - n_after

                  # MANDATORY: Print the count
                  print(f"Degenerate {context} filtered: {n_removed} / {n_before} removed")
                  print(f"Remaining {context}: {n_after}")

                  return filtered
            new: |-
              import pandas as pd
              import numpy as np

              def filter_degenerate(data, context="features"):
                  """Filter degenerate data points and report what was removed.

                  Always call this BEFORE statistical analysis. For a DataFrame the features are
                  the columns (samples x features), so every count below is a count of columns.
                  """
                  if isinstance(data, pd.DataFrame):
                      n_before = data.shape[1]
                      n_unique = data.nunique()                 # NaN is not counted as a value
                      all_nan = data.columns[n_unique == 0]     # every value NaN
                      constant = data.columns[n_unique == 1]    # one distinct non-NaN value
                      filtered = data.drop(columns=all_nan.union(constant))
                      n_after = filtered.shape[1]
                      print(f"All-NaN {context} removed: {len(all_nan)} / {n_before}")
                      print(f"Constant {context} removed: {len(constant)} / {n_before}")
                  elif isinstance(data, list):
                      # Remove None, empty, and zero-length items
                      n_before = len(data)
                      filtered = [x for x in data if x is not None and len(x) > 0]
                      n_after = len(filtered)
                  else:
                      n_before = n_after = len(data)
                      filtered = data

                  n_removed = n_before - n_after

                  # MANDATORY: Print the count
                  print(f"Degenerate {context} filtered: {n_removed} / {n_before} removed")
                  print(f"Remaining {context}: {n_after}")

                  return filtered
          - old: See nan-safe-correlation for NaN-aware correlation; statistical-analysis for test guidance.
            new: See nan-safe-correlation for NaN-aware correlation.

