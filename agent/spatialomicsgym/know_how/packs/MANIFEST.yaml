            new: |-
              Plot every gene with a tested p-value (→ `figures/ma_plot.png`); run after Step 7, which imports matplotlib and numpy.

              ```python
              ma = results[["baseMean", "log2FoldChange", "padj"]].dropna(subset=["padj"])
