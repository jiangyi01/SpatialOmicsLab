            new: Run ORA, then draw the dot plot from the exported table (→ `figures/enrichment_dotplot.png`). No plotting skill is merged here, so the plot is drawn directly with matplotlib; GSEApy's `Overlap` column ("k/n") gives the gene ratio.
          - old: |-
