        replace:
          - old: '`pydeseq2>=0.4`, '
            new: '`pydeseq2>=0.5.2`, '
          - old: '- **Data requirements**: Raw (unnormalized)'
            new: |-
              - **API version**: PyDESeq2 API as checked against the v0.5.4 source: since 0.5.2 size factors are `dds.obs["size_factors"]` and dispersions `dds.var["dispersions"]` (0.5.1 and earlier kept them in `obsm`/`varm`); since 0.5.0 `DeseqStats` requires `contrast` and `lfc_shrink(coeff=...)` requires the design-column name (e.g. `"condition[T.treated]"`); `DeseqDataSet(n_cpus=...)` and `inference=DefaultInference(n_cpus=...)` are both accepted.
              - **Data requirements**: Raw (unnormalized)
          - old: dds.obsm['size_factors']
            new: dds.obs['size_factors']
          - old: |
              ds.lfc_shrink()
            new: |
              ds.lfc_shrink(coeff="condition[T.treated]")  # a design-matrix column; required since 0.5.0
          - old: '| `lfc_shrink()` | off | call after `summary()` | apeGLM shrinkage; reduces noisy LFC estimates |'
            new: '| `lfc_shrink(coeff=...)` | off | call after `summary()` | apeGLM shrinkage of one design column, e.g. `"condition[T.treated]"` |'
          - old: '| `contrast` | `None` | `[var, test, ref]` | Which comparison to test; `None` uses last coefficient |'
            new: '| `contrast` | (required) | `[var, test, ref]` | Which comparison to test; `DeseqStats` requires it |'
          - old: '| Shrinkage produces unexpected LFCs | Calling `lfc_shrink()` before `summary()` | Always call `ds.summary()` first, then `ds.lfc_shrink()` |'
            new: '| Shrinkage produces unexpected LFCs | Calling `lfc_shrink()` before `summary()` | Always call `ds.summary()` first, then `ds.lfc_shrink(coeff=...)` |'
          - old: |-
              np.log10(dds.varm["_normed_means"] + 1),
                  np.log10(dds.varm["dispersions"]),
            new: |-
              np.log10(dds.var["_normed_means"] + 1),
                  np.log10(dds.var["dispersions"]),
          - old: |-
              Prepare the DEG table, then **read (upstream skill, not merged here) and follow its "Volcano" recipe** on the exported CSV (→ `figures/volcano_plot.png`).

              ```python
              # Volcano input = log2FoldChange vs padj; saved in Step 6 as deseq2_all_results.csv
              volcano_input = results[["log2FoldChange", "padj"]].dropna()
              print(f"Volcano input: {len(volcano_input)} genes -> deseq2_all_results.csv")
              # (upstream skill, not merged here)
              ```
            new: |-
              Plot every tested gene from the Step 6 table (→ `figures/volcano_plot.png`). No plotting skill is merged here, so the plot is drawn directly with matplotlib.

              ```python
              import os

              import matplotlib.pyplot as plt
              import numpy as np

              volcano = results[["log2FoldChange", "padj"]].dropna()
              sig = (volcano.padj < 0.05) & (volcano.log2FoldChange.abs() > 1.0)
              neg_log_padj = -np.log10(volcano.padj.clip(lower=np.finfo(float).tiny))  # padj can be exactly 0

              os.makedirs("figures", exist_ok=True)
              plt.figure(figsize=(8, 6))
              plt.scatter(volcano.log2FoldChange[~sig], neg_log_padj[~sig], s=8, c="lightgray", label="not significant")
              plt.scatter(volcano.log2FoldChange[sig], neg_log_padj[sig], s=8, c="crimson", label="padj < 0.05, |log2FC| > 1")
              plt.axhline(-np.log10(0.05), color="gray", linestyle="--", linewidth=0.8)
              for x in (-1.0, 1.0):
                  plt.axvline(x, color="gray", linestyle="--", linewidth=0.8)
              plt.xlabel("log2 fold change")
              plt.ylabel("-log10(adjusted p-value)")
              plt.legend()
              plt.savefig("figures/volcano_plot.png", dpi=300, bbox_inches="tight")
              print(f"Volcano: {len(volcano)} genes, {int(sig.sum())} significant -> figures/volcano_plot.png")
              ```
          - old: |-
              Prepare the DEG table, then **read (upstream skill, not merged here) and follow its "MA plot" recipe** on the exported CSV (→ `figures/ma_plot.png`).

