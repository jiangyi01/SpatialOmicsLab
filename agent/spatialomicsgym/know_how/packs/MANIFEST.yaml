      - name: pydeseq2-differential-expression
        source: skills/genomics-bioinformatics/rnaseq/pydeseq2-differential-expression/SKILL.md
        dest: sciagent/pydeseq2-differential-expression.md
        # hunt 2026-09-30, u13k2-packs-5/-13/-14: the PyDESeq2 >= 0.5.2 API the kdense twin states (checked
        #   against the v0.5.4 source; pydeseq2 is not installed in any env here), and volcano/MA plots drawn
        #   here
        excise:
