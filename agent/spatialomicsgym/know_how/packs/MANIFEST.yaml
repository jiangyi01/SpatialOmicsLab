      - name: cellxgene-census
        source: skills/genomics-bioinformatics/single-cell/cellxgene-census/SKILL.md
        dest: sciagent/cellxgene-census.md
        # hunt 2026-09-30, u13k2-packs-13/-14: the twin's TileDB-SOMA-ML loader, checked against cellxgene-
        #   census 1.17.0 (the heavy tool env) and the TileDB-SOMA-ML source; the Short Description no longer routes to
        #   scanpy/anndata skills
        replace:
          - old: ' For your own data use scanpy; for annotated data use anndata.'
            new: ''
          - old: |-
              Train models directly on Census data using the experimental dataloader.

              ```python
              from cellxgene_census.experimental.ml import experiment_dataloader
              import cellxgene_census

              with cellxgene_census.open_soma() as census:
                  dataloader = experiment_dataloader(
                      census["census_data"]["homo_sapiens"],
                      measurement_name="RNA",
                      X_name="raw",
                      obs_value_filter="tissue_general == 'liver' and is_primary_data == True",
                      obs_column_names=["cell_type"],
                      batch_size=128,
                      shuffle=True,
                  )

                  for batch in dataloader:
                      X = batch["X"]           # Gene expression tensor
                      labels = batch["obs"]    # Cell metadata
                      print(f"Batch X shape: {X.shape}, labels: {list(labels.columns)}")
                      break  # Show first batch only
              ```
            new: |-
              Train models on Census data with TileDB-SOMA-ML. The `cellxgene_census.experimental.ml` loaders are deprecated: cellxgene-census 1.17.0 warns on use, and its `experiment_dataloader` takes an `ExperimentDataPipe`, not the arguments this example used to pass.

              ```python
              import cellxgene_census
              import tiledbsoma as soma
              from tiledbsoma_ml import ExperimentDataset, experiment_dataloader

              with cellxgene_census.open_soma() as census:
                  experiment = census["census_data"]["homo_sapiens"]
                  with experiment.axis_query(
                      measurement_name="RNA",
                      obs_query=soma.AxisQuery(value_filter="tissue_general == 'liver' and is_primary_data == True"),
                  ) as query:
                      dataset = ExperimentDataset(
                          query=query,
                          layer_name="raw",
                          obs_column_names=["cell_type"],
                          batch_size=128,
                          shuffle=True,
                      )
                      dataloader = experiment_dataloader(dataset)

                      for X, obs in dataloader:
                          print(f"Batch X shape: {X.shape}, labels: {list(obs.columns)}")
                          break  # Show first batch only
              ```
