        # Picked on 2 of 10 control prompts in the 2026-09-20 measurement (deconvolution, integration);
        # the twin in sciagent/ says the same thing. Scoped the same way, worded distinctly.
        # Kept under 240 characters on purpose: get_pack_summaries clips there, and the scoping
