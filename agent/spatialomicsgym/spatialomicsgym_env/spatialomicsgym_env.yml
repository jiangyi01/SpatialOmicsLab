# Minimal conda env for the SpatialOmicsLab agent CORE (STCoscientist + MCP orchestration
# + data profiling). Excludes torch/transformers/tokenizers/safetensors (langchain-optional)
# and ALL heavy per-tool bio packages — those live in the untouched per-tool worker envs.
# Create:  conda env create -f spatialomicsgym_env.yml
#   (or)   conda create -n spatialomicsgym_env python=3.11 -y && \
#          pip install -r spatialomicsgym_env_requirements.txt && pip install -e . --no-deps
name: spatialomicsgym_env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # --- LLM / agent orchestration ---
      - langchain==0.3.27
      - langchain-core==0.3.79
      # Imported directly by agent/env_collection.py; it was only ever present here because
      # langchain 0.3 happened to pull it. Pinned explicitly so the recipe states its own closure.
      - langchain-text-splitters==0.3.11
      - langchain-anthropic==0.3.22
      - langchain-openai==0.3.35
      - langgraph==0.3.18
      - langsmith==0.4.42
      - anthropic==0.72.1
      - openai==2.38.0
      - tiktoken==0.12.0
      # --- config / IO ---
      - pydantic==2.11.10
      - pydantic_core==2.33.2
      - python-dotenv==1.2.1
      - PyYAML
      - httpx
      - requests
      - tenacity
      - rich==14.2.0
      - tqdm==4.67.1
      # --- data profiling (spatial h5ad) ---
      - numpy==2.2.6
      - pandas
      - pyarrow==21.0.0
      - scipy
      - scikit-learn==1.7.2
      - numexpr==2.14.1
      # 0.12.6 with the unpinned scipy (1.17) broke backed-sparse reads -- '_validate_indices' -- so the
      # tissue premise check crashed in this env (2026-09-30); 0.12.10 is what the portal's python has.
      - anndata==0.12.10
      - scanpy==1.11.5
      # clustering/integration backends so inline sc.tl.leiden + harmony work
      # (agent REPL fallback path; worker envs carry their own copies)
      - python-igraph==1.0.0
      - leidenalg==0.12.0
      - harmonypy==0.0.10  # 2.x breaks scanpy harmony_integrate orientation
      - h5py==3.15.1
      - jsonpatch==1.33
      # --- in-process bio tools (spatialomicsgym/tool/*) ---
      # The agent's catalogue advertises them and they run in THIS interpreter; without these,
      # 32 of the 41 tools in five modules failed on import or on call (hunt 2026-09-30,
      # uT5-molbio-48; user decision: add the dependencies rather than hide the tools).
      - biopython==1.88
      - beautifulsoup4==4.15.0
      - scikit-image==0.26.0
      - opencv-python-headless==5.0.0.93
      - trackpy==0.7
      - rdkit==2025.9.1   # pharmacology's RDKit tools (hunt 2026-09-30, uT2-pharmacology-22/30)
      - fcsparser==0.2.4   # FCS reader for cell_biology's two flow tools (hunt 2026-09-30, uT5-molbio-45/48)
      # --- MCP client + web portal ---
      - mcp==1.27.0
      - fastmcp==3.2.3
      - nest_asyncio==1.6.0   # required by add_mcp() to register MCP tools as REPL callables
      - gradio==5.49.1
      # sog-web's dataset upload. It arrives transitively today (gradio depends on it), which is
      # precisely why it is named here: the portal must not lose its upload button to somebody
      # else's dependency bump.
      - python-multipart==0.0.32
      # --- tests / lint ---
      - pytest==9.0.1
      - ruff==0.14.5
