# The egress policy: every destination this platform may reach, and why.
#
# Seeded from a scan of the shipped tree and maintained by hand since: no command regenerates it
# (`sog-web egress inventory`, named here before, never existed). Every host below is one some
# shipped code actually names; a module that starts reaching a new host must add it here.
#
# READ-ONLY TO EVERY AGENT AND EVERY TOOL. Changing it is an operator action on the shell.
# Nothing in `spatialomicsgym/` writes this file, and a lens fails the suite if anything starts
# to. The portal runs as root so DAC cannot stop it; what stops it is that no writer exists, and
# the sha256 of the bytes actually loaded is recorded at every boot.
#
# SCOPE tells you which boundary enforces an entry:
#   tool   - an in-process research module in the portal (http_client's allowlist)
#   worker - reachable from the sog-agent REPL worker or an MCP tool worker (the proxy)
#   setup  - package installation (the broker and the recipe lens)
#
# A `paths:` block makes an entry PATH-GRANULAR: being on the host is not enough. That is
# enforced at the broker and over the recipes. It CANNOT be enforced at the proxy, which sees
# only `CONNECT github.com:443` -- see SECURITY.md, 'What this does not stop'.

version: 1

defaults:
  max_redirects: 4              # R5.2: re-check every hop, cap the chain
  max_response_bytes: 8388608   # R5.4: charge the DECOMPRESSED size
  deadline_grace_seconds: 60    # wall clock beyond the caller's timeout
  refuse_private_ranges: true   # R5.3: no private/link-local/loopback/CGNAT

