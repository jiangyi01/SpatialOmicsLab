      source: official_repo
      source_file: "Neighborseq::prep_cell_mat formals (installed package, /opt/conda/envs/neighborseq)"
      confidence: high
      notes: "Read out of the installed package rather than its prose: prep_cell_mat(ge, celltypes,
        logfc.threshold = 1, min.pct = 0.25, max.cells = 200, topn = 50, res = 0.8) keeps the topn
        strongest markers per cluster, and topn = 50 is the value here. Our portal exposes no
        n_markers -- it declares n_top, which is the number of interactions reported, a different
        quantity -- so this row is provenance only. tools/neighborseq_worker.R hardcodes the same 50
        in its own Seurat-v5-compatible reimplementation of prep_cell_mat."
    logfc_threshold:
      value: 1
      source: official_repo
      source_file: "Neighborseq::prep_cell_mat formals (installed package, /opt/conda/envs/neighborseq)"
      confidence: high
      adopted: false
      notes: "RECORDED, NOT RUN. Upstream prep_cell_mat defaults logfc.threshold = 1 and passes it
        to FindAllMarkers. Our Seurat-v5-compatible reimplementation at
        tools/neighborseq_worker.R (MARKER_LOGFC_THRESHOLD) passes 0.25, which is Seurat's own default rather than the
        value Neighborseq raised it to -- four times looser. Adopting 1 would change the marker
        panel of every neighborseq run and move any recorded result, so the row records the
        divergence and the worker stands. See also the min_pct row, which diverges the same way."
    min_pct:
      value: 0.25
      source: official_repo
      source_file: "Neighborseq::prep_cell_mat formals (installed package, /opt/conda/envs/neighborseq)"
      confidence: high
      adopted: false
      notes: "RECORDED, NOT RUN. Upstream prep_cell_mat defaults min.pct = 0.25; our reimplementation
        at tools/neighborseq_worker.R (MARKER_MIN_PCT) passes 0.1, again Seurat's own default. min.pct is a
        detection-rate floor, not a fold-change one, so the looser value admits genes seen in as few
        as 10 percent of a cluster -- and because the panel is then cut with top_n on log fold
        change, those rarely-detected genes rank high rather than being trimmed. The divergence is
        therefore directional and not merely wider. The same call no longer passes max.cells.per.ident
        = 200 (upstream max.cells = 200): the marker test now uses every cell, a deliberate divergence
        under the no-subsampling policy."

