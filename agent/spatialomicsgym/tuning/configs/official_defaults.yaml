# Official default hyperparameters recovered from tool source code.
#
# Provenance tracking:
#   source: official_repo | documentation | paper | spatialomicsgym_config | inferred
#   source_file: GitHub URL, config path, or paper reference
#   confidence: high | medium | low
#   version: tool version if relevant
#   adopted: false  -> recorded for provenance only; we deliberately run something else
#
# Priority: official_repo > documentation > paper > spatialomicsgym_config > inferred
#
# A row is a *recovered upstream value*, not automatically a value we use. Where the notes read
# "<upstream> default X; SpatialOmicsLab uses Y", the row is documenting a divergence we chose, and
# adopting it would undo that choice. Those rows carry "adopted: false" and get_official_defaults
# withholds them, so the mcp_config default stands. Omitting the field means adopted -- the common
# case. Add it whenever a note says we run something other than the recorded value; without it,
# overlaying the row silently reinstates the value the note says we rejected.

tools:
  # ============================================================
  # SPATIAL CLUSTERING TOOLS
  # ============================================================

  run_scanpy_spatial_domain:
    resolution:
      value: 1.0
      adopted: false
      source: official_repo
      source_file: "https://github.com/scverse/scanpy/blob/master/src/scanpy/tools/_leiden.py"
      confidence: high
      version: "scanpy>=1.9"
      notes: "Leiden default resolution=1.0 in scanpy; SpatialOmicsLab uses 0.6"
    n_neighbors:
      value: 15
      source: official_repo
      source_file: "https://github.com/scverse/scanpy/blob/master/src/scanpy/neighbors/__init__.py"
      confidence: high
      version: "scanpy>=1.9"
      notes: "Default n_neighbors=15 in sc.pp.neighbors"
    n_pcs:
      value: 50
      source: official_repo
      source_file: "https://github.com/scverse/scanpy/blob/master/src/scanpy/neighbors/__init__.py"
      confidence: high
      version: "scanpy>=1.9"
      notes: "Default n_pcs=None (uses all available, typically 50); SpatialOmicsLab now aligned to 50"

  graphst_spatial_clustering:
    cluster_tool:
      value: "mclust"
      source: official_repo
      source_file: "https://github.com/JinmiaoChenLab/GraphST/blob/main/GraphST/utils.py"
      confidence: high
      version: "1.1.1"
      notes: "Default method='mclust' in GraphST.utils.clustering()"
    radius:
      value: 50
      source: official_repo
      source_file: "https://github.com/JinmiaoChenLab/GraphST/blob/main/GraphST/utils.py"
      confidence: high
      notes: "Default radius=50 for spatial neighbor refinement"

  stagate_spatial_domains:
    rad_cutoff:
      value: 150.0
      adopted: false
      source: official_repo
      source_file: "https://github.com/zhanglabtools/STAGATE/blob/main/STAGATE_pyG/utils.py"
      confidence: high
      notes: "Cal_Spatial_Net default rad_cutoff=None; 150 is the tutorial value for the DLPFC full-resolution pixel coordinates (spot spacing ~137), where it links each spot to its six-spot ring. Not adopted: a fixed radius depends on the coordinate units (150 links no spots on slides whose spacing exceeds it), so the portal default 0 derives the radius from the spot spacing, which rebuilds that six-neighbour ring."
    n_epochs:
      value: 1000
      adopted: false
      source: paper
      source_file: "https://doi.org/10.1038/s41467-022-29439-6"
      confidence: medium
      notes: "Paper uses 1000 epochs; SpatialOmicsLab uses 200"
    n_clusters:
      value: 7
      adopted: false
      source: inferred
      source_file: "dataset-dependent"
      confidence: low
      notes: "n_clusters is dataset-dependent; no universal default"

  deepst_identify_domains:
    pre_epochs:
      value: 800
      adopted: false
      source: official_repo
      source_file: "https://github.com/spatial-data-lab/DeepST/blob/main/deepst/DeepST.py"
      confidence: medium
      notes: "DeepST default pre_epochs=800; SpatialOmicsLab uses 500"
    epochs:
      value: 500
      source: official_repo
      source_file: "https://github.com/spatial-data-lab/DeepST/blob/main/deepst/DeepST.py"
      confidence: medium
      notes: "Training epochs default 500 in official code"
    pca_n_comps:
      value: 200
      source: official_repo
      source_file: "https://github.com/spatial-data-lab/DeepST/blob/main/deepst/DeepST.py"
      confidence: high
      notes: "Default PCA components = 200"

  run_sedr:
    n_clusters:
      value: 7
      source: inferred
      source_file: "https://github.com/JinmiaoChenLab/SEDR"
      confidence: low
      notes: "Dataset-dependent; DLPFC tutorial uses 7"
    using_dec:
      value: true
      source: official_repo
      source_file: "https://github.com/JinmiaoChenLab/SEDR/blob/master/src/SEDR_train.py"
      confidence: high
      notes: "DEC refinement of the SEDR embedding is upstream's tutorial default (train_with_dec); the domains are KMeans labels in both modes"

  run_miso:
    n_clusters:
      value: 7
      adopted: false
      source: inferred
      source_file: "https://github.com/MISe-Omics/MISO"
      confidence: low
      notes: "Dataset-dependent; no universal default"

  stlearn_spatial_clustering:
    n_pcs:
      value: 50
      source: official_repo
      source_file: "https://github.com/BiomedicalMachineLearning/stLearn"
      confidence: high
      notes: "stLearn default n_pcs=50; SpatialOmicsLab also uses 50"
    n_neighbors:
      value: 25
      source: official_repo
      source_file: "https://github.com/BiomedicalMachineLearning/stLearn"
      confidence: medium
      notes: "stLearn tutorials use 25 neighbors"
    resolution:
      value: 1.0
      source: official_repo
      source_file: "https://github.com/BiomedicalMachineLearning/stLearn"
      confidence: medium
      notes: "Default Leiden resolution in stLearn tutorials"

  precast_spatial_clustering:
    K:
      value: 7
      source: inferred
      source_file: "https://github.com/feiyoung/PRECAST"
      confidence: low
      notes: "K (n_clusters) is dataset-dependent"
    gene_number:
      value: 2000
      source: official_repo
      source_file: "https://github.com/feiyoung/PRECAST"
      confidence: medium
      notes: "Default HVG selection count"

  prost_pnn_domains:
    n_neighbors:
      value: 20
      source: official_repo
      source_file: "https://github.com/PROST-library/PROST"
      confidence: medium
    n_eigs:
      value: 30
      source: official_repo
      source_file: "https://github.com/PROST-library/PROST"
      confidence: medium

  cellcharter_cluster_spatial_domains:
    n_layers:
      value: 3
      source: official_repo
      source_file: "https://github.com/CSOgroup/cellcharter"
      confidence: high
    n_clusters_min:
      value: 3
      source: official_repo
      source_file: "https://github.com/CSOgroup/cellcharter"
      confidence: medium
    n_clusters_max:
      value: 12
      source: official_repo
      source_file: "https://github.com/CSOgroup/cellcharter"
      confidence: medium

  seurat_qc_cluster:
    n_hvgs:
      value: 2000
      source: official_repo
      source_file: "https://github.com/satijalab/seurat"
      confidence: high
      notes: "FindVariableFeatures default nfeatures=2000"
    n_pcs:
      value: 30
      source: official_repo
      source_file: "https://github.com/satijalab/seurat"
      confidence: high
      notes: "RunPCA default npcs=50; 30 is common tutorial value"
    resolution:
      value: 0.8
      source: official_repo
      source_file: "https://github.com/satijalab/seurat"
      confidence: high
      notes: "FindClusters default resolution=0.8"

  run_bass:
    burn_in:
      value: 2000
      source: official_repo
      source_file: "https://github.com/zhengli09/BASS"
      confidence: medium
    n_samples:
      value: 5000
      source: official_repo
      source_file: "https://github.com/zhengli09/BASS"
      confidence: medium

  spiral_integrate:
    n_epochs:
      value: 100
      adopted: false
      source: official_repo
      source_file: "https://github.com/guott15/SPIRAL/tree/main/Demo"
      confidence: high
      notes: "Every real-data demo (run_spiral_DLPFC/coronal/sagittal/mouse_ob.ipynb) trains 100 epochs and the simulation demo 200; no demo uses 300. SpatialOmicsLab keeps its portal default 200."
    hidden_dim:
      value: 32
      source: official_repo
      source_file: "https://github.com/guott15/SPIRAL/tree/main/Demo"
      confidence: high
      notes: "Every demo sets AEdims=[N,[512],32] and GSdims=[512,32]. This wrapper's hidden layers are hidden_dim*16 wide (HIDDEN_WIDTH_FACTOR in tools/spiral_worker.py), so upstream's 512 is hidden_dim=32. The old value 256 meant 4096-wide layers, 8x upstream."
    latent_dim:
      value: 32
      source: official_repo
      source_file: "https://github.com/guott15/SPIRAL"
      confidence: medium

  run_iris:
    n_clusters:
      value: 7
      source: inferred
      source_file: "dataset-dependent"
      confidence: low

  run_spacel_splane:
    # resolution is accepted and ignored by the portal (Splane clusters with KMeans(n_clusters)); it
    # is not a tunable knob and is deliberately absent here.
    n_clusters:
      value: 7
      source: inferred
      source_file: "dataset-dependent"
      confidence: low

  # ============================================================
  # SVG DETECTION TOOLS
  # ============================================================

  hotspot_spatial_modules:
    model:
      value: "danb"
      source: official_repo
      source_file: "https://github.com/YosefLab/Hotspot/blob/master/hotspot/hotspot.py"
      confidence: high
      notes: "Default model='danb' (depth-adjusted negative binomial)"
    n_neighbors:
      value: 30
      source: official_repo
      source_file: "https://github.com/YosefLab/Hotspot/blob/master/hotspot/hotspot.py"
      confidence: high
      notes: "Default n_neighbors=30 in Hotspot"
    autocorr_fdr:
      value: 0.05
      source: official_repo
      source_file: "https://github.com/YosefLab/Hotspot"
      confidence: high
    min_gene_threshold:
      value: 30
      source: official_repo
      source_file: "https://github.com/YosefLab/Hotspot"
      confidence: high

  spagft_identify_svg:
    n_neighbors:
      value: 20
      source: spatialomicsgym_config
      source_file: "mcp_config.yaml"
      confidence: high
      notes: "Our from-scratch substitute's KNN size, not a SpaGFT parameter: SpaGFT.detect_svg sets K = ceil(sqrt(n_spots)/2) (4 at <= 500 spots) itself, and the worker lists n_neighbors in params.ignored on a SpaGFT run"
    n_eigs:
      value: 50
      source: spatialomicsgym_config
      source_file: "mcp_config.yaml"
      confidence: high
      notes: "Our substitute's eigenpair count, not a SpaGFT parameter: detect_svg uses ceil(sqrt(n_spots)) low- and high-frequency modes (ratio_low_freq/ratio_high_freq='infer'); listed in params.ignored on a SpaGFT run"
    n_top_genes:
      value: 200
      source: spatialomicsgym_config
      source_file: "mcp_config.yaml"
      confidence: high
      notes: "Our cap on spagft_top_svg_genes.csv and predicted_genes.json; SpaGFT has no such parameter (detect_svg scores every gene)"

  prost_index_svg:
    n_neighbors:
      value: 20
      source: official_repo
      source_file: "https://github.com/PROST-library/PROST"
      confidence: medium
    n_top_genes:
      value: 200
      source: official_repo
      source_file: "https://github.com/PROST-library/PROST"
      confidence: medium

  spark_svg_detection:
    pval_cutoff:
      value: 0.05
      source: official_repo
      source_file: "https://github.com/xzhoulab/SPARK"
      confidence: high

  spatialde_run_svg:
    top_k_genes:
      value: 200
      source: inferred
      source_file: "https://github.com/Teichlab/SpatialDE"
      confidence: medium
      notes: "SpatialDE returns all genes sorted by significance; top_k is a post-filter"

  svgbit_run:
    # Put beside the installed svgbit 0.2.17 (svgbit/run.py: ``k: int = 6, n_svgs: int = 1000``), which
    # the portal also defaults to. 10 / 200 were filed here as upstream's but were an old local choice
    # -- the svgbit_run_expansion rows below say so -- and were overlaid on every baseline trial and
    # injected into the agent's prompt as "official defaults" (hunt 2026-09-30, u32-tuning-13).
    k:
      value: 6
      source: official_repo
      source_file: "https://github.com/CPenglab/svgbit/blob/master/svgbit/run.py"
      confidence: high
      notes: "svgbit.run default k=6 (kNN network); the portal default is the same"
    n_svgs:
      value: 1000
      source: official_repo
      source_file: "https://github.com/CPenglab/svgbit/blob/master/svgbit/run.py"
      confidence: high
      notes: "svgbit.run default n_svgs=1000; the portal default is the same"

  spvc_svg_detection:
    pval_cutoff:
      value: 0.05
      source: official_repo
      source_file: "https://github.com/xzhoulab/SPARK"
      confidence: medium
      notes: "SPVC shares SPARK-X framework"

  bsp_identify_svg:
    top_k_genes:
      value: 200
      source: inferred
      source_file: "BSP implementation"
      confidence: medium

  seurat_spatial_variable_features:
    nfeatures:
      value: 2000
      source: official_repo
      source_file: "https://github.com/satijalab/seurat"
      confidence: high

  squidpy_spatial_autocorr:
    n_neighs:
      value: 6
      source: official_repo
      source_file: "https://github.com/scverse/squidpy"
      confidence: high
      notes: "Squidpy default for Visium hexagonal grid"
    mode:
      value: "moran"
      source: official_repo
      source_file: "https://github.com/scverse/squidpy"
      confidence: high

  # ============================================================
  # DECONVOLUTION TOOLS
  # ============================================================

  run_cell2location:
    n_cells_per_location:
      value: 8.0
      adopted: false
      source: official_repo
      source_file: "https://github.com/BayraktarLab/cell2location/blob/master/cell2location/models/_cell2location_module.py"
      confidence: high
      notes: "The module default is N_cells_per_location=8.0 (LocationModelLinearDependentWMultiExperimentLocationBackgroundNormLevelGeneAlphaPyroModel); setup_anndata takes no such argument. The tutorials pass 30, which is the portal default and stands (hunt 2026-09-30, u32-tuning-13)."
    detection_alpha:
      value: 20.0
      source: official_repo
      source_file: "https://github.com/BayraktarLab/cell2location/blob/main/cell2location/models/Cell2location.py"
      confidence: high
      notes: "Default detection_alpha=20.0"
    max_epochs_ref:
      value: 250
      adopted: false
      source: documentation
      source_file: "https://cell2location.readthedocs.io/"
      confidence: medium
      notes: "Tutorials use 250. Until 2026-09-29 the worker CLI defaulted to 50 when the portal omitted the flag; since then portal and worker both default to 250."
    max_epochs_map:
      value: 30000
      adopted: false
      source: documentation
      source_file: "https://cell2location.readthedocs.io/"
      confidence: medium
      notes: "Tutorials recommend 30000. Until 2026-09-29 the worker CLI defaulted to 2000 when the portal omitted the flag; since then portal and worker both default to 30000."
    cell_count_cutoff:
      value: 5
      source: official_repo
      source_file: "https://github.com/BayraktarLab/cell2location"
      confidence: high
    cell_percentage_cutoff2:
      value: 0.03
      source: official_repo
      source_file: "https://github.com/BayraktarLab/cell2location"
      confidence: high
    nonz_mean_cutoff:
      value: 1.12
      source: official_repo
      source_file: "https://github.com/BayraktarLab/cell2location"
      confidence: high

  tangram_map_sc_to_spatial:
    num_epochs:
      value: 1000
      adopted: false
      source: official_repo
      source_file: "https://github.com/broadinstitute/Tangram/blob/main/tangram/mapping_utils.py"
      confidence: high
      notes: "Default num_epochs=1000 in tg.map_cells_to_space(); SpatialOmicsLab uses 500"
    density_prior:
      value: "rna_count_based"
      source: official_repo
      source_file: "https://github.com/broadinstitute/Tangram"
      confidence: high
    n_markers_per_class:
      value: 100
      source: documentation
      source_file: "https://github.com/broadinstitute/Tangram"
      confidence: medium

  graphst_deconvolution:
    epochs:
      value: 1200
      source: official_repo
      source_file: "https://github.com/JinmiaoChenLab/GraphST"
      confidence: medium
    retain_percent:
      value: 0.15
      source: official_repo
      source_file: "https://github.com/JinmiaoChenLab/GraphST"
      confidence: medium

  tacco_annotate:
    method:
      value: "OT"
      source: official_repo
      source_file: "https://github.com/simonwm/tacco"
      confidence: high
    multi_center:
      value: 3
      source: official_repo
      source_file: "https://github.com/simonwm/tacco"
      confidence: high
    lamb:
      value: 0.001
      source: official_repo
      source_file: "https://github.com/simonwm/tacco"
      confidence: medium

  spacexr_rctd_deconvolution:
    mode:
      value: "doublet"
      source: official_repo
      source_file: "https://github.com/dmcable/spacexr"
      confidence: high
      notes: "RCTD default mode is 'doublet' (allows 1-2 cell types per spot)"

  run_card:
    min_count_gene:
      value: 100
      source: official_repo
      source_file: "https://github.com/YingMa0107/CARD"
      confidence: medium
    min_count_spot:
      value: 5
      source: official_repo
      source_file: "https://github.com/YingMa0107/CARD"
      confidence: medium

  run_destvi:
    # Put beside the installed scvi-tools 1.3.3 in destvi_env. 500 / 2500 matched neither upstream nor
    # the portal (100 / 2000), and as light parameters they were the tuning baseline and the agent's
    # injected "official defaults" (hunt 2026-09-30, u32-tuning-13).
    max_epochs_sc:
      value: 300
      adopted: false
      source: official_repo
      source_file: "https://github.com/scverse/scvi-tools/blob/main/src/scvi/model/_condscvi.py"
      confidence: high
      notes: "CondSCVI.train default max_epochs=300; the portal trains the reference model for 100"
    max_epochs_st:
      value: 2000
      source: official_repo
      source_file: "https://github.com/scverse/scvi-tools/blob/main/src/scvi/model/_destvi.py"
      confidence: high
      notes: "DestVI.train default max_epochs=2000; the portal default is the same"

  run_stdeconvolve:
    n_topics:
      value: 15
      adopted: false
      source: inferred
      source_file: "https://github.com/JEFworks-Lab/STdeconvolve"
      confidence: low
      notes: "n_topics is dataset-dependent; no universal default"

  run_spotlight:
    n_top:
      value: 3000
      source: inferred
      source_file: "https://github.com/MarcElosua/SPOTlight"
      confidence: medium
      notes: "Not an upstream default: SPOTlight 1.6.7 has n_top = NULL, which trainNMF turns into max(table(mgs$cluster)), every marker of each cell type. 3000 exceeds the per-type marker count after the mean.AUC > 0.8 filter (at most 330 on the 44-type mini reference, 2026-09-29), so serving it reproduces that; the portal default of 100 caps it."
    min_cont:
      value: 0.09
      source: official_repo
      source_file: "https://github.com/MarcElosua/SPOTlight"
      confidence: medium
      notes: "SPOTlight 1.x calls this threshold min_prop (1.6.7 default 0.01); tools/spotlight_worker.R passes min_cont to SPOTlight as min_prop."

  run_gist:
    prior_lambda:
      value: 0.1
      source: official_repo
      source_file: "https://github.com/jhu-statcomputing/GIST"
      confidence: medium
      notes: "Ignored by this tool: GIST reads prior_lambda only in its image-guided model, which needs a per-spot prior the wrapper does not take; the base model runs (reported in params.ignored). The GIST() signature default is 50."

  bayestme_deconvolution:
    knn_k:
      value: 6
      source: official_repo
      source_file: "https://github.com/tansey-lab/bayestme"
      confidence: medium

  starfysh_deconvolution:
    n_genes:
      value: 2000
      source: official_repo
      source_file: "https://github.com/alevits/starfysh"
      confidence: medium
    # Put beside the installed starfysh (utils.py ``run_starfysh(..., lr=1e-4, epochs=100, ...)``). 300
    # matched neither upstream nor the portal (200); 1e-3 is the portal's own choice, which the
    # starfysh_deconvolution_expansion row calls 10x upstream's. Both are recorded, not adopted, so
    # the portal defaults stand (hunt 2026-09-30, u32-tuning-13).
    epochs:
      value: 100
      adopted: false
      source: official_repo
      source_file: "https://github.com/azizilab/starfysh/blob/main/starfysh/utils.py"
      confidence: high
      notes: "run_starfysh default epochs=100; the portal trains for 200"
    lr:
      value: 0.0001
      adopted: false
      source: official_repo
      source_file: "https://github.com/azizilab/starfysh/blob/main/starfysh/utils.py"
      confidence: high
      notes: "run_starfysh default lr=1e-4; the portal uses 1e-3"

  # ============================================================
  # ADDITIONAL TOOL DEFAULTS (expanded coverage)
  # Tools researched from GitHub source code / README defaults
  # ============================================================

  stride_deconvolution:
    normalize:
      value: true
      source: official_repo
      source_file: "https://github.com/wanglabtongji/STRIDE"
      confidence: medium
      notes: "STRIDE CLI --normalize is common default in tutorials"
    annotation_key:
      value: "CellType"
      source: documentation
      source_file: "https://github.com/wanglabtongji/STRIDE"
      confidence: medium
      notes: "STRIDE tutorial expects obs['CellType'] for cell-type labels"
    outprefix:
      value: "stride"
      source: spatialomicsgym_config
      source_file: "mcp_config.yaml"
      confidence: medium
      notes: >-
        Output prefix is spatialomicsgym-chosen, no upstream canonical value. Mirrors
        stride_mcp_server.py's own default, which is what a call that omits the argument sends;
        this row is overlaid on top of the mcp_config baseline in executor._step1_load_defaults,
        so a value that disagrees with the portal makes the baseline trial run a configuration no
        ordinary call produces.

  commot_spatial_communication:
    dis_thr:
      value: null
      adopted: false
      source: official_repo
      source_file: "https://github.com/zcang/COMMOT/blob/main/commot/tools/_spatial_communication.py"
      confidence: high
      notes: "commot.tl.spatial_communication default dis_thr=None (a distance in obsm['spatial'] units); the SpatialOmicsLab portal default is 0 = automatic 200 um, converted with the slide's scalefactors (spot_diameter_fullres / 65 um)"
    heteromeric:
      value: false
      adopted: false
      source: official_repo
      source_file: "https://github.com/zcang/COMMOT/blob/main/commot/tools/_spatial_communication.py"
      confidence: high
      notes: "Default heteromeric=False in spatial_communication(); SpatialOmicsLab uses True"
    pathway_sum:
      value: false
      adopted: false
      source: official_repo
      source_file: "https://github.com/zcang/COMMOT/blob/main/commot/tools/_spatial_communication.py"
      confidence: high
      notes: "Default pathway_sum=False; SpatialOmicsLab uses True"
    lr_database:
      value: "CellChat"
      source: documentation
      source_file: "https://github.com/zcang/COMMOT"
      confidence: high
      notes: "Tutorial default is CellChat LR database"
    species:
      value: "human"
      source: documentation
      source_file: "https://github.com/zcang/COMMOT"
      confidence: medium

  mist_regions_impute:
    species:
      value: "Human"
      source: documentation
      source_file: "https://github.com/yli183/ReST"
      confidence: medium
      notes: "MIST/ReST tutorial default species is Human"
    hvg_prop:
      value: 0.8
      source: documentation
      source_file: "https://github.com/yli183/ReST"
      confidence: medium
      notes: "Tutorial default 0.8 HVG proportion"
    n_pcs:
      value: 10
      source: documentation
      source_file: "https://github.com/yli183/ReST"
