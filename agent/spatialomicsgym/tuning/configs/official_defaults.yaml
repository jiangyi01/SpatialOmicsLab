      notes: "Portal default only, and NOT RUN: Neighborseq::multiplet_rf hard-codes xgboost num_parallel_tree = 200 (nround = 1, max_depth = 20) and no argument of neighborseq() reaches it, so tools/neighborseq_worker.R lists n_trees under params.ignored and reports params.num_parallel_tree = 200. The earlier note (Random Forest default ntree=500) described randomForest, which Neighborseq does not use."
