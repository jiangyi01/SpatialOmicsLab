llm: "gpt-5"
temperature: 1.0
timeout_seconds: 1800
max_workers: 1
# project_root: defaults to the checkout this runner lives in (load_benchmark_config); a pinned
# absolute path sent a worktree's or another box's run to the main tree (hunt 2026-09-30, u33a-bench-runner-27).
benchmark_data_dir: "benchmarks/benchmark_data"
output_dir: "benchmarks/results/benchmark_runs/clustering"
mcp_config_path: "MCP_server/mcp_config.yaml"
