    - spatialomicsgym_name: generate_qc_report
      description: 'Counts, detected genes and mitochondrial fraction, as distributions and on the tissue. [DATA REQUIREMENTS] Input: one .h5ad. Required obs: none -- the metrics are computed here when absent and the caption says so. SC reference: not needed. Image: not needed.'
      parameters:
        data_path:
          type: str
          required: true
          description: 'Path to the AnnData (.h5ad) to read, e.g. ./work/spatial_input/slide.h5ad.'
        output_dir:
          type: str
          required: false
          default: ''
          description: 'Directory the figure, its record and the post-analysis manifest are written to. Empty resolves to ./work/spatial_viz (SOG_WORK_DIR honoured).'
        groupby:
          type: str
          required: false
          default: ''
          description: 'Categorical obs column to group by: each QC metric is drawn as one violin per level instead of a single histogram. Empty draws one histogram per metric over every observation.'
        compute_if_missing:
          type: bool
          required: false
          default: true
          description: 'Compute quality-control metrics when the object carries none. The caption says they were computed here and are not stored.'
        on_tissue:
          type: bool
          required: false
          default: true
          description: 'Also paint each metric on the tissue when the object has coordinates.'
        title:
          type: str
          required: false
          default: ''
          description: 'Figure title. Empty derives one from what was drawn.'
        figure_format:
          type: str
          required: false
          default: 'png'
          description: '''png'', ''svg'' or ''pdf''. PNG and SVG display in the answer; PDF is download-only. Above 50,000 marks the point layer is rasterised inside a vector file so the export stays servable.'
