mcp_servers:
  scanpy_spatial:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/scanpy_spatial_mcp_server.py
    enabled: true
    description: 'Scanpy Leiden clustering of a spatial slide on an expression PCA kNN graph, published as spatial domains (spatial coordinates are not used in clustering). Runs in the SpaGCN conda env.'
    env:
      SCANPY_SPATIAL_PYTHON: /opt/conda/envs/SpaGCN/bin/python
      SCANPY_SPATIAL_WORKER: /workspace/epic-fermat/agent/tools/scanpy_spatial_worker.py
    tools:
    - spatialomicsgym_name: run_scanpy_spatial_domain
      description: 'Run Scanpy Leiden clustering on a spatial h5ad (normalize_total, log1p, HVG selection, scale, PCA, kNN graph on the first n_pcs expression PCs, Leiden, UMAP) and publish the clusters as spatial domains in obs[''spatial_domain'']. Spatial coordinates are NOT used in clustering, only to draw the spatial figure; params.method says so. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] and raw counts in X (or in adata.raw, with use_raw_counts=true). normalize_total and log1p always run: an X with negative or NaN values (scaled / z-scored data) is refused before anything runs, and the error says whether adata.raw holds counts; a non-integer non-negative X (already normalised) is normalised again, with a warning. params.expression_source says which matrix ran. Spots with obs[''in_tissue''] == 0 (background outside the tissue) are left out first and counted in params.in_tissue_filter; only the top `n_top_genes` highly variable genes (default 2000) are clustered on. Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        data_path:
          type: str
          required: true
          description: Path to the spatial AnnData (.h5ad) to cluster, with expression in .X and spot
            coordinates in obsm['spatial']. There is no default - pass the user's own file, for example
            ./work/spatial_input/V1_Human_Lymph_Node.h5ad.
        output_dir:
          type: str
          required: true
          description: Directory the domain labels and figures are written to. There is no default -
            pass a directory under the run's working directory, for example ./work/scanpy_spatial_domain.
        target_n_clusters:
          type: int
          required: false
          default: 0
          description: 'Number of spatial domains to aim for. When > 0 the worker binary-searches the
            Leiden resolution (up to 25 Leiden runs) for the cluster count closest to this; an exact
            match is not guaranteed. params.resolution_used is the resolution that ran,
            params.resolution_search records the target, the count achieved, whether it matched and
            every trial, and a warning is raised when the target was not reached; resolution is then
            ignored and listed in params.ignored. Pass this whenever the number of domains is known or requested (benchmark datasets, or a
            user asking for a specific count): on the DLPFC reference, target_n_clusters=7 scores
            ARI~0.16 against ARI~0.01 for the default resolution=1.0. Leave at 0 to let `resolution`
            decide, in which case the resulting domain count is whatever that resolution produces.'
        resolution:
          description: 'Leiden resolution. Used only when target_n_clusters is 0. With target_n_clusters > 0 it has no effect (it is listed in params.ignored) and params.resolution_used reports the resolution the search chose; the search never falls back to this value. Higher values give more, smaller domains -- prefer target_n_clusters when the expected number of domains is known.'
          type: float
          required: false
          default: 1.0
        n_neighbors:
          description: Number of neighbours in the kNN graph that Leiden is run on.
          type: int
          required: false
          default: 15
        n_pcs:
          description: 'Number of principal components -- used both for the PCA itself and as the number of components the neighbour graph is built on (always the PCA, also for panels of 50 genes or fewer). Must be below the smaller of the spot count and the kept-gene count, or the run stops saying so.'
          type: int
          required: false
          default: 50
        min_counts:
          description: Minimum total counts per spot; spots below it are dropped before clustering. 0 (the default) applies no filter.
          type: int
          required: false
          default: 0
        n_top_genes:
          description: Number of highly variable genes kept before PCA and clustering; every other gene is discarded. The default of 2000 discards most of a whole-transcriptome slide (33538 genes -> 2000), so raise it to cluster on a wider panel.
          type: int
          required: false
          default: 2000
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Cluster adata.raw.X instead of X. Use it for a CELLxGENE-style h5ad whose X is log-normalised or scaled (z-scored) and whose integer counts sit in adata.raw; a file without adata.raw, or whose adata.raw does not hold counts, is refused. The matrix clustered is reported as params.expression_source (''X'' or ''raw.X'') beside params.x_matrix_kind (what X held).'
  spatial_miso:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/miso_mcp_server.py
    enabled: true
    description: 'MISO multi-modal clustering (RNA, optionally with H&E image features; input: spatial transcriptomics .h5ad).'
    env:
      MISO_PYTHON: /opt/conda/envs/miso/bin/python
      MISO_WORKER: /workspace/epic-fermat/agent/tools/miso_worker.py
    tools:
    - spatialomicsgym_name: run_miso
      description: 'Run MISO clustering on a spatial transcriptomics .h5ad file. The input MUST be an AnnData .h5ad object (for example ./work/spatial_input/lung_scc_visium_raw.h5ad) with raw counts in .X (or in adata.raw, with use_raw_counts=true). The worker builds the RNA modality with scanpy + miso.utils.preprocess and, if a histology image is provided, adds an image modality via miso.hist_features.get_features, then writes `miso_cluster` back into a new .h5ad. MISO itself reads no spot coordinates: its affinity graph is built from each modality''s features, so spatial information enters only through histology image features sampled at each spot. Without histology_image_path the result is expression clusters, and the payload says so (params.uses_spatial_coordinates=false). MISO clusters a subset of what you supply: spots with in_tissue=0 are dropped first, and miso.utils.preprocess then drops every gene detected in fewer than 10 spots (a threshold fixed by the MISO library, which no parameter here can change). The payload reports the supplied counts as n_spots/n_genes and the analysed counts as n_spots_used/n_genes_used. miso.utils.preprocess log1p''s the matrix as counts: an X with negative or NaN values (scaled data) is refused, and the error says whether adata.raw holds counts; a fractional X (already log-normalised) runs with a warning; use_raw_counts=true runs on adata.raw.X (params.expression_source, params.x_matrix_kind). summary.n_clusters is the number of clusters the labels hold and summary.n_clusters_requested the n_clusters asked for (KMeans can return fewer on a degenerate embedding, with a warning). Memory: MISO holds the spots x genes matrix dense (intrinsic to the library); with sparse=false (the default, the MISO tutorial''s setting) it also holds an N x N affinity per modality and a dense N x N distance matrix every epoch. The peak is estimated before anything is allocated, and a run that cannot fit stops with the numbers, naming sparse=true when that would fit. Nothing is subsampled. [DATA REQUIREMENTS] Input: h5ad with raw counts in X (or in adata.raw, with use_raw_counts=true); obsm[''spatial''] (full-resolution pixel coordinates) is required with a histology image. Tool preprocesses internally via scanpy + miso.utils.preprocess. Required obs: none. SC reference: not needed. Image: optional H&E via histology_image_path for multi-modal mode, either the full-resolution TIF or Space Ranger''s tissue_hires_image.png / tissue_lowres_image.png (mapped into the image with the scalefactors; every spot window must fall inside the image).'
      parameters:
        h5ad_path:
          type: str
          required: true
          description: Path to a spatial transcriptomics .h5ad file, e.g. ./work/spatial_input/lung_scc_visium_raw.h5ad.
        histology_image_path:
          type: str
          required: false
          default: ''
          description: ' Optional path to the matching H&E image: the full-resolution TIF, or Space Ranger''s tissue_hires_image.png / tissue_lowres_image.png. If provided, MISO computes image features at each spot and includes them as a second modality; every spot''s window must fall inside the image or the run stops. If omitted, MISO runs on the RNA modality only and uses no spatial coordinates. '
        n_clusters:
          type: int
          required: false
          default: 6
          description: Number of clusters for Miso.cluster() (KMeans on the MISO embedding).
        output_dir:
          type: str
          required: false
          default: ''
          description: 'Directory to save CSVs and annotated .h5ad. If left empty, the portal''s default output directory for MISO is used (never the folder the input .h5ad sits in).'
        device:
          type: str
          required: false
          default: auto
          description: 'Compute device: "auto", "cpu", "gpu"/"cuda", or "cuda:N" to pick a specific GPU. "auto" follows the hardware; a GPU request on a machine without CUDA degrades to CPU rather than failing.'
        sparse:
          type: bool
          required: false
          default: false
          description: 'false (default, the MISO tutorial''s setting): MISO''s dense Gaussian affinity over every pair of spots, N x N per modality. true: MISO''s own k-nearest-neighbour affinity (Miso(sparse=True)), whose memory grows linearly with the spot count. A different affinity; params.affinity records which ran.'
        neighbors:
          type: int
          required: false
          default: 100
          description: k of the sparse kNN affinity (MISO's own default 100). Used only with sparse=true; with sparse=false a non-default value is listed in params.ignored.
        image_resolution:
          type: str
          required: false
          default: auto
          description: 'Which pixel frame the histology image is in: "fullres" (obsm[''spatial''] used as-is), "hires" / "lowres" (coordinates multiplied by tissue_hires_scalef / tissue_lowres_scalef), or "auto" (hires/lowres when the file name or an exact size match with an image in uns[''spatial''] says so, otherwise fullres). Used only with histology_image_path.'
        scalefactors_json:
          type: str
          required: false
          default: ''
          description: 'Path to Space Ranger''s scalefactors_json.json. Empty uses the scalefactors in the h5ad''s uns[''spatial''] (one library entry; scalar markers beside it, such as CELLxGENE''s is_single, are not libraries), then a scalefactors_json.json beside the image. Used only with histology_image_path.'
        pixel_size_raw:
          type: float
          required: false
          default: 0.0
          description: 'Microns per pixel of the supplied histology image. 0 derives it from the scalefactors (microns_per_pixel, or the physical spot spot_diameter_fullres measures -- bin_size_um on Visium HD, otherwise the 55 um Visium spot -- over spot_diameter_fullres, divided by the image scale factor); only with no scalefactors at all is the MISO tutorial''s 0.2544 used, with a warning. For a platform whose spot is not 55 um, pass it explicitly. Used only with histology_image_path.'
        spot_diameter_microns:
          type: float
          required: false
          default: 0.0
          description: 'Diameter in microns of the image window each spot''s features are averaged over. It sets the window radius only, never the image scale (params.histology.spot_diameter_um / spot_radius_px). 0 uses bin_size_um from the scalefactors (Visium HD), otherwise the 55 um Visium spot. Used only with histology_image_path.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'false (default): MISO runs on X. true: on the counts in adata.raw.X, for an h5ad whose X is log-normalised or scaled and whose raw counts sit in adata.raw (a file without adata.raw, or whose raw is not counts, is refused). The matrix used is reported as params.expression_source (X or raw.X).'
  cell2location:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/cell2location_mcp_server.py
    enabled: true
    description: Cell2location pipeline (reference NB regression + spatial mapping + Leiden spatial domains) on scRNA + spatial AnnData.
    env:
      CELL2LOCATION_PYTHON: /opt/conda/envs/cell2loc_env/bin/python
      CELL2LOCATION_WORKER: /workspace/epic-fermat/agent/tools/cell2location_worker.py
    tools:
    - spatialomicsgym_name: run_cell2location
      description: 'Fit a cell2location RegressionModel on a scRNA reference (.h5ad) and run spatial mapping on a Visium/spatial AnnData (.h5ad). The tool also performs Leiden clustering on the inferred cell-type abundance (q05_cell_abundance_w_sf) to obtain spatial domains (region_cluster), and saves QC/diagnostic figures. Results are written under results_dir (default ./work/cell2location_output), including reference_signatures/inf_aver.csv, cell2location_map/sp.h5ad, and PNG figures; every file is written to a partial path and renamed into place. Spots whose obs[''in_tissue''] is 0 (background glass) are left out and counted in params.in_tissue_filter. The spatial model trains full-batch unless batch_size_map is set, and a run whose measured memory footprint does not fit is refused before any training with the numbers and a batch_size_map that fits; nothing is subsampled. [DATA REQUIREMENTS] Input: spatial h5ad with raw counts in X. SC reference: h5ad with cell-type labels in obs[''CellType''] (or labels_key) and batch info in obs[''Sample''] (or batch_key; null or ''none'' fits without a batch covariate). Both must hold raw integer counts in X: every value is checked, a non-integer matrix is refused unless round_counts=true, and negative or NaN values are always refused. Tool trains NB regression on reference then maps to spatial.'
      parameters:
        sc_h5ad_path:
          type: str
          required: true
          description: Path to scRNA reference AnnData (.h5ad) with cell-type labels in .obs[labels_key].
        spatial_h5ad_path:
          type: str
          required: true
          description: Path to spatial AnnData (.h5ad), e.g. 10x Visium, with raw counts in .X.
        results_dir:
          type: str
          required: false
          default: ./work/cell2location_output
          description: 'Base directory for outputs. Under this directory the tool creates: ''reference_signatures/'' (inf_aver.csv, reference QC/figures) and ''cell2location_map/'' (sp.h5ad with region_cluster,
            mapping QC/figures).

            '
        labels_key:
          type: str
          required: false
          default: CellType
          description: 'Column in sc_adata.obs with cell-type annotation (e.g. ''CellType''; null means the default). Must exist; the error lists the columns otherwise. Missing labels are refused unless
            drop_unlabeled=true.'
        batch_key:
          type: str
          required: false
          default: Sample
          description: 'Column in sc_adata.obs with batch/sample ID (e.g. ''Sample''), used as the RegressionModel batch covariate. Pass null or ''none'' to fit without a batch covariate; a named column
            must exist and be fully populated.'
        n_cells_per_location:
          type: int
          required: false
          default: 30
          description: Expected number of cells per location (N_cells_per_location in cell2location).
        detection_alpha:
          type: float
          required: false
          default: 20.0
          description: Hyperprior controlling over-dispersion of detection efficiency (detection_alpha).
        max_epochs_ref:
          type: int
          required: false
          default: 250
          description: Max epochs for training the reference RegressionModel (NB regression).
        max_epochs_map:
          type: int
          required: false
          default: 30000
          description: Max epochs for training the spatial cell2location mapping model.
        cell_count_cutoff:
          type: int
          required: false
          default: 5
          description: 'filter_genes: minimum number of cells in which a gene is detected in the reference.'
        cell_percentage_cutoff2:
          type: float
          required: false
          default: 0.03
          description: 'filter_genes: minimum fraction of cells expressing a gene in the reference.'
        nonz_mean_cutoff:
          type: float
          required: false
          default: 1.12
          description: 'filter_genes: minimum mean expression among non-zero cells in the reference.'
        n_neighbors:
          type: int
          required: false
          default: 15
          description: Number of neighbors for the KNN graph on q05_cell_abundance_w_sf used before Leiden.
        leiden_resolution:
          type: float
          required: false
          default: 1.1
          description: Resolution parameter for Leiden clustering to define spatial domains (region_cluster).
        round_counts:
          type: bool
          required: false
          default: false
          description: 'X of both files must be raw integer counts; a non-integer matrix is refused. true rounds every value to the nearest integer (np.rint) instead, reported in params.rounded_inputs
            and a warning. Negative or NaN/inf values are refused either way.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Reference cells with a missing (NaN/empty) label are refused by default; true leaves them out and reports the count in params.n_reference_cells_dropped_unlabeled.'
        batch_size_map:
          type: int
          required: false
          default: null
          description: 'Spots per minibatch for the spatial model''s training and posterior export. null (default) trains full-batch, as upstream and this tool always did: the whole spots x shared-genes matrix is held dense (about 70 bytes per spot-gene pair at peak) and the export keeps 1000 posterior samples of every spot, so a run that cannot fit (a Visium HD or Xenium slide) is refused before training with the numbers and a batch_size_map that fits; nothing is subsampled. A number trains in minibatches of that many spots (one epoch = n_spots / batch_size_map steps) and summarises the export batch by batch. Reported in params.batch_size_map, params.posterior_sample_kwargs and params.memory_estimate.'
  graphst:
    enabled: true
    description: 'GraphST-based spatial transcriptomics tools for spatial domain identification and scRNA-ST deconvolution. The server runs a FastMCP wrapper in the spatialomicsgym_env environment and delegates heavy
      computation to a dedicated GraphST conda environment at /opt/conda/envs/GraphST.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/graphst_mcp_server.py
    env:
      GRAPHST_PYTHON: /opt/conda/envs/GraphST/bin/python
      GRAPHST_WORKER: /workspace/epic-fermat/agent/tools/graphst_worker.py
      GRAPHST_R_HOME: /opt/conda/envs/GraphST/lib/R
    tools:
    - spatialomicsgym_name: graphst_spatial_clustering
      description: 'Run GraphST spatial clustering / domain identification on a single spatial transcriptomics AnnData (.h5ad) file and save domains to the specified output directory. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] and raw counts in X (or in adata.raw, with use_raw_counts=true). Tool preprocesses internally (seurat_v3 top-3000 HVG, normalize, log1p, scale, PCA) unless var already has ''highly_variable'': GraphST then trains on those genes with X as stored (reported as data.hvg_source). Builds dense n_spots x n_spots matrices. GraphST''s own preprocessing normalises X as counts, so X is checked before it runs: a negative or non-finite X (scaled or z-scored data, e.g. a CELLxGENE export whose counts sit in adata.raw) is refused, and the error says whether adata.raw holds counts; a non-negative non-integer X (already normalised or log-transformed) runs as before but is normalised a second time, with a warning; use_raw_counts=true runs on adata.raw.X instead. params.expression_source and params.x_matrix_kind say which matrix ran. An input whose var already has ''highly_variable'' is trained on X as stored by design and is not refused; with use_raw_counts=true GraphST preprocesses adata.raw''s counts itself. Spots with obs[''in_tissue''] == 0 (background outside the tissue) are left out before the graph is built and get no domain; data.n_spots is the count supplied, data.n_spots_used the count clustered, and params.in_tissue_filter with a warning says how many were left out. Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        st_h5ad:
          type: str
          required: true
          description: 'Path to spatial AnnData (.h5ad). Must include obsm[''spatial''] and raw counts in .X (or in adata.raw, with use_raw_counts=true); a negative or non-finite X is refused and a non-integer X runs with a warning, unless var already flags ''highly_variable'' (then X is trained on as stored).'
        output_dir:
          type: str
          required: true
          description: 'Output directory where graphst_clustering_output.h5ad and graphst_domain.csv will be saved. Use the directory specified by the caller.

            '
        n_clusters:
          type: int
          required: true
          description: 'Number of spatial domains (clusters) to identify in the tissue.

            '
        cluster_tool:
          type: str
          required: false
          default: mclust
          description: 'Clustering backend used after GraphST embedding. One of {''mclust'', ''leiden'', ''louvain''}. ''mclust'' (default, recommended) uses Gaussian mixture models via R; requires R_HOME
            to be set.

            '
        radius:
          type: int
          required: false
          default: 50
          description: 'Number of nearest spots that vote on each spot''s domain in the spatial refinement step (a count, not a distance). Used only by cluster_tool=''mclust'' and must be 1..n_spots-1; leiden/louvain accept it and list it under params.ignored.

            '
        device:
          type: str
          required: false
          default: auto
          description: 'Torch device string (''auto'', ''cpu'', or ''cuda:0''). ''auto'' uses GPU if available, otherwise CPU.

            '
        label_key:
          type: str
          required: false
          description: 'Optional obs key in the AnnData object containing ground-truth labels for computing ARI. Read before clustering, so a key GraphST also writes (domain, mclust, leiden, louvain) is scored against the input values; spots with a missing label are left out and counted; a key that is not an obs column is listed under params.ignored.

            '
        r_home:
          type: str
          required: false
          description: 'Optional R_HOME path for ''mclust'' clustering. If not provided, the worker will fall back to the GRAPHST_R_HOME environment variable.

            '
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Run on the counts in adata.raw.X instead of X (obs and obsm are kept); GraphST then runs its own preprocessing on those counts. An h5ad without adata.raw, or whose adata.raw does not hold counts, is refused. Without it, a negative or non-finite X is refused and a non-integer X runs with a warning. Reported as params.expression_source ("X" or "raw.X") and params.use_raw_counts.'
    - spatialomicsgym_name: graphst_deconvolution
      description: 'Run GraphST deconvolution to transfer cell-type labels from an annotated scRNA reference onto a spatial transcriptomics dataset, saving cell-type abundance per spot under the directory given by output_dir. [DATA REQUIREMENTS] Input: spatial h5ad with obsm[''spatial''] and raw counts in X (or in adata.raw, with use_raw_counts=true). SC reference: h5ad with raw counts in X (or in adata.raw) and cell-type labels required in obs column (specified via celltype_key). Tool preprocesses both inputs internally (seurat_v3 HVGs, normalize_total, log1p), treating each X as raw counts: a negative or non-finite X is refused (the error names the input and says whether its adata.raw holds counts), a non-integer X runs with a warning, and use_raw_counts=true reads adata.raw.X of each input that has an adata.raw (reported as params.expression_source for the spatial input and params.sc_expression_source for the reference). GraphST learns a dense n_cells x n_spots float32 mapping matrix (about 6 copies alive while it trains); once the reference is read, a run whose estimate exceeds the memory available is refused with the numbers before training, and neither input is ever cut down. Spatial spots with obs[''in_tissue''] == 0 (background outside the tissue) are left out before training and get no abundance row; data.n_spots is the count supplied, data.n_spots_used the count deconvolved, and params.in_tissue_filter with a warning says how many were left out.'
      parameters:
        st_h5ad:
          type: str
          required: true
          description: 'Path to spatial AnnData (.h5ad), e.g., a human lymph node Visium dataset.

            '
        scrna_h5ad:
          type: str
          required: true
          description: 'Path to annotated scRNA reference AnnData (.h5ad). Must contain cell-type labels in obs[celltype_key] (default ''cell_type'').

            '
        output_dir:
          type: str
          required: true
          description: 'Output directory, e.g. "./work/graphst_V1_LN", where graphst_deconvolution_output.h5ad and graphst_celltype_abundance.csv will be saved.

            '
        celltype_key:
          type: str
          required: false
          default: cell_type
          description: 'Column in the scRNA obs containing cell-type labels. The worker will copy obs[celltype_key] to obs[''cell_type''] if needed. Label values become the abundance column names and must not equal an existing spatial obs column; a missing label is an error unless drop_unlabeled=true.

            '
        epochs:
          type: int
          required: false
          default: 1200
          description: 'Number of training epochs for the GraphST deconvolution model.

            '
        retain_percent:
          type: float
          required: false
          default: 0.15
          description: 'Fraction (0, 1] of reference cells kept per spot when the learned mapping matrix is projected onto cell types (0.15 keeps the top 15%). A value outside (0, 1], or one that keeps no cell (retain_percent x n_cells < 1), is refused.

            '
        device:
          type: str
          required: false
          default: auto
          description: 'Torch device string (''auto'', ''cpu'', or ''cuda:0''). ''auto'' uses GPU if available, otherwise CPU.

            '
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Leave out reference cells whose obs[celltype_key] label is missing (NaN/empty) instead of failing on them; the number left out is reported as data.n_cells_dropped_unlabeled.

            '
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Read adata.raw.X of each input (spatial and reference) that has an adata.raw instead of its X; an input without one is read from X (and checked like X) with a warning, and a run where neither input has an adata.raw is refused. Without it, a negative or non-finite X is refused and a non-integer X runs with a warning. Reported as params.expression_source (spatial), params.sc_expression_source (reference) and params.use_raw_counts.'
  tangram:
    enabled: true
    description: 'Tangram-based mapping of single-cell RNA-seq data onto spatial transcriptomics (e.g., Visium). This server runs a FastMCP wrapper in the spatialomicsgym_env environment and delegates the heavy computation
      to a dedicated Tangram conda environment at /opt/conda/envs/tangram-env.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/tangram_mcp_server.py
    env:
      TANGRAM_PYTHON: /opt/conda/envs/tangram-env/bin/python
      TANGRAM_WORKER: /workspace/epic-fermat/agent/tools/tangram_worker.py
    tools:
    - spatialomicsgym_name: tangram_map_sc_to_spatial
      description: 'Run the full Tangram pipeline to map a single-cell reference onto a spatial transcriptomics dataset. The tool selects marker genes, learns a probability map from reference cells (or, in the default clusters mode, from cell-type clusters) to spots by gradient descent on the cosine similarity between predicted and measured spot expression, and writes each spot''s cell-type composition to tangram_celltype_probabilities.csv (rows sum to 1; in clusters mode the cluster map is weighted by each cluster''s share of the reference, obs[''cluster_density''], as Tangram''s density term trains it, and params.proportion_weighting records the weighting). Unless project_genes is false it also writes a spots x genes expression matrix predicted from the reference (tangram_projected_genes.h5ad). Spots with obs[''in_tissue''] == 0 (background) are left out of the mapping and every output and counted in params.in_tissue_filter. [DATA REQUIREMENTS] Input: spatial h5ad with expression in X (coordinates are not used) and gene identifiers of the same kind as the reference''s; a slide that shares no gene with the reference (e.g. Ensembl IDs against symbols) is refused. Log-normalized data needed for marker gene ranking (sc.tl.rank_genes_groups). SC reference: h5ad with cell-type labels in obs column (specified via annotation_key, default ''cell_type''); reference cells with a missing label are refused unless drop_unlabeled is true.'
      parameters:
        sc_h5ad:
          type: str
          required: true
          description: 'Path to single-cell AnnData (.h5ad) with cell-type labels in obs[annotation_key]. For example: "./test/test_data/sc_annotation_ref/sc.h5ad".

            '
        spatial_h5ad:
          type: str
          required: true
          description: 'Path to spatial AnnData (.h5ad), e.g. a 10x Visium dataset with counts in .X and coordinates in obsm[''spatial'']. For example: "./work/spatial_input/V1_Human_Lymph_Node.h5ad".

            '
        output_dir:
          type: str
          required: true
          description: "Output directory, e.g. \"./work/tangram_output\", where the Tangram results will be written, including:\n  - tangram_mapping_sc_to_spatial.h5ad\n  - tangram_spatial_with_annotations.h5ad\n  - tangram_projected_genes.h5ad (only when project_genes is true)\n  - tangram_celltype_probabilities.csv\n"
        annotation_key:
          type: str
          required: false
          default: cell_type
          description: 'Column name in the single-cell AnnData obs containing cell-type annotations to be projected into space (e.g. "cell_type", "cell_subclass", etc.).

            '
        mode:
          type: str
          required: false
          default: clusters
          description: 'Tangram mapping mode: "clusters" (default, paper-grade: maps per-label aggregates of the reference, using annotation_key as the cluster label) or "cells" (single-cell resolution). "cells" trains a dense reference-cells x spots map and holds about 7 float32 copies of it while training; before training, whatever project_genes says, that size is checked against GPU memory when training runs on CUDA (the host''s share, about 3 copies, against host memory) and against host memory on the CPU, and a map that cannot fit stops the run naming mode="clusters" (on CUDA also device="cpu" when host memory can hold it); params.mapping_memory_checked_against records which memory it was checked against.'
        n_markers_per_class:
          type: int
          required: false
          default: 100
          description: 'Number of top marker genes per annotation group (annotation_key) used as training genes. The tool uses scanpy.tl.rank_genes_groups and then tg.pp_adatas to align gene space.

            '
        num_epochs:
          type: int
          required: false
          default: 1000
          description: 'Number of training epochs for tg.map_cells_to_space. Larger values may improve convergence but increase runtime.

            '
        density_prior:
          type: str
          required: false
          default: rna_count_based
          description: 'Tangram density prior: "rna_count_based" (recommended for Visium) or "uniform" (for single-cell-resolution spatial technologies).

            '
        device:
          type: str
          required: false
          default: auto
          description: 'Device string for Tangram: "auto" (GPU if available, otherwise CPU), "cpu", or "cuda:0".

            '
        project_genes:
          type: bool
          required: false
          default: true
          description: 'Run tg.project_genes and write tangram_projected_genes.h5ad, a dense spots x reference-genes matrix (float64 in clusters mode, where the reference is aggregated by annotation_key like the mapping; cells mode also densifies the reference). Its size is checked against available memory before training, and a projection that cannot fit stops the run naming this knob. False skips it; the cell-type mapping and tangram_celltype_probabilities.csv do not depend on it.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Reference cells with a missing (NaN/empty) annotation_key label are refused by default; true leaves them out and reports the count in params.n_reference_cells_dropped_unlabeled.'
  tacco:
    enabled: true
    label: "TACCO \u2013 cell-type deconvolution for spatial transcriptomics"
    description: 'TACCO MCP server: transfer single-cell annotations (e.g., CellType) onto spatial transcriptomics spots and return composition profiles and dominant cell type per spot.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/tacco_mcp_server.py
    env:
      TACCO_PYTHON: /opt/conda/envs/TACCO_env/bin/python
      TACCO_WORKER: /workspace/epic-fermat/agent/tools/tacco_worker.py
    tools:
    - spatialomicsgym_name: tacco_annotate
      description: 'Use TACCO to transfer cell-type annotations from a single-cell reference AnnData onto a spatial transcriptomics AnnData and compute per-spot compositions and dominant cell type. [DATA REQUIREMENTS] Input: spatial h5ad with raw counts in X (use_raw_counts=true reads adata.raw instead); X with negative or NaN/inf values is refused, and TACCO itself refuses a slide whose values do not look like integers. Spots with obs[''in_tissue''] == 0 (background glass in a CELLxGENE export) are left out and reported: data.n_spots is the slide supplied, data.n_spots_used the spots annotated, params.in_tissue_filter the count left out; only in-tissue spots appear in the outputs. SC reference: h5ad with cell-type labels in obs column (name specified via annotation_key parameter). Tool transfers annotations via optimal transport or other methods.'
      parameters:
        sc_h5ad:
          type: str
          required: true
          description: Path to single-cell reference AnnData (.h5ad) with cell-type labels in .obs[annotation_key].
        spatial_h5ad:
          type: str
          required: true
          description: Path to spatial AnnData (.h5ad), e.g. Visium/HD data with counts in .X.
        output_dir:
          type: str
          required: true
          description: Directory to store TACCO outputs (annotated h5ad + CSV files).
        annotation_key:
          type: str
          required: true
          default: CellType
          description: obs column in sc_h5ad containing categorical cell-type labels (e.g. 'CellType').
        result_key:
          type: str
          required: false
          default: ''
          description: 'obsm key in spatial h5ad for TACCO compositions; default ''tacco_<annotation_key>''. The dominant label per spot goes to obs[''<result_key>_max''].'
        method:
          type: str
          required: false
          default: OT
          description: 'TACCO annotation method (default ''OT''). Also runnable here: ''nnls'', ''projection'', ''svm'', ''NMFreg''. ''tangram'', ''RCTD'' and ''SingleR'' need an external conda env this tool does not expose and are refused; ''novosparc'' and ''WOT'' need their package installed. params.method records the method that ran.'
        multi_center:
          type: int
          required: false
          default: 3
          description: 'Number of sub-clusters (k-means centres) each reference cell type is split into before annotating; applies to every method (recommended 3; <=0 disables multi-center).'
        lamb:
          type: float
          required: false
          default: 0.001
          description: 'Regularization lambda of the OT method. Only OT takes it; for any other method it is not passed to TACCO and is listed in params.ignored.'
        bisections:
          type: int
          required: false
          default: null
          description: 'Number of recursive bisections of the annotation. Above 0 TACCO runs the chosen method
            repeatedly, each round assigning a fraction of the counts still unassigned, which sharpens
            compositions on spots holding several cell types at the cost of that many extra rounds. Omit to take
            TACCO''s own method-dependent default, which is 4 for the ''OT'' method used here by default and 0
            for every other method.'
        bisection_divisor:
          type: int
          required: false
          default: 3
          description: 'Size of the fraction assigned per bisection round: each round assigns 1/bisection_divisor
            of the counts still unassigned, and the total number of typing rounds is bisections +
            bisection_divisor - 1, so the default pair (OT''s 4 bisections, divisor 3) is six rounds. Read only
            once bisections resolves above 0, and must then be at least 2; TACCO raises on anything smaller.'
        platform_iterations:
          type: int
          required: false
          default: null
          description: 'Platform-normalization iterations run before annotating, correcting the systematic
            per-gene efficiency difference between the reference and the slide. 0 normalizes once and does not
            iterate; a positive value repeats the correction using the previous round''s annotation; a negative
            value skips platform normalization entirely, which is only appropriate when reference and slide come
            from the same assay. Omit to take TACCO''s own method-dependent default, which is 0 for the ''OT''
            and ''projection'' methods and -1, no normalization at all, for every other method.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Reference cells with a missing (NaN/empty/''nan'') label in obs[annotation_key] stop the run by default; true leaves them out and reports the count in params.n_reference_cells_dropped_unlabeled and data.n_cells_sc_used.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'TACCO treats expression as counts. false reads X of both inputs: X with negative or NaN/inf values (scaled data) is refused, and non-integer X (normalised data) runs with a warning, although TACCO itself then refuses a slide whose values do not look like integers. true runs on adata.raw of the spatial h5ad (refused when it has none or it does not hold counts) and of the reference when it has one (otherwise its X, with a warning); the annotated h5ad then carries those counts as X. params.expression_source / expression_source_sc say which matrix was read.'
  stride:
    enabled: true
    label: "STRIDE \u2013 topic modelling-based cell-type mapping"
    description: 'STRIDE MCP server: uses a single-cell RNA-seq reference to deconvolve cell-type compositions for each spatial transcriptomics spot, based on topic modelling.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/stride_mcp_server.py
    env:
      STRIDE_PYTHON: /opt/conda/envs/stride/bin/python
      STRIDE_WORKER: /workspace/epic-fermat/agent/tools/stride_worker.py
    tools:
    - spatialomicsgym_name: stride_deconvolution
      description: 'Run STRIDE deconvolution to estimate cell-type composition for each spatial spot, given a single-cell reference and a spatial transcriptomics dataset. [DATA REQUIREMENTS] Input: spatial h5ad with raw counts, read from layers[''counts''], then adata.raw, then X (params.expression_source / expression_source_sc say which); values that are not whole numbers are rounded to the nearest integer with a warning, and NaN/inf or negative values are refused. Spots with obs[''in_tissue''] == 0 (background glass in a CELLxGENE export) are left out and reported: data.n_spots is the slide supplied, data.n_spots_used the spots deconvolved, params.in_tissue_filter the count left out. Both matrices reach STRIDE as sparse 10x HDF5. SC reference: h5ad with cell-type labels in obs[annotation_key] (typically ''CellType''); a reference cell with no label stops the run unless drop_unlabeled is true. Tool runs topic modeling for deconvolution. [SCALE FACTORS] STRIDE scales each spot and reference cell to count / total * factor, and its default factor rounds the 75th percentile of the counts to the nearest 1000, which is 0 below 500 counts (Xenium cells, VisiumHD bins, targeted panels) and would give every spot the same prior-only composition; the tool then passes the unrounded percentile, with a warning. params.st_scale_factor / sc_scale_factor report the factors used; st_scale_factor / sc_scale_factor set them. A spot with no count in the genes of STRIDE''s topic model gets only the model''s topic prior, so such spots are counted in data.n_spots_without_counts, warned about, and given no dominant cell type. [GENE PANEL] STRIDE is run on the genes the two objects share. If fewer than 500 genes are shared -- normal for a targeted panel (MERFISH, Xenium, CosMx, seqFISH) and for any thin reference match -- STRIDE''s own QC crashes, so the tool works around it by ranking the shared panel by raw variance and deconvolving on the top 50 genes only; pass gene_use_file to decline that substitution and choose the panel yourself. The payload reports the supplied panels as n_genes (spatial) and n_genes_sc (single-cell), the shared panel as n_overlap_genes, and the genes actually deconvolved as n_genes_used, with a warning naming each cut; params.gene_selection names the gene list the topic model was trained on and params.ntopics_selected the topic number STRIDE chose.'
      parameters:
        sc_h5ad:
          type: str
          required: true
          description: 'Path to single-cell reference AnnData (.h5ad) with cell-type labels in obs[annotation_key].

            '
        spatial_h5ad:
          type: str
          required: true
          description: 'Path to spatial AnnData (.h5ad), e.g. a 10x Visium dataset with gene expression counts.

            '
        output_dir:
          type: str
          required: true
          description: 'Directory where STRIDE outputs and intermediate files will be written (e.g. ./work/stride_V1_LN).

            '
        annotation_key:
          type: str
          required: true
          default: CellType
          description: 'obs column in sc_h5ad containing cell-type labels. Typically ''CellType'' for your reference dataset.

            '
        outprefix:
          type: str
          required: false
          default: stride
          description: 'Prefix for STRIDE output files (spot_celltype_frac, topic_spot_mat, etc.). STRIDE loads an existing <outprefix>_topic_spot_mat_<k>.npz instead of recomputing it, which would pair an earlier topic x spot matrix with the newly trained model. A matrix an earlier run of this tool left in output_dir (no newer than the <outprefix>_dominant_celltype_per_spot.csv that run wrote) is replaced: it is removed, with its .txt twin, just before STRIDE starts and listed in params.stale_topic_matrices_removed, with a warning. Any other such matrix stops the run and is left untouched; use a new output_dir or another outprefix.'
        normalize:
          type: bool
          required: false
          default: true
          description: 'Whether to normalize counts inside STRIDE (adds --normalize).

            '
        gene_use_file:
          type: str
          required: false
          default: null
          description: 'Path to a plain-text file with one gene symbol per line, restricting the deconvolution to those genes. Leave unset to let STRIDE choose -- except on a slide sharing fewer than 500 genes with the reference, where leaving it unset means the tool substitutes its own 50-gene raw-variance panel (see the tool description). Genes not in the shared panel are ignored. The literal ''All'' trains on every shared gene. A path that is not a readable file, an empty list, or a list with no gene in the shared panel stops the run, because STRIDE itself would silently replace the list with its own marker search.'
        ntopics:
          type: array
          required: false
          description: 'List of topic numbers to evaluate. If unset, STRIDE auto-ranges from N_celltypes to
            3*N_celltypes. Providing a focused list (e.g. [44, 55, 66, 77, 88]) dramatically speeds up model
            selection.'
        task:
          type: str
          required: false
          default: 'deconvolution'
          description: 'STRIDE task to run. ''deconvolution'' is the only supported value; any other value is
            rejected.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Reference cells with a missing (NaN/empty) label in obs[annotation_key] are refused by default; true leaves them out and reports the count in params.n_reference_cells_dropped_unlabeled.'
        st_scale_factor:
          type: float
          required: false
          default: null
          description: 'Scale factor STRIDE normalises each spot to (count / total * factor), a number > 0 such as 10000. Unset: STRIDE''s default, the 75th percentile of counts per spot over the shared genes rounded to the nearest 1000 -- or, when that rounds to 0 (a 75th percentile under 500, e.g. Xenium cells or VisiumHD bins), the unrounded percentile, with a warning, because a factor of 0 empties every spot''s topic document and gives every spot the same prior-only composition. A slide where three quarters of the spots have no count in the shared genes stops the run unless this is set. The factor used is params.st_scale_factor.'
        sc_scale_factor:
          type: float
          required: false
          default: null
          description: 'Scale factor for the reference cells (count / total per cell * factor), a number > 0. Unset: STRIDE''s default by the same rule as st_scale_factor, or the unrounded 75th percentile when that rounds to 0 (a factor of 0 would train the topic model on empty documents). The factor used is params.sc_scale_factor.'
  stlearn:
    enabled: true
    description: 'stLearn MCP server: stSME spatial clustering (Louvain) on Visium-like spatial transcriptomics data, where each spot''s expression PCA is adjusted by the histology-image morphology of its neighbours. Needs a histology image in uns["spatial"]; without one the call stops unless allow_pca_fallback=True, which clusters expression alone and says so in the payload.'
    command:
    - python
    - /workspace/epic-fermat/agent/tools/stlearn_mcp_server.py
    env:
      STLEARN_PYTHON: /opt/conda/envs/stlearn/bin/python
      STLEARN_WORKER: /workspace/epic-fermat/agent/tools/stlearn_worker.py
    tools:
    - spatialomicsgym_name: stlearn_spatial_clustering
      description: 'Run stLearn stSME spatial clustering on a spatial transcriptomics AnnData (.h5ad): tiles of the histology image around every spot, ResNet50 morphology features, expression PCA adjusted by morphologically similar neighbours within radius (X_pca_morphology), then Louvain. The library is the first uns["spatial"] entry that holds images or scale factors (a scalar entry such as CELLxGENE''s is_single is skipped and kept in the output). With no histology image, no image under use_quality, or a failure in tiling / feature extraction / morphology.adjust, the call stops with the reason; allow_pca_fallback=True instead clusters the expression PCA alone (no image, no spatial information) and reports params.method, params.used_fallback=true and a warning. Spots with obs[''in_tissue''] == 0 (background outside the tissue, which CELLxGENE Visium exports carry) are left out before anything runs and reported in params.in_tissue_filter and a warning; data.n_spots is the number clustered and data.n_spots_input the number supplied. stLearn normalises X as counts: a negative or non-finite X (scaled data) is refused, naming use_raw_counts when adata.raw holds counts; a non-negative non-integer X (already normalised) runs with a warning; use_raw_counts=true runs on adata.raw.X, and params.expression_source says which matrix ran. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] (2 columns) and counts in X (or in adata.raw, with use_raw_counts=true). Tool runs normalize_total + log1p + unit-variance scaling (a sparse X stays sparse; PCA centres it implicitly) + PCA + stSME + Louvain internally. Required obs: none (an optional obs[''in_tissue''] 0/1 flag marks background spots). SC reference: not needed. Image: required -- a histology image in uns[''spatial''][<library>][''images''][use_quality] with scalefactors[''tissue_<use_quality>_scalef''] (no scale factor needed for fulres); without one, pass allow_pca_fallback=True to accept expression-only clustering.'
      parameters:
        st_h5ad:
          type: str
          required: true
          description: "Path to the spatial AnnData (.h5ad) file to be analyzed. For your LN demo this is typically \"./work/spatial_input/V1_Human_Lymph_Node.h5ad\". The AnnData is expected to follow a\
            \ 10x Visium-like structure with:\n  - obs / var containing barcodes and genes,\n  - obsm[\"spatial\"] containing spot coordinates,\n  - uns[\"spatial\"][library_id][\"images\"] storing H&E\
            \ images.\n"
        output_dir:
          type: str
          required: true
          description: "Directory where all stLearn outputs will be written, including:\n  - \"stlearn_clustering.h5ad\": annotated AnnData with Louvain labels in obs['louvain'] (and, when stSME ran, obsm['X_morphology'] and obsm['X_pca_morphology']),\n  - \"stlearn_clusters_per_spot.csv\": per-spot cluster assignments,\n  - \"stlearn_cluster_plot.png\": cluster map overlaid on tissue,\n  - \"tiling/\": the image tiles stSME extracted CNN features from (reported as tiling_dir only when stSME ran).\nExample: \"./work/stlearn_V1_LN\".\n"
        n_pcs:
          type: int
          required: false
          default: 50
          description: 'Number of principal components to compute and use as the initial low-dimensional representation ("X_pca") before morphology adjustment in stSME. Typical values are between 30 and
            100.

            '
        n_neighbors:
          type: int
          required: false
          default: 25
          description: 'Number of nearest neighbors when building the kNN graph via st.pp.neighbors (on X_pca or X_pca_morphology). Larger values produce a denser graph and can smooth clusters more.

            '
        radius:
          type: int
          required: false
          default: 50
          description: 'Radius, in pixels of the use_quality image, within which st.spatial.morphology.adjust averages morphologically similar neighbouring spots during stSME (the default 50 suits a hires Visium image, where spots sit about 20 px apart). Spots with no other spot inside the radius keep their unadjusted PCA and are counted in params.n_spots_without_neighbours_in_radius; a radius below the spot spacing, where no spot has a neighbour, is refused. Listed in params.ignored when stSME does not run.'
        crop_size:
          type: int
          required: false
          default: 40
          description: 'Tile size (in pixels of the use_quality image) used in st.pp.tiling when stLearn extracts CNN image features around each spot. Listed in params.ignored when stSME does not run.'
        resolution:
          type: float
          required: false
          default: 1.0
          description: "Resolution parameter for Louvain clustering. Higher resolution values lead to more, finer-grained clusters; lower values produce fewer, larger domains. A good starting range is 0.4\u2013\
            1.2.\n"
        random_state:
          type: int
          required: false
          default: 0
          description: 'Random seed for PCA, neighbor graph construction, and Louvain clustering. Fixing this value ensures the spatial clustering results are reproducible across runs.

            '
        use_quality:
          type: str
          required: false
          default: hires
          enum:
          - hires
          - lowres
          - fulres
          description: 'Which image in uns["spatial"][<library>]["images"] stSME tiles and places the spots on: "hires" (default, recommended), "lowres", or "fulres" (spots placed with obsm["spatial"] as-is). The library must hold that key and, for hires/lowres, scalefactors["tissue_<use_quality>_scalef"]; otherwise the call stops and lists the images the library does hold, unless allow_pca_fallback=True. An image stored under the key "fullres" is not read by "fulres".'
        allow_pca_fallback:
          type: bool
          required: false
          default: false
          description: 'Default false: when stSME cannot run (no histology image in uns["spatial"], no image under use_quality, or tiling / CNN feature extraction / morphology.adjust fails) the call stops with the reason. True instead clusters the expression PCA alone with Louvain -- no image and no spatial information enter the clustering -- and the payload says so (params.method, params.used_fallback=true, a warning; radius and crop_size listed in params.ignored).'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Default false. True runs on adata.raw.X instead of X, for an h5ad (typically a CELLxGENE Visium export) whose X is normalised or scaled and whose integer counts sit in adata.raw; refused when there is no adata.raw or it does not hold counts. params.expression_source reports the matrix that ran ("X" or "raw.X").'
  deepst:
    enabled: true
    description: 'DeepST MCP server: identify spatial domains in spatial transcriptomics using the DeepST deep learning framework (deepstkit). Supports Visium-like h5ad input with obsm["spatial"] coordinates
      and returns domain labels plus visualization.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/deepst_mcp_server.py
    env:
      DEEPST_PYTHON: /opt/conda/envs/deepst-env/bin/python
      DEEPST_WORKER: /workspace/epic-fermat/agent/tools/deepst_worker.py
    tools:
    - spatialomicsgym_name: deepst_identify_domains
      description: 'Run DeepST (deepstkit) to learn a latent embedding and identify spatial domains on a single spatial transcriptomics dataset stored in a Visium-like AnnData (.h5ad). DeepST integrates gene expression with spatial proximity (and optionally histology features) via a graph neural network autoencoder and denoising autoencoder, then clusters spots into spatial domains. Spots with obs[''in_tissue''] == 0 (background outside the tissue, which CELLxGENE Visium exports ship beside it) are left out before anything runs and reported under params.in_tissue_filter with a warning; data.n_spots is the supplied count and data.n_spots_used the analysed one. When the spatial plot cannot be drawn, output_files.spatial_plot_png is null and a warning says why. deepstkit normalises X as counts (normalize_total, then log1p), so X is checked before it runs: a negative or non-finite X (scaled or z-scored data, e.g. a CELLxGENE export whose counts sit in adata.raw) is refused, and the error says whether adata.raw holds counts; a non-negative non-integer X (already normalised or log-transformed) runs as before but is normalised a second time, with a warning; use_raw_counts=true runs on adata.raw.X instead. params.expression_source and params.x_matrix_kind say which matrix ran. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] and raw counts in X (or in adata.raw, with use_raw_counts=true). Tool preprocesses internally. Required obs: none. SC reference: not needed. Image: not read; use_morphological=true needs H&E features already in obsm[''image_feat_pca''] of the input. The in-tissue spots are analysed whole: DeepST builds dense spot-by-spot matrices, so a slide whose matrices exceed the memory available to the run (a cgroup limit included) is refused up front with the numbers.'
      parameters:
        st_h5ad:
          type: str
          required: true
          description: 'Path to the spatial AnnData (.h5ad) input, e.g. "./work/spatial_input/V1_Human_Lymph_Node.h5ad". It must contain raw counts in adata.X (or in adata.raw, with use_raw_counts=true) and spot coordinates in adata.obsm["spatial"] (Visium-style). A normalised X is not what DeepST expects: a negative or non-finite X is refused, and a non-integer X runs with a warning because deepstkit normalises it a second time.'
        output_dir:
          type: str
          required: true
          description: "Output directory for all DeepST results, including:\n  - \"deepst_clustering.h5ad\":\n      annotated AnnData with DeepST embeddings and domain labels\n      (e.g. obs[\"DeepST_refine_domain\"\
            ]).\n  - \"deepst_domains_per_spot.csv\":\n      per-spot domain assignments (spot ID + domain).\n  - \"deepst_spatial_domains.png\":\n      spatial map of domains (Scanpy spatial plot).\nExample:\n\
            \  \"./work/deepst_V1_LN\".\n"
        n_domains:
          type: int
          required: false
          default: 7
          description: 'Target number of spatial domains, between 1 and the number of in-tissue spots (spots with obs[''in_tissue''] == 0 are left out first). deepstkit sweeps the Leiden resolution from 2.49 down to 0.10 for a partition with exactly this many clusters and reports the one it used as params.resolution_used; when none exists the run stops unless allow_resolution_fallback is true. Spatial refinement can then merge clusters, so summary.n_clusters (after refinement) may be below summary.n_domains_leiden (before it). The original DLPFC examples use 7.'
        pre_epochs:
          type: int
          required: false
          default: 500
          description: 'Number of pretraining epochs for DeepST. Pretraining helps initialize the autoencoder and graph neural network before the main training phase. Larger values may improve stability
            at the cost of runtime.

            '
        epochs:
          type: int
          required: false
          default: 500
          description: 'Number of main training epochs for DeepST. Increasing this can improve convergence of the DeepST latent embedding but will increase runtime.

            '
        pca_n_comps:
          type: int
          required: false
          default: 200
          description: 'Number of principal components computed in DeepST._data_process on the augmented expression matrix and fed to the DeepST model. Capped at min(n_spots, n_genes) - 1; params.pca_n_comps
            reports the value that ran and params.pca_n_comps_requested the request, with a warning when they differ.'
        spatial_type:
          type: str
          required: false
          default: BallTree
          description: 'Neighbour search deepstkit''s augmentation uses to weight nearby spots: BallTree (default), KDTree, NearestNeighbors, or LinearRegress (reads obs columns imagerow, imagecol, array_row
            and array_col instead of obsm["spatial"]). Any other value is refused before training.'
        dist_type:
          type: str
          required: false
          default: KDTree
          description: 'Distance / graph type for DeepST._get_graph, e.g. "KDTree". This determines how the spatial adjacency graph is constructed from obsm["spatial"] coordinates.

            '
        use_morphological:
          type: bool
          required: false
          default: false
          description: 'Whether to weight neighbours by H&E similarity. deepstkit reads the image features from obsm["image_feat_pca"] of the input (its _get_image_crop output, ResNet50 tile features
            reduced by PCA); this tool does not extract them, so true needs an input that already carries that key and is refused before training otherwise. Keep false to run on expression and spatial proximity.'
        use_gpu:
          type: str
          required: false
          default: auto
          enum:
          - auto
          - gpu
          - cpu
          description: "Compute device for DeepST:\n  - \"auto\": use the GPU if CUDA is available, else the CPU.\n  - \"gpu\": use the GPU; on a machine without CUDA the run uses the CPU and says so\
            \ in the log.\n  - \"cpu\": CPU only.\nThis is mapped to the `use_gpu` flag inside DeepST.\n"
        seed:
          type: int
          required: false
          default: 0
          description: 'Random seed for DeepST (torch, numpy, etc.) to ensure reproducible embeddings and domain labels across runs.

            '
        allow_resolution_fallback:
          type: bool
          required: false
          default: false
          description: 'When no Leiden resolution in deepstkit''s sweep (2.49 down to 0.10) yields exactly n_domains clusters, deepstkit substitutes Leiden at resolution 1.0 and returns however many
            domains that gives. false (default): the run stops with an error that reports the cluster counts Leiden reached at 0.10 and 2.49, so a reachable n_domains can be chosen. true: the substitute
            is accepted and flagged as params.used_fallback=true, params.resolution_used=1.0 and params.resolution_search_matched=false.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Run on the counts in adata.raw.X instead of X (obs and obsm are kept). Use it for a CELLxGENE-style h5ad whose X is log-normalised or scaled and whose integer counts sit in adata.raw; an h5ad without adata.raw, or whose adata.raw does not hold counts, is refused. Without it, a negative or non-finite X is refused and a non-integer X runs with a warning. Reported as params.expression_source ("X" or "raw.X") and params.use_raw_counts.'
  hotspot:
    enabled: true
    description: 'Hotspot MCP server: identify informative spatially-varying genes and gene modules on spatial transcriptomics data using a graph-based autocorrelation and local-correlation framework. Supports
      Visium-like h5ad inputs with obsm["spatial"] coordinates.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/hotspot_mcp_server.py
    env:
      HOTSPOT_PYTHON: /opt/conda/envs/hotspot/bin/python
      HOTSPOT_WORKER: /workspace/epic-fermat/agent/tools/hotspot_worker.py
    tools:
    - spatialomicsgym_name: hotspot_spatial_modules
      description: 'Run Hotspot on a spatial transcriptomics AnnData (.h5ad) to find spatially informative genes, cluster them into gene modules, compute per-cell module scores, and optionally generate spatial plots for top modules. The similarity metric is defined from an embedding in adata.obsm (typically the ''spatial'' coordinates for Visium-like data). Spots flagged obs[''in_tissue''] == 0 (background glass; CELLxGENE Visium exports carry every array spot) are left out before the KNN graph is built and reported in params.in_tissue_filter, data.n_spots_off_tissue_dropped (data.n_spots_input is the count supplied), a warning and the analysis. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial'']. Analyses adata.X unless layer_key names a layer (a named layer that is absent is an error; X is never substituted). The default danb model needs non-negative integer counts: the worker checks this before running and refuses log-normalised or scaled values (use a raw-count layer_key, model=normal / none, or round_counts=true for near-integer floats); use_raw_counts=true models adata.raw.X instead (CELLxGENE exports keep the counts there beside a processed X), and the refusal says whether adata.raw holds counts. The normal / none models take normalised values by design. Required obs: none. SC reference: not needed. Image: not needed.

        '
      parameters:
        st_h5ad:
          type: str
          required: true
          description: "Path to the spatial AnnData (.h5ad) input. For your lymph node demo this is:\n  \"./work/spatial_input/V1_Human_Lymph_Node.h5ad\".\nThe object should contain:\n  - adata.X (counts\
            \ or normalized expression),\n  - adata.obsm[\"spatial\"] with 2D coordinates of spots,\n  - optional layers (analysed only when layer_key names one) and obs['total_counts'].\n"
        output_dir:
          type: str
          required: true
          description: "Output directory for Hotspot results, including:\n  - \"hotspot_annotated.h5ad\":\n      AnnData with hotspot_module in .var and\n      hotspot_module_scores in .obsm.\n  - \"hotspot_gene_autocorrelations.csv\"\
            :\n      per-gene autocorrelation statistics (C, Z, Pval, FDR).\n  - \"hotspot_local_correlations_z.csv\":\n      gene-by-gene local correlation Z-scores.\n  - \"hotspot_gene_modules.csv\":\n\
            \      gene-to-module assignments.\n  - \"hotspot_module_scores_per_cell.csv\":\n      per-cell module scores.\n  - \"hotspot_spatial_module_*.png\":\n      spatial maps for top modules.\nExample:\n\
            \  \"./work/hotspot_V1_LN\".\n"
        layer_key:
          type: str
          required: false
          default: ''
          description: 'AnnData layer holding the matrix Hotspot models. Empty (the default) analyses adata.X, as upstream Hotspot does with layer_key=None. A named layer that the file does not have is an
            error listing the layers it has; X is never substituted for it. The matrix used is recorded as params.expression_source.'
        model:
          type: str
          required: false
          default: danb
          enum:
          - danb
          - bernoulli
          - normal
          - none
          description: "Background model for gene expression used by Hotspot:\n  - \"danb\": depth-adjusted negative binomial (recommended for UMI),\n  - \"bernoulli\": detection-only model,\n  - \"normal\"\
            : Gaussian model on expression,\n  - \"none\": assumes values are already standardized.\ndanb and bernoulli are count models: the worker checks the analysed matrix first (finite\
            \ and non-negative; integer-valued for danb, and for bernoulli unless obs holds the per-cell UMI totals).\n"
        latent_obsm_key:
          type: str
          required: false
          default: spatial
          description: 'Name of the AnnData .obsm key defining the similarity space for cells/spots. For spatial data this is typically "spatial", so Hotspot uses 2D spatial coordinates to define neighborhoods.
            Alternatively, you can provide a PCA embedding (e.g. "X_pca"). A key absent from obsm is an error; there is no fallback to "spatial". The key used is echoed as params.latent_obsm_key.

            '
        umi_counts_obs_key:
          type: str
          required: false
          default: total_counts
          description: 'obs key containing per-cell UMI counts used for the expression background model. If this column does not exist, the worker computes total counts as the row sums of the analysed
            matrix (after the zero-variance gene filter); params.umi_counts_source says which was used.

            '
        n_neighbors:
          type: int
          required: false
          default: 30
          description: 'Number of neighbors per cell in the Hotspot KNN graph (hs.create_knn_graph). Larger values smooth signal but may blur small-scale spatial patterns.

            '
        autocorr_fdr:
          type: float
          required: false
          default: 0.05
          description: 'FDR threshold for selecting informative genes from hs.compute_autocorrelations. Only genes with FDR below this threshold are used for local correlations and module detection.
            A value outside (0, 1) disables the cut and sends every gene on; params.gene_selection says so.

            '
        min_gene_threshold:
          type: int
          required: false
          default: 30
          description: 'min_gene_threshold for hs.create_modules. Once two branches in the agglomerative clustering both exceed this number of genes, they are not merged, preserving distinct modules.

            '
        module_fdr_threshold:
          type: float
          required: false
          default: 0.05
          description: 'fdr_threshold for hs.create_modules, controlling how strict the correlation cutoff is when merging gene branches into modules.

            '
        n_jobs:
          type: int
          required: false
          default: 4
          description: 'Number of parallel jobs used when computing autocorrelations and local correlations. Increase this on multi-core machines to speed up Hotspot at the cost of CPU usage.

            '
        n_top_modules:
          type: int
          required: false
          default: 3
          description: 'Number of top modules (ranked by average absolute module score) drawn as spatial maps, hotspot_spatial_module_<m>.png; 0 draws none and a negative value is refused. On a CELLxGENE slide, whose uns[''spatial''] holds its one library beside a scalar is_single key, that library (and its own spot diameter) is named to scanpy, so the map is drawn. A map that still cannot be drawn (no obsm[''spatial''], or scanpy refuses) is named in a warning and the analysis with the reason. output_files.spatial_module_plots is the list of map paths written, summary.plotted_modules their module ids.'
        seed:
          type: int
          required: false
          default: 0
          description: 'Random seed for NumPy and any stochastic steps in Hotspot to ensure reproducible module calls and scores across runs.

            '
        round_counts:
          type: bool
          required: false
          default: false
          description: 'Round the analysed matrix to the nearest integer before a count model (danb / bernoulli). Off by default, so non-integer values are an error rather than silently modelled. Use it for
            counts stored as near-integer floats; the payload reports data.n_values_rounded and a warning. Ignored (listed in params.ignored) under model normal / none.

            '
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Model adata.raw.X instead of adata.X. CELLxGENE Visium exports keep the integer counts in adata.raw beside a log-normalised or scaled X, which the danb / bernoulli count models refuse. Refused when the file has no adata.raw or adata.raw does not hold counts, and together with a non-empty layer_key. The matrix modelled is recorded as params.expression_source ("raw.X").'
  spagft:
    enabled: true
    description: 'SpaGFT MCP server: identify spatially variable genes (SVGs) with the official SpaGFT package (SpaGFT.detect_svg: graph Fourier transform on a spatial KNN graph, kneedle cutoff on the GFT score). If SpaGFT cannot be imported the call fails and names what is missing; a from-scratch low-frequency energy ratio (not SpaGFT) runs only when allow_gft_fallback=true, and the result then names it in params.method and params.used_fallback.'
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spagft_mcp_server.py
    env:
      SPAGFT_PYTHON: /opt/conda/envs/spagft_env/bin/python
      SPAGFT_WORKER: /workspace/epic-fermat/agent/tools/spagft_worker.py
    tools:
    - spatialomicsgym_name: spagft_identify_svg
      description: 'Identify spatially variable genes (SVGs) on a spatial AnnData (.h5ad) with SpaGFT.detect_svg. SpaGFT builds a KNN graph on the coordinates named by spatial_key, projects each gene''s normalize_total + log1p expression (the layer named by layer_key, adata.X when the object has no such layer) onto the graph''s low- and high-frequency Fourier modes, ranks genes by GFT score and calls a gene significant when it passes SpaGFT''s kneedle cutoff (params.significance_basis). SpaGFT sets its own KNN size (ceil(sqrt(n_spots)/2), 4 at <= 500 spots), mode counts (ceil(sqrt(n_spots)) each) and gene filter (detected in at least one spot), so n_neighbors, n_eigs, low_freq_fraction, min_detected_frac and seed configure only the substitute and are listed in params.ignored on a SpaGFT run. Spots with obs[''in_tissue''] == 0 are left out (data.n_spots_out_of_tissue_excluded); data.n_genes counts the genes supplied and data.n_genes_used those SpaGFT kept. Nothing is subsampled; SpaGFT densifies the spots x genes matrix, and a slide too large for this machine''s memory is refused with the numbers. Outputs: spagft_svg_scores.csv (every gene SpaGFT scored, with gft_score, svg_rank, cutoff_gft_score, pvalue and fdr), spagft_top_svg_genes.csv and predicted_genes.json (the n_top_genes highest-scoring significant genes). [DATA REQUIREMENTS] Input: h5ad with 2D coordinates in obsm[spatial_key] (or two obs columns such as array_row,array_col named in spatial_key) and raw counts in X or layers[layer_key]. Required obs: none (in_tissue is used when present). SC reference: not needed. Image: not needed.'
      parameters:
        st_h5ad:
          type: str
          required: true
          description: "Spatial AnnData (.h5ad) with 2D spatial coordinates in adata.obsm[spatial_key] (or the two obs columns spatial_key names) and raw counts in X or layers[layer_key]. Example:\n  \"./work/spatial_input/V1_Human_Lymph_Node.h5ad\"\n"
        output_dir:
          type: str
          required: true
          description: "Directory where the outputs are written: spagft_svg_scores.csv, spagft_top_svg_genes.csv and predicted_genes.json (the substitute writes spagft_graph_spectrum.npz instead of predicted_genes.json). Example:\n  \"./work/spagft_V1_LN\"\n"
        layer_key:
          type: str
          required: false
          default: counts
          description: 'AnnData layer holding raw counts. adata.X is analysed when the object has no such layer; params.expression_source says which matrix was read, and a warning says so when a layer other than the default counts was named and is absent. The matrix is normalize_total + log1p-transformed before SpaGFT, so it must hold counts: one with negative or non-finite values (scaled or z-scored data) is refused, naming use_raw_counts when adata.raw holds counts, and a non-integer (already normalised) one runs with a warning that it is not raw counts.'
        spatial_key:
          type: str
          required: false
          default: spatial
          description: 'obsm key holding the 2D coordinates the KNN graph is built on, or two obs column names joined by a comma (array_row,array_col, SpaGFT''s tutorial convention for Visium). The obs grid is never read in place of an obsm key; params.spatial_info names the coordinates used. An analysed spot with no finite coordinate is refused with the count.'
        n_neighbors:
          type: int
          required: false
          default: 20
          description: 'KNN size of the from-scratch substitute only (allow_gft_fallback=true and SpaGFT could not be imported). SpaGFT sets its own, ceil(sqrt(n_spots)/2) (4 at <= 500 spots), reported as params.num_neighbors; on a SpaGFT run this value is listed in params.ignored.'
        n_eigs:
          type: int
          required: false
          default: 50
          description: 'Number of smallest Laplacian eigenpairs the substitute computes. SpaGFT uses ceil(sqrt(n_spots)) low- and high-frequency modes each (params.n_low_frequency_modes); on a SpaGFT run this value is listed in params.ignored.'
        low_freq_fraction:
          type: number
          required: false
          default: 0.1
          description: 'Share (0-1) of the substitute''s eigenpairs counted as low frequency; a share that leaves no high-frequency eigenpair is refused. Substitute only; listed in params.ignored on a SpaGFT run.'
        min_detected_frac:
          type: number
          required: false
          default: 0.05
          description: 'Minimum fraction of spots with non-zero expression for a gene to enter the substitute. SpaGFT keeps every gene detected in at least one spot; listed in params.ignored on a SpaGFT run.'
        n_top_genes:
          type: int
          required: false
          default: 200
          description: 'Number of top-ranked significant SVGs written to spagft_top_svg_genes.csv and predicted_genes.json (at least 1). A value above the significant count keeps every significant gene; spagft_svg_scores.csv always holds every gene scored.'
        seed:
          type: int
          required: false
          default: 0
          description: 'Random seed of the substitute only. SpaGFT draws no random number; listed in params.ignored on a SpaGFT run.'
        allow_gft_fallback:
          type: bool
          required: false
          default: false
          description: 'Whether to accept a substitute when SpaGFT cannot be imported. Default false: the tool then fails and names what is missing, so nothing that is not SpaGFT is reported under its name. true accepts a from-scratch low-frequency energy ratio on a normalized-Laplacian KNN graph (not SpaGFT, no significance test), computed on the same normalize_total + log1p matrix with each gene centred; the result then names it in params[''method''], sets params[''used_fallback''] to true, and the analysis text says SpaGFT did not run.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Analyse adata.raw.X instead of X or the layer_key layer. Use it when X is log-normalised or scaled and the integer counts sit in adata.raw (CELLxGENE exports); refused when the object has no adata.raw or it does not hold counts. A layer_key layer the object has is then not read and is listed in params.ignored. params.expression_source then says raw.X, and params.x_matrix_kind says what X held.'
  commot:
    enabled: true
    description: "COMMOT MCP server: infer spatial cell\u2013cell communication from transcriptomics using collective optimal transport and curated ligand\u2013receptor databases (e.g. CellChat), producing\
      \ annotated AnnData and sender/receiver summary matrices.\n"
    command:
    - python
    - /workspace/epic-fermat/agent/tools/commot_mcp_server.py
    env:
      COMMOT_PYTHON: /opt/conda/envs/COMMOT/bin/python
      COMMOT_WORKER: /workspace/epic-fermat/agent/tools/commot_worker.py
    tools:
    - spatialomicsgym_name: commot_spatial_communication
      description: "Run COMMOT spatial_communication on a spatial AnnData (.h5ad) to infer ligand-receptor-mediated communication between spatial locations, using the CellChat or CellPhoneDB_v4.0 database (secreted-signalling pairs, filtered to pairs detected in at least 5% of spots). Writes an annotated h5ad plus sender/receiver summary CSVs, and reports the effective distance threshold in obsm['spatial'] units and microns, the median spot spacing, how many spot pairs fall within the threshold, and the share of the communication score between distinct spots. Multi-section files: pass section_key for a per-section run (params.mode \"per-section-2d\"), or coords_key/dims=3 for a 3D run on an aligned frame scoring one bounded block (params.mode \"3d\"; COMMOT is 3D-capable); a 2D run over several sections without section_key is refused, naming both ways out. [DATA REQUIREMENTS] Input: h5ad with obsm['spatial'] and expression in X (counts when normalize is true). Gene names must be symbols of the chosen species; Ensembl var_names are renamed from a var symbol column (feature_name, gene_symbols, gene_symbol, gene_name) when one exists. Required obs: none (uses expression directly). Spots with obs['in_tissue'] == 0 (the background a CELLxGENE Visium export carries) are left out before normalisation and the ligand-receptor filter, so the outputs hold the in-tissue spots only; the count is in data.n_spots_off_tissue_dropped and params.in_tissue_filter. SC reference: not needed. Image: not needed. Memory: upstream COMMOT builds a dense spots x spots distance matrix (about 9 bytes x n_spots squared; about 1 byte x n_spots squared when the input already carries a dense obsp['spatial_distance'], which COMMOT then uses instead of obsm['spatial']); the run is refused with the numbers when that exceeds the memory available. A sparse obsp['spatial_distance'] is refused.\n"
      parameters:
        st_h5ad:
          type: str
          required: true
          description: "Path to spatial AnnData (.h5ad) with expression and obsm['spatial'] coordinates. Spots with obs['in_tissue'] == 0 are left out and counted in data.n_spots_off_tissue_dropped. Example:\n  \"./work/spatial_input/V1_Human_Lymph_Node.h5ad\"\n"
        output_dir:
          type: str
          required: true
          description: "Directory to store COMMOT outputs: annotated h5ad and sender/receiver summaries. Example:\n  \"./work/commot_V1_LN\"\n"
        lr_database:
          type: str
          required: false
          default: CellChat
          description: 'Ligand-receptor database for commot.pp.ligand_receptor_database: "CellChat" (human, mouse, zebrafish) or "CellPhoneDB_v4.0" (human, mouse). These are the only two the installed COMMOT implements; any other name is refused with the valid values. Only the "Secreted Signaling" pairs are loaded.

            '
        species:
          type: str
          required: false
          default: human
          description: 'Species of the ligand-receptor database: "human", "mouse", or "zebrafish" (CellChat only). Must match the species of the gene symbols in var_names.

            '
        database_name:
          type: str
          required: false
          default: CellChat
          description: 'Label used to tag COMMOT outputs in AnnData keys and file names, such as ''commot-<database_name>-sum-sender'' and ''commot_<database_name>_results.h5ad''. A plain name (no path separators); keep it equal to lr_database so the outputs say which database they came from (a label naming a different database is flagged in the payload warnings).

            '
        dis_thr:
          type: number
          required: false
          default: 0.0
          description: 'Maximum signalling distance passed to commot.tl.spatial_communication, in the units of obsm[''spatial''] as stored (dis_thr_unit="coordinates"): full-resolution image pixels for 10x Visium, where one 100 um spot pitch is roughly 30-370 pixels depending on the scan, and usually microns for imaging platforms. 0 (default) = automatic 200 um, converted with the slide''s uns[''spatial''] scalefactors (spot_diameter_fullres spans 65 um, or microns_per_pixel), or 200 coordinate units when the file carries no scale. A threshold shorter than every spot''s nearest-neighbour distance is refused, because COMMOT would then score only within-spot signalling. When the input carries obsp[''spatial_distance''], COMMOT measures dis_thr on that matrix instead of obsm[''spatial''], so an explicit value is in the matrix''s units; the automatic value and dis_thr_unit="um" are converted only when that matrix is the Euclidean distance of obsm[''spatial''] and are refused otherwise, and a sparse obsp[''spatial_distance''] is refused.'
        dis_thr_unit:
          type: str
          required: false
          default: coordinates
          description: 'Unit of dis_thr: "coordinates" (the units of the distances COMMOT measures: obsm[''spatial''], or obsp[''spatial_distance''] when the input carries that matrix) or "um" (microns, converted with the slide''s Visium scalefactors; refused when the file has none, or when obsp[''spatial_distance''] is not the Euclidean distance of obsm[''spatial'']). Has no effect when dis_thr is 0 (automatic 200 um).'
        heteromeric:
          type: bool
          required: false
          default: true
          description: 'Whether to consider heteromeric receptors in COMMOT (heteromeric=true in spatial_communication).

            '
        pathway_sum:
          type: bool
          required: false
          default: true
          description: 'Whether to compute pathway-level summarized communication scores in COMMOT.

            '
        normalize:
          type: bool
          required: false
          default: true
          description: 'If true, the worker will run sc.pp.normalize_total + sc.pp.log1p on the input AnnData before running COMMOT (X should hold counts; a matrix that uns[''log1p''] marks as already log-transformed is refused, and negative values are refused either way); if false, it assumes the data is already normalized/log-transformed.

            '
        coords_key:
          type: str
          required: false
          default: spatial
          description: 'coords_key: the obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). For dims=3 the frame must be declared in uns[''spatial_3d''][''frames''] with its units and z source.

            '
        dims:
          type: int
          required: false
          default: 2
          description: 'dims: 2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z. For COMMOT, dims=3 scores one bounded block (params.mode "3d"): the result h5ad''s obsm[''spatial''] holds the block''s three micrometre columns, declared in uns[''spatial_3d''][''frames''][''spatial''] (role aligned) so the explorer reads it as 3D.

            '
        section_key:
          type: str
          required: false
          default: null
          description: 'section_key: the obs column naming sections; required for a 2D run on a multi-section file (the run is per section: one section_<label>/ folder each, params.mode "per-section-2d") and used by a 3D block to select sections. A 2D run on a multi-section file without it is refused, naming both ways out.

            '
        dis_thr_um:
          type: number
          required: false
          default: 0.0
          description: 'Maximum signalling distance in micrometres, for a frame with recorded units; 0 = automatic 200 um in the frame''s units. Replaces dis_thr/dis_thr_unit there (those remain for bare 2D data without units); passing both is refused.

            '
        block_sections:
          type: list
          required: false
          default: all
          description: 'block_*: the cells COMMOT scores in a 3D run -- a few adjacent sections and a bounding box, at most block_max_cells; a whole stack over the cap is refused with the count and the block offered. block_sections: labels of section_key, or "all".

            '
        block_bbox_um:
          type: list
          required: false
          default: null
          description: 'block_bbox_um: [a0, b0, a1, b1] in micrometres -- lower corner, then upper corner -- over the frame''s two IN-PLANE axes in column order: the axes its axis_map does not name as the section stacking axis (without such an entry, x and y). On the Zhuang/Allen CCF frame, cut coronally and stacked along CCF x, a is CCF y (dorsal-ventral) and b is CCF z (medial-lateral): block_bbox_um=[4900, 1700, 5600, 2400] keeps CCF y 4900-5600 um and CCF z 1700-2400 um. commot_block.json records the axes. Null = the whole sections.

            '
        block_max_cells:
          type: int
          required: false
          default: 40000
          description: 'The most cells a 3D block may hold. COMMOT builds a dense n x n distance matrix (about 9 bytes x n squared); a block over the cap is refused stating that, the estimated total peak and the memory available, with a block that fits.

            '
        refuse_over_cap:
          type: bool
          required: false
          default: false
          description: 'Before any transport the run counts the cell pairs within the threshold (n_links) and the entries the result''s obsp matrices may store, 2 x n_links + n_cells (stored_nnz_estimate, an upper bound). Over the explorer''s cap (50,000,000 stored entries; SOG_CCC_MAX_NNZ) the direction, matrix and dot-plot views will be refused there, so the run warns -- or, with refuse_over_cap=True, refuses. The cell cap never implies the link cap.

            '
  cellcharter:
    enabled: true
    description: 'CellCharter MCP server: identify spatial domains (cellular niches) in spatial omics data via CellCharter''s neighborhood aggregation and ClusterAutoK, automatically selecting a stable
      number of clusters across a specified K range.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/cellcharter_mcp_server.py
    env:
      CELLCHARTER_PYTHON: /opt/conda/envs/cellcharter-env/bin/python
      CELLCHARTER_WORKER: /workspace/epic-fermat/agent/tools/cellcharter_worker.py
    tools:
    - spatialomicsgym_name: cellcharter_cluster_spatial_domains
      description: 'Run CellCharter on a spatial AnnData (.h5ad): build a squidpy spatial graph on obsm[spatial_key] (hexagonal grid neighbours when obs has array_row/array_col, a generic 6-nearest-neighbour graph otherwise; one graph per library when library_key is given), aggregate each spot''s neighbourhood over n_layers hops with cc.gr.aggregate_neighbors, and cluster with ClusterAutoK, which fits every K in the range max_runs times and keeps the most stable one (params.k_selected). Returns an annotated h5ad and a CSV of cluster labels per spot. Spots with obs[''in_tissue''] == 0 (background outside the tissue, e.g. the glass of a CELLxGENE Visium export) are left out before the graph is built and reported under params.in_tissue_filter with a warning; data.n_spots is the slide supplied and data.n_spots_used the spots clustered (the CSV''s rows). Representation: obsm[use_rep] if present, else obsm[''X_scVI''], else obsm[''X_pca''], else the worker computes its own PCA (normalize_total 1e4 + log1p, the 2,000 most highly variable genes by hvg_flavor, scale, 30 components); the 2,000-gene cap is fixed by the tool, and the payload then reports the supplied panel as n_genes and the analysed panel as n_genes_used. On that branch X is treated as counts: negative or NaN values (scaled data) are refused, and the error says whether adata.raw holds counts; fractional values (log-normalised) run with a warning; use_raw_counts=true normalises adata.raw.X instead (params.expression_source, params.x_matrix_kind). params.use_rep names the key actually aggregated, params.use_rep_requested the key asked for and params.use_rep_computed whether the worker built it, with a warning whenever they differ. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial'']. Prefers X_scVI or a similar learned representation in obsm; if none is present the worker builds a PCA from X, which should hold raw counts (or from adata.raw with use_raw_counts=true; a non-integer matrix is reported in a warning, a negative one refused). Required obs: none (obs[''in_tissue''] is honoured when present). SC reference: not needed. Image: not needed.'
      parameters:
        st_h5ad:
          type: str
          required: true
          description: "Path to the spatial transcriptomics AnnData (.h5ad). Should contain spatial coordinates in adata.obsm[spatial_key]. For 10x Visium, obsm[\"spatial\"] plus obs[\"array_row\"]/[\"\
            array_col\"] are recommended. Example:\n  \"./work/spatial_input/V1_Human_Lymph_Node.h5ad\"\n"
        output_dir:
          type: str
          required: true
          description: "Directory where CellCharter outputs will be written: an annotated h5ad with cluster labels and a CSV with spot IDs and cluster assignments. Example:\n  \"./work/cellcharter_V1_LN\"\
            \n"
        spatial_key:
          type: str
          required: false
          default: spatial
          description: 'obsm key with spatial coordinates; both the grid graph (used when obs has array_row/array_col) and the generic nearest-neighbour graph are built from it. For 10x Visium, this is typically "spatial".'
        use_rep:
          type: str
          required: false
          default: X_scVI
          description: 'Key in adata.obsm holding a low-dimensional representation to aggregate. When it is absent the worker uses, in order, obsm["X_scVI"], obsm["X_pca"], or a PCA it computes itself (normalize_total 1e4 + log1p, 2,000 HVGs by hvg_flavor, scale, 30 components, stored as "X_pca"). The payload reports the key actually used as params.use_rep, the requested one as params.use_rep_requested and whether the worker computed it as params.use_rep_computed, and adds a warning when the requested key was not the one used.'
        n_layers:
          type: int
          required: false
          default: 3
          description: 'Number of neighborhood aggregation layers in cc.gr.aggregate_neighbors. Higher values aggregate information from more distant neighbors.

            '
        n_clusters_min:
          type: int
          required: false
          default: 3
          description: 'Minimum number of clusters (K) considered by CellCharter''s ClusterAutoK. ClusterAutoK scores each K by its stability against the neighbouring K, so the smallest K it can select is max(2, n_clusters_min); params.k_candidates lists the K it could select and params.k_selected the one it chose.'
        n_clusters_max:
          type: int
          required: false
          default: 12
          description: 'Maximum number of clusters (K) considered by ClusterAutoK. K is selected from [max(2, n_clusters_min), n_clusters_max]; n_clusters_max must be >= 2 and >= n_clusters_min, otherwise the call is refused before any compute.'
        max_runs:
          type: int
          required: false
          default: 5
          description: 'Maximum number of runs per candidate K used by ClusterAutoK to estimate clustering stability. Must be at least 2: K is chosen by the stability between runs, and with 1 upstream fits every K and then fails, so the call is refused before any compute.'
        convergence_tol:
          type: number
          required: false
          default: 0.001
          description: 'Convergence tolerance for ClusterAutoK. Lower values require more consistent results across runs before a K is considered stable.

            '
        cluster_key:
          type: str
          required: false
          default: cluster_cellcharter
          description: 'Name of the column in adata.obs where CellCharter cluster labels will be stored.

            '
        library_key:
          type: str
          required: false
          default: ''
          description: 'Optional obs column holding sample or library IDs for multi-sample datasets. It must name an existing obs column with no missing values (the run stops and lists the columns otherwise). The spatial graph is then built per library (categories no spot carries are dropped first; a library with no more spots than squidpy''s 6-neighbour graph stops the run and is named) and CellCharter aggregates per sample. Leave empty for single-sample data; params.sample_key_used reports what the aggregation was split by.'
        hvg_flavor:
          type: str
          required: false
          default: seurat_v3
          enum:
          - seurat_v3
          - seurat
          - cell_ranger
          description: 'scanpy highly_variable_genes flavour, used only when the worker builds the PCA itself (no usable representation in obsm): seurat_v3 (default) ranks the raw counts in layers[''counts''] (X is copied there when absent) and needs scikit-misc -- a missing or broken package stops the run rather than switching flavour; seurat or cell_ranger rank the log-normalised X. Ignored, and listed in params.ignored, when the representation comes from obsm.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Used only when the worker builds the PCA itself (no usable representation in obsm): false (default) treats X as the counts; true normalises adata.raw.X instead, for an h5ad whose X is log-normalised or scaled and whose raw counts sit in adata.raw (a file without adata.raw, or whose raw is not counts, is refused). Ignored, and listed in params.ignored, when the representation comes from obsm.'
  prost:
    enabled: true
    description: 'PROST MCP server: run PROST on spatial transcriptomics data. prost_index_svg ranks spatially variable genes by the PROST Index (PI); prost_pnn_domains detects spatial domains with PROST PNN after PROST''s tutorial preprocessing (normalize_total + log1p). If PROST cannot run, both tools fail with PROST''s own error. A spectral substitute built on the spot coordinates (not PROST) runs only when allow_spectral_fallback=true, and the result then names it in params.method and params.used_fallback. All computation runs in /opt/conda/envs/PROST_ENV via prost_worker.py.'
    command:
    - python
    - /workspace/epic-fermat/agent/tools/prost_mcp_server.py
    env:
      PROST_PYTHON: /opt/conda/envs/PROST_ENV/bin/python
      PROST_WORKER: /workspace/epic-fermat/agent/tools/prost_worker.py
      PYTHONUNBUFFERED: '1'
      MPLCONFIGDIR: /tmp/matplotlib
      NUMBA_CACHE_DIR: /tmp/numba_cache
    tools:
    - spatialomicsgym_name: prost_index_svg
      description: 'Identify spatially variable genes (SVGs) on a spatial AnnData (.h5ad) with the PROST Index (PROST prepare_for_PI + cal_PI). PROST is given the expression named by layer_key (adata.X when empty) and the coordinates in adata.obsm[spatial_key]; its ''visium'' platform preset rasterises obs[''array_row'']/obs[''array_col''] instead when the file has them (params.coordinate_source says which). Spots with obs[''in_tissue''] == 0 (background outside the tissue) are left out before PROST runs; data.n_spots is the count supplied, data.n_spots_used the count analysed, and params.in_tissue_filter with a warning says how many were left out. If PROST cannot run the call fails with PROST''s error, unless allow_spectral_fallback=true, in which case a SpaGFT-style spectral score on a kNN graph of the spot coordinates (not PROST) is returned and labelled in params.method and params.used_fallback. Outputs: prost_index_all_gene_scores.csv (per-gene scores; prost_index, sep, sig on the PROST path); prost_top_svg_genes.csv (top N SVGs with ranks); prost_laplacian_eigenvalues.csv (Laplacian spectrum, substitute path only). [DATA REQUIREMENTS] Input: h5ad with 2D coordinates in obsm (spatial_key) and expression in X or layer_key. Required obs: none (array_row/array_col are used when present). SC reference: not needed. Image: not needed.'
      parameters:
        st_h5ad:
          type: str
          required: true
          description: "Path to the spatial AnnData (.h5ad) file. Must contain per-spot expression (adata.X or adata.layers[layer_key]) and 2D spatial coordinates in adata.obsm[spatial_key]. Example:\n\
            \  \"./work/spatial_input/V1_Human_Lymph_Node.h5ad\"\n"
        output_dir:
          type: str
          required: true
          description: "Directory where PROST Index outputs (scores, top genes, spectrum) will be written. The directory will be created if it does not exist. Example:\n  \"./work/prost_V1_LN_index\"\n"
        spatial_key:
          type: str
          required: false
          default: spatial
          description: 'Key in adata.obsm holding the 2D spot coordinates. They are written to obsm[''spatial''] of the object PROST is given, which is where PROST reads coordinates; with the ''visium'' platform preset PROST rasterises obs[''array_row'']/obs[''array_col''] for the gene images instead when the file has them (params[''coordinate_source''] says which). The spectral substitute, when allowed, builds its kNN graph on these coordinates.'
        layer_key:
          type: str
          required: false
          default: ''
          description: 'Optional adata.layers key holding the expression PROST is given (it becomes X of the object PROST reads). Empty uses adata.X. A layer the file does not have is an error that lists the layers it does have; there is no silent switch to adata.X.'
        n_neighbors:
          type: int
          required: false
          default: 20
          description: 'Neighbours in the kNN graph of the spectral substitute (allow_spectral_fallback=true and PROST did not run). PROST itself does not read it; on a PROST run it is listed in params[''ignored''].'
        n_eigs:
          type: int
          required: false
          default: 50
          description: 'Number of smallest Laplacian eigenpairs the spectral substitute computes as its graph Fourier basis. Substitute only; listed in params[''ignored''] on a PROST run.'
        low_freq_fraction:
          type: number
          required: false
          default: 0.1
          description: "Fraction (0\u20131) of the lowest-frequency eigenmodes used to compute per-gene SVG scores in the fallback path. For example, 0.1 with n_eigs=50 uses the 5 lowest non-trivial eigenvectors.\n"
        min_detected_frac:
          type: number
          required: false
          default: 0.05
          description: 'Minimum fraction of cells/spots with non-zero expression required for a gene to enter the FALLBACK spectral SVG scoring; genes below it are filtered out of that path only. It applies only when the PROST library cannot be driven: on the official PROST Index path the library runs its own gene selection (prepare_for_PI, an absolute spot count) and this threshold is not applied to the scored gene set. The payload reports which selection ran as min_detected_frac_applied.

            '
        n_top_genes:
          type: int
          required: false
          default: 200
          description: 'Number of top-ranked SVG genes to export in prost_top_svg_genes.csv. This file also includes a "rank" column starting from 1.

            '
        seed:
          type: int
          required: false
          default: 0
          description: 'Seed for the spectral substitute''s eigensolver start vector (allow_spectral_fallback=true and PROST did not run). PROST''s Index is deterministic and reads no seed; on a PROST run it is listed in params[''ignored''].'
        allow_spectral_fallback:
          type: bool
          required: false
          default: false
          description: 'Whether to accept a substitute when PROST cannot run. Default false: the tool then fails with PROST''s own error, so nothing that is not PROST is reported under its name. true accepts a SpaGFT-style spectral score on a kNN graph of the spot coordinates (not PROST); the result then names it in params[''method''], sets params[''used_fallback''] to true, and the analysis text says PROST did not run.'
        platform:
          type: str
          required: false
          default: 'visium'
          description: 'PROST platform preset, which selects how the slide is laid out on a grid before the spatial index is computed. ''visium'' and ''ST'' take the regular lattice path (rasterising obs[''array_row'']/obs[''array_col''] when the file has them, else the spatial_key coordinates) and keep genes detected in at least 3 spots; any other name (for example ''Slide-seq'', ''Stereo-seq'', ''osmFISH'', ''SeqFISH'') takes the irregular-spot path, which interpolates the expression onto a grid and keeps only genes detected in at least 50 spots. ''visium'' -- also when passed explicitly -- is replaced by ''irregular'' (the interpolating path) when the coordinates cannot form that lattice: a spot at a negative image index, or a median nearest-spot spacing above 4 pixels (for example micrometre or pixel coordinates without array_row/array_col). params.platform is the preset PROST ran with, and the analysis text says when and why it was replaced. Set it to match the assay.'
    - spatialomicsgym_name: prost_pnn_domains
      description: 'Detect spatial domains with PROST PNN, following PROST''s published pipeline (prepare_for_PI, cal_PI, normalize_total + log1p, feature_selection by PROST Index, run_PNN) with an exact n_domains. PNN clusters on at most pnn_n_top_genes genes: the count it used is params.pnn_n_genes_used (also data.n_genes_used). Spots with obs[''in_tissue''] == 0 (background outside the tissue) are left out before PROST runs and get no domain; data.n_spots is the count supplied, data.n_spots_used the count labelled, and params.in_tissue_filter with a warning says how many were left out. PNN memory grows with the square of the spot count (run_PNN about 56 bytes per spot pair at the peak; pnn_sparse=true runs PROST''s run_PNN_sparse, about 5): the peak is estimated before any PROST stage runs, a slide that cannot fit is refused with the numbers, and params.pnn_memory records the estimate. If PROST cannot run the call fails with PROST''s error, unless allow_spectral_fallback=true, in which case KMeans on the Laplacian eigenvectors of a kNN graph of the spot coordinates (gene expression not used; not PROST) is returned and labelled in params.method and params.used_fallback. Outputs: prost_domain_labels.csv (per-spot domain assignments, columns spot and prost_domain); prost_domains_annotated.h5ad (input AnnData with obs[''prost_domain''] as string labels). [DATA REQUIREMENTS] Input: h5ad with 2D coordinates in obsm (spatial_key) and raw counts in X, in layer_key, or in adata.raw (use_raw_counts=true); or pnn_preprocessing=''none'' for input that is already normalised and log-transformed. Required obs: none (array_row/array_col are used when present). SC reference: not needed. Image: not needed.'
      parameters:
        st_h5ad:
          type: str
          required: true
          description: "Path to the spatial AnnData (.h5ad) file containing expression and spatial coordinates. Example:\n  \"./work/spatial_input/V1_Human_Lymph_Node.h5ad\"\n"
        output_dir:
          type: str
          required: true
          description: "Output directory for PROST PNN / fallback spatial domain results, including:\n  - prost_domain_labels.csv\n  - prost_domains_annotated.h5ad\nExample:\n  \"./work/prost_V1_LN_domains\"\
            \n"
        spatial_key:
          type: str
          required: false
          default: spatial
          description: 'Key in adata.obsm holding the 2D spot coordinates. They are written to obsm[''spatial''] of the object PROST is given, so PNN builds its cell graph from them; with the ''visium'' platform preset PROST rasterises obs[''array_row'']/obs[''array_col''] for the gene images instead when the file has them (params[''coordinate_source''] says which). The spectral substitute, when allowed, clusters these coordinates.'
        layer_key:
          type: str
          required: false
          default: ''
          description: 'Optional adata.layers key holding the expression PROST is given (it becomes X of the object PROST reads). Empty uses adata.X. A layer the file does not have is an error that lists the layers it does have; there is no silent switch to adata.X. With pnn_preprocessing=''normalize_log1p'' (the default) it must hold raw counts. Counts kept in adata.raw (not a layer) are reached with use_raw_counts=true instead; the two cannot be combined.'
        n_neighbors:
          type: int
          required: false
          default: 20
          description: 'Neighbours in the kNN graph of the spectral substitute (allow_spectral_fallback=true and PROST did not run). PROST PNN uses pnn_k_neighbors instead; on a PROST run this is listed in params[''ignored''].'
        n_eigs:
          type: int
          required: false
          default: 30
          description: 'Number of smallest Laplacian eigenpairs the spectral substitute computes for its embedding. Substitute only; listed in params[''ignored''] on a PROST run.'
        n_domains:
          type: int
          required: false
          default: 6
          description: 'Target number of spatial domains (clusters) to infer. In the fallback path this is the number of KMeans clusters; in the PROST PNN path, this value is passed to the PNN routine.

            '
        seed:
          type: int
          required: false
          default: 0
          description: 'Random seed used when calling PROST PNN (if applicable) and when running KMeans in the fallback spectral clustering, so that domain assignments are reproducible.

            '
        allow_spectral_fallback:
          type: bool
          required: false
          default: false
          description: 'Whether to accept a substitute when PROST cannot run. Default false: the tool then fails with PROST''s own error, so nothing that is not PROST is reported under its name. true accepts KMeans on the Laplacian eigenvectors of a kNN graph built from the spot coordinates alone (gene expression is not used; not PROST); the result then names it in params[''method''], sets params[''used_fallback''] to true, and the analysis text says PROST did not run.'
        platform:
          type: str
          required: false
          default: 'visium'
          description: 'PROST platform preset, which selects how the slide is laid out on a grid before the spatial index is computed. ''visium'' and ''ST'' take the regular lattice path (rasterising obs[''array_row'']/obs[''array_col''] when the file has them, else the spatial_key coordinates) and keep genes detected in at least 3 spots; any other name (for example ''Slide-seq'', ''Stereo-seq'', ''osmFISH'', ''SeqFISH'') takes the irregular-spot path, which interpolates the expression onto a grid and keeps only genes detected in at least 50 spots. ''visium'' -- also when passed explicitly -- is replaced by ''irregular'' (the interpolating path) when the coordinates cannot form that lattice: a spot at a negative image index, or a median nearest-spot spacing above 4 pixels (for example micrometre or pixel coordinates without array_row/array_col). params.platform is the preset PROST ran with, and the analysis text says when and why it was replaced. Set it to match the assay.'
        pnn_init:
          type: str
          required: false
          default: 'kmeans'
          description: 'Initialisation PROST''s PNN clustering starts from. Must be ''kmeans'' or ''mclust'': PROST''s
            own default, ''leiden'', ignores n_domains and picks the number of domains from a resolution instead, so
            it is not offered here.'
        pnn_k_neighbors:
          type: int
          required: false
          default: 7
          description: 'Neighbours in the cell graph PROST''s PNN clustering builds (PROST''s own default is 7). This
            is separate from n_neighbors, which sizes the graph used by the spectral fallback.'
        pnn_n_top_genes:
          type: int
          required: false
          default: 3000
          description: 'Upper bound on the genes PROST''s own feature selection keeps (ranked by the PROST index) before the PNN clustering runs; PROST''s default is 3000. feature_selection keeps at most the genes with a positive PROST index among those prepare_for_PI kept (detected in at least 10% of spots), so a targeted panel can give fewer; params[''pnn_n_genes_used''] is the count PNN clustered on. It is what keeps PNN''s dense PCA tractable on a whole-transcriptome slide, so raising it well above a few thousand costs memory quickly.'
        pnn_preprocessing:
          type: str
          required: false
          default: 'normalize_log1p'
          description: 'Expression preprocessing between PROST''s cal_PI and its feature selection / PNN clustering. ''normalize_log1p'' (default) runs sc.pp.normalize_total + sc.pp.log1p on raw counts, as PROST''s own DLPFC tutorial does, and refuses a matrix that is not non-negative integers (point layer_key at a raw-count layer, or pass use_raw_counts=true when the counts sit in adata.raw). ''none'' gives PNN the matrix exactly as stored, for input that is already normalised and log-transformed.'
        pnn_sparse:
          type: bool
          required: false
          default: false
          description: 'Run PROST''s own run_PNN_sparse instead of run_PNN for the PNN clustering (same pnn_init, n_domains and pnn_k_neighbors). run_PNN (the default, false) densifies the n_spots x n_spots spot graph and trains a dense graph-attention layer on it: about 56 bytes per spot pair at the peak (~8 GiB at 12,000 spots, ~13 TiB at 500,000). run_PNN_sparse keeps the graph and the attention layer sparse in the forward pass (a different attention formula, so its domains can differ from run_PNN''s) but its backward pass still builds one n x n float32 gradient, about 5 bytes per pair. The chosen variant''s peak is estimated before prepare_for_PI starts; a run that cannot fit stops there with the numbers and says whether this switch would fit. params.pnn_function names the PROST function that ran and params.pnn_memory the estimate.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Give PROST adata.raw.X instead of X. Use it for a CELLxGENE-style h5ad whose X is log-normalised or scaled and whose integer counts sit in adata.raw, where layer_key cannot reach them; a file without adata.raw, or whose adata.raw does not hold counts, is refused, and so is use_raw_counts together with layer_key. With pnn_preprocessing=''normalize_log1p'' (the default) a non-count X is refused and the error names this switch when adata.raw holds counts. params.expression_source is then ''raw.X'' and data.n_genes counts adata.raw''s genes.'
  stagate:
    enabled: true
    label: "STAGATE \u2013 Graph attention auto-encoder for spatial domains"
    description: 'STAGATE constructs a spatial neighbor graph and uses a graph attention auto-encoder to learn low-dimensional embeddings and identify spatial domains in spatial transcriptomics data.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/stagate_mcp_server.py
    env:
      STAGATE_PYTHON: /opt/conda/envs/stagate_pyg/bin/python
      STAGATE_WORKER: /workspace/epic-fermat/agent/tools/stagate_worker.py
    tools:
    - spatialomicsgym_name: stagate_spatial_domains
      description: 'Run STAGATE to build a spatial neighbor graph, train a graph attention auto-encoder, and cluster spots into spatial domains with KMeans on its embedding (mclust is not run), returning an annotated AnnData and labels. Spots with obs[''in_tissue''] == 0 (background) are left out before the graph is built and reported under params.in_tissue_filter. The graph is measured before training and reported in summary.spatial_graph (edges, mean neighbours per spot, isolated spots); a graph that leaves more than half the spots with no neighbour is refused with the spot spacing and the remedy, because upstream adds a self-loop to every spot and would otherwise train a non-spatial auto-encoder. STAGATE trains on a subset of the genes you supply. The preprocessing follows STAGATE''s tutorial: drop every gene detected in fewer than 3 spots, flag the n_hvg most highly variable (3,000 by default), normalise each spot to 10,000 over all the remaining genes and log-transform, and only then keep the flagged genes. The payload reports the supplied panel as n_genes and the analysed panel as n_genes_used. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] and raw counts in X (or in the layer named by layer_key). Raw counts needed for seurat_v3 HVG selection. Tool runs normalize, log1p, HVG internally. Required obs: none (obs[''in_tissue''] is honoured when present). SC reference: not needed. Image: not needed.'
      parameters:
        st_h5ad:
          type: string
          required: true
          description: 'Path to the spatial AnnData (.h5ad) containing expression and spatial coordinates.

            '
        output_dir:
          type: string
          required: true
          description: 'Directory where STAGATE outputs (annotated h5ad stagate_domains.h5ad, domain label CSV stagate_domain_assignments.csv, embedding stagate_embedding.npy) will be saved.'
        spatial_key:
          type: string
          required: false
          default: spatial
          description: 'Key in `adata.obsm` storing spatial coordinates; the MCP will copy this to `obsm[''spatial'']` before running STAGATE.

            '
        layer_key:
          type: string
          required: false
          default: ''
          description: 'Optional key in `adata.layers` to use as the expression matrix. If empty, STAGATE will use `adata.X`.

            '
        rad_cutoff:
          type: number
          required: false
          default: 0.0
          description: 'Radius of the spatial neighbor graph, in the units of obsm[spatial_key]. 0 (default) derives it from the data: 1.2 x the median distance from a spot to its 6th-nearest spot, which on a Visium grid links each spot to its six-spot first ring (the graph STAGATE''s tutorial value of 150 builds on its own DLPFC coordinates). A fixed value depends on the coordinate units: where the spot spacing exceeds it (150 on many CytAssist and Visium atlas slides) it links no spots and the run is refused. The radius used is reported as params.rad_cutoff. Not used when k_cutoff > 0.'
        k_cutoff:
          type: int
          required: false
          default: 0
          description: 'When > 0, build a k-nearest-neighbor graph with this k (upstream model=''KNN'') instead of a radius graph; rad_cutoff is then not used. 0 (default) builds the radius graph.'
        n_epochs:
          type: int
          required: false
          description: 'Number of training epochs for STAGATE. Larger values yield better convergence at the cost of runtime.

            '
          default: 2000
        n_clusters:
          type: int
          required: false
          default: 6
          description: 'Number of spatial domains KMeans is asked for on the STAGATE embedding. summary.n_clusters reports the number of domains the labels hold and summary.n_clusters_requested this value.'
        device:
          type: string
          required: false
          default: auto
          description: 'Device for training: "auto" (GPU if available), "cpu", or a CUDA device string such as "cuda:0". params.device reports the device that trained; a CUDA request on a machine without CUDA trains on the CPU and the payload warns.'
        seed:
          type: int
          required: false
          default: 0
          description: 'Random seed for STAGATE training and for the KMeans clustering of its embedding.'
        n_hvg:
          type: int
          required: false
          default: 3000
          description: 'How many highly variable genes STAGATE trains on, chosen after the detected-in-fewer-than-3-spots
            filter. 3,000 is the upstream tutorial value. Raise it toward the panel size to train on more of
            the slide, or lower it on a targeted panel where 3,000 exceeds the genes available.'
        hvg_flavor:
          type: string
          required: false
          default: seurat_v3
          description: 'scanpy flavour for choosing the n_hvg genes: seurat_v3 (default; ranks raw counts and needs scikit-misc in the STAGATE env), seurat or cell_ranger (log-normalised dispersion). A missing package stops the run; no other flavour is substituted.'
  mist:
    enabled: true
    label: "MIST \u2013 Region detection and imputation (ReST)"
    description: 'MIST (ReST) detects spatially coherent tissue regions (ReST extract_regions) and fills zeros with ReST''s default spKNN imputer (mean of the spot''s grid neighbours; MIST''s region-wise
      ensemble imputer is not run). It reads the Visium array grid from obs[''array_row''] / obs[''array_col''], runs ReST QC and preprocessing, then returns region labels, region statistics, and an spKNN-imputed
      CPM matrix.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/mist_mcp_server.py
    env:
      MIST_PYTHON: /opt/conda/envs/ReST/bin/python
      MIST_WORKER: /workspace/epic-fermat/agent/tools/mist_worker.py
    tools:
    - spatialomicsgym_name: mist_regions_impute
      description: 'Run the MIST (ReST) pipeline on a spatial transcriptomics AnnData file: region detection (ReST extract_regions) and/or imputation with ReST''s default spKNN imputer (each zero replaced by the mean of the spot''s grid neighbours; MIST''s region-wise ensemble imputer is not run). Outputs: region assignments (the label ''isolated'' marks a spot in no region and is not a region), region statistics, and an spKNN-imputed CPM matrix, all over the in-tissue spots that pass ReST''s QC (spots with obs[''in_tissue''] == 0, background outside the tissue, are left out first and counted in params.in_tissue_filter; ReST''s QC then keeps pct_counts_mt < 25 and non-zero counts; data.n_spots is the count supplied, data.n_spots_used the count the tables cover). A run that finds no region is an error. ReST CPM-normalises and log2-transforms the matrix it is given, i.e. treats it as counts, so the matrix is checked first: a negative or non-finite one is refused (the error says whether adata.raw holds counts), a non-integer one runs with a warning, and use_raw_counts=true hands ReST adata.raw.X (params.expression_source and params.x_matrix_kind say which matrix ran). seed is accepted and listed under params.ignored (nothing on this path draws from a seedable random stream). [DATA REQUIREMENTS] Input: h5ad with raw counts in X (or in a layer, or in adata.raw with use_raw_counts=true) and the Visium array grid in obs[''array_row''] / obs[''array_col'']; obsm[spatial_key] is read only when those columns are absent, and pixel coordinates are refused unless allow_coordinate_rescale_fallback is true. Required obs: array_row, array_col (or a unit-spaced grid in obsm). SC reference: not needed. Image: not needed.'
      parameters:
        st_h5ad:
          type: string
          required: true
          description: 'Path to the spatial AnnData (.h5ad) file containing expression and spatial coordinates (e.g., Visium or similar).

            '
        output_dir:
          type: string
          required: true
          description: 'Directory where MIST outputs will be written, including: ''mist_region_assignments.csv'', ''mist_region_stats.txt'', and ''mist_imputed_expression.csv''.

            '
        spatial_key:
          type: string
          required: false
          default: spatial
          description: 'obsm key read only when obs[''array_row''] / obs[''array_col''] are absent. MIST links spots closer than 2 coordinate units, so pixel coordinates are refused unless
            allow_coordinate_rescale_fallback is true.

            '
        layer_key:
          type: string
          required: false
          default: null
          description: 'Optional key in adata.layers to use as the expression matrix. It must exist (a missing layer is an error, not a switch to X) and is checked like X (raw counts expected: a negative or non-finite layer is refused, a non-integer one runs with a warning). If omitted or null, adata.X is used. Cannot be combined with use_raw_counts=true.'
        species:
          type: string
          required: false
          default: Human
          description: 'Species for ReST''s mitochondrial QC: ''Human'' (MT- genes) or ''Mouse'' (mt- genes), any case.

            '
        hvg_prop:
          type: number
          required: false
          default: 0.8
          description: 'Proportion of genes to keep as highly variable genes during ReST preprocessing (rd.preprocess).

            '
        n_pcs:
          type: int
          required: false
          default: 10
          description: 'Number of principal components to use in ReST preprocessing.

            '
        filter_spot:
          type: boolean
          required: false
          default: true
          description: 'Accepted and ignored: ReST.preprocess has no spot-filter switch; its QC (pct_counts_mt < 25) always runs. Listed in params.ignored.

            '
        min_sim:
          type: number
          required: false
          default: 0.1
          description: 'Minimum similarity threshold for ReST region extraction (rd.extract_regions).

            '
        min_size:
          type: int
          required: false
          default: 20
          description: 'Minimum region size (number of spots) to keep during region extraction.

            '
        gap:
          type: number
          required: false
          default: 0.02
          description: 'Gap parameter controlling region merging in ReST region extraction.

            '
        n_cores:
          type: int
          required: false
          default: 1
          description: 'Accepted and ignored: it belongs to MIST''s ensemble imputer, which this tool does not run; the spKNN imputation that runs is single-threaded. Listed in params.ignored.

            '
        n_experts:
          type: int
          required: false
          default: 3
          description: 'Accepted and ignored: spKNN has no experts (they belong to MIST''s ensemble imputer, which this tool does not run). Listed in params.ignored.

            '
        task:
          type: string
          required: false
          default: all
          enum:
          - all
          - regions
          - impute
          - regions_impute
          description: 'Which parts of the MIST pipeline to run. ''all'' or ''regions_impute'' will run preprocessing, region extraction, and imputation; ''regions'' will only detect regions; ''impute''
            will only run imputation using the ReST object.

            '
        seed:
          type: int
          required: false
          default: 0
          description: 'Accepted and ignored: nothing on the path this tool runs draws from a random stream it could seed (ReST''s PCA uses scanpy''s fixed random_state=0; region extraction and spKNN imputation are deterministic). Listed in params.ignored.'
        allow_coordinate_rescale_fallback:
          type: boolean
          required: false
          default: false
          description: 'Default false: coordinates MIST cannot connect (median nearest-neighbour distance >= 2 coordinate units, e.g. pixel coordinates in obsm) are refused with an error. True: they are
            shifted to the origin, scaled so the median neighbour distance is sqrt(2), and rounded to integers; params.used_fallback is then true and params.coordinate_scale holds the factor. Only relevant
            when obs[''array_row''] / obs[''array_col''] are absent.

            '
        use_raw_counts:
          type: boolean
          required: false
          default: false
          description: 'Hand ReST the counts in adata.raw.X instead of X. Use it for a CELLxGENE-style h5ad whose X is log-normalised or scaled and whose integer counts sit in adata.raw; an h5ad without adata.raw, or whose adata.raw does not hold counts, is refused, and so is combining it with layer_key. Without it, a negative or non-finite matrix is refused and a non-integer one runs with a warning. Reported as params.expression_source ("X", "raw.X" or "layers[''<key>'']") and params.use_raw_counts.'
  spotgf:
    enabled: true
    label: "SpotGF \u2013 OT-based gene filtering and denoising (GEM)"
    description: 'SpotGF denoises spatially resolved transcriptomics data using an optimal transport-based gene filtering algorithm. It takes a GEM-like SRT file with geneID, x, y, and MIDCount columns,
      computes SpotGF scores for each gene, and generates denoised expression matrices and diagnostic plots under manual (proportion-based) and automatic thresholding schemes.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spotgf_mcp_server.py
    env:
      SPOTGF_PYTHON: /opt/conda/envs/SpotGF/bin/python
      SPOTGF_WORKER: /workspace/epic-fermat/agent/tools/spotgf_worker.py
    tools:
    - spatialomicsgym_name: spotgf_denoise
      description: 'Run the full SpotGF workflow on a GEM-format spatial transcriptomics file to compute SpotGF scores, generate denoised expression matrices, and produce spatial and QC visualizations.
        [DATA REQUIREMENTS] Input: GEM-format spatial transcriptomics file (NOT h5ad). Tool computes SpotGF scores and generates denoised expression. SC reference: not needed. Image: not needed.

        '
      parameters:
        gem_path:
          type: string
          required: true
          description: 'Path to the input spatial transcriptomics file in GEM/txt/csv format (optionally gzipped). The file must contain at least the columns: ''geneID'', ''x'', ''y'', and ''MIDCount''.
            If ''cen_x'' and ''cen_y'' are present, binsize can be set to 1 for single-cell denoising.

            '
        output_dir:
          type: string
          required: true
          description: 'Directory where SpotGF outputs will be written: ''SpotGF_scores.txt'', ''SpotGF_proportion_<proportion>.gem'', ''SpotGF_auto_threshold.gem'' (when auto_threshold), ''alpha_shape.png'' (always) and the figures described under visualize and auto_threshold. The payload lists only the files this run wrote; a same-named file left by an earlier run is reported in a warning, not as an output.'
        binsize:
          type: int
          required: false
          default: 70
          description: 'Denoising resolution used when calculating SpotGF scores. Smaller values yield finer denoising but increase runtime. This parameter affects the score calculation but not the final
            denoised GEM itself.

            '
        proportion:
          type: number
          required: false
          default: 0.5
          description: 'Share (0-1] of the scored genes (those in more than 10 GEM rows) the proportion GEM keeps, by SpotGF score; e.g. 0.9 writes ''SpotGF_proportion_0.9.gem''. The unscored genes are added on top, so the GEM holds more than this share of all genes; the kept count is in summary.n_genes_kept_proportion. SpotGF keeps int(n_scored * proportion) genes, so a proportion that keeps none is refused before the run.'
        lower:
          type: number
          required: false
          default: 0.0
          description: 'Lower bound of SpotGF''s search for the tissue-outline alpha (alphashape.optimizealpha), which runs only when alpha is 0. With any other alpha it has no effect and is listed in params.ignored with a warning.'
        upper:
          type: number
          required: false
          default: 100000.0
          description: 'Upper bound of SpotGF''s search for the tissue-outline alpha, which runs only when alpha is 0; with any other alpha it has no effect and is listed in params.ignored with a warning. Typically left at a large value.'
        max_iterations:
          type: int
          required: false
          default: 10000
          description: 'Maximum iterations of SpotGF''s search for the tissue-outline alpha (alphashape.optimizealpha), which runs only when alpha is 0; with any other alpha it has no effect and is listed in params.ignored with a warning.'
        auto_threshold:
          type: boolean
          required: false
          default: true
          description: 'If true, SpotGF also writes ''SpotGF_auto_threshold.gem'' (genes above an automatic score threshold) and two violin plots comparing the denoised GEMs with the raw data; false skips both. SpotGF builds the violins from its spatial figures, which it draws only for a denoised GEM with more than 200 genes, so with a smaller GEM it stops in that last step after the scores and every GEM are written: the run is then reported with those files, summary.upstream_completed false and a warning, and no violin plot.'
        visualize:
          type: boolean
          required: false
          default: true
          description: 'If true, SpotGF saves ''Spatial_proportion.png'' (and ''Spatial_automatic.png'' with auto_threshold), each only for a denoised GEM with more than 200 genes. SpotGF cannot run its auto threshold without these figures, so with auto_threshold true they are always drawn and visualize=false is reported in params.ignored; turn auto_threshold off as well to run without figures. ''alpha_shape.png'' is written either way.'
        spot_size:
          type: int
          required: false
          default: 5
          description: 'Spot size (marker size) used when drawing spatial expression figures.

            '
        alpha:
          type: number
          required: false
          default: 0.0
          description: 'Alpha parameter for tissue boundary detection. 0 (the default) makes SpotGF search for it within lower/upper for at most max_iterations iterations; any other value is used as the outline alpha directly, and lower, upper and max_iterations are then listed in params.ignored. params.alpha_searched says which happened.'
  xfuse:
    enabled: true
    label: "XFuse \u2013 Deep spatial data fusion (super-resolution)"
    description: 'XFuse integrates histology images and spatial transcriptomics using a deep generative model to produce super-resolved expression maps and other analyses specified in a TOML configuration
      file.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/xfuse_mcp_server.py
    env:
      XFUSE_PYTHON: /opt/conda/envs/xfuse/bin/python
      XFUSE_WORKER: /workspace/epic-fermat/agent/tools/xfuse_worker.py
    tools:
    - spatialomicsgym_name: xfuse_spatial_analysis
      description: 'Run XFuse super-resolution end-to-end from a standard spatial h5ad file. This is the entry point to use when you have an h5ad: it converts the data to XFuse''s native format, writes the TOML configuration, trains the model, and runs the requested analyses, all under one output directory. Use xfuse_run instead only when you already have an XFuse-format .h5 and a TOML config. [DATA REQUIREMENTS] Input: spatial h5ad with adata.X raw integer counts (a normalised or log X is refused, not truncated, and the refusal names use_raw_counts when adata.raw holds counts; use_raw_counts=true fits adata.raw.X instead, as a CELLxGENE export needs; round_counts=true rounds near-integer floats), adata.obsm[''spatial''] coordinates, and adata.uns[''spatial''] Visium-style metadata carrying an H&E image (hires or lowres) under exactly one library entry (a scalar beside it, such as CELLxGENE''s is_single, is skipped; two libraries are refused). adata.obs[''in_tissue''] is optional: spots with in_tissue == 0 are left out of the count data and the payload reports how many (params.in_tissue_filter); without the column every spot is modelled. At most 32,767 on-tissue spots per slide, because XFuse numbers spots in an int16 label image. The payload reports data.n_spots / data.n_genes as supplied and data.n_spots_used / data.n_genes_used as fitted (after the tissue mask, XFuse''s gene filter and slide_min_counts), and params.expression_source names the matrix fitted. Gene maps are not masked to tissue (the conversion is --no-mask). SC reference: not needed. Image: required, and must be embedded in the h5ad.'
      parameters:
        st_h5ad:
          type: string
          required: true
          description: 'Path to the spatial transcriptomics AnnData h5ad file.

            '
        output_dir:
          type: string
          required: true
          description: 'Directory for all outputs: the converted data, the generated TOML config, and the training results.

            '
        epochs:
          type: int
          required: false
          default: 50
          description: 'Number of training epochs. Use 3-10 for a quick smoke test.

            '
        batch_size:
          type: int
          required: false
          default: 1
          description: 'Training batch size. Increase if GPU memory allows.

            '
        patch_size:
          type: int
          required: false
          default: 512
          description: 'Size of the image patches used for training. Use 256 for speed.

            '
        network_depth:
          type: int
          required: false
          default: 5
          description: 'XFuse neural network depth.

            '
        network_width:
          type: int
          required: false
          default: 16
          description: 'XFuse neural network width.

            '
        learning_rate:
          type: float
          required: false
          default: 0.0003
          description: 'Optimizer learning rate.

            '
        gene_regex:
          type: string
          required: false
          default: '.*'
          description: 'Regular expression selecting which genes to model. The default keeps all genes; use ''^(?!RPS|RPL|MT-).*'' to exclude ribosomal and mitochondrial genes.

            '
        min_counts:
          type: int
          required: false
          default: 1
          description: 'Minimum total reads per gene across all spots for that gene to be kept.

            '
        slide_min_counts:
          type: int
          required: false
          default: 0
          description: Minimum total reads per spot for that spot to be modelled. The default 0 keeps every
            spot. XFuse masks out every spot whose summed counts fall below this; its own project template
            uses 100, which drops background and near-empty areas of the slide. It is the per-spot
            counterpart of min_counts, which filters on the other axis.
        enable_metagenes:
          type: boolean
          required: false
          default: true
          description: 'If true, run metagene analysis after training.

            '
        enable_prediction:
          type: boolean
          required: false
          default: false
          description: 'Must stay false on this tool; true is refused before anything is converted or trained. XFuse''s prediction analysis sums predicted expression over the regions of a named annotation layer in the slide''s data.h5, and this h5ad conversion writes none, so the run would train to the end and then fail. To predict per annotated region, convert with ''xfuse convert visium --annotation'', then use xfuse_build_config with annotation_layer, and xfuse_run.'
        enable_gene_maps:
          type: boolean
          required: false
          default: false
          description: 'If true, run gene map imputation after training. The maps are not masked to tissue: XFuse masks them with a zero-count background label that only its own image-based tissue detection (xfuse convert --mask) writes, and this pipeline converts with --no-mask (the spots come from obs[''in_tissue'']), so the maps cover the whole image, background included. The generated config says mask_tissue = false and the payload reports params.gene_maps_masked = false with a warning.'
        session_path:
          type: string
          required: false
          default: null
          description: Optional path to an existing XFuse '.session' file, to resume a previous run instead
            of training from scratch. Passed through to 'xfuse run --session'. Leave unset for a fresh run.
        round_counts:
          type: boolean
          required: false
          default: false
          description: 'Round adata.X to the nearest integer (np.rint) before conversion. Off by default, so a non-integer X is an error rather than silently truncated to integers. Use it only for counts stored as near-integer floats; the payload reports params.n_values_rounded and a warning, which names use_raw_counts when X is not near-integer and adata.raw holds counts (rounded log values are not counts). Negative or NaN/inf values are refused either way.'
        use_raw_counts:
          type: boolean
          required: false
          default: false
          description: 'Fit adata.raw.X instead of adata.X, keeping obs, obsm and uns. For an h5ad whose X is log-normalised or scaled and whose integer counts sit in adata.raw (CELLxGENE exports such as the library''s Muscle Gastrocnemius and Skin FaceTemple samples); without it such an X is refused and the error names this switch. A file without adata.raw, or whose adata.raw does not hold counts, is refused. The matrix fitted is reported as params.expression_source (X or raw.X).'
    - spatialomicsgym_name: xfuse_run
      description: 'Run an XFuse analysis given a TOML configuration file and a save directory. This corresponds to running `xfuse run CONFIG.toml --save-path SAVE_PATH [--session SESSION]` on the command
        line. [DATA REQUIREMENTS] Input: TOML configuration file specifying slides and settings. Requires pre-prepared data in XFuse format. SC reference: not needed. Image: histology images referenced
        in TOML config.

        '
      parameters:
        config_path:
          type: string
          required: true
          description: 'Path to the XFuse TOML configuration file (e.g. ''./work/xfuse_config.toml'').

            '
        save_path:
          type: string
          required: true
          description: 'Directory where XFuse should write the run, including TensorBoard logs and an ''analyses'' subdirectory for results.

            '
        session_path:
          type: string
          required: false
          default: null
          description: 'Optional path to an existing XFuse ''.session'' file to resume a previous run (passed to ''xfuse run --session'').

            '
    - spatialomicsgym_name: xfuse_build_config
      description: |
        Build a basic XFuse TOML configuration file from simple inputs (slides, optimization settings, and which analyses to enable) for xfuse_run. This tool writes a ready-to-use config file and returns its path. Example of a generated config:

            [xfuse]
            network_depth = 5
            gene_regex = ".*"
            min_counts = 1

            [optimization]
            epochs = 50
            batch_size = 1
            patch_size = 512

            [analyses]
            [analyses.analysis-metagenes]
            type = "metagenes"
            [analyses.analysis-prediction]
            type = "prediction"
            [analyses.analysis-prediction.options]
            annotation_layer = "annotation1"

            [slides]
            [slides.toydata1]
            data = "toydata.h5"
            [slides.toydata1.covariates]
            section = "0"
            [slides.toydata1.options]
            min_counts = 0

        [DATA REQUIREMENTS] Input: slide paths to XFuse-format .h5 files (written by xfuse_spatial_analysis) and analysis parameters. Generates the TOML configuration file for xfuse_run. SC reference: not needed. Image: none separately; each slide's .h5 carries its histology image.
      parameters:
        output_config_path:
          type: string
          required: true
          description: 'Path where the TOML configuration file should be written, e.g. ''./work/xfuse_config_basic.toml''.

            '
        slides:
          type: array
          required: true
          description: 'List of slides for XFuse. Each slide becomes a [slides.<name>] block with its ''data'' path and a ''section'' covariate set to the slide''s position in the list (0, 1, ...), which is what keeps slides apart.'
          items:
            type: object
            properties:
              name:
                type: string
                required: true
                description: 'Identifier used in the config under [slides.<name>], e.g. ''toydata1'' or ''slide1''.'
              data:
                type: string
                required: true
                description: 'Path to the XFuse-format .h5 file holding this slide''s data. A relative path is taken relative to the config file.'
              min_counts:
                type: int
                required: false
                description: 'Per-slide SPOT filter: spots whose summed counts fall below this are masked out (default 0 keeps every spot). Label 1 is exempted (always_keep = [1]) only when the slide''s data.h5 holds it with zero counts -- the background ''xfuse convert'' writes with its default tissue mask; a --no-mask conversion such as xfuse_spatial_analysis writes gets always_keep = [], and a file that cannot be read yet gets [] with a warning. params.always_keep and params.always_keep_basis say what each slide got.'
        network_depth:
          type: int
          required: false
          default: 5
          description: 'Value for [xfuse].network_depth (model depth).

            '
        epochs:
          type: int
          required: false
          default: 50
          description: 'Number of training epochs ([optimization].epochs).

            '
        batch_size:
          type: int
          required: false
          default: 1
          description: 'Batch size for optimization ([optimization].batch_size).

            '
        patch_size:
          type: int
          required: false
          default: 512
          description: 'Patch size for optimization ([optimization].patch_size).

            '
        enable_metagenes:
          type: boolean
          required: false
          default: true
          description: 'If true, add an [analyses.analysis-metagenes] block (type = "metagenes").'
        enable_prediction:
          type: boolean
          required: false
          default: false
          description: 'If true, add an [analyses.analysis-prediction] block (type = "prediction") that reads the annotation layer named by annotation_layer. XFuse runs analyses after training and fails when a slide''s data.h5 lacks that layer, so name a layer every slide carries.'
        enable_gene_maps:
          type: boolean
          required: false
          default: false
          description: 'If true, add an [analyses.analysis-gene-maps] block (type = "gene_maps") with XFuse''s default mask_tissue = true. That mask is the slide''s zero-count background label, which only an xfuse convert --mask conversion writes; a slide whose label 1 is a spot (a --no-mask conversion, as xfuse_spatial_analysis writes) has none, so its gene maps cover the whole image, and a warning names such slides.'
        network_width:
          type: int
          required: false
          default: 16
          description: 'XFuse neural network width.'
        learning_rate:
          type: number
          required: false
          default: 0.0003
          description: 'Optimizer learning rate.'
        gene_regex:
          type: string
          required: false
          default: '.*'
          description: Regular expression selecting which genes XFuse models, written into [xfuse].gene_regex.
            The default keeps all genes; use "^(?!RPS|RPL|MT-).*" to exclude ribosomal and mitochondrial genes.
        min_counts:
          type: int
          required: false
          default: 1
          description: Minimum total reads per gene across the whole slide for that gene to be kept, written
            into [xfuse].min_counts. This is a gene filter, separate from the per-slide min_counts carried
            in slides, which filters low-quality spots.
        annotation_layer:
          type: string
          required: false
          default: ''
          description: 'Name of the annotation layer the prediction analysis reads, written into [analyses.analysis-prediction.options].annotation_layer. Only used when enable_prediction is true. The default '''' matches no layer, so the config is written with a warning. Layers are written by ''xfuse convert ... --annotation''; the h5ad conversion in xfuse_spatial_analysis writes none. A slide data file that already exists is checked and a missing layer is refused.'
  istar:
    enabled: true
    label: "iStar \u2013 Super-resolution tissue architecture"
    description: 'iStar infers near single-cell tissue architecture by integrating spatial transcriptomics (cnts.tsv, locs-raw.tsv) with histology (he-raw.jpg). Each dataset lives under a "prefix" directory
      that must contain the raw inputs described in the iStar README (he-raw.jpg, cnts.tsv, locs-raw.tsv, pixel-size-raw.txt, radius-raw.txt). A demo dataset ships with the iStar checkout at ''$ISTAR_SRC/data/demo/''
      if you have run the iStar demo data download script.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/istar_mcp_server.py
    env:
      ISTAR_PYTHON: /opt/conda/envs/istar/bin/python
      ISTAR_WORKER: /workspace/epic-fermat/agent/tools/istar_worker.py
    tools:
    - spatialomicsgym_name: istar_check_dataset
      description: 'Check whether an iStar dataset prefix is ready to run the pipeline. This tool inspects the directory to see if required files exist: - he-raw.jpg: raw histology image - cnts.tsv: gene
        count matrix (rows = spots, columns = genes) - locs-raw.tsv: spot locations, matching rows in cnts.tsv - pixel-size-raw.txt: physical pixel size of he-raw.jpg - radius-raw.txt: number of pixels
        per spot radius It returns which files exist, which are missing, and a ''ready'' flag. Use this before calling istar_full_pipeline to confirm that data are prepared. For the built-in demo, you can
        use prefix = ''$ISTAR_SRC/data/demo/'', the demo bundled with your iStar checkout. [DATA REQUIREMENTS] Input: dataset prefix directory containing required iStar input files. Tool checks data readiness. SC reference: not needed.
        Image: checked as part of dataset.

        '
      parameters:
        prefix:
          type: string
          required: true
          description: 'Dataset prefix directory (e.g. ''$ISTAR_SRC/data/demo/'', the demo bundled with your iStar checkout). This directory should contain the raw iStar inputs listed above.

            '
    - spatialomicsgym_name: istar_full_pipeline
      description: 'Run the full iStar pipeline (iStar''s own scripts, in the order of its run.sh) on a dataset located under a given prefix directory. Required inputs under {prefix} are he-raw.jpg, cnts.tsv, locs-raw.tsv, pixel-size-raw.txt, and radius-raw.txt, as described in the iStar README. Raw inputs are copied into ''output_dir'', and all intermediate and final results are written there, where iStar''s scripts put them: super-resolution expression per gene in cnts-super/ (plots in cnts-super-plots/), gene-feature clusters in clusters-gene/, per-cluster differential expression in cnts-clustered/by-clusters/contrast/, and spot-level plots in spots/; output_files names each one, and a path iStar did not write is null. [DATA REQUIREMENTS] Input: dataset prefix directory with gene expression, spatial coordinates, and tissue image. Tool runs full iStar super-resolution pipeline. SC reference: not needed. Image: required (tissue image in dataset directory).

        '
      parameters:
        prefix:
          type: string
          required: true
          description: 'Path prefix to the dataset directory, e.g. ''$ISTAR_SRC/data/demo/'' (the demo bundled with your iStar checkout). This directory should contain at least: ''he-raw.jpg'', ''cnts.tsv'', ''locs-raw.tsv'', ''pixel-size-raw.txt'',
            and ''radius-raw.txt''.

            '
        output_dir:
          type: string
          required: true
          description: 'Output directory where the full iStar run will be stored, e.g. ''./work/istar_demo''. The worker will copy the raw input files from ''prefix'' into this directory and run
            the pipeline there, so ALL results live under this folder.

            '
        device:
          type: string
          required: false
          default: cpu
          enum:
          - cpu
          - cuda
          description: 'Device to use for feature extraction and imputation. Default is ''cpu'' as requested; ''cuda'' can be used if GPUs are available.

            '
        pixel_size:
          type: number
          required: false
          default: 0.5
          description: 'Desired analysis pixel size written to {output_dir}/pixel-size.txt before preprocessing.

            '
        n_genes:
          type: int
          required: false
          default: 1000
          description: 'Number of most variable genes to impute (select_genes.py --n-top). The number actually imputed is reported as summary.n_genes_imputed (fewer when cnts.tsv holds fewer genes).

            '
        impute_epochs:
          type: int
          required: false
          default: 400
          description: 'Number of epochs for imputation (impute.py --epochs).

            '
        n_clusters:
          type: int
          required: false
          default: 10
          description: 'Number of k-means clusters for gene-feature-based clustering (cluster.py --n-clusters). Connected regions smaller than min_cluster_size are then merged into their neighbours, so summary.n_clusters (the clusters found) can be lower; the request is reported as summary.n_clusters_requested.

            '
        filter_size:
          type: int
          required: false
          default: 8
          description: 'Filter size for smoothing spatial clusters (cluster.py --filter-size).

            '
        min_cluster_size:
          type: int
          required: false
          default: 20
          description: 'Minimum cluster size for gene-feature-based clustering (cluster.py --min-cluster-size).

            '
        run_celltype:
          type: boolean
          required: false
          default: false
          description: 'If true, run the optional cell-type inference step (pixannot.py + enrich.py) using a cell-type marker panel.

            '
        celltype_marker_file:
          type: string
          required: false
          default: null
          description: 'Path to a cell-type marker reference panel: a tab-separated table whose header names the columns ''gene'' and ''label'', one row per marker gene. Your iStar checkout ships a format example at ''$ISTAR_SRC/data/markers/cell-type-template.tsv''. Only used if run_celltype is true. Checked before the pipeline starts; a label none of whose marker genes is among the imputed genes stops the run before imputation, and markers that are not imputed are listed in summary.celltype_markers_not_imputed.

            '
        run_signature_scores:
          type: boolean
          required: false
          default: false
          description: 'If true, compute user-defined signature scores using marker_score.py.

            '
        signature_file:
          type: string
          required: false
          default: null
          description: 'Path to a signature score reference panel: a plain-text file with one gene symbol per line. Your iStar checkout ships a format example at ''$ISTAR_SRC/data/markers/signature-score-template.txt''. Only used if run_signature_scores is true. If none of its genes is among the imputed genes the run stops before imputation; genes that are not imputed are listed in summary.signature_genes_not_imputed.

            '
        allow_mask_fallback:
          type: boolean
          required: false
          default: false
          description: 'What to do when iStar''s tissue detection (get_mask.py) finds no tissue in he-raw.jpg. false (default): the run stops with an error before imputation. true: the whole image, background included, is treated as tissue; params.used_fallback is then true, params.method names the all-True mask and summary.tissue_mask is ''all_true_fallback''.

            '
  stage:
    enabled: true
    label: "STAGE \u2013 High-density spatial transcriptomics modeling"
    description: 'STAGE (upstream STAGE 1.0.1) is an autoencoder that maps expression to spot coordinates and decodes expression at new coordinates. Given a spatial AnnData (.h5ad), a platform (data_type) and an objective (experiment), the worker calls STAGE.STAGE once: 10x or ST_KTH generation decodes expression at new positions between measured array spots; Slide-seq 3d_model decodes simulated sections between real ones. 10x recovery is accepted but cannot run in the installed STAGE 1.0.1 and returns an error saying so. STAGE does not cluster.'
    command:
    - python
    - /workspace/epic-fermat/agent/tools/stage_mcp_server.py
    env:
      STAGE_PYTHON: /opt/conda/envs/stage_env/bin/python
      STAGE_WORKER: /workspace/epic-fermat/agent/tools/stage_worker.py
    tools:
    - spatialomicsgym_name: stage_run
      description: 'Run upstream STAGE (STAGE.STAGE, one call) on a spatial transcriptomics AnnData (.h5ad). Accepted data_type/experiment pairs: 10x with generation or recovery, ST_KTH with generation, Slide-seq with 3d_model; any other pair is refused before work starts. generation decodes expression at new positions a fixed fraction of an array-grid step from each measured spot, so it needs array-grid coordinates: obsm[''coord''] when supplied, otherwise obs[''array_col''] and obs[''array_row''] (the Visium tissue_positions columns, the STAGE tutorial layout); pixel coordinates in obsm[''spatial''] are refused, not used. Generation runs under pandas Copy-on-Write, and a run that generated no new position or moved the measured ones is reported as an error. recovery is accepted, but the installed STAGE 1.0.1 cannot run it (its model.py never sets X_dim on that branch): the call returns an error that says so and no other method is substituted. 3d_model reads x, y, z from obsm[''coord''] or obsm[''spatial''] and each bead''s section from obs[sec_name]. Spots with obs[''in_tissue''] == 0 (background outside the tissue, which CELLxGENE Visium exports carry) are left out before anything runs, so STAGE neither trains on them nor generates positions around them; params.in_tissue_filter and a warning say how many, data.n_spots counts the measured spots modelled and data.n_spots_input those supplied. Unless var[''highly_variable''] is present, the worker selects highly variable genes with hvg_flavor (5000 for 10x generation and Slide-seq, 3000 otherwise, or every gene of a narrower panel), then applies normalize_total and log1p; STAGE models only those genes (data.n_genes_used). Because that path normalises X as counts, a negative or non-finite X (scaled data) is refused there, naming use_raw_counts when adata.raw holds counts, and a non-negative non-integer X runs with a warning; use_raw_counts=true reads adata.raw.X instead; an input that carries its own var[''highly_variable''] is used as supplied (normalised data is accepted there). params.expression_source says which matrix was read. STAGE holds its training matrix dense; a run whose estimated peak does not fit in the memory available (under a cgroup limit, the room left once what the container already uses is counted) is refused with the numbers, and no in-tissue spot is dropped. Outputs under <output_dir>/stage_run/: adata_stage.h5ad (expression at the modelled positions, no cluster labels), adata_sample.h5ad (recovery), adata_simu.h5ad and adata_all.h5ad (3d_model), plus STAGE''s own weights and h5ad files; output_files lists only the files this call wrote. [DATA REQUIREMENTS] Input: h5ad with expression in X (raw counts for the default seurat_v3 gene selection, or in adata.raw with use_raw_counts=true) and, for 10x or ST_KTH generation, obs array_row/array_col or obsm[''coord''] in array units; Slide-seq 3d_model needs three-column coordinates and a section column. Required obs: none (an optional obs[''in_tissue''] 0/1 flag marks background spots). SC reference: not needed. Image: not needed.'
      parameters:
        st_h5ad:
          type: string
          required: true
          description: 'Path to the spatial AnnData (.h5ad): expression in X (raw counts for the default seurat_v3 gene selection, or any X plus a var[''highly_variable''] column) and coordinates: obsm[''coord''] if present; otherwise, for 10x and ST_KTH, obs[''array_col''] and obs[''array_row'']; obsm[''spatial''] is accepted for recovery and 3d_model (x, y, z), not for generation.'
        output_dir:
          type: string
          required: true
          description: 'Directory where STAGE outputs will be written. Recommended: ./work/stage_<short_task_name>.

            '
        data_type:
          type: string
          required: false
          default: 10x
          enum:
          - 10x
          - ST_KTH
          - Slide-seq
          description: "Platform / technology type, following the STAGE API:\n - \"10x\"      : 10x Visium-like data\n - \"ST_KTH\"   : ST KTH (PDAC-style) data\n - \"Slide-seq\": Slide-seq / Slide-seqV2\
            \ data.\n"
        experiment:
          type: string
          required: false
          default: generation
          enum:
          - recovery
          - generation
          - 3d_model
          description: 'Analysis objective. generation (10x or ST_KTH): decode expression at new positions between measured array spots. 3d_model (Slide-seq): decode simulated sections between real ones. recovery (10x): train on a down-sampled half and predict every spot; the installed STAGE 1.0.1 cannot run it (X_dim is never set on that branch), so the call returns an error and nothing is substituted.'
        coord_sf:
          type: number
          required: false
          default: null
          description: 'Coordinate scaling factor (STAGE coord_sf); upstream asks for the largest scaled coordinate to be about 1. If null, the tutorial value for data_type (10x 77, ST_KTH 35, Slide-seq 6000) when it scales the largest |x|,|y| to between 0.25 and 4, otherwise the largest |x|,|y| itself; params.coord_sf and params.coord_sf_source report which. An explicit value is used as given, with a warning when it is off-scale.'
        down_ratio:
          type: number
          required: false
          default: null
          description: 'Down-sampling ratio for experiment=''recovery''. If null, the worker uses 0.5. Ignored for other experiments.

            '
        train_epoch:
          type: int
          required: false
          default: 10000
          description: 'Number of training epochs (STAGE train_epoch). For 3d_model on Slide-seq, the worker uses 1000 if this is left at 10000.

            '
        batch_size:
          type: int
          required: false
          default: null
          description: "Mini-batch size. If null, the worker uses platform-aware defaults:\n  - 10x generation/recovery -> 512\n  - ST_KTH generation      -> 64\n  - Slide-seq 3d_model     -> 8192.\n"
        learning_rate:
          type: number
          required: false
          default: null
          description: "Learning rate. If null, the worker uses:\n  - 10x           -> 1e-3\n  - ST_KTH        -> 1e-4\n  - Slide-seq 3D  -> 1e-3.\n"
        w_recon:
          type: number
          required: false
          default: 0.1
          description: 'Weight for reconstruction loss (default 0.1).

            '
        w_w:
          type: number
          required: false
          default: 0.1
          description: 'Weight for W regularization loss (default 0.1).

            '
        w_l1:
          type: number
          required: false
          default: 0.1
          description: 'Weight for L1 penalty (default 0.1).

            '
        use_gpu:
          type: boolean
          default: false
          description: 'Whether to attempt running STAGE on GPU (cuda:0). If false or if CUDA is unavailable, the worker runs on CPU.

            '
        seed:
          type: int
          default: 1234
          description: 'Random seed passed to STAGE and torch. Can be changed if you need different runs.

            '
        sec_name:
          type: string
          required: false
          default: null
          description: 'For experiment=''3d_model'' (Slide-seq): column name specifying the section id; defaults to ''section'' if null.

            '
        select_section:
          type: string
          required: false
          default: null
          description: 'For experiment=''3d_model'' (Slide-seq): comma-separated IDs of the sections to train on, spelled as obs[sec_name] spells them (numbers for a numeric column, e.g. ''1,3,5,6,8''; names otherwise). An ID the column lacks is refused. If null, 1,3,5,6,8. Listed in params.ignored for other experiments.'
        gap:
          type: number
          required: false
          default: 0.05
          description: 'For experiment=''3d_model'' (Slide-seq): z-distance between each simulated section and the real section it is derived from. Upstream defines it as half the distance between adjacent real sections; the worker warns when it is not. Defaults to 0.05. Listed in params.ignored for other experiments.'
        relu:
          type: boolean
          default: true
          description: 'Whether to use ReLU activation on output layers. Tutorials typically use true; you can turn it off if needed.

            '
        device:
          type: str
          required: false
          default: ''
          description: 'Compute device: "cpu", "gpu"/"cuda", or "cuda:N" to pick a specific GPU. Overrides use_gpu when set; left empty (the default) the choice falls back to use_gpu, which is off, so the run is on CPU. A GPU request on a machine without CUDA degrades to CPU rather than failing.'
        hvg_flavor:
          type: string
          required: false
          default: seurat_v3
          enum:
          - seurat_v3
          - seurat
          - cell_ranger
          description: 'scanpy highly-variable-gene flavour for inputs without a var[''highly_variable''] column. seurat_v3 (the STAGE tutorials) ranks raw counts and needs scikit-misc; when it cannot run, the call stops and names the package instead of switching flavour. seurat and cell_ranger rank normalised log data. No effect when var[''highly_variable''] is supplied (a non-default value is then listed in params.ignored).'
        use_raw_counts:
          type: boolean
          required: false
          default: false
          description: 'Default false. True reads adata.raw.X instead of X and runs the tutorial preprocessing (highly variable genes, normalize_total, log1p) on those counts, for an h5ad (typically a CELLxGENE Visium export) whose X is normalised or scaled and whose integer counts sit in adata.raw; refused when there is no adata.raw or it does not hold counts. The var[''highly_variable''] flags of X are not carried onto the raw counts (a warning says so). params.expression_source reports the matrix read ("X" or "raw.X").'
  spaotsc:
    enabled: true
    label: "SpaOTsc \u2013 Spatial OT mapping & signaling (scRNA-seq \u2194 spatial)"
    description: "SpaOTsc derives a mapping between spatial data and scRNA-seq, computes spatial cell\u2013cell distances for scRNA-seq, optional spatial clustering, and OT-based signaling analyses. It\
      \ first tries to use precomputed matrices (as in the SpaOTsc short tutorial); if those do not exist but raw data are provided (h5ad / h5 / csv / txt), it automatically normalizes them and constructs\
      \ the needed matrices.\n"
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spaotsc_mcp_server.py
    env:
      SPAOTSC_PYTHON: /opt/conda/envs/spaotsc/bin/python
      SPAOTSC_WORKER: /workspace/epic-fermat/agent/tools/spaotsc_worker.py
    tools:
    - spatialomicsgym_name: spaotsc_run
      description: 'Run the upstream SpaOTsc package: map scRNA-seq cells onto spatial spots by optimal transport, then optionally compute spatial cell-cell distances, spatial subclusters and ligand-receptor signaling. If precomputed matrices are available (either via `data_dir` with standard filenames or via explicit file paths), they are used directly; a path you name must exist. Otherwise, if raw inputs (raw_sc_path scRNA-seq counts and raw_is_path spatial counts) are provided, the tool builds all four matrices: sc expression (CPM 1e4 + log2 on the shared genes), sc_dmat (exp(1 - Pearson r) on up to 40 PCs), a cost matrix from profiles binarised strictly above each gene''s 70th percentile, and is_dmat (Euclidean distance between spot coordinates from obsm[''spatial''] or raw_is_coord_path; without coordinates the run stops). Background spots are not mapped: spots with obs[''in_tissue''] == 0 in an h5ad raw_is_path (a CELLxGENE Visium export carries every array spot), or flagged 0 by an in_tissue column of raw_is_coord_path, are left out before the matrices are built and counted (data.n_spots_off_tissue_dropped, params.in_tissue_filter). The raw build treats X as counts: an input whose matrix holds negative or NaN values (scaled data) is refused, one with non-integer values runs with a warning, and use_raw_counts=true reads the counts from adata.raw instead (params.expression_source). Steps, each needing the one before: run_mapping (transport plan, cells x spots); run_cellcell_distance (needs run_mapping; upstream solves one Sinkhorn problem per pair of cells, n_sc*(n_sc-1)/2 of them, so it is by far the slowest step); run_clustering (needs run_cellcell_distance and more than 50 cells); run_signaling (needs run_cellcell_distance plus non-empty ligands and receptors that are in the shared gene panel; ds_genes_up/ds_genes_down add the signal-range step). A requested step that cannot run is an error, never a silent skip. SpaOTsc is dense by construction (n_sc x n_sc, n_sc x n_is and n_is x n_is float64 matrices): the worker refuses with the numbers when they cannot fit (available memory is MemAvailable, or the room left under a container''s cgroup memory limit when that is smaller) and never subsamples. All outputs are saved under ./work/spaotsc_<tag> unless `output_dir` is overridden; output_files lists only the files this run wrote. coords_key: the obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). dims: 2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z. section_key: the obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run. For SpaOTsc the graph is is_dmat, read from an h5ad raw_is_path only (dims=3 with raw_is_coord_path is refused); it is one matrix over the whole input, so a 2D run on a multi-section file is refused even with section_key: run 3D, or once per section. params.mode and params.frame say which ran. [DATA REQUIREMENTS] Input: raw h5ad / h5 / csv / tsv / txt counts, or precomputed SpaOTsc matrices. SC reference: REQUIRED (raw_sc_path scRNA-seq plus raw_is_path spatial data, or precomputed sc_expr/sc_dmat/cost_matrix/is_dmat). Image: not needed.'
      parameters:
        out_tag:
          type: string
          required: false
          default: demo
          description: Short tag appended to ./work/spaotsc_<tag>.
        output_dir:
          type: string
          required: false
          default: null
          description: 'If set, override the default ./work/spaotsc_<tag>.

            '
        data_dir:
          type: string
          required: false
          default: null
          description: "Directory containing SpaOTsc-style precomputed matrices. Expected filenames (any missing will be reported):\n  - dm_sc_normalized.txt                (cells\xD7genes)\n  - dm_is.txt\
            \ OR dm_pos_pos_geodesic_mgeom.npy    (is_dmat)\n  - dm_scanpy_pca40_pcc.npy            (sc_dmat)\n  - dm_sc_is_mcc.npy                   (cost_matrix)\n  - selected_genes.txt              \
            \   (optional)\n"
        sc_expr_path:
          type: string
          nullable: true
          description: "Path to sc expression (cells\xD7genes) table (.txt/.tsv/.csv)."
        is_dmat_path:
          type: string
          required: false
          default: null
          description: Path to spatial distance matrix (.txt/.csv/.npy).
        sc_dmat_path:
          type: string
          required: false
          default: null
          description: Path to sc distance/dissimilarity (.npy recommended).
        cost_matrix_path:
          type: string
          required: false
          default: null
          description: "Path to sc\u2194spatial dissimilarity matrix (.npy recommended)."
        selected_genes_path:
          type: string
          required: false
          default: null
          description: Optional gene panel (one name per line) used when building the matrices from raw input; genes not in both inputs are dropped and counted. Must exist when given.
        raw_sc_path:
          type: string
          required: false
          default: null
          description: "Raw scRNA data: h5ad / h5 / csv / tsv / txt. - If h5ad: AnnData is read and X (cells\xD7genes) is used. - If text: rows=cells, columns=genes; first column is treated as index.\n"
        raw_is_path:
          type: string
          required: false
          default: null
          description: 'Raw spatial expression matrix (same genes as scRNA where possible). Accepts h5ad / h5 / csv / tsv / txt. If h5ad, obsm[''spatial''] is used as coordinates if available, and spots with obs[''in_tissue''] == 0 (background) are left out before the matrices are built and counted in data.n_spots_off_tissue_dropped.'
        raw_is_coord_path:
          type: string
          required: false
          default: null
          description: 'Optional explicit coordinates for spatial locations (csv/tsv/txt). The coordinate columns are found by name (pxl_row_in_fullres/pxl_col_in_fullres, imagerow/imagecol, array_row/array_col, row/col or x/y), so a Space Ranger tissue_positions file works as is; rows are matched to raw_is_path spots by the spot ID in the first column, and a file without IDs is matched by position only when its row count equals the number of spots. An in_tissue column (Space Ranger tissue_positions, the converter''s metadata.csv) is never read as a coordinate: spots it flags 0 are left out and counted. If omitted and raw_is_path is h5ad with obsm[''spatial''], those coordinates are used.'
        run_mapping:
          type: boolean
          required: false
          default: true
          description: "Compute transport plan \u03C0 (spatial\u2194sc mapping)."
        run_cellcell_distance:
          type: boolean
          required: false
          default: true
          description: 'Compute the spatial cell-cell distance for the scRNA-seq cells. Needs run_mapping=True. Upstream solves one Sinkhorn problem per pair of cells, n_sc*(n_sc-1)/2 of them (about 4.5 million for 3,000 cells), so this is by far the slowest step.'
        run_clustering:
          type: boolean
          required: false
          default: false
          description: 'Run SpaOTsc spatial subclustering on the sc cells. Needs run_cellcell_distance=True and more than 50 cells. Writes clustering/labels.csv with columns cell, cluster (spatial subcluster "i_j"; empty for a cell whose spatial group has 3 or fewer cells) and expression_cluster.'
        run_signaling:
          type: boolean
          required: false
          default: false
          description: 'Run OT-based ligand-receptor signaling (signaling/signaling_scores.*, an n_sc x n_sc sender-to-receiver score matrix). Needs run_cellcell_distance=True and non-empty ligands and receptors that are in the shared gene panel; otherwise the run fails rather than skipping the step. With ds_genes_up/ds_genes_down the signal range is also inferred over 10/50/100 is_dmat units (signaling/inferred_range.*).'
        ligands:
          type: array
          items:
            type: string
          required: false
          default: []
          description: Ligand gene symbols (for run_signaling).
        receptors:
          type: array
          items:
            type: string
          required: false
          default: []
          description: Receptor gene symbols (for run_signaling).
        ds_genes_up:
          type: array
          items:
            type: string
          required: false
          default: []
          description: Downstream genes up-regulated by the ligand-receptor signal (for run_signaling). A non-empty ds_genes_up or ds_genes_down also runs the signal-range step.
        ds_genes_down:
          type: array
          items:
            type: string
          required: false
          default: []
          description: Downstream genes down-regulated by the ligand-receptor signal (for run_signaling). A non-empty ds_genes_up or ds_genes_down also runs the signal-range step.
        seed:
          description: Random seed for reproducibility. Seeds both Python's random module and numpy.
          type: int
          required: false
          default: 1234
        use_landmark:
          type: boolean
          required: false
          default: true
          description: Solve each cell-pair transport in the cell-cell distance on 100 landmark spots instead of every spot; needs at least 100 spots.
        use_raw_counts:
          type: boolean
          required: false
          default: false
          description: 'Read the counts from adata.raw instead of X, for each h5ad raw input (raw_sc_path, raw_is_path) that carries an adata.raw; an input without one keeps X, with a warning. Default false reads X. Use it for a CELLxGENE-style h5ad whose X is processed and whose counts are in adata.raw. Only the raw build reads it; with precomputed matrices it is listed in params.ignored. params.expression_source says which matrix each input was read from.'
        coords_key:
          type: string
          required: false
          default: spatial
          description: 'The obsm key of raw_is_path holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned'').'
        dims:
          type: int
          required: false
          default: 2
          description: '2 or 3; 3 builds is_dmat in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z.'
        section_key:
          type: string
          required: false
          default: null
          description: 'The obs column naming sections of raw_is_path; recorded in params.frame of a 3D run. A 2D run on a multi-section file is refused (SpaOTsc builds one is_dmat over the whole input).'
  moscot:
    enabled: true
    label: "MOSCOT \u2013 Optimal transport for time & space"
    description: 'MOSCOT provides optimal transport formulations for time-series single-cell data, spatial alignment of slides, and mapping of scRNA-seq profiles onto spatial omics data. This MCP wrapper
      supports TemporalProblem, AlignmentProblem and MappingProblem via a unified tool interface.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/moscot_mcp_server.py
    env:
      MOSCOT_PYTHON: /opt/conda/envs/moscot/bin/python
      MOSCOT_WORKER: /workspace/epic-fermat/agent/tools/moscot_worker.py
    tools:
    - spatialomicsgym_name: moscot_run
      description: 'Run a MOSCOT problem (temporal dynamics, spatial alignment, or scRNA-to-spatial mapping) on AnnData inputs, using TemporalProblem, AlignmentProblem or MappingProblem from MOSCOT depending on `problem_type`. Before moscot runs, the worker applies normalize_total + log1p to X (unconditionally; an X that is already log-transformed is transformed again, and the payload warns when X did not hold integer counts) and stores a PCA with n_comps = min(30, n_obs - 1, n_vars - 1) as obsm[''X_moscot_pca'']; params.preprocessing reports both. Spots marked obs[''in_tissue''] == 0 in the spatial AnnData (the input of temporal and alignment, the spatial side of mapping) are background; they are left out after loading and counted in params.in_tissue_filter with a warning. Outputs: every problem type saves a pickled problem holding the solved couplings. Alignment writes adata_alignment_aligned.h5ad with the warped coordinates of every section in obsm[''moscot_spatial_warp''], one merged object whose sections are told apart by obs[batch_key] (recorded as params.batch_key); the section held fixed is params.reference_batch_used. Mapping writes moscot_mapping_cell_to_spot.csv (columns cell, batch, spot, transport_mass, mass_fraction: for every cell, the spot that receives most of its transported mass); adata_mapping_spatial.h5ad and adata_mapping_sc_with_pca.h5ad are the inputs as they entered the solver. Temporal writes no per-cell table; its couplings are only in moscot_temporal_problem.pkl. Parameters that do not apply to the chosen problem type are accepted and listed in params.ignored. params.device is the device requested and params.device_used the one solve() received. [DATA REQUIREMENTS] Input: h5ad files for temporal, spatial alignment, or scRNA-to-spatial mapping. Requirements vary by problem type. Spatial problems need obsm[''spatial'']. SC reference: mapping only.'
      parameters:
        problem_type:
          type: string
          required: true
          enum:
          - temporal
          - alignment
          - mapping
          description: 'Which MOSCOT problem to run. ''temporal'': TemporalProblem on a time-series AnnData (requires `time_key`). ''alignment'': AlignmentProblem to align two or more spatial sections concatenated in a single AnnData (requires `batch_key` naming the section of every spot, and spatial coordinates in `obsm[spatial_key]`). ''mapping'': MappingProblem to map scRNA-seq cells onto spatial spots (requires `adata_sc_path`; the spatial AnnData is `adata_spatial_path`, or `adata_path` when that is omitted).'
        adata_path:
          type: string
          required: true
          description: 'For ''temporal'' and ''alignment'': path to the AnnData (.h5ad) containing all cells. For ''mapping'', this is used as the spatial AnnData if `adata_spatial_path` is omitted (and is not read when it is given).'
        adata_spatial_path:
          type: string
          required: false
          default: null
          description: 'Optional explicit AnnData (.h5ad) path for the spatial dataset when `problem_type=''mapping''`. If omitted, the server uses `adata_path` as the spatial file. data.n_spots/n_genes describe this file.'
        adata_sc_path:
          type: string
          required: false
          default: null
          description: 'Required for `problem_type=''mapping''`: AnnData (.h5ad) with single-cell expression profiles to be mapped into space. It must share gene names (var_names) with the spatial AnnData.'
        time_key:
          type: string
          required: false
          default: null
          description: 'For `problem_type=''temporal''`: obs key storing numeric time points (e.g. ''day''). Required for temporal problems. The worker calls TemporalProblem.prepare(time_key=time_key, policy=policy, joint_attr=''X_moscot_pca''), where X_moscot_pca is the worker''s own PCA of the normalize_total + log1p X (n_comps = min(30, n_obs - 1, n_vars - 1)). Observations with no time point are refused unless drop_unlabeled is true.'
        batch_key:
          type: string
          required: false
          default: null
          description: 'For `problem_type=''alignment''`: obs key storing the section/slide of every spot. Required for alignment; at least 2 sections. The column is stored as string categories in moscot''s own section order (numeric order for numbers), which AlignmentProblem.align() requires; params.batch_key_recast reports the change, and params.batch_key records the column so the sections of adata_alignment_aligned.h5ad can be told apart. For `problem_type=''mapping''`, this is optional and forwarded to MappingProblem.prepare(batch_key=...): each spatial batch is mapped against all cells. Spots with no value are refused unless drop_unlabeled is true.'
        spatial_key:
          type: string
          default: spatial
          description: 'obsm key with spatial coordinates for spatial problems (alignment / mapping). For typical Visium-style data, this is ''spatial''. Not read by temporal problems (listed in params.ignored there).'
        policy:
          type: string
          required: false
          default: sequential
          description: 'Temporal: ''sequential'', ''triu'' or ''tril''. (''explicit'' is refused: it needs an explicit list of time-point pairs, which this tool does not take.) Alignment: ''sequential'' (align consecutive sections) or ''star'' (align every section to reference_batch, which is also passed to AlignmentProblem.prepare). If omitted, the worker uses ''sequential'' and reports it as params.policy. Mapping has no policy; a value given there is listed in params.ignored.'
        reference_batch:
          type: string
          required: false
          default: null
          description: 'For alignment problems: the obs[batch_key] level held fixed. It is the hub of policy=''star'' (AlignmentProblem.prepare(reference=...)) and the target of AlignmentProblem.align(key_added=''moscot_spatial_warp'', reference=...). Matched as text, so ''0'' names an integer section 0; an unknown level is refused before solving. If omitted, the first level of obs[batch_key] in order of appearance is used and reported as params.reference_batch_used, with a warning.'
        sc_attr:
          type: string
          required: false
          default: null
          description: 'For mapping problems: value passed to MappingProblem.prepare(sc_attr=...). If omitted, the worker applies the same normalize_total(target_sum=1e4) + log1p to BOTH AnnDatas'' X (moscot builds the expression term from one joint PCA over their shared genes), computes a PCA of the sc AnnData (n_comps = min(30, n_obs - 1, n_vars - 1)) and passes it as ''X_moscot_pca''. If given (e.g. ''X_pca'' or ''X_scVI'' in obsm), neither X is normalized by the worker, and the payload warns when one X holds integer counts and the other does not.'
        epsilon:
          type: number
          required: false
          default: 0.001
          description: 'Entropic regularization epsilon passed to .solve() for all problem types. A subproblem that does not converge is reported in summary.n_not_converged and as a warning; a larger epsilon converges faster.'
        alpha:
          type: number
          required: false
          default: 0.8
          description: 'For mapping problems: alpha parameter in MappingProblem.solve(), interpolating between quadratic (spatial) and linear (expression) terms. Ignored for temporal and alignment problems and listed in params.ignored there; AlignmentProblem.solve runs with moscot''s own alpha (0.5, reported as params.solver_alpha).'
        batch_size:
          type: int
          required: false
          default: null
          description: 'Optional batch size passed to .solve(). Larger values reduce overhead but require more memory; leave null to let MOSCOT choose defaults.

            '
        device:
          type: string
          required: false
          default: cpu
          description: 'Device moscot''s .solve() runs on: ''cpu'' (default), ''gpu'', ''cuda[:N]'' or ''tpu''. A GPU request where the worker finds no GPU runs on the CPU; params.device is the request, params.device_used the device solve() received, and the payload warns.'
        output_dir:
          type: string
          required: false
          default: null
          description: 'Directory where the worker will write all outputs. If omitted, a default `./work/moscot_<out_tag>` directory is created automatically.

            '
        out_tag:
          type: string
          required: false
          default: moscot_run
          description: 'Tag used to derive the default output_dir if not provided. Also useful when running multiple MOSCOT analyses in the same SpatialOmicsLab session.

            '
        drop_unlabeled:
          type: boolean
          required: false
          default: false
          description: 'Observations whose time_key (temporal) or batch_key (alignment, mapping) is missing belong to no MOSCOT subproblem; alignment used to write (0, 0) as their warped coordinates. With false (default) such a run is refused with the count; with true those observations are dropped before solving and counted in data.n_dropped_unlabeled.'
  st_gears:
    enabled: true
    label: "ST-GEARS \u2013 3D serial section alignment"
    description: 'ST-GEARS reconstructs 3D tissue architecture from serial spatial transcriptomics sections by computing anchors, rigidly aligning sections, and applying elastic registration, then interpolating
      back to the original resolution.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/st_gears_mcp_server.py
    env:
      ST_GEARS_PYTHON: /opt/conda/envs/st_gears/bin/python
      ST_GEARS_WORKER: /workspace/epic-fermat/agent/tools/st_gears_worker.py
    tools:
    - spatialomicsgym_name: st_gears_reconstruct_3d
      description: 'Run the full ST-GEARS pipeline on a multi-section spatial AnnData (.h5ad) with a slice ID column and an annotation/cluster column, and write an aligned 3D reconstruction AnnData to output_dir:
        optional binning, serial_align anchors, rigid stacking, elastic registration and, when binning ran, linear interpolation back to every spot. The aligned frame is obsm[''spatial_3d_aligned'']
        (aligned x, y and the slice ordinal as z; the ordinal is not a distance). With binning on, spots outside the binned grid''s convex hull get no aligned coordinate from linear interpolation:
        they are NaN, marked obs[''st_gears_xy_source''] == ''none'' and counted in the payload (allow_nearest_fallback fills them from the nearest bin, flagged as a fallback).
        [DATA REQUIREMENTS] Input: multi-section spatial h5ad with obsm[''spatial''] (two columns x, y, or three x, y, z; ST-GEARS indexes a third column, so a two-column input is handed to it
        with the slice ordinal as z and written back unchanged), a slice ID column in obs, and an annotation/cluster column. Tool reconstructs 3D tissue structure from serial sections.
        SC reference: not needed.

        '
      parameters:
        st_h5ad:
          type: string
          required: true
          description: 'Path to the multi-section spatial AnnData (.h5ad). It must contain an obs column (slice_key) whose values identify serial sections (e.g. 0,1,2,...), and an obs column (group_key) with grouping (cluster/annotation) used as anchors. Spots with obs[''in_tissue''] == 0 (background glass, as CELLxGENE Visium exports carry) are left out of the alignment and the output and counted in params.in_tissue_filter; a section with no in-tissue spot is refused.'
        output_dir:
          type: string
          required: true
          description: 'Directory where the worker will write ''st_gears_aligned.h5ad'' and ''st_gears_run_metadata.json''.

            '
        slice_key:
          type: string
          default: slice_id
          required: false
          description: 'obs column defining serial section IDs. For example, ''slice_id'' or ''section''. The AnnData is split into sections by this column; sections are ordered numerically when
            every id is a number, and in natural order otherwise (''S2'' before ''S10''). A missing id is refused unless drop_unlabeled=true.

            '
        group_key:
          type: string
          default: annotation
          required: false
          description: 'obs column with clustering/annotation used as grouping for anchor computation (the grp_col in the ST-GEARS README). A missing label (NaN/empty) in the sections being aligned
            is refused unless drop_unlabeled=true.

            '
        binning_on:
          type: boolean
          default: true
          required: false
          description: 'Whether to perform granularity adjusting (binning) before alignment. Recommended to keep true when any section has more than ~3000 spots.

            '
        bin_step:
          type: int
          default: 2
          required: false
          description: "Step size for binning, in the coordinates' own units. Check your xy coordinates first: when adjacent spots are ~10 units apart, a step of 20 reduces spots ~4\xD7; a step below\
            \ the spot spacing bins nothing. Keep at least ~200 spots per section after binning. Binning densifies each section's spots x genes matrix whatever the step; the worker estimates that\
            \ memory first and refuses with the numbers when it cannot fit.\n"
        uniform_weight:
          type: boolean
          default: false
          required: false
          description: 'Pass-through for serial_align. Set to false to use Distributive Constraints (recommended when groups are reliable and sections are not too far apart). Set to true if you want more
            uniform weighting.

            '
        filter_by_label:
          type: boolean
          default: true
          required: false
          description: 'If true, anchor computation filters out label pairs that never co-occur in two sections.

            '
        tune_alpha_li:
          type: array
          items:
            type: number
          default:
          - 0.8
          - 0.2
          - 0.05
          - 0.013
          required: false
          description: 'Regularization factor list for serial_align. Following the README, values should change exponentially between 0 and 1; a longer list means finer tuning resolution. A list that
            is not all numbers is an error.

            '
        num_itermax:
          type: int
          default: 200
          required: false
          description: 'Maximum number of optimization iterations in serial_align.

            '
        fil_pc:
          type: int
          default: 20
          required: false
          description: 'Thresholding parameter for filtering anchors in rigid and elastic registration. Not usually changed.

            '
        pixel_size:
          type: number
          required: false
          default: null
          description: 'Edge length of one elastic-field pixel, in coordinate units. If null, the worker uses the median nearest-neighbour spacing of the spots (of the bins when binning_on=true)
            handed to ST-GEARS, following upstream''s guidance ''a rough average of spots distance''; the value used is reported in params.pixel_size and params.pixel_size_source. The field is a
            dense grid triangulated whole, so a pixel_size far below the spot spacing is refused, with its grid size and memory estimate, when that grid cannot fit in memory.

            '
        sigma:
          type: number
          default: 1.0
          description: 'Kernel size of Gaussian filters for the elastic field; higher values give a smoother field. Not usually changed.

            '
        start_idx:
          type: int
          required: false
          default: null
          description: 'Index (0-based, in the ordered sections) of the first section to align. If null, uses 0. Only the sections from start_idx to end_idx are aligned and written to the output;
            start_idx must be below end_idx.

            '
        end_idx:
          type: int
          required: false
          default: null
          description: 'Index (0-based, in the ordered sections) of the last section to align. If null, uses the last section index. Only the sections from start_idx to end_idx are aligned and
            written to the output.

            '
        use_gpu:
          type: boolean
          default: false
          required: false
          description: 'Whether to let serial_align use GPU if available. Keep false if your st_gears environment does not have CUDA.

            '
        seed:
          type: int
          default: 0
          required: false
          description: 'Random seed for numpy and for reproducible runs.

            '
        drop_unlabeled:
          type: boolean
          default: false
          required: false
          description: 'False (default): spots with a missing group_key label (in the sections being aligned) or a missing slice_key id stop the run with their count. True: they are left out of the
            alignment and the output, and the count is reported in summary.n_spots_dropped_unlabeled.

            '
        allow_nearest_fallback:
          type: boolean
          default: false
          required: false
          description: 'With binning on, ST-GEARS''s linear interpolation gives no coordinate to spots outside the convex hull of the binned grid: their rows in spatial_3d_aligned, st_gears_xyz and
            spatial_elas_reuse are NaN, obs[''st_gears_xy_source''] is ''none'', and summary.n_spots_without_aligned_xy counts them. True gives those spots the displacement of the nearest bin in
            spatial_3d_aligned / st_gears_xyz (spatial_elas_reuse stays as ST-GEARS wrote it), marks them ''nearest'', and records params.used_fallback=true. With binning off it has no effect
            and is listed in params.ignored.

            '
  paste:
    enabled: true
    label: "PASTE \u2013 Alignment & integration of spatial slices"
    description: "PASTE aligns and integrates multiple spatial transcriptomics slices by combining gene expression similarity and spatial distances. This MCP exposes two workflows:\n  (1) paste_pairwise_align:\
      \ sequential pairwise alignment + stacked\n      coordinates via stack_slices_pairwise.\n  (2) paste_center_align: center_align to infer a consensus center slice\n      plus aligned slices via stack_slices_center.\n"
    command:
    - python
    - /workspace/epic-fermat/agent/tools/paste_mcp_server.py
    env:
      PASTE_PYTHON: /opt/conda/envs/paste_env/bin/python
      PASTE_WORKER: /workspace/epic-fermat/agent/tools/paste_worker.py
    tools:
    - spatialomicsgym_name: paste_pairwise_align
      description: 'Run sequential pairwise PASTE alignment on multiple spatial slices. Given a list of AnnData .h5ad files (each with expression in .X and obsm[''spatial''] coordinates), PASTE computes pairwise OT couplings between consecutive slices and then stacks them into a common coordinate system via stack_slices_pairwise. The worker writes aligned h5ad files and .npy coupling matrices under output_dir. Spots with obs[''in_tissue''] == 0 (background glass in CELLxGENE Visium exports) are left out of every slice and counted in params.in_tissue_filter and params.in_tissue_dropped_per_slice, so the aligned slices hold the in-tissue spots only. Two consecutive slices that share no gene name (gene symbols against Ensembl IDs) are refused rather than aligned on geometry alone; data.n_common_genes_per_pair reports the genes each pair shares. pairwise_align is deterministic, so random_seed is accepted and listed in params.ignored. [DATA REQUIREMENTS] Input: multiple h5ad files, each with obsm[''spatial''] required and expression in X as counts (PASTE compares spots by a KL divergence: negative or non-finite X is refused, non-integer X runs with a warning; use_raw_counts reads adata.raw instead), all with one gene-ID convention. Tool aligns slices sequentially using PASTE optimal transport. SC reference: not needed. Image: not needed.'
      parameters:
        slice_h5ads:
          type: array
          items:
            type: string
          required: true
          description: 'List of slice AnnData .h5ad paths, in anatomical order (e.g. ["./work/spatial_input/slice1.h5ad", "./work/spatial_input/slice2.h5ad", "./work/spatial_input/slice3.h5ad"]). Each AnnData must include
            obsm["spatial"].

            '
        output_dir:
          type: string
          required: true
          description: "Directory where PASTE pairwise outputs will be stored, including:\n  - paste_pairwise_aligned_slice_<i>.h5ad\n  - paste_pairwise_pi_<i>_<i+1>.npy\nRecommended: \"./work/paste_pairwise_<tag>\"\
            .\n"
        alpha:
          type: number
          required: false
          default: 0.1
          description: 'PASTE alpha parameter controlling trade-off between expression similarity and spatial distances in the OT problem.

            '
        use_gpu:
          type: boolean
          required: false
          default: false
          description: 'If true, request the PASTE GPU backend when available. If false, run purely on CPU.

            '
        random_seed:
          type: int
          required: false
          default: 0
          description: 'Accepted and ignored in pairwise mode: pst.pairwise_align is deterministic (uniform initial plan, exact EMD in its fused Gromov-Wasserstein), so the seed changes nothing; the run lists it in params.ignored with a warning. paste_center_align does use its seed (center_align''s NMF).'
        z_spacing:
          type: float
          required: false
          default: 0.0
          description: 'Physical distance between consecutive sections, in the coordinates'' own units. 0.0 means NOT DECLARED, not zero apart: PASTE aligns in plane and cannot supply a z itself, and this package has no default spacing anywhere. Given, the aligned coordinates are written as a three-column obsm[''spatial_3d_aligned'']; absent, as two columns under obsm[''spatial_aligned'']. Either way obsm[''spatial''] keeps the coordinates PASTE was given, without which there is no before frame and the alignment cannot be validated.'
        device:
          type: str
          required: false
          default: ''
          description: 'Compute device: "cpu", "gpu"/"cuda", or "cuda:N" to pick a specific GPU. Overrides use_gpu when set; left empty (the default) the choice falls back to use_gpu, which is off, so the run is on CPU. A GPU request on a machine without CUDA degrades to CPU rather than failing.'
        use_raw_counts:
          type: boolean
          required: false
          default: false
          description: 'Align on adata.raw.X (raw counts) of every slice instead of X. Refused when a slice has no adata.raw or its adata.raw does not hold counts. Left false, X is used: a negative or non-finite X is refused (naming this parameter when adata.raw holds counts) and a non-integer X runs with a warning. params.expression_source records the matrix used.'
    - spatialomicsgym_name: paste_center_align
      description: 'Run PASTE center alignment on multiple spatial slices. The worker leaves out spots with obs[''in_tissue''] == 0 (background glass in CELLxGENE Visium exports; counted in params.in_tissue_filter and params.in_tissue_dropped_per_slice), filters for common genes across slices (slices that share no gene are refused; data.n_common_genes reports the count), optionally builds spatial heuristic initial mappings, then calls center_align to infer a consensus center slice and per-slice couplings. Finally it stacks slices around the center using stack_slices_center and saves aligned h5ad files (in-tissue spots only) and .npy coupling matrices. [DATA REQUIREMENTS] Input: multiple h5ad files, each with obsm[''spatial''] required and expression in X as counts (center_align uses a KL divergence and a KL NMF: negative or non-finite X is refused, non-integer X runs with a warning; use_raw_counts reads adata.raw instead). Tool computes center alignment across slices. SC reference: not needed. Image: not needed.'
      parameters:
        slice_h5ads:
          type: array
          items:
            type: string
          required: true
          description: 'List of slice AnnData .h5ad paths. Each AnnData must include obsm["spatial"]; genes will be filtered to the intersection across slices.

            '
        output_dir:
          type: string
          required: true
          description: "Directory where PASTE center-alignment outputs will be stored, including:\n  - paste_center_slice.h5ad\n  - paste_center_aligned_slice_<i>.h5ad\n  - paste_center_pi_slice_<i>.npy\n\
            Recommended: \"./work/paste_center_<tag>\".\n"
        alpha:
          type: number
          required: false
          default: 0.1
          description: 'PASTE alpha parameter (expression vs spatial trade-off) used inside center_align.

            '
        use_gpu:
          type: boolean
          required: false
          default: false
          description: 'If true, request PASTE GPU backend when available.

            '
        random_seed:
          type: int
          required: false
          default: 0
          description: 'Seed for center_align''s NMF (its random initialisation). Was 5 here and 0 on paste_pairwise_align and in the worker''s own argparse until 2026-09-21 -- three values for one concept, so the same call seeded differently depending on which door it came through. 5 was PASTE''s tutorial value, not its library default.'
        z_spacing:
          type: float
          required: false
          default: 0.0
          description: 'Physical distance between consecutive sections, in the coordinates'' own units. 0.0 means NOT DECLARED, not zero apart: PASTE aligns in plane and cannot supply a z itself, and this package has no default spacing anywhere. Given, the aligned coordinates are written as a three-column obsm[''spatial_3d_aligned'']; absent, as two columns under obsm[''spatial_aligned'']. Either way obsm[''spatial''] keeps the coordinates PASTE was given, without which there is no before frame and the alignment cannot be validated.'
        use_spatial_init:
          type: boolean
          required: false
          default: false
          description: 'If true, the worker first builds initial mappings from the first slice to each slice with match_spots_using_spatial_heuristic, computed on the slices'' coordinates (obsm[''spatial''], two columns; a wider key is refused, never truncated), and passes them as pis_init to center_align. params.spatial_init_source records the source, and a transport that stopped at POT''s iteration cap is listed in warnings. This can help difficult alignments but increases runtime.'
        device:
          type: str
          required: false
          default: ''
          description: 'Compute device: "cpu", "gpu"/"cuda", or "cuda:N" to pick a specific GPU. Overrides use_gpu when set; left empty (the default) the choice falls back to use_gpu, which is off, so the run is on CPU. A GPU request on a machine without CUDA degrades to CPU rather than failing.'
        use_raw_counts:
          type: boolean
          required: false
          default: false
          description: 'Align on adata.raw.X (raw counts) of every slice instead of X. Refused when a slice has no adata.raw or its adata.raw does not hold counts. Left false, X is used: a negative or non-finite X is refused (naming this parameter when adata.raw holds counts) and a non-integer X runs with a warning. params.expression_source records the matrix used.'
  seurat:
    enabled: true
    label: "Seurat \u2013 Single-cell & spatial analysis"
    description: 'Seurat MCP server: quality control and clustering for single-cell RNA-seq, multi-sample integration, marker detection, dimensionality reduction plots, and 10x Visium spatial transcriptomics
      workflows (QC + clustering, spatial feature plots, spatial dim plots, and spatially variable gene detection).

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/seurat_mcp_server.py
    env:
      SEURAT_RSCRIPT: /opt/conda/envs/seurat_env/bin/Rscript
      SEURAT_WORKER: /workspace/epic-fermat/agent/tools/seurat_worker.R
    tools:
    - spatialomicsgym_name: seurat_qc_cluster
      description: 'Run a basic Seurat QC + clustering pipeline on one sample: Read10X -> CreateSeuratObject (min_features, then min_cells) -> NormalizeData -> FindVariableFeatures -> ScaleData -> RunPCA -> FindNeighbors -> FindClusters -> optional RunUMAP. Saves the Seurat object (.rds), metadata CSV, UMAP coordinates (if run), and a DimPlot PNG. The QC filters drop every cell with fewer than min_features detected genes (the default 200 removes most spots of sparse spatial data) and then every gene detected in fewer than min_cells of the cells left; the payload reports the input size (data.n_cells_input, data.n_genes_input) and what was dropped (params.n_cells_dropped, params.n_genes_dropped, plus a warning). min_features=0 keeps every cell. [DATA REQUIREMENTS] Input: a 10x counts directory, or an .h5ad / 10x .h5 / .csv / .tsv / .txt (optionally gzipped) / .loom file, which the tool converts to a 10x counts directory itself (from adata.raw when the h5ad has one). Not a processed .rds and not a Visium Space Ranger folder (use seurat_spatial_qc_cluster). A converted .h5ad / 10x .h5 keeps its Gene Expression features only (a feature whose feature_types label is empty or NaN, as an outer-join concat leaves it, counts as a gene); other feature types it holds (e.g. Antibody Capture) are left out and listed in params.feature_types_dropped with a warning. A counts directory holding more than one feature type is refused. SC reference: not needed. Image: not needed.'
      parameters:
        data_path:
          type: string
          required: true
          description: 'Input counts: a 10x counts directory (matrix.mtx(.gz), barcodes.tsv(.gz), features.tsv(.gz)), or an .h5ad, 10x .h5, .csv/.tsv/.txt (optionally gzipped) or .loom file, converted to a 10x counts directory under output_dir/_seurat_10x_input.'
        output_dir:
          type: string
          required: true
          description: "Directory to write outputs:\n  - seurat_qc_cluster_obj.rds\n  - seurat_qc_cluster_metadata.csv\n  - seurat_qc_cluster_umap.csv (if UMAP run)\n  - seurat_qc_cluster_dimplot.png\n"
        project:
          type: string
          default: SeuratQC
          description: Project name for the Seurat object.
        min_cells:
          type: int
          default: 3
          required: false
          description: 'Filter genes detected in fewer than this many cells, counted after the min_features filter. The number removed is reported as params.n_genes_dropped.'
        min_features:
          type: int
          default: 200
          required: false
          description: 'Filter cells with fewer than this many detected genes. The default 200 removes most spots of sparse spatial data; 0 keeps every cell. The payload reports data.n_cells_input and params.n_cells_dropped, with a warning when any cell was dropped; a value that leaves no cell is refused with the most-detected cell''s count.'
        n_hvgs:
          type: int
          default: 2000
          required: false
          description: Number of highly variable genes for FindVariableFeatures.
        n_pcs:
          type: int
          default: 30
          required: false
          description: Number of principal components for PCA and neighbors.
        resolution:
          type: number
          default: 0.8
          required: false
          description: Clustering resolution for FindClusters.
        umap:
          type: boolean
          default: true
          required: false
          description: Whether to run RunUMAP and save UMAP coordinates.
        seed:
          type: int
          default: 0
          required: false
          description: 'Random seed. FindClusters receives random.seed = seed and RunPCA / RunUMAP receive seed.use = 42 + seed, so 0 reproduces Seurat''s own defaults; params.seeds shows what each step received.'
    - spatialomicsgym_name: seurat_integrate_qc_cluster
      description: 'Run a Seurat integration pipeline on two or more samples. Each sample is read, QC-filtered by CreateSeuratObject (min_features, then min_cells), normalized and its HVGs selected; then SelectIntegrationFeatures -> FindIntegrationAnchors -> IntegrateData on the ''integrated'' assay, followed by ScaleData, RunPCA, FindNeighbors, FindClusters, and optional RunUMAP. The payload reports the input and dropped cells and genes in total (data.n_cells_input, data.n_genes_input, params.n_cells_dropped, params.n_genes_dropped) and per sample (summary.qc_per_sample); data.n_genes counts the genes of the RNA assay and data.n_integration_features the anchor features of the integrated assay. The saved object keeps DefaultAssay ''integrated''. [DATA REQUIREMENTS] Input: one counts input per sample, each a 10x counts directory or an .h5ad / 10x .h5 / .csv / .tsv / .txt / .loom file the tool converts; not an .rds and not a Visium Space Ranger folder. A converted .h5ad / 10x .h5 keeps its Gene Expression features only (a feature whose feature_types label is empty or NaN counts as a gene); other feature types are left out and listed per sample in params.feature_types_dropped with a warning. SC reference: not needed. Image: not needed.'
      parameters:
        data_paths:
          type: array
          items:
            type: string
          required: true
          description: 'List of counts inputs, one per sample: 10x counts directories, or .h5ad / 10x .h5 / .csv / .tsv / .txt / .loom files, each converted to a 10x counts directory under output_dir/_sample_<i>.'
        sample_ids:
          type: array
          items:
            type: string
          required: true
          description: 'Sample IDs corresponding to data_paths (same length). Stored in meta.data$sample_id for downstream analysis.

            '
        output_dir:
          type: string
          required: true
          description: "Directory to write outputs:\n  - seurat_integrate_obj.rds\n  - seurat_integrate_metadata.csv\n  - seurat_integrate_umap.csv (if UMAP run)\n  - seurat_integrate_dimplot_clusters.png\n"
        project:
          type: string
          default: SeuratIntegration
          description: Project name for the integrated object.
        n_hvgs:
          type: int
          default: 2000
          required: false
          description: Number of variable features for integration.
        n_pcs:
          type: int
          default: 30
          required: false
          description: Number of PCs for PCA and neighbors.
        resolution:
          type: number
          default: 0.8
          required: false
          description: Clustering resolution.
        umap:
          type: boolean
          default: true
          required: false
          description: Whether to run UMAP.
        seed:
          type: int
          default: 0
          required: false
          description: 'Random seed, handed to FindClusters and RunPCA / RunUMAP as in seurat_qc_cluster (params.seeds).'
        min_cells:
          type: int
          default: 3
          required: false
          description: 'Per sample, filter genes detected in fewer than this many cells, counted after the min_features filter. Reported per sample in summary.qc_per_sample and in total as params.n_genes_dropped (genes of the input that no sample kept).'
        min_features:
          type: int
          default: 200
          required: false
          description: 'Per sample, filter cells with fewer than this many detected genes; 0 keeps every cell. Reported per sample in summary.qc_per_sample and in total as params.n_cells_dropped, with a warning when any cell was dropped.'
    - spatialomicsgym_name: seurat_find_markers
      description: 'Run Seurat differential expression / marker detection on a Seurat object (.rds). The comparison is chosen from group_a, group_b and cluster: (a) group_a and group_b give the pairwise test group_a vs group_b (seurat_markers_<a>_vs_<b>.csv; a cluster given as well is not used and is listed in params.ignored); (b) group_a alone, or cluster alone, gives that group vs all the others (seurat_markers_cluster_<group>.csv); group_b without group_a, or group_a beside a different cluster, is refused; (c) none of them runs FindAllMarkers, the positive markers of every identity (seurat_all_markers.csv). params.comparison names the comparison that ran. The RNA assay is tested when the object has one, so an object from seurat_integrate_qc_cluster is not tested on its batch-corrected integrated values; otherwise the object''s DefaultAssay. assay overrides this, and split per-sample layers are joined for the test (params.layers_joined). [DATA REQUIREMENTS] Input: Seurat object (.rds). A counts-only assay is log-normalized first (summary.normalization says so). SC reference: not needed. Image: not needed.'
      parameters:
        seurat_rds:
          type: string
          required: true
          description: Path to Seurat object (.rds).
        output_dir:
          type: string
          required: true
          description: Directory where marker CSV will be written.
        ident_key:
          type: string
          default: seurat_clusters
          description: 'Column in meta.data used as identity (Idents).

            '
        group_a:
          type: string
          required: false
          default: null
          description: 'Identity for ident.1 of FindMarkers. With group_b, the pairwise test group_a vs group_b; alone, group_a vs all other identities.'
        group_b:
          type: string
          required: false
          default: null
          description: 'Identity for ident.2 of the pairwise test. Needs group_a; given alone it is refused.'
        cluster:
          type: string
          required: false
          default: null
          description: 'Single identity for a one-vs-all marker search. Not used when group_a and group_b are both given (listed in params.ignored); refused beside a different group_a.'
        logfc_threshold:
          type: number
          default: 0.25
          required: false
          description: logFC threshold for marker detection.
        min_pct:
          type: number
          default: 0.1
          required: false
          description: Minimum fraction of cells expressing feature.
        test_use:
          type: string
          default: wilcox
          required: false
          description: 'Test used in FindMarkers/FindAllMarkers (e.g. ''wilcox'').

            '
        assay:
          type: string
          required: false
          default: null
          description: 'Assay to test. Left unset, RNA when the object has an RNA assay, else the object''s DefaultAssay. Reported as params.assay and params.assay_choice.'
    - spatialomicsgym_name: seurat_dimplot
      description: 'Generate a DimPlot PNG from a Seurat object (.rds), with configurable reduction (umap/tsne/pca) and grouping column. A reduction the object does not hold is an error naming the ones it has, unless allow_reduction_fallback is true; then the first of umap/tsne/pca present is drawn and the payload records params.reduction (drawn), params.reduction_requested, params.used_fallback and a warning. [DATA REQUIREMENTS] Input: Seurat object (.rds) with the requested reduction. Generates DimPlot PNG. SC reference: not needed. Image: not needed.'
      parameters:
        seurat_rds:
          type: string
          required: true
          description: Path to Seurat object (.rds).
        output_dir:
          type: string
          required: true
          description: Directory to save DimPlot PNG.
        reduction:
          type: string
          default: umap
          required: false
          description: 'Dimensionality reduction name (e.g. ''umap'', ''tsne'', ''pca'').

            '
        group_by:
          type: string
          default: seurat_clusters
          required: false
          description: 'meta.data column to color by.

            '
        label:
          type: boolean
          default: true
          required: false
          description: 'Whether to label clusters/groups on the plot.

            '
        allow_reduction_fallback:
          type: boolean
          default: false
          required: false
          description: 'If the requested reduction is not in the object, draw the first of umap/tsne/pca it has instead of stopping. The payload then records params.used_fallback=true, params.reduction_requested and a warning. Off by default, so no reduction is swapped silently.'
    - spatialomicsgym_name: seurat_spatial_qc_cluster
      description: 'Run a basic Seurat spatial pipeline on a 10x Visium dataset: Load10X_Spatial -> QC filters (min_cells, min_features) -> NormalizeData -> FindVariableFeatures -> ScaleData -> RunPCA -> FindNeighbors -> FindClusters -> optional RunUMAP and FindSpatiallyVariableFeatures. Saves a Seurat object (.rds), metadata, UMAP coordinates, a SpatialDimPlot PNG, and optionally spatially variable gene CSV. A counts matrix holding several feature types (a CytAssist protein run: Antibody Capture beside Gene Expression) has only its Gene Expression features QC-filtered, normalised and clustered; each other type is kept unprocessed as an assay of its own in the saved object (e.g. Antibody.Capture), reported in params.feature_types_input and params.other_feature_type_assays with a warning. [DATA REQUIREMENTS] Input: a Space Ranger folder (filtered_feature_bc_matrix.h5 + spatial/ with tissue_lowres_image.png); the filtered_feature_bc_matrix.h5 inside such a folder (the folder around it is staged; a raw_feature_bc_matrix.h5, or an .h5 with no spatial/ beside it, is refused); or an .h5ad with obsm[''spatial''] and the lowres image in uns[''spatial''], whose spots with obs[''in_tissue''] == 0 are left out and reported in params.in_tissue_filter. SC reference: not needed. Image: loaded from the Visium folder or uns[''spatial''].'
      parameters:
        data_path:
          type: string
          required: true
          description: '10x Visium input: a Space Ranger folder holding filtered_feature_bc_matrix.h5 and spatial/ (re-staged internally with one positions file, which Seurat 5 needs); the filtered_feature_bc_matrix.h5 (or <sample>_filtered_feature_bc_matrix.h5) inside such a folder, whose folder is staged the same way (a raw_feature_bc_matrix.h5, or an .h5 with no spatial/ beside it, is refused); or an .h5ad with obsm[''spatial''] whose uns[''spatial''] carries the lowres image.'
        output_dir:
          type: string
          required: true
          description: "Directory where outputs will be written:\n  - seurat_spatial_obj.rds\n  - seurat_spatial_metadata.csv\n  - seurat_spatial_umap.csv (if UMAP run)\n  - seurat_spatial_dimplot_clusters.png\n\
            \  - seurat_spatial_variable_features.csv (if spatial_var)\n"
        project:
          type: string
          default: SeuratSpatial
          required: false
          description: Project name.
        min_cells:
          type: int
          default: 3
          required: false
          description: Filter genes expressed in fewer than this many spots.
        min_features:
          type: int
          default: 200
          required: false
          description: Filter spots with fewer than this many detected genes.
        n_hvgs:
          type: int
          default: 2000
          required: false
          description: Number of HVGs.
        n_pcs:
          type: int
          default: 30
          required: false
          description: Number of PCs.
        resolution:
          type: number
          default: 0.6
          required: false
          description: Clustering resolution.
        umap:
          type: boolean
          default: true
          required: false
          description: Whether to run UMAP.
        spatial_var:
          type: boolean
          default: true
          required: false
          description: 'Whether to compute spatially variable features and save CSV.

            '
        sv_assay:
          type: string
          default: Spatial
          required: false
          description: Assay used for spatial variable feature detection.
        sv_selection_method:
          type: string
          default: markvariogram
          required: false
          description: 'Selection method for FindSpatiallyVariableFeatures.

            '
        sv_nfeatures:
          type: int
          default: 2000
          required: false
          description: 'Number of top-ranked features FindSpatiallyVariableFeatures flags as spatially variable (its nfeatures) and the CSV keeps. Only the n_hvgs scaled features are ranked, so the CSV holds at most n_hvgs rows and never an unscored gene; summary.n_sv_features_tested and summary.n_sv_genes give the counts.'
        seed:
          type: int
          default: 0
          required: false
          description: 'Random seed, handed to FindClusters and RunPCA / RunUMAP as in seurat_qc_cluster (params.seeds).'
    - spatialomicsgym_name: seurat_spatial_feature_plot
      description: 'Load a spatial Seurat object (.rds) and generate SpatialFeaturePlot PNG files for a list of genes, one PNG per gene. [DATA REQUIREMENTS] Input: spatial Seurat object (.rds). Generates SpatialFeaturePlot PNGs for specified genes. SC reference: not needed. Image: embedded in Seurat object.'
      parameters:
        seurat_rds:
          type: string
          required: true
          description: Path to a spatial Seurat object (.rds).
        output_dir:
          type: string
          required: true
          description: Directory to save SpatialFeaturePlot PNGs.
        features:
          type: array
          required: true
          description: List of gene names to plot.
          items:
            type: string
            required: true
        image_alpha:
          type: number
          default: 0.8
          required: false
          description: "Alpha blending for the tissue image background (0\u20131).\n"
        spot_size:
          type: number
          default: 1.5
          required: false
          description: 'Spot size factor for SpatialFeaturePlot (pt.size.factor).

            '
        ncol:
          type: int
          default: 1
          required: false
          description: 'Accepted and ignored: each feature is drawn to its own PNG, so there is no grid to lay out. A value other than 1 is listed in params.ignored with a warning.'
    - spatialomicsgym_name: seurat_spatial_dimplot
      description: 'Load a spatial Seurat object (.rds) and generate a SpatialDimPlot PNG colored by a metadata column (e.g. seurat_clusters, sample_id). [DATA REQUIREMENTS] Input: spatial Seurat object
        (.rds). Generates SpatialDimPlot PNG colored by metadata column. SC reference: not needed. Image: embedded in Seurat object.

        '
      parameters:
        seurat_rds:
          type: string
          required: true
          description: Path to a spatial Seurat object (.rds).
        output_dir:
          type: string
          required: true
          description: Directory to save SpatialDimPlot PNG.
        group_by:
          type: string
          default: seurat_clusters
          description: 'meta.data column used for coloring the SpatialDimPlot.

            '
        image_alpha:
          type: number
          default: 0.8
          required: false
          description: "Alpha blending for the tissue image background (0\u20131).\n"
        spot_size:
          type: number
          default: 1.5
          required: false
          description: 'Spot size factor for SpatialDimPlot (pt.size.factor).

            '
        label:
          type: boolean
          default: true
          required: false
          description: 'Whether to show text labels on groups/clusters.

            '
    - spatialomicsgym_name: seurat_spatial_variable_features
      description: 'Run Seurat::FindSpatiallyVariableFeatures on a spatial Seurat object (.rds) and save a CSV of spatially variable genes with statistics. Seurat ranks only the features of the assay''s scale.data layer (the variable genes an object from seurat_spatial_qc_cluster was scaled on); the CSV holds the top nfeatures of those by rank, never an unscored gene, and summary.n_features_tested / summary.n_features_not_tested give the counts. [DATA REQUIREMENTS] Input: spatial Seurat object (.rds) whose assay has a scale.data layer and which carries its spatial image (the spot coordinates live there), such as seurat_spatial_obj.rds from seurat_spatial_qc_cluster; an object without either is refused. SC reference: not needed. Image: the object''s own spatial image is required.'
      parameters:
        seurat_rds:
          type: string
          required: true
          description: Path to a spatial Seurat object (.rds).
        output_dir:
          type: string
          required: true
          description: Directory to save spatial variable feature CSV.
        assay:
          type: string
          default: Spatial
          required: false
          description: Assay name used for FindSpatiallyVariableFeatures.
        selection_method:
          type: string
          default: markvariogram
          required: false
          description: 'Selection method (depends on Seurat version).

            '
        nfeatures:
          type: int
          default: 2000
          required: false
          description: 'Number of top-ranked tested features flagged spatially variable (FindSpatiallyVariableFeatures nfeatures) and kept in the CSV. When fewer features were tested, the CSV holds all of them and a warning says so.'
  spatialde:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spatialde_mcp_server.py
    enabled: true
    description: "SpatialDE \u2013 detect spatially variable genes (SVGs) and optional AEH patterns."
    env:
      SPATIALDE_PYTHON: /opt/conda/envs/SpatialDE/bin/python
      SPATIALDE_WORKER: /workspace/epic-fermat/agent/tools/spatialde_worker.py
    tools:
    - spatialomicsgym_name: spatialde_run_svg
      description: "Run SpatialDE 1.1.3 (the Svensson et al. 2018 Gaussian-process likelihood-ratio test) to detect spatially variable genes; every in-tissue spot is tested, never subsampled (spots flagged obs['in_tissue'] == 0 are background glass: they are left out and reported in params.in_tissue_filter and data.n_spots_off_tissue_dropped). Supports multiple input modes:\n  (1) visium_10x: counts_h5 + spatial_dir (10x Visium layout with spatial/)\n  (2) h5ad: AnnData with coordinates in obsm[spatial_key]\n  (3) matrix_with_coords: expression matrix + coordinates table\nWrites CSV tables and PNG figures (volcano + top gene spatial plots). [DATA REQUIREMENTS] Input: flexible - accepts h5ad, visium_10x (counts_h5 + spatial_dir), or matrix_with_coords (CSV counts + CSV coords). For h5ad, needs obsm['spatial'] and raw integer counts in X (or in the layer named by layer, or in adata.raw with use_raw_counts=true); non-integer values stop the run unless round_counts is true, and the refusal says whether adata.raw holds counts. Required obs: none. SC reference: not needed. Image: not needed.\n"
      parameters:
        input_mode:
          type: str
          required: true
          enum:
          - visium_10x
          - h5ad
          - matrix_with_coords
          description: Input mode selector.
        output_dir:
          type: str
          required: true
          default: ./work/spatialde_out
          description: Directory for outputs.
        counts_h5:
          type: str
          required: false
          default: ''
          description: 10x filtered_feature_bc_matrix.h5. Required when input_mode=visium_10x; there is
            no default, so pass the user's own file.
        spatial_dir:
          type: str
          required: false
          default: ''
          description: Directory containing 'spatial/' with tissue_positions_list.csv etc. Required when
            input_mode=visium_10x; there is no default, so pass the user's own directory.
        h5ad_path:
          type: str
          required: false
          default: ''
          description: AnnData .h5ad path.
        spatial_key:
          type: str
          required: false
          default: spatial
          description: obsm key containing 2D coordinates.
        layer:
          type: str
          required: false
          default: ''
          description: 'Optional layer to use as expression matrix (e.g. ''counts''), h5ad mode. An error together with use_raw_counts=true.'
        matrix_path:
          type: str
          required: false
          default: ''
          description: Expression matrix CSV/TSV (rows=spots/cells, columns=genes by default).
        coords_path:
          type: str
          required: false
          default: ''
          description: Coordinates CSV/TSV with ID + x + y.
        matrix_orientation:
          type: str
          required: false
          default: cells_by_genes
          enum:
          - cells_by_genes
          - genes_by_cells
          description: Orientation of the matrix file.
        id_col:
          description: Name of the spot-identifier column in coords_path (matrix_with_coords mode only). It must be a real column, not the index. A Space Ranger tissue-positions file calls it barcode.
          type: str
          required: false
          default: barcode
        x_col:
          description: Name of the first coordinate column in coords_path (matrix_with_coords mode only). For a Space Ranger tissue-positions file pass imagerow, or pxl_row_in_fullres.
          type: str
          required: false
          default: x
        y_col:
          description: Name of the second coordinate column in coords_path (matrix_with_coords mode only). For a Space Ranger tissue-positions file pass imagecol, or pxl_col_in_fullres.
          type: str
          required: false
          default: y
        regress_formula:
          type: str
          required: false
          default: ~np.log(total_counts)
          description: Regression formula string passed to SpatialDE anndata wrapper.
        top_k_genes:
          type: int
          required: false
          default: 20
          description: 'How many of the most significant genes are listed in top_genes.tsv and summary.top_genes and plotted. 0 or more; a negative value is refused.'
        run_aeh:
          type: bool
          required: false
          default: false
          description: If true, run automatic_expression_histology.
        aeh_C:
          description: Number of spatial patterns for automatic expression histology. Read only when run_aeh is true.
          type: int
          required: false
          default: 8
        aeh_l:
          description: Length scale for automatic expression histology, in the units of the input coordinates. Read only when run_aeh is true.
          type: float
          required: false
          default: 1000.0
        random_seed:
          description: 'Seeds numpy. The SpatialDE test and every hvg_flavor are deterministic, so it only changes the random initialisation of automatic expression histology (run_aeh true); otherwise it is listed in params.ignored. Spots are never subsampled.'
          type: int
          required: false
          default: 0
        hvg_top_n:
          type: int
          required: false
          default: 2000
          description: 'Genes kept by the highly-variable-gene pre-filter before SpatialDE runs, ranked by hvg_flavor.
            Set it to 0 to disable the pre-filter and test every gene, at a large cost in runtime and memory. Genes
            cut here are absent from the output table, not ranked last in it.'
        hvg_flavor:
          type: str
          required: false
          default: 'variance'
          enum:
          - seurat_v3
          - seurat
          - cell_ranger
          - variance
          description: 'Ranks genes for the hvg_top_n pre-filter. Default variance, the ranking every default run has actually used (the earlier seurat_v3 default fell back to it silently), so default results are unchanged. seurat_v3 is the scanpy count-based flavour and needs scikit-misc, which the SpatialDE env does not ship; without it the run stops and names the package, and nothing is substituted unless allow_hvg_fallback is true. cell_ranger is scanpy dispersion on counts; scanpy fails with Bin edges must be unique when 15% or more of the genes are zero in every tested spot (most whole-transcriptome Visium samples), and the run then stops and says so. seurat is the scanpy log-data flavour: it applies expm1 first and this worker hands it raw counts, so it is refused, never run. variance is the worker''s own raw-count variance ranking. Ignored, and listed in params.ignored, when hvg_top_n is 0 or the input has no more than hvg_top_n genes.'
        allow_hvg_fallback:
          type: bool
          required: false
          default: false
          description: 'If hvg_flavor cannot run (seurat_v3 without scikit-misc, cell_ranger on a sample with many all-zero genes, or seurat, which is refused on counts), rank genes by raw-count variance instead of stopping. The payload then records params.used_fallback=true, params.hvg_method_used=variance and a warning. Off by default, so no flavour is switched silently.'
        round_counts:
          type: bool
          required: false
          default: false
          description: 'Round non-integer expression values to the nearest integer before the test and record it (params.rounded_to_integers, a warning). Off by default. SpatialDE models raw counts, so non-integer input stops the run unless this is true; prefer pointing layer at a raw-count layer. NaN or negative values are refused either way.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Test adata.raw.X instead of adata.X (h5ad mode, with layer empty). CELLxGENE Visium exports keep the integer counts in adata.raw beside a log-normalised or scaled X. Refused when the file has no adata.raw or adata.raw does not hold counts, and together with layer; listed in params.ignored by the visium_10x and matrix_with_coords modes, which have no adata.raw. The matrix tested is recorded as params.expression_source (X, raw.X or layers[...]).'
  somde:
    enabled: true
    label: "SOMDE \u2013 SOM-accelerated SpatialDE-like SVG detection"
    description: 'SOMDE MCP server: identifies spatially variable genes using SOM-based condensation + Gaussian process testing (SpatialDE-like). Wrapper runs in spatialomicsgym_env and calls somde_worker.py in /opt/conda/envs/somde.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/somde_mcp_server.py
    env:
      SOMDE_PYTHON: /opt/conda/envs/somde/bin/python
      SOMDE_WORKER: /workspace/epic-fermat/agent/tools/somde_worker.py
      PYTHONUNBUFFERED: '1'
      MPLCONFIGDIR: /tmp/matplotlib
      NUMBA_CACHE_DIR: /tmp/numba_cache
    tools:
    - spatialomicsgym_name: somde_run
      description: 'Identify spatially variable genes with SOMDE (self-organising map + Gaussian process) and output CSV results + top-gene spatial plots. Spots flagged obs[''in_tissue''] == 0 (background glass; CELLxGENE Visium exports carry every array spot) are left out before the SOM is built and reported in params.in_tissue_filter, data.n_spots_off_tissue_dropped, a warning and the analysis. [DATA REQUIREMENTS] Input: spatial h5ad with obsm[''spatial''] and raw integer counts in X (or in the layer named by layer) - pass input_mode=''h5ad'' and h5ad_path. NaN, negative or non-integer values stop the run unless round_counts is true; use_raw_counts=true tests adata.raw.X instead (CELLxGENE exports keep the counts there), and the refusal says whether adata.raw holds counts. Raw 10x Space Ranger output also works: pass input_mode=''visium_10x'' with counts_h5 + spatial_dir. Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        input_mode:
          type: str
          required: false
          default: h5ad
          enum:
          - h5ad
          - visium_10x
          description: Input loader mode. Use 'h5ad' with h5ad_path (the usual case), or 'visium_10x' with counts_h5 + spatial_dir.
        h5ad_path:
          type: str
          required: false
          description: 'Path to the spatial h5ad, with coordinates in obsm[''spatial''] (exactly two columns; a 3-column key is refused rather than truncated) or, if that key is absent, obs[''x'']/obs[''y''].
            Required when input_mode=''h5ad''.'
        counts_h5:
          type: str
          required: false
          description: 'Path to 10x Visium filtered_feature_bc_matrix.h5. Required when input_mode=''visium_10x''.

            '
        spatial_dir:
          type: str
          required: false
          description: 'Directory containing ''spatial/tissue_positions_list.csv'' (either the sample root or the ''spatial'' subdir). Required when input_mode=''visium_10x''.

            '
        output_dir:
          type: str
          required: true
          description: 'Output directory for SOMDE results (CSVs + figures/).

            '
        max_genes:
          type: int
          required: false
          default: 2000
          description: 'Maximum genes tested (our pre-filter, not SOMDE''s): above it, the genes with the largest variance of log1p(counts normalised to 10,000 per spot) are kept and the rest are not tested.
            The cut is reported in params.gene_selection, a warning and the analysis. It also sizes the dense genes x spots table SOMDE needs, so lower it if the run is refused for memory.'
        min_counts:
          type: int
          required: false
          default: 1
          description: Minimum total counts per gene to retain before ranking (our pre-filter, not SOMDE's; reported in params.gene_selection).
        som_dim:
          type: int
          required: false
          default: 20
          description: 'SOMDE''s k, passed to SomNode(X, som_dim): the average number of spots per SOM node. The grid is int(sqrt(n_spots // som_dim)) nodes per side, so a larger value condenses more coarsely; a value leaving fewer than 2x2 nodes is refused. It also sets most of SOMDE''s memory: its Gaussian-process test keeps ten n_nodes x n_nodes float64 matrices at once (about 67 GiB for a 500,000-spot VisiumHD slide at 20). The preflight counts them beside the dense table and a run that cannot fit is refused naming som_dim (with a value that fits) and max_genes; the estimate is params.memory_estimate_gib.'
        top_k_genes:
          type: int
          required: false
          default: 20
          description: 'How many top genes to plot and export. 0 or more; a negative value is refused.'
        random_seed:
          type: int
          required: false
          default: 0
          description: 'Accepted for compatibility and has no effect: SOMDE draws no random numbers (its SOM starts from a homogeneous meshgrid codebook and is batch-trained, and the max_genes ranking
            is a deterministic sort whose ties keep file order). Reported under params.ignored.'
        allow_pixel_coord_fallback:
          type: bool
          required: false
          default: false
          description: 'visium_10x only. When array_row/array_col in the tissue-positions file are constant the run stops; set true to run on pxl_col_in_fullres/pxl_row_in_fullres instead. The payload
            then records params.used_fallback=true and params.coord_source.'
        layer:
          type: str
          required: false
          default: ''
          description: 'h5ad mode only: the AnnData layer holding the raw counts SOMDE analyses instead of X (e.g. ''counts''). Empty (the default) analyses X. A layer the file does not have is an error listing the layers it has; use use_raw_counts for adata.raw (the two together are an error). Listed in params.ignored with input_mode=''visium_10x''. The matrix used is recorded as params.expression_source.'
        round_counts:
          type: bool
          required: false
          default: false
          description: 'Round non-integer expression values to the nearest integer before SOMDE runs and record it (params.rounded_to_integers, params.n_non_integer_values, a warning). Off by default: SOMDE models raw counts, so non-integer input (normalised data) stops the run unless this is true; prefer pointing layer at a raw-count layer. NaN or negative values are refused either way.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'h5ad mode only (with layer empty): test adata.raw.X instead of X. CELLxGENE Visium exports keep the integer counts in adata.raw beside a log-normalised or scaled X. Refused when the file has no adata.raw or adata.raw does not hold counts, and together with layer; listed in params.ignored with input_mode=''visium_10x''. The matrix tested is recorded as params.expression_source (X, raw.X or layers[...]).'
  svgbit:
    enabled: true
    label: "SVGBit \u2013 spatially variable genes (ranking + clustering)"
    description: "SVGBit MCP server for ranking and clustering spatially variable genes (SVGs) for marker exploration.\nThis MCP server runs a FastMCP wrapper in spatialomicsgym_env and delegates execution to a worker running inside the svgbit conda env: /opt/conda/envs/svgbit.\nWorker contract:\n  - Accepts: --json '<payload>'\n  - Requires: payload[\"__tool__\"] == \"svgbit_run\"\n  - Prints: final JSON to stdout only; all logs to stderr\n  - Supports:\n      input_mode = \"visium_10x\" (counts_h5 + spatial_dir)\n      input_mode = \"h5ad\"       (adata_path; coordinates from obs['x']/obs['y'], obs['center_x']/obs['center_y'], or a two-column obsm['spatial'])\n  - Produces:\n      hotspot_df.csv / AI.csv / Di.csv / svg_cluster.csv when available\n      svg_ranked.csv (every analysed gene, ranked by AI)\n      Returns \"top_svg_genes\" list (top_k_genes) for quick inspection\n"
    command:
    - python
    - /workspace/epic-fermat/agent/tools/svgbit_mcp_server.py
    env:
      SVGBIT_PYTHON: /opt/conda/envs/svgbit/bin/python
      SVGBIT_WORKER: /workspace/epic-fermat/agent/tools/svgbit_worker.py
      PYTHONUNBUFFERED: '1'
      MPLCONFIGDIR: /tmp/matplotlib
      NUMBA_CACHE_DIR: /tmp/numba_cache
    tools:
    - spatialomicsgym_name: svgbit_run
      description: "Run the SVGBit pipeline: construct STDataset from counts + coordinates, apply the gene filters and normalization asked for, execute svgbit.run (KNN weights, local Moran's I hotspots, AI/Di density, hotspot clustering), and write result tables under output_dir.\ninput_mode options (there is no CSV input mode):\n  - \"visium_10x\": uses 10x filtered_feature_bc_matrix.h5 + the tissue positions table under spatial_dir\n  - \"h5ad\": uses adata_path (.h5ad); coordinates from obs['x']/obs['y'], else obs['center_x']/obs['center_y'], else a two-column obsm['spatial'] (a three-column one is refused, not flattened)\n\nNotes:\n  - spots with in_tissue == 0 (obs['in_tissue'] in an h5ad, the tissue-positions table in visium_10x mode) are background outside the tissue and are left out before anything is ranked; data.n_spots is the count ranked, and params.in_tissue_filter, a warning and the analysis say how many were left out.\n  - genes are cut in this order and every cut is reported in params.n_genes_after_* and data.n_genes_used (the genes actually ranked): min_counts (applies whatever max_genes is), the max_genes variance cap (0 = no cap), low_variance_var, then quantile (the default 0.99 drops the ~1% most highly expressed genes; 1.0 skips it).\n  - a requested filter or normalization that the installed svgbit lacks stops the run instead of being skipped.\n  - svgbit's density step builds a dense n_spots x n_spots neighbour matrix per worker process; the worker estimates it first (available memory counts the page cache as reclaimable) and stops with the numbers if it cannot fit.\n  - gene names are made unique to avoid downstream collisions. No plots are produced. [DATA REQUIREMENTS] Input: h5ad with coordinates in obs['x']/obs['y'], obs['center_x']/obs['center_y'] or a two-column obsm['spatial'], or a 10x Visium counts h5 + spatial directory. Requires expression counts in X. SC reference: not needed. Image: not needed.\n"
      parameters:
        input_mode:
          required: true
          type: str
          enum:
          - visium_10x
          - h5ad
          description: Input format selector.
        counts_h5:
          required: false
          type: str
          description: 'Path to 10x Visium filtered_feature_bc_matrix.h5 produced by Space Ranger. Required when input_mode="visium_10x".

            '
          default: ''
        spatial_dir:
          type: str
          required: false
          description: 'Path to Visium sample directory containing a "spatial/" folder with tissue_positions.csv or tissue_positions_list.csv and images. Required when input_mode="visium_10x".

            '
          default: ''
        adata_path:
          type: str
          required: false
          description: 'Path to AnnData .h5ad file. Required when input_mode="h5ad". Coordinates are read from obs columns x and y, else obs columns center_x and center_y, else a two-column obsm["spatial"] (a three-column one is refused, not flattened); params.coord_source says which was used.'
          default: ''
        output_dir:
          type: str
          required: true
          description: Output directory to write CSV results.
          default: ./work/svgbit_out
        k:
          type: int
          required: false
          description: Neighborhood size used by SVGBit (kNN-related steps).
          default: 6
        max_genes:
          type: int
          required: false
          description: 'After min_counts, keep the max_genes highest-variance genes before SVGBit runs; 0 keeps them all. Reported in params.n_genes_after_variance_cap and data.n_genes_used.'
          default: 2000
        min_counts:
          type: int
          required: false
          description: 'Drop genes non-zero in fewer than min_counts spots before ranking. Applies whatever max_genes is; 0 keeps every gene. Reported in params.n_genes_after_min_counts and data.n_genes_used.'
          default: 1
        low_variance_var:
          required: false
          type: number
          description: 'If >0, apply svgbit.filters.low_variance_filter, which keeps genes whose variance is above this value. The run stops if the installed svgbit lacks the filter. Reported in params.n_genes_after_low_variance_filter.'
          default: 0.0
        quantile:
          type: number
          required: false
          description: 'svgbit.filters.quantile_filter keeps genes whose mean is strictly below this quantile of all gene means, so 0.99 drops the ~1% most highly expressed genes. 1.0 skips the filter; the value must lie in (0, 1]. The dropped genes are reported in params.n_genes_after_quantile_filter, data.n_genes_used and a warning.'
          default: 0.99
        normalize:
          type: boolean
          required: false
          description: 'If true, apply svgbit.normalizers.logcpm_normalizer() before ranking; the run stops if the installed svgbit lacks it. params.normalizer names what ran. log-CPM treats the matrix as counts, so with true a matrix holding negative or non-finite values (scaled or z-scored data) is refused, naming use_raw_counts when adata.raw holds counts, and a non-integer (already normalised) matrix runs with a warning. With false the matrix is ranked as supplied, so normalised or scaled data is accepted (non-finite values are still refused).'
          default: true
        n_svgs:
          type: int
          required: false
          description: 'Number of top-AI genes svgbit clusters into SVG clusters (svg_cluster.csv). It does not change AI.csv or svg_ranked.csv, which rank every analysed gene.'
          default: 1000
        n_svg_clusters:
          type: int
          required: false
          description: 'Number of SVG clusters svgbit forms from the top n_svgs genes (svg_cluster.csv).'
          default: 5
        cores:
          type: int
          required: false
          description: 'Worker processes for the Moran permutation and density steps. Each holds its own dense n_spots x n_spots neighbour matrix (8 * n_spots^2 bytes), so memory grows with cores; random_seed reproduces a run only at the same cores.'
          default: 1
        top_k_genes:
          type: int
          required: false
          description: 'Number of top genes returned inline in tool response ("top_svg_genes"). Must be 0 or more; a negative value is refused.'
          default: 20
        random_seed:
          type: int
          required: false
          description: Seed for numpy's global RNG, applied before SVGbit runs. SVGbit calls spatially variable genes from a 999-permutation Moran's I and takes no seed of its own, so two unseeded runs of one slide return different gene lists (measured max difference 0.215 in AI, a score bounded in 0 to 1). Pass a fixed value for a reproducible run. Reproduces only at the same cores value, because the worker pool chunks genes by worker count.
          default: 0
        use_raw_counts:
          type: boolean
          required: false
          default: false
          description: 'Rank adata.raw.X instead of X (input_mode="h5ad"). Use it when X is log-normalised or scaled and the integer counts sit in adata.raw (CELLxGENE exports); refused when the file has no adata.raw or it does not hold counts. In visium_10x mode the count matrix is counts already and the flag is listed in params.ignored. params.expression_source and params.x_matrix_kind say which matrix ran and what X held.'
  spatialprompt:
    enabled: true
    label: "SpatialPrompt \u2013 spatial cell-type deconvolution + spot clustering"
    description: "SpatialPrompt MCP server for (1) estimating per-spot cell-type proportions using a single-cell reference (spatialprompt_deconvolution), and (2) segmenting a slide into spatial domains from expression and coordinates alone (spatialprompt_cluster), optionally naming each domain from a proportions table written by (1).\nThis MCP server runs a FastMCP wrapper in spatialomicsgym_env and delegates execution to a worker running inside the SpatialPrompt conda env: /opt/conda/envs/spatialpromptENV.\nSupported input patterns (worker side):\n  - input_mode=\"visium_10x\":\n      counts_h5: 10x filtered_feature_bc_matrix.h5 (Space Ranger)\n      spatial_dir: Space Ranger run directory containing spatial/tissue_positions_list.csv (or spatial/tissue_positions.csv)\n  - input_mode=\"h5ad\":\n      st_h5ad: AnnData (.h5ad) containing coordinates in:\n        - adata.obsm['spatial'] (preferred), or\n        - adata.obs[['x','y']]\n  In both modes a 0/1 in_tissue flag (adata.obs['in_tissue'], or the Space Ranger positions file) is honoured: in_tissue == 0 spots are background and are left out, and the payload counts them.\n\nReference scRNA input:\n  - sc_h5ad: AnnData (.h5ad) with cell-type labels in sc.obs[sc_label_key].\n"
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spatialprompt_mcp_server.py
    env:
      SPATIALPROMPT_PYTHON: /opt/conda/envs/spatialpromptENV/bin/python
      SPATIALPROMPT_WORKER: /workspace/epic-fermat/agent/tools/spatialprompt_worker.py
      PYTHONUNBUFFERED: '1'
      MPLCONFIGDIR: /tmp/matplotlib
      NUMBA_CACHE_DIR: /tmp/numba_cache
    tools:
    - spatialomicsgym_name: spatialprompt_deconvolution
      description: "Estimate per-spot cell-type proportions using SpatialPrompt's reference-guided SpatialDeconvolution workflow (predict_cell_prop: spots simulated from the reference, a spatial-neighbourhood step, then k-nearest-neighbour regression).\nInputs:\n  - sc_h5ad: single-cell reference AnnData\n  - sc_label_key: sc.obs column holding discrete cell-type labels (e.g., \"cell_type\"); a cell with no label is refused unless drop_unlabeled is true\n  - spatial input:\n      * visium_10x: (counts_h5 + spatial_dir)\n      * h5ad: (st_h5ad)\n\nWhat reaches SpatialPrompt (every cut is counted in the payload's data and named in its analysis):\n  - spots: in_tissue == 0 spots (a 0/1 obs['in_tissue'] flag, or the Space Ranger positions file) are left out; data.n_spots is the slide supplied, data.n_spots_used the spots deconvolved\n  - genes: min_counts removes spatial genes with fewer total counts, then max_genes keeps the most variable of the rest; data.n_genes is the panel supplied and data.n_genes_used what survived both cuts. SpatialPrompt then keeps its own 1000 most reference-variable genes among those shared with the reference (data.n_genes_modelled), so with the default max_genes=2000 that choice only sees the 2000 spatial genes kept.\n\nOutputs:\n  - cell_type_proportions.csv (spots x cell types, indexed by spot barcode) under output_dir\n\nNotes:\n  - SpatialPrompt holds the spatial and reference matrices dense over the shared genes; the worker estimates that size against available memory first and stops with the numbers if it cannot fit. Lower max_genes to shrink the shared gene panel.\n  - Gene selection is variance ranking, with no optional dependencies. [DATA REQUIREMENTS] Input: spatial h5ad with obsm['spatial'] and expression in X. SC reference: h5ad with cell-type labels required. Tool uses SpatialPrompt reference-guided workflow.\n"
      parameters:
        input_mode:
          required: true
          type: str
          enum:
          - visium_10x
          - h5ad
          description: 'Spatial input mode. Use "visium_10x" for 10x Visium Space Ranger outputs, or "h5ad" for prebuilt AnnData.

            '
        output_dir:
          type: str
          required: true
          description: Output directory for all results and intermediate artifacts.
        sc_h5ad:
          type: str
          required: true
          description: Path to single-cell reference AnnData (.h5ad).
        sc_label_key:
          type: str
          required: true
          default: cell_type
          description: Column name in sc.obs specifying cell-type annotations.
        counts_h5:
          type: str
          required: false
          description: Path to Visium filtered_feature_bc_matrix.h5 (10x).
        spatial_dir:
          type: str
          required: false
          description: Space Ranger run directory containing spatial/tissue_positions_list.csv.
        st_h5ad:
          type: str
          required: false
          description: Path to spatial AnnData (.h5ad) with coordinates.
        max_genes:
          type: int
          required: false
          default: 2000
          description: 'Spatial genes kept for the deconvolution, ranked by spatial variance after min_counts has been applied (0 keeps all). SpatialPrompt then chooses its own 1000 reference-variable genes among those shared with the reference, so this cap bounds what that choice can see. Counted in data.n_genes (supplied) and data.n_genes_used (kept) and named in the analysis.'
        min_counts:
          type: int
          required: false
          default: 1
          description: 'Minimum total counts over the analysed (on-tissue) spots for a spatial gene to be kept, applied whatever max_genes is (0 disables it). The number removed is data.n_genes_below_min_counts.'
        random_seed:
          type: int
          required: false
          default: 0
          description: Random seed (used for reproducibility where applicable).
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Reference cells whose sc_label_key label is missing (NaN/empty) are refused by default; true leaves them out and reports the count as data.n_cells_dropped_unlabeled (data.n_cells_sc_used is the reference that was used).'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'SpatialPrompt TPM-normalises both matrices, so it reads them as counts. false reads X: X with negative or NaN/inf values (scaled data) is refused, and non-integer X (normalised data) runs with a warning. true runs on adata.raw of the spatial h5ad (refused when it has none or it does not hold counts) and of the reference when it has one (otherwise its X, with a warning); ignored in visium_10x mode, whose Space Ranger matrix is counts. params.expression_source / expression_source_sc say which matrix was read.'
    - spatialomicsgym_name: spatialprompt_cluster
      description: "Cluster spatial spots into spatial domains using SpatialPrompt's SpatialCluster workflow (KMeans, with n_clust as the exact number of clusters, on a 50-component reduction of its 1000 most variable genes and their spatial-neighbourhood average).\nTypical usage:\n  1) Run this tool on the slide on its own. SpatialCluster reads the expression matrix and the coordinates only, so no single-cell reference and no deconvolution are needed to get domains.\n  2) Optionally run spatialprompt_deconvolution on the same slide first and pass its proportions CSV as cell_type_prop_csv. Each domain is then also named after the cell types that dominate it.\n\nWhat is clustered: in_tissue == 0 spots (a 0/1 obs['in_tissue'] flag, or the Space Ranger positions file) are background and are left out; data.n_spots is the slide supplied and data.n_spots_used the spots clustered. SpatialCluster clusters on the 1000 genes with the highest raw-count variance (data.n_genes_used of data.n_genes); only those are made dense.\n\nOutputs:\n  - spatialprompt_spot_clusters.csv under output_dir\n  - spatialprompt_spatial_with_clusters.h5ad carrying the labels in obs\n  - spatialprompt_cluster_cell_types.csv, only when cell_type_prop_csv is supplied and covers every clustered spot [DATA REQUIREMENTS] Input: spatial h5ad with obsm['spatial'] and expression in X. SC reference: not needed.\n"
      parameters:
        input_mode:
          required: true
          type: str
          enum:
          - visium_10x
          - h5ad
          description: Spatial input mode.
        output_dir:
          type: str
          required: true
          description: Output directory for clustering results.
        cell_type_prop_csv:
          type: str
          required: false
          description: "Optional. Path to the per-spot cell type proportions CSV written by spatialprompt_deconvolution on this same slide. Supply it only to have each cluster named after the cell types that dominate it; the clustering itself does not use it, so omit it to segment the slide on expression and coordinates alone."
        counts_h5:
          type: str
          required: false
          description: Path to Visium filtered_feature_bc_matrix.h5 (10x).
        spatial_dir:
          type: str
          required: false
          description: Space Ranger run directory containing spatial/tissue_positions_list.csv.
        st_h5ad:
          type: str
          required: false
          description: Path to spatial AnnData (.h5ad).
        n_clust:
          type: int
          required: false
          default: 8
          description: Number of clusters.
        clust_label:
          type: str
          required: false
          default: spatialprompt_cluster
          description: Column name to store cluster labels in adata.obs.
        random_seed:
          type: int
          required: false
          default: 0
          description: Random seed.
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'SpatialCluster TPM-normalises the slide, so it reads X as counts: X with negative or NaN/inf values (scaled data) is refused, and non-integer X (normalised data) runs with a warning. true clusters adata.raw instead (refused when the h5ad has none or it does not hold counts; ignored in visium_10x mode, whose Space Ranger matrix is counts). params.expression_source says which matrix was read.'
  bayestme:
    enabled: true
    label: "BayesTME \u2013 Bayesian spatial deconvolution + marker gene discovery"
    description: 'BayesTME performs Bayesian deconvolution for spatial transcriptomics, estimating latent cell-type components and (optionally) selecting marker genes for those components. This SpatialOmicsLab integration is reference-free: it runs BayesTME''s SVI deconvolution (bayestme.svi.deconvolution.deconvolve) without an scRNA expression prior, then optionally its select_marker_genes CLI. It follows the standard two-layer MCP pattern: (1) a FastMCP wrapper (spatialomicsgym_env) that validates arguments and spawns (2) a worker script running inside the BayesTME conda environment. The worker enforces SpatialOmicsLab protocol: stdout is final JSON only; all logs go to stderr. Input loaders: - 10x Visium layout using an H5 count matrix + spatial/tissue_positions_list.csv - Space Ranger outs/ directory with the RAW feature-barcode matrix - .h5ad with raw counts in X and obsm[''spatial''] (the worker adds in_tissue, layout and a neighbour graph) - Generic (counts .h5ad + coords CSV) for non-10x platforms'
    command:
    - python
    - /workspace/epic-fermat/agent/tools/bayestme_mcp_server.py
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BAYESTME_PYTHON: /opt/conda/envs/bayestme/bin/python
      BAYESTME_WORKER: /workspace/epic-fermat/agent/tools/bayestme_worker.py
    tools:
    - spatialomicsgym_name: bayestme_deconvolution
      description: 'Run BayesTME deconvolution on spatial transcriptomics input and (optionally) perform marker gene selection via the BayesTME CLI. The tool writes all artifacts to output_dir and returns a JSON summary with canonical file paths: deconvolution_result.h5 (BayesTME DeconvolutionResult; the derived reads_trace array is not stored, DeconvolutionResult.read_h5 recomputes it), bayestme_deconvolved.h5ad, and bayestme_with_markers.h5ad (if marker_genes.run=true). IMPORTANT protocol notes: - Worker stdout is JSON only; wrapper returns the parsed JSON. - Worker logs and progress are emitted to stderr for debugging. - deconvolution.n_components is required. - BayesTME''s spatial prior builds its own neighbour graph from the in-tissue positions and the layout (HEX/SQUARE lattice neighbours, IRREGULAR a fixed 5-nearest-neighbour graph); knn_k only shapes obsp[''connectivities''] in the saved h5ad and is reported in params.ignored. - Only in-tissue spots are deconvolved (data.n_spots_used); out-of-tissue rows of the obsm results are zeros, and the spots left out are counted in params.in_tissue_filter. - BayesTME''s likelihood is Poisson, so the matrix it fits must hold raw counts: a log-normalised or scaled X (fractional, negative or NaN values over the in-tissue spots) is refused before the SVI run, and the error says whether adata.raw holds counts; use_raw_counts=true fits adata.raw instead (reported as params.counts_source). [DATA REQUIREMENTS] Input: spatial data with raw counts (in X, or in adata.raw with use_raw_counts=true) and spot coordinates (h5ad: X + obsm[''spatial'']). SC reference: not used (reference-free). Tool runs BayesTME Bayesian deconvolution.'
      parameters:
        output_dir:
          type: str
          required: true
          description: 'Directory where BayesTME outputs will be saved. The worker will create this directory if it does not exist. Outputs typically include: - deconvolution_result.h5 (BayesTME DeconvolutionResult
            container) - bayestme_deconvolved.h5ad (AnnData annotated with BayesTME results) - bayestme_with_markers.h5ad (if marker gene selection is enabled)

            '
        input_mode:
          type: str
          required: false
          default: visium_h5_spatial
          description: 'Select the input loader strategy. Supported modes in this integration: - "visium_h5_spatial": 10x Visium-style input using an H5 count matrix plus spatial/tissue_positions_list.csv. - "spaceranger_outs": Space Ranger "outs/" directory holding the RAW feature-barcode matrix. - "h5ad": AnnData .h5ad with raw counts in X and coordinates in obsm[''spatial'']. - "generic_counts_coords": counts-only .h5ad + coords CSV (barcode,x,y[,in_tissue]).'
        spaceranger_dir:
          type: str
          required: false
          default: ''
          description: 'Required when input_mode="spaceranger_outs". Path to a Space Ranger outputs directory (typically ".../outs"). The worker will use the BayesTME helper loader for this mode.

            '
        visium_h5_path:
          type: str
          required: false
          default: ''
          description: "Required when input_mode=\"visium_h5_spatial\". Path to the 10x filtered_feature_bc_matrix.h5 (or equivalent, possibly renamed). Example:\n  ./work/spatial_input/V1_Human_Lymph_Node/V1_Human_Lymph_Node_filtered_feature_bc_matrix.h5\n"
        visium_spatial_dir:
          type: str
          required: false
          default: ''
          description: "Required when input_mode=\"visium_h5_spatial\". Path to the Visium \"spatial/\" directory containing tissue_positions_list.csv and (optionally) scalefactors/images. Example:\n  ./work/spatial_input/V1_Human_Lymph_Node/spatial\n"
        coord_type:
          type: str
          required: false
          default: array
          description: 'Coordinate system to use when input_mode="visium_h5_spatial": - "array": uses array_row/array_col (best for building Visium neighbor graphs). - "pixel": uses pxl_row_in_fullres/pxl_col_in_fullres
            (image pixel space). For most Visium deconvolution workflows, "array" is recommended.

            '
        h5ad_path:
          type: str
          required: false
          default: ''
          description: 'Required when input_mode="h5ad". Path to an AnnData (.h5ad) with raw counts in adata.X (or in adata.raw, with use_raw_counts=true) and spot coordinates in adata.obsm[''spatial''] (the run is refused without them). A matrix that is not counts (fractional, negative or NaN values over the in-tissue spots) is refused before the SVI run, and the error says whether adata.raw holds counts. adata.obs[''in_tissue''] is optional (absent means every spot is in tissue; 0/1, true/false or their text forms are read by value). The worker writes adata.uns[''layout''] from the layout parameter (or keeps the file''s own uns[''layout''] when layout is empty) and rebuilds adata.obsp[''connectivities''] with knn_k; neither graph is what BayesTME''s spatial prior uses.'
        layout:
          type: str
          required: false
          default: ''
          description: 'Spot lattice BayesTME builds its spatial prior on. Used only when input_mode=h5ad; the other three modes derive it from the input. One of HEX (Visium), SQUARE (a regular grid) or IRREGULAR (Slide-seq, MERFISH, Xenium and any other free-position platform). Empty (the default) uses the h5ad''s own uns[''layout''], and HEX when the file has none. Any other value is rejected by the worker.'
        counts_h5ad_path:
          type: str
          required: false
          default: ''
          description: 'Required when input_mode="generic_counts_coords". Path to an AnnData (.h5ad) with raw counts in adata.X (or in adata.raw, with use_raw_counts=true); a matrix that is not counts is refused before the SVI run. The worker joins it with coords_csv by barcode/obs_names, then constructs the BayesTME-required fields.'
        coords_csv:
          type: str
          required: false
          default: ''
          description: 'Required when input_mode="generic_counts_coords". CSV containing at least: barcode,x,y Optionally: in_tissue (boolean or 0/1). Barcodes must match counts_h5ad_path.obs_names.

            '
        knn_k:
          type: int
          required: false
          default: 6
          description: 'K for the k-nearest-neighbour graph the worker writes to adata.obsp[''connectivities''] in the saved h5ad. It does not reach the deconvolution: BayesTME''s spatial prior builds its own neighbour graph from the in-tissue positions and the layout, so knn_k is reported in params.ignored.'
        gene_filtering:
          type: object
          required: false
          default: {}
          description: 'Optional gene filtering prior to deconvolution. If omitted, no filtering is applied. Supported keys: - filter_ribosomal_genes (bool): drop RPS/RPL genes - spot_threshold (float in (0, 1]): keep genes detected in AT MOST this fraction of in-tissue spots, i.e. drop near-ubiquitous genes - n_top_by_standard_deviation (int): keep the top-N genes by standard deviation of log counts. Each step and its gene counts are reported in params.gene_filtering.'
          properties:
            filter_ribosomal_genes:
              type: boolean
              required: false
              default: false
              description: 'If true, removes ribosomal genes (names matching BayesTME''s pattern [Rr][Pp][SsLl]) before running BayesTME. The pattern is matched against var_names, or, when var_names are Ensembl IDs (e.g. a CELLxGENE h5ad), against a gene-symbol column of var (SYMBOL, gene_symbols, gene_name, GeneName, GeneName-2 or feature_name); params.gene_filtering names the column matched (matched_on) and a warning says so. Ensembl var_names with no symbol column match nothing, and a warning says that too.'
            spot_threshold:
              type: number
              required: false
              default: null
              description: 'Keep genes detected in at most this fraction of in-tissue spots and drop the rest (BayesTME''s filter_genes_by_spot_threshold removes near-ubiquitous genes, not rare ones). Example: 0.95 drops genes detected in more than 95% of spots. Must be in (0, 1]; null means no spot filter.'
            n_top_by_standard_deviation:
              type: int
              required: false
              default: null
              description: 'Keep only the top-N genes by standard deviation across spots.

                '
        deconvolution:
          type: object
          required: false
          default: {}
          description: 'Parameters controlling BayesTME SVI deconvolution. Supported keys in this integration: - n_components (int, required): number of latent components/cell types - rho (float or null): spatial smoothing strength of the spatial guide; null uses BayesTME_VI''s own 0.5 - n_svi_steps (int): optimization steps for SVI - n_samples (int): posterior sample count - use_spatial_guide (bool): enable the spatial prior - seed (int): RNG seed'
          properties:
            n_components:
              type: int
              required: false
              default: null
              description: 'Number of latent components (often interpreted as cell types / programs). Required: BayesTME cannot infer it, and the worker refuses a missing or null value.'
            rho:
              type: number
              required: false
              default: null
              description: 'Spatial smoothing strength (the lambda of the BayesTME paper) used by the spatial guide; must be >= 0. If null, the worker uses BayesTME_VI''s own default 0.5 (BayesTME''s deconvolve() would otherwise pass None through and crash) and reports the value used as params.rho. Has no effect when use_spatial_guide=false.'
            n_svi_steps:
              type: int
              required: false
              default: 10000
              description: 'Number of SVI optimization steps. Increase for better convergence at higher runtime cost.

                '
            n_samples:
              type: int
              required: false
              default: 100
              description: 'Number of posterior samples to draw for summarization.

                '
            use_spatial_guide:
              type: boolean
              required: false
              default: true
              description: 'Whether to use BayesTME''s spatial prior (the guide with the spatial regularizer). If the in-tissue spots all share one position the run is refused rather than silently run without it; pass false to run the non-spatial model.'
            seed:
              type: int
              required: false
              default: 0
              description: 'RNG seed for reproducibility.

                '
        marker_genes:
          type: object
          required: false
          default: {}
          description: 'Controls marker gene selection. If marker_genes.run=true, the worker will invoke the BayesTME CLI "select_marker_genes" using the deconvolution_result.h5 and the bayestme_deconvolved.h5ad,
            producing bayestme_with_markers.h5ad.

            '
          properties:
            run:
              type: boolean
              required: false
              default: true
              description: 'If true, run marker gene selection after deconvolution.

                '
            n_marker_genes:
              type: int
              required: false
              default: 10
              description: 'Number of marker genes to select per component: a whole number >= 1 (5.0 reads as 5; null means 10), checked before the SVI run. Reported as params.marker_n_marker_genes.'
            alpha:
              type: number
              required: false
              default: 0.05
              description: 'Marker-gene cutoff of the two cutoff methods (TIGHT: omega > 1 - alpha; FALSE_DISCOVERY_RATE: fdr <= alpha): a number in (0, 1] (null means 0.05), checked before the SVI run and reported as params.marker_alpha. BEST_AVAILABLE, the default method, does not read it: a given alpha is listed in params.ignored and params.marker_alpha is null.'
            method:
              type: str
              required: false
              default: BEST_AVAILABLE
              description: 'Marker gene selection method passed to select_marker_genes: BEST_AVAILABLE (default; ranks every gene), FALSE_DISCOVERY_RATE or TIGHT, checked before the SVI run. BayesTME''s select_marker_genes CLI writes its gene list for every gene and stops as soon as one fails the cutoff, so TIGHT, and FALSE_DISCOVERY_RATE with alpha below 1, are refused before the SVI run; use BEST_AVAILABLE or run=false.'
            verbose:
              type: boolean
              required: false
              default: true
              description: 'If true, pass -v to the marker gene CLI and emit CLI logs to stderr.

                '
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Fit the counts in adata.raw instead of adata.X. Read only by input_mode="h5ad" and "generic_counts_coords" (the two 10x modes read a count matrix and list it in params.ignored). Use it for a CELLxGENE-style Visium h5ad, whose X is log-normalised or scaled and whose integer counts sit in adata.raw; a file without adata.raw is refused. The matrix fitted is reported as params.counts_source ("X" or "raw").'
  starfysh:
    enabled: true
    label: "Starfysh \u2013 Reference-free spatial deconvolution with optional histology integration"
    description: "Starfysh is an end-to-end toolbox for analysis and integration of spatial transcriptomics datasets. For SpatialOmicsLab, we integrate Starfysh primarily as a deconvolution tool that infers spot-level\
      \ cell-type/state proportions, guided by either (a) user-provided marker signatures or (b) unsupervised Archetypal Analysis (AA) marker discovery when signatures are not provided.\nThis SpatialOmicsLab integration\
      \ follows the standard two-layer MCP pattern: (1) a wrapper (spatialomicsgym_env) that validates arguments and spawns (2) a worker script running inside the Starfysh conda environment. SpatialOmicsLab protocol guarantees:\
      \ - Worker stdout is final JSON only; all logs/progress go to stderr. - Wrapper returns parsed JSON only.\nInput handling is flexible to support \u201Cany spatial transcriptomics\u201D in practice\
      \ by normalizing common formats into the Visium-style folder structure expected by Starfysh preprocessing: - 10x Visium: H5 count matrix + spatial/tissue_positions_list.csv + scalefactors_json.json\
      \ + tissue image - Space Ranger outs/ directory - Generic: counts-only .h5ad + coords CSV (barcode,x,y[,in_tissue]) (worker synthesizes\
      \ tissue_positions_list.csv)\n"
    command:
    - python
    - /workspace/epic-fermat/agent/tools/starfysh_mcp_server.py
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      STARFYSH_PYTHON: /opt/conda/envs/Starfysh/bin/python
      STARFYSH_WORKER: /workspace/epic-fermat/agent/tools/starfysh_worker.py
    tools:
    - spatialomicsgym_name: starfysh_deconvolution
      description: 'Run Starfysh deconvolution to infer spot-level factor proportions (cell types / states). The worker writes all artifacts to output_dir and returns a JSON summary with canonical output paths. Core outputs: starfysh_annotated.h5ad (inference/generative outputs in AnnData), cell_type_proportions.csv (from adata.obsm[''qc_m'']), gene_signatures_used.csv (provided or AA-derived), anchor_spots.csv, training_losses.csv, starfysh_model_state.pt. Protocol notes: worker stdout is JSON only and the wrapper returns parsed JSON; worker logs/progress go to stderr. If signature_csv is omitted, the worker runs Archetypal Analysis (AA) to derive signatures. [DATA REQUIREMENTS] Input: a Visium count h5 + spatial/ folder, a Space Ranger outs/, or a counts h5ad + coords CSV; each input_mode reads only its own inputs and lists any other supplied input in params ignored. A Visium spatial/ folder without tissue_hires_image.png and tissue_lowres_image.png (VisiumHD exports) is read without images and named in params visium_images_missing; PoE still needs tissue_hires_image.png. Starfysh normalises X as counts: in generic_counts_coords mode a counts_h5ad whose X has negative or NaN values (scaled / z-scored) is refused and the error says whether adata.raw holds counts, a non-integer X (log-normalised) runs with a warning, and use_raw_counts=true stages adata.raw.X (params expression_source / x_matrix_kind). Reference-free: no single-cell reference is used; named cell types come from signature_csv (its column names are kept exactly as given), otherwise Archetypal Analysis yields arch_<i> factors. In generic_counts_coords mode, background spots (in_tissue == 0) are left out and reported in params in_tissue_filter. Starfysh''s own preprocessing drops zero-count and all-mitochondrial spots; data n_spots_dropped_by_starfysh_preprocess reports how many, beside n_spots_input. Tool infers spot-level factor proportions.'
      parameters:
        output_dir:
          type: string
          required: true
          description: 'Directory where Starfysh outputs will be saved. Created if missing.

            '
        input_mode:
          type: string
          required: false
          default: visium_h5_spatial
          description: 'Input loader strategy (there is no plain-h5ad mode). "visium_h5_spatial": 10x Visium input using count_h5 + spatial_dir. "spaceranger_outs": Space Ranger outs/ directory (filtered_feature_bc_matrix.h5
            + spatial/), read in place and never modified. "generic_counts_coords": counts .h5ad + coords CSV (barcode,x,y[,in_tissue]); add hires_image to run PoE. Staged input lives in <output_dir>/_starfysh_input/<sample_id>,
            rebuilt on every run.

            '
        sample_id:
          type: string
          required: false
          default: V1_Human_Lymph_Node
          description: 'Sample identifier used to construct a Visium-like folder tree for Starfysh. For "spaceranger_outs", this may be inferred from outs_dir basename.

            '
        count_h5:
          type: string
          required: false
          description: 'Path to 10x Visium filtered_feature_bc_matrix.h5 (or any .h5 matrix; worker symlinks it to Starfysh-expected name "filtered_feature_bc_matrix.h5" inside a temp sample folder).

            '
        spatial_dir:
          type: string
          required: false
          description: 'Path to the Visium spatial/ directory holding tissue_positions_list.csv (or the Space Ranger 2.0 tissue_positions.csv) and scalefactors_json.json; tissue_hires_image.png is needed only for PoE. The worker symlinks these into its own staging tree. A folder without tissue_hires_image.png and tissue_lowres_image.png (VisiumHD exports) is read without images and named in params visium_images_missing.'
        outs_dir:
          type: string
          required: false
          description: 'Path to Space Ranger "outs/" directory that contains: filtered_feature_bc_matrix.h5 and spatial/ subfolder.

            '
        counts_h5ad:
          type: string
          required: false
          description: 'AnnData (.h5ad) with raw counts in X (or in adata.raw, with use_raw_counts=true), obs_names as barcodes/spots and var_names as genes. Read only in generic_counts_coords mode. Spots with obs in_tissue == 0 (background, as CELLxGENE Visium exports carry them) are left out before Starfysh runs and reported in params in_tissue_filter. An X with negative or NaN values (scaled / z-scored) is refused, and the error says whether adata.raw holds counts; a non-integer X (log-normalised) runs with a warning.'
        coords_csv:
          type: string
          required: false
          description: 'CSV with at least (barcode,x,y). Read only in generic_counts_coords mode. Optional in_tissue column, used to leave out background spots (in_tissue == 0) when the counts h5ad obs has no in_tissue column. Worker synthesizes Visium-style tissue_positions_list.csv required by Starfysh preprocessing.'
        hires_image:
          type: string
          required: false
          default: ''
          description: 'Optional path to the paired H&E image (png), read only in generic_counts_coords mode, where it is staged as spatial/tissue_hires_image.png. PoE (use_poe=true, the default) needs it -- without it a PoE run is refused unless use_poe=false or allow_poe_fallback=true. In the Visium modes the image comes from spatial_dir / outs_dir; a hires_image passed there has no effect and is listed in params ignored.'
        scalefactors_json:
          type: string
          required: false
          default: ''
          description: 'Optional scalefactors_json.json, read only in generic_counts_coords mode. If omitted there, the worker writes a minimal scalefactors file using tissue_hires_scalef=1.0. In the Visium modes the scalefactors come from spatial_dir / outs_dir; a scalefactors_json passed there has no effect and is listed in params ignored.'
        n_genes:
          type: integer
          required: false
          default: 2000
          description: 'Number of genes (HVGs) to use in Starfysh training. Starfysh preprocess selects HVGs.

            '
        use_poe:
          type: boolean
          required: false
          default: true
          description: 'Whether to run Starfysh PoE mode, which integrates histology image patches into inference. PoE requires the paired H&E image: spatial/tissue_hires_image.png in a Visium/spaceranger input, or hires_image=<path> in generic_counts_coords mode. With no image a use_poe=true run is refused before any data is loaded, unless allow_poe_fallback=true lets it run standard Starfysh instead (params used_fallback=true). Pass false to select standard Starfysh explicitly -- the upstream library default, and the right choice for any input without an image (a Visium spatial/ folder with no PNG is read without images). params method names the model that ran.'
        allow_poe_fallback:
          type: boolean
          required: false
          default: false
          description: 'Only with use_poe=true. When no paired H&E image is available, run standard Starfysh (no image integration) instead of failing; the result then reports used_fallback=true in
            params and names the model that ran in params method. Off by default: without it a PoE request with no image is an error before any data is loaded.

            '
        hchannel:
          type: boolean
          required: false
          default: false
          description: 'Whether to extract hematoxylin channel during image preprocessing (if supported by environment).

            '
        signature_mode:
          type: string
          required: false
          default: auto
          description: 'Signature behavior: - "auto": use signature_csv if provided; else derive signatures via AA. - "provided": require signature_csv and use it. - "archetype": ignore signature_csv and
            derive signatures via AA.

            '
        signature_csv:
          type: string
          required: false
          default: ''
          description: 'Path to a marker table: one column per cell type / state, its marker genes listed down the column (columns may differ in length). A leading index column is optional -- the first column
            is the row index when its header is blank or none of its values is a gene of the counts, and a signature otherwise (the result says which). Every signature must share at least one gene with the counts.

            '
        aa_r:
          type: integer
          required: false
          default: 30
          description: 'Used only when signatures are derived by Archetypal Analysis (no signature_csv). Forwarded to ArchetypalAnalysis.compute_archetypes(cn=aa_r): the FisherS conditional number that picks
            the PCs for the intrinsic-dimension estimate (the lower bound on the archetype count). It is NOT the number of archetypes. Positive integer; 30 is the upstream default and 0 is refused.

            '
        aa_n_markers:
          type: integer
          required: false
          default: 100
          description: 'Number of marker genes per archetype returned by AA when deriving signatures.

            '
        n_anchors:
          type: integer
          required: false
          default: 30
          description: 'Number of anchor spots per factor for Starfysh anchor selection.

            '
        window_size:
          type: number
          required: false
          default: 3
          description: 'Neighborhood radius (in array_row/array_col units) for library-size smoothing.

            '
        patch_r:
          type: integer
          required: false
          default: 16
          description: 'Patch radius for PoE image integration (if use_poe=true).

            '
        sig_version:
          type: string
          required: false
          default: gene_score
          description: How Starfysh normalises the signature means. Accepted values are gene_score
            (the library default) and norm. Any other spelling is rejected before any data is
            loaded; leave empty to let Starfysh choose.
        n_repeats:
          type: integer
          required: false
          default: 3
          description: 'Number of random restarts; Starfysh keeps the best run.

            '
        lr:
          type: number
          required: false
          default: 0.001
          description: 'Learning rate.

            '
        epochs:
          type: integer
          required: false
          default: 200
          description: 'Training epochs per restart. There is no early stopping; every restart runs all of them.

            '
        patience:
          type: integer
          required: false
          default: 50
          description: 'Accepted for compatibility and has no effect: the installed Starfysh run_starfysh has no early stopping, so every restart trains for the full epochs. Reported in params ignored.

            '
        device:
          type: string
          required: false
          default: auto
          description: '"auto" (use CUDA if available), or explicitly "cpu", or "cuda".

            '
        use_raw_counts:
          type: boolean
          required: false
          default: false
          description: 'Read only in generic_counts_coords mode: stage the counts in adata.raw.X of counts_h5ad instead of X. Use it for a CELLxGENE-style h5ad whose X is log-normalised or scaled and whose integer counts sit in adata.raw; an h5ad without adata.raw, or whose adata.raw does not hold counts, is refused. The Visium modes read a 10x count matrix, which has no adata.raw, and list use_raw_counts in params ignored. params expression_source says which matrix ran (X or raw.X).'
  ucdeconvolve:
    enabled: true
    label: "ucdeconvolve (UCD) \u2013 API-backed context-free cell type fraction deconvolution"
    description: "ucdeconvolve (UniCell Deconvolve / UCD) is an API-backed, pretrained model that predicts cell type fractions for transcriptomic data (bulk, single-cell, and spatial). In the spatial tutorial,\
      \ UCD authenticates via ucd.api.authenticate(TOKEN) and runs UCDBase with ucd.tl.base(adata), appending prediction matrices into adata.obsm and metadata into adata.uns under a configurable key (default\
      \ \"ucdbase\").\nThis SpatialOmicsLab integration follows the standard two-layer MCP pattern: (1) a FastMCP wrapper (spatialomicsgym_env) validates arguments and spawns (2) a\
      \ worker script running inside the ucdenv conda environment. The worker enforces SpatialOmicsLab protocol: stdout is final JSON only; all logs go to stderr.\nInput handling is flexible and designed to support\
      \ \u201Cany spatial transcriptomics\u201D in practice: - 10x Visium layout using an H5 count matrix + spatial/tissue_positions_list.csv - Space Ranger outs/ directory - Pre-built .h5ad (AnnData) -\
      \ Generic (counts .h5ad + coords CSV) for non-10x platforms\nIMPORTANT: UCD requires an API access token. Provide it via tool parameter \"token\" or by setting environment variable UCD_TOKEN (recommended).\n"
    command:
    - python
    - /workspace/epic-fermat/agent/tools/ucdeconvolve_mcp_server.py
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      UCD_PYTHON: /opt/conda/envs/ucdenv/bin/python
      UCD_WORKER: /workspace/epic-fermat/agent/tools/ucdeconvolve_worker.py
      UCD_TOKEN: ${UCD_TOKEN}
    tools:
    - spatialomicsgym_name: ucdeconvolve_base
      description: 'Run ucdeconvolve.tl.base() (UCDBase), a pre-trained reference-free model that runs on the UCD cloud API, to obtain context-free cell type fraction predictions. The expression matrix UCD reads is uploaded to the UCD service, and a UCD token is required. What can be checked locally (the groupby column, the neighbour graph smoothing needs, the gene overlap with UCD''s input vocabulary) is checked before the upload.

        Background spots (obs[''in_tissue''] == 0 -- every array spot of a CELLxGENE Visium h5ad, or the in_tissue column of coords_csv) are left out right after loading and are never uploaded; params.in_tissue_filter and data.n_spots_supplied count them, and data.n_spots counts the in-tissue spots UCD read. A matrix holding negative or NaN/infinite values (scaled data) is refused before the upload; counts and log1p data are both accepted.

        Outputs saved to output_dir (canonical paths returned in JSON): ucdeconvolve_annotated.h5ad, plus one <key_added>_<category>_predictions.csv per prediction category UCD returned -- ucdbase_raw_predictions.csv, and with split=true also ucdbase_primary_predictions.csv, ucdbase_lines_predictions.csv and ucdbase_cancer_predictions.csv. A run that exports no prediction CSV is an error.

        params.counts_source names the matrix UCD read (adata.raw when use_raw is on and the input has one, otherwise adata.X; no stand-in adata.raw is written), with counts_integer_valued and n_genes_matched beside it. summary.pred_celltype_key names the obs column assign_top_celltypes actually wrote. A post-processing step that fails after the upload stops the run with an error, once the predictions are on disk. A knob set away from its default whose step does not run (pred_key_added, assign_category, groupby and knnsmooth_* with assign_top_celltypes off; knnsmooth_cycles with no knnsmooth_neighbors; n_neighbors with compute_neighbors off; coord_type in the h5ad and generic_counts_coords modes) is still echoed and is listed in params.ignored with a warning.

        Protocol notes: worker stdout is JSON only; the wrapper returns parsed JSON. Worker logs/progress go to stderr. The token is never printed. [DATA REQUIREMENTS] Input: h5ad with counts in X or adata.raw (log1p-normalised values are un-logged by UCD). Uses UCDBase context-free predictions; no SC reference needed. Requires ucdeconvolve authentication. Image: not needed.'
      parameters:
        output_dir:
          type: string
          required: true
          description: 'Directory where outputs will be saved. The worker creates it if missing.

            '
        token:
          type: string
          required: false
          description: 'UCD API access token, required for authentication. Leave unset: the wrapper
            reads the UCD_TOKEN environment variable, which is where the credential belongs (sog-setup
            collects it into .env). Passing a literal token here would place it in the transcript.

            '
        sample_id:
          type: string
          required: false
          default: sample
          description: 'Human-readable sample identifier used only for reporting.

            '
        input_mode:
          type: string
          required: false
          default: visium_h5_spatial
          description: "Select the input loader strategy. Supported modes: - \"visium_h5_spatial\": 10x Visium-style input using an H5 count matrix plus\n  spatial/tissue_positions_list.csv (your demo dataset\
            \ matches this).\n- \"spaceranger_outs\": Space Ranger \"outs/\" directory. - \"h5ad\": pre-built AnnData .h5ad. - \"generic_counts_coords\": counts-only .h5ad + coords CSV (barcode,x,y[,in_tissue]).\n"
        coord_type:
          type: string
          required: false
          default: array
          description: 'Spatial coordinate system used when constructing adata.obsm[''spatial''] for Visium inputs (input_mode visium_h5_spatial or spaceranger_outs): - "array": uses array_row/array_col (recommended for Visium spot adjacency) - "pixel": uses pxl_*_in_fullres (image pixel space). Any other value is refused in those modes. The h5ad and generic_counts_coords modes do not read it; a non-default value there is listed in params.ignored.'
        visium_h5_path:
          type: string
          required: false
          default: ''
          description: "Required when input_mode=\"visium_h5_spatial\". Path to filtered_feature_bc_matrix.h5 (or equivalent). Example:\n  ./work/spatial_input/V1_Human_Lymph_Node/V1_Human_Lymph_Node_filtered_feature_bc_matrix.h5\n"
        visium_spatial_dir:
          type: string
          required: false
          default: ''
          description: "Required when input_mode=\"visium_h5_spatial\". Path to the Visium \"spatial/\" directory containing tissue_positions_list.csv and scalefactors. Example:\n  ./work/spatial_input/V1_Human_Lymph_Node/spatial\n"
        spaceranger_dir:
          type: string
          required: false
          default: ''
          description: 'Required when input_mode="spaceranger_outs". Path to a Space Ranger outputs directory (typically ".../outs").

            '
        h5ad_path:
          type: string
          required: false
          default: ''
          description: 'Required when input_mode="h5ad". Path to an AnnData (.h5ad). Spots with obs["in_tissue"] == 0 (background, as in a CELLxGENE Visium export) are left out before the upload and counted in params.in_tissue_filter; UCD runs on the rest of the object.'
        counts_h5ad_path:
          type: string
          required: false
          default: ''
          description: 'Required when input_mode="generic_counts_coords". Path to a counts-only AnnData (.h5ad). obs_names must be barcodes.

            '
        coords_csv:
          type: string
          required: false
          default: ''
          description: 'Required when input_mode="generic_counts_coords". CSV with columns: barcode,x,y[,in_tissue]. Barcodes must match counts_h5ad_path.obs_names. A spot with in_tissue 0 here, or in the counts h5ad''s own obs["in_tissue"], is background and is left out before the upload (params.in_tissue_filter).'
        key_added:
          type: string
          required: false
          default: ucdbase
          description: 'Stem used by UCD to store results in adata.uns and adata.obsm.

            '
        split:
          type: boolean
          required: false
          default: true
          description: 'Whether to split predictions into primary/lines/cancer categories (plus raw).

            '
        sort:
          type: boolean
          required: false
          default: true
          description: 'Sort columns of prediction matrices by mean prediction.

            '
        propagate:
          type: boolean
          required: false
          default: true
          description: 'Whether to perform belief propagation up the cell-type hierarchy.

            '
        use_raw:
          type: boolean
          required: false
          default: true
          description: 'Read counts from adata.raw when the object carries one, otherwise adata.X
            (ucdeconvolve''s own rule; no stand-in adata.raw is written). Handed to ucd.tl.base beside
            split, sort and propagate. params.counts_source names the matrix UCD read.'
        verbosity:
          type: integer
          required: false
          description: Logging verbosity handed to ucd.tl.base. Leave unset to use the library
            default.
        assign_top_celltypes:
          type: boolean
          required: false
          default: true
          description: 'If true, run ucd.utils.assign_top_celltypes() to attach a per-spot top prediction to adata.obs["<pred_key_added>_<key_added>"] ("_sm<k>" appended when knnsmooth_neighbors is set); summary.pred_celltype_key names that column. A failure stops the run with an error after the predictions are written.

            '
        pred_key_added:
          type: string
          required: false
          default: ucd_pred_celltype
          description: 'Prefix of the adata.obs column that holds the top celltype label. ucdeconvolve appends "_<key_added>" (and "_sm<k>" when smoothing), so the default writes adata.obs["ucd_pred_celltype_ucdbase"]; summary.pred_celltype_key names it.

            '
        assign_category:
          type: string
          required: false
          description: 'Restrict the top-celltype call to one prediction category UCD returned, for
            example raw or primary (primary, lines and cancer exist only with split=true). Leave unset to
            let ucdeconvolve choose (primary when present, else all). A category UCD did not return stops
            the run with an error that lists the ones it did.'
        groupby:
          type: string
          required: false
          default: ''
          description: 'Name of an obs column, so that every spot in a cluster receives one label. A
            name that is not an obs column is refused before the upload. Leave empty to assign a label
            per spot.'
        compute_neighbors:
          type: boolean
          required: false
          default: false
          description: 'Run sc.pp.neighbors on adata.X before the upload -- an expression-space graph,
            not a spatial one. Needed when knnsmooth_neighbors is set and the input carries no neighbour
            graph, because the smoothing reads adata.obsp["distances"]. A failure stops the run.'
        n_neighbors:
          type: integer
          required: false
          default: 10
          description: 'Neighbour count used when compute_neighbors is on. The graph stores n_neighbors - 1 neighbours per spot, so it must exceed knnsmooth_neighbors. Ignored otherwise (a non-default value is then listed in params.ignored).'
        knnsmooth_neighbors:
          type: integer
          required: false
          description: 'Average each spot''s predictions over this many of its nearest neighbours in
            adata.obsp["distances"] (expression space) before the label is called. Leave unset for no
            smoothing. It needs a neighbour graph, so pair it with compute_neighbors unless the input
            already carries one; a missing or too-small graph is refused before the upload.'
        knnsmooth_cycles:
          type: integer
          required: false
          default: 1
          description: 'How many times the neighbour smoothing is repeated. Read only when knnsmooth_neighbors is set and assign_top_celltypes is on; otherwise a non-default value is listed in params.ignored.'
  data_converter:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/data_converter_mcp_server.py
    enabled: true
    description: "Bidirectional data format converter: h5ad\u2194RDS, h5ad\u2194CSV for spatial transcriptomics."
    env:
      DATA_CONVERTER_PYTHON: /opt/conda/envs/novosparc/bin/python
      DATA_CONVERTER_WORKER: /workspace/epic-fermat/agent/tools/data_converter_worker.py
      DATA_CONVERTER_RSCRIPT: ${DATA_CONVERTER_RSCRIPT}
    tools:
    - spatialomicsgym_name: convert_h5ad_to_seurat_rds
      description: 'Convert AnnData h5ad to Seurat RDS. Transfers expression, metadata, spatial coordinates, and dimensionality reductions. The spatial coordinates are x, y from obsm[''spatial'']: a wider obsm[''spatial''] whose extra columns are constant (one plane) is transferred as x, y with the constant reported (params.coordinates_note), and one whose extra axis varies (a stack of sections) is refused rather than flattened. [DATA REQUIREMENTS] Input: h5ad file. Converts to Seurat RDS format. Transfers expression, metadata, spatial coordinates, and reductions.'
      parameters:
        h5ad_path:
          type: str
          required: true
          description: Path to input .h5ad file.
        output_dir:
          description: Directory for output files. The converted .rds is written here unless output_rds gives a full path.
          type: str
          required: true
        output_rds:
          description: Path for output .rds file. If empty, saves as <output_dir>/converted.rds.
          type: str
          required: false
          default: ''
        project:
          description: Seurat project name.
          type: str
          required: false
          default: SeuratProject
        assay:
          description: 'Seurat assay name (default: RNA).'
          type: str
          required: false
          default: RNA
    - spatialomicsgym_name: convert_seurat_rds_to_h5ad
      description: 'Convert Seurat RDS to AnnData h5ad. Extracts expression, metadata, spatial coords, and reductions. [DATA REQUIREMENTS] Input: Seurat RDS file. Converts to h5ad format. Extracts expression,
        metadata, spatial coords, and reductions.'
      parameters:
        rds_path:
          type: str
          required: true
          description: Path to input .rds file.
        output_dir:
          description: Directory for output files. The converted .h5ad is written here unless output_h5ad gives a full path.
          type: str
          required: true
        output_h5ad:
          description: Path for output .h5ad file. If empty, saves as <output_dir>/converted.h5ad.
          type: str
          required: false
          default: ''
    - spatialomicsgym_name: convert_h5ad_to_csv
      description: 'Export h5ad to CSV files (counts, coordinates, metadata, celltypes) for R tools. celltypes.csv holds the obs column named by cell_type_key, else the first of cell_type, CellType, celltype, cluster, leiden, louvain. Every spot is exported; spots with obs[''in_tissue''] == 0 are counted in data.n_spots_off_tissue with a warning, because the flag travels in metadata.csv, not coordinates.csv. coordinates.csv holds x, y from obsm[''spatial'']: a wider obsm[''spatial''] whose extra columns are constant (one plane) is written as x, y with the set-aside constant reported (params.coordinates_note), and one whose extra axis varies (a stack of sections) is refused before anything is written. [DATA REQUIREMENTS] Input: h5ad file. Exports to CSV files (counts, coordinates, metadata, celltypes) for use with R tools or CSV-input tools.'
      parameters:
        h5ad_path:
          description: Path to input .h5ad file.
          type: str
          required: true
        output_dir:
          description: Directory for output CSV files.
          type: str
          required: true
        transpose_counts:
          type: boolean
          required: false
          default: true
          description: If true, output counts as genes x cells (R convention).
        cell_type_key:
          type: str
          required: false
          default: ''
          description: obs column to export as celltypes.csv (e.g. DeconvolutionLabel1); the file's single column is still headed cell_type. An absent column is an error that lists the obs columns. Empty (default) takes the first of cell_type, CellType, celltype, cluster, leiden, louvain that exists. params.cell_type_column_used names the column exported, and data.n_cells_unlabeled counts cells with no label in it.
    - spatialomicsgym_name: convert_csv_to_h5ad
      description: 'Build h5ad from CSV files (counts, optional coordinates/metadata/celltypes). [DATA REQUIREMENTS] Input: CSV files (counts, optional coordinates/metadata/celltypes). Builds h5ad from
        CSV components.'
      parameters:
        counts_csv:
          description: Path to counts CSV. Default assumes genes x cells (R convention); set counts_transposed=false if cells x genes.
          type: str
          required: true
        output_dir:
          description: Directory for output .h5ad file.
          type: str
          required: true
        coords_csv:
          type: str
          required: false
          default: ''
          description: Optional path to a spatial coordinates CSV (cells as rows, cell names in the first column). Read on the spatial_columns names when the file has them; otherwise the axis pair is matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- and the columns actually used are reported in params.spatial_columns_used.
        metadata_csv:
          description: Optional path to cell metadata CSV.
          type: str
          required: false
          default: ''
        celltypes_csv:
          description: Optional path to cell type annotations CSV.
          type: str
          required: false
          default: ''
        counts_transposed:
          description: If true (default), counts CSV is genes x cells. If false, cells x genes.
          type: boolean
          required: false
          default: true
        spatial_columns:
          type: str
          required: false
          default: x,y
          description: Comma-separated names of the two coordinate columns to read from coords_csv (default x,y). If the file does not have them the axis pair is matched by name instead; either way params.spatial_columns_used records what was actually read.
  bsp:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/bsp_mcp_server.py
    enabled: true
    description: BSP (scBSP) spatially variable gene detection using granularity-based statistics.
    env:
      BSP_PYTHON: /opt/conda/envs/bsp/bin/python
      BSP_WORKER: /workspace/epic-fermat/agent/tools/bsp_worker.py
    tools:
    - spatialomicsgym_name: bsp_identify_svg
      description: 'Identify spatially variable genes (SVGs) from a spatial transcriptomics AnnData (.h5ad) using scBSP (single-cell big-small patch): each gene is scored by how the variance of its local means changes between a small and a large neighbourhood patch, and one log-normal null fitted across the tested genes gives its p-value (params.method names what ran; no random numbers are drawn). The expression matrix stays sparse. Spots with obs[''in_tissue''] == 0 are background and are left out before the test (data.n_spots_out_of_tissue_excluded), and genes detected in fewer than 10 spots are not tested (params.n_genes_dropped_sparse); both counts are also stated in the analysis text, and nothing is subsampled. If no gene reaches 10 spots, or scBSP returns NaN for every gene, the run stops with an error instead of inventing p-values. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] and expression in X. Tool runs scBSP granularity-based SVG detection. Required obs: none (an in_tissue 0/1 flag is honoured when present). SC reference: not needed. Image: not needed.'
      parameters:
        st_h5ad:
          type: str
          required: true
          description: Path to spatial transcriptomics .h5ad file.
        output_dir:
          type: str
          required: true
          description: Directory to save BSP output files.
        spatial_key:
          type: str
          required: false
          default: spatial
          description: Key in adata.obsm for spatial coordinates.
        layer:
          type: str
          required: false
          default: ''
          description: 'AnnData layer to use. Empty string uses adata.X. scbsp.granp documents its input as the raw expression matrix, so a matrix with negative or non-finite values (scaled or z-scored data) is refused, naming use_raw_counts when adata.raw holds counts; a non-integer (normalised) matrix is tested as supplied, with a warning.'
        top_k_genes:
          description: 'Maximum number of genes to write to predicted_genes.json and bsp_top_genes.csv (default 200; must be >= 0). When pvalue_cutoff<1.0 is used, the pool is filtered by significance first, then capped at top_k_genes. To match the manual BSP runner''s behavior ("return ALL p<0.05 genes"), pass top_k_genes=10000 (or any value larger than the expected significant-gene count) together with pvalue_cutoff=0.05.'
          type: int
          required: false
          default: 200
        seed:
          description: 'Accepted and ignored: scBSP draws no random numbers (ball-tree neighbourhoods, sparse local means and a fitted log-normal null are deterministic), so the seed cannot change the result. Listed under params.ignored.'
          type: int
          required: false
          default: 0
        pvalue_cutoff:
          type: float
          required: false
          default: 1.0
          description: 'P-value cutoff applied to the gene pool before top_k_genes is taken; must be > 0. The default of 1.0 keeps every gene, so the reported list is purely the top-K ranking and summary.n_significant counts p < 0.05. Set it to 0.05 (or another threshold) to report only genes that are also significant, which usually returns fewer than top_k_genes; summary.n_significant then counts p < pvalue_cutoff. If no gene passes, predicted_genes.json and bsp_top_genes.csv are empty and a warning says so (the full ranking stays in bsp_results.csv); the unfiltered list is never substituted.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Test adata.raw.X instead of X. Use it when X is log-normalised or scaled and the integer counts sit in adata.raw (CELLxGENE exports); refused when the file has no adata.raw or it does not hold counts. A layer named alongside it is not read and is listed in params.ignored. params.expression_source and params.x_matrix_kind say which matrix ran.'
  novosparc:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/novosparc_mcp_server.py
    enabled: true
    description: novoSpaRc spatial gene expression reconstruction via optimal transport.
    env:
      NOVOSPARC_PYTHON: /opt/conda/envs/novosparc/bin/python
      NOVOSPARC_WORKER: /workspace/epic-fermat/agent/tools/novosparc_worker.py
    tools:
    - spatialomicsgym_name: novosparc_reconstruct_spatial
      description: 'Reconstruct spatial gene expression from scRNA-seq data using novoSpaRc (upstream optimal transport: a Gromov-Wasserstein match of the cells'' expression graph to the locations'' physical graph, plus a linear atlas cost when a reference expression is used). params.mode names what ran: atlas-guided (st_h5ad given and alpha > 0; the reference''s expression of the genes it shares with the scRNA-seq HVGs is the atlas, params.n_markers of them), reference geometry (st_h5ad given and alpha = 0; its coordinates only), or de novo grid (no st_h5ad; structure only, alpha not applied). The cost and coupling matrices are dense (cells x cells, locations x locations, cells x locations) and intrinsic to the method; the worker estimates their memory first and fails with the numbers rather than subsample. With st_h5ad, spots with obs[''in_tissue''] == 0 (background glass, as in CELLxGENE Visium exports) are left out first and counted in params.in_tissue_filter. params.converged is read from the solver itself: true only when the Gromov-Wasserstein loop reached its tolerance and the last Sinkhorn solve converged (params.gw_iterations, gw_max_iter, gw_tol, gw_last_change), false when either stopped at its iteration limit, null when it could not be read. Outputs are keyed by identifiers: the coupling CSV has scRNA-seq cell IDs as rows and location IDs (reference barcodes, or grid positions) as columns; the spatial expression CSV and reconstructed h5ad have one row per location ID; a locations x cell-types mass table is added when annotation_key names an obs column. [DATA REQUIREMENTS] Input: scRNA-seq h5ad with expression in X (the cells being mapped). Optional spatial reference h5ad with obsm[''spatial''] for the target locations and, when alpha > 0, as the expression atlas. SC reference: the scRNA-seq data is the input being mapped, not a separate reference.'
      parameters:
        sc_h5ad:
          type: str
          required: true
          description: Path to scRNA-seq AnnData (.h5ad).
        output_dir:
          type: str
          required: true
          description: Directory for output files.
        st_h5ad:
          type: str
          required: false
          default: ''
          description: 'Optional reference spatial .h5ad. Its obsm[spatial_key] coordinates are the target locations and its barcodes label them; with alpha > 0 its expression is also the atlas. Spots with obs[''in_tissue''] == 0 (background) are left out first and counted in params.in_tissue_filter. Gene identifiers are matched directly or through a gene-symbol var column such as CELLxGENE''s feature_name (reported as params.gene_ids_*). Empty: a de novo grid is built.'
        spatial_key:
          description: obsm key for spatial coordinates in the reference h5ad (unused without st_h5ad).
          type: str
          required: false
          default: spatial
        annotation_key:
          description: 'obs column of the scRNA-seq data holding cell-type labels. When present, each location''s share of transported mass per cell type is written to novosparc_celltype_location.csv (unlabelled cells are counted, not made a class). When absent the run still succeeds and the key is listed in params.ignored. An empty string skips the table.'
          type: str
          required: false
          default: cell_type
        num_locations:
          type: int
          required: false
          default: 1000
          description: Number of target locations for the de novo grid (unused with st_h5ad). novoSpaRc builds a full grid, so data.n_locations reports the number built (1000 requested gives 1015).
        alpha:
          description: 'novoSpaRc alpha_linear (0-1): the weight of the reference-atlas (marker expression) cost against the structural Gromov-Wasserstein cost; 0 is structure only, 1 the atlas only. Without st_h5ad there is no atlas, so alpha is not applied (listed in params.ignored) and alpha = 1 is refused.'
          type: float
          required: false
          default: 0.5
        n_hvg:
          description: 'Number of highly variable genes (top variance of the prepared scRNA-seq expression) to use for reconstruction. Counts and linear-scale data (CPM/TPM, proportions, fractional counts) are normalize_total + log1p transformed first; log-transformed or scaled data is used as supplied (params.sc_preprocessing says which).'
          type: int
          required: false
          default: 2000
        seed:
          description: 'Accepted for compatibility; it has no effect. Nothing random runs (the transport starts from the product coupling, the de novo grid is not random, the kNN graphs are exact), so it is listed in params.ignored.'
          type: int
          required: false
          default: 0
        num_neighbors_s:
          type: int
          required: false
          default: 5
          description: 'Number of neighbors in the source (expression) graph.'
        num_neighbors_t:
          type: int
          required: false
          default: 5
          description: 'Number of neighbors in the target (spatial) graph.'
  scdot:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/scdot_mcp_server.py
    enabled: true
    description: 'Cell-spot mapping by entropic optimal transport (Sinkhorn) on a fixed cosine cost, run through scDOT''s OT layer only; scDOT''s NNLS deconvolution and joint training are not run.'
    env:
      SCDOT_PYTHON: /opt/conda/envs/scdot/bin/python
      SCDOT_WORKER: /workspace/epic-fermat/agent/tools/scdot_worker.py
    tools:
    - spatialomicsgym_name: scdot_map_cells_to_spots
      description: 'Map single cells to spatial spots by entropic optimal transport: one Sinkhorn solve on a fixed cosine spot-cell cost through scDOT''s OptimalTransportLayer. This is not full scDOT: its NNLS marker deconvolution and joint training are not run, and the payload''s params.method says so. Produces a spots x cells coupling matrix and per-spot cell-type proportions (coupling @ one-hot labels). The dense n_spots x n_cells plan is intrinsic (about 12 bytes per spot-cell pair); a run that does not fit in the memory the worker can still allocate (page cache counted as reclaimable) is refused with the numbers, never subsampled. Spots whose obs[''in_tissue''] is 0 (background glass) are left out and counted in params.in_tissue_filter. It maps on a subset of both panels you supply: it filters and HVG-selects each modality separately, then keeps only the genes both retain. The payload reports the supplied panels as n_genes (spatial) and n_genes_sc (single-cell), and the shared analysed panel as n_genes_used and n_genes_sc_used, which are equal by construction. [DATA REQUIREMENTS] Input: spatial h5ad with expression in X (coordinates are not read). SC reference: h5ad with cell-type labels in obs[annotation_key].'
      parameters:
        sc_h5ad:
          type: str
          required: true
          description: Path to scRNA-seq AnnData (.h5ad) with cell type annotations.
        st_h5ad:
          type: str
          required: true
          description: Path to spatial transcriptomics AnnData (.h5ad).
        output_dir:
          description: Directory where the outputs will be saved.
          type: str
          required: true
        annotation_key:
          type: str
          required: false
          default: cell_type
          description: obs column with cell type labels in scRNA-seq data.
        spatial_key:
          description: 'Accepted for compatibility only: the mapping compares expression profiles and never reads coordinates, so this has no effect and every run lists it under params.ignored.'
          type: str
          required: false
          default: spatial
        n_hvg:
          description: 'Number of highly variable genes to select on the single-cell reference. The analysed panel is the intersection of that selection with the spatial slide''s surviving genes, so it is normally smaller than n_hvg -- see n_genes_used in the payload.'
          type: int
          required: false
          default: 2000
        device:
          description: 'Compute device: "cpu", "gpu"/"cuda", "cuda:N" for a particular card, or "auto" to follow the hardware. A GPU request degrades to the CPU when no CUDA device is present; params.device is the device the solve actually ran on.'
          type: str
          required: false
          default: cpu
        seed:
          description: Random seed for reproducibility.
          type: int
          required: false
          default: 0
        ot_gamma:
          type: float
          required: false
          default: 1.0
          description: 'Regularization parameter for entropy-regularized OT (higher = sparser).'
        ot_maxiters:
          type: int
          required: false
          default: 1000
          description: 'Maximum iterations for the Sinkhorn algorithm.'
        ot_eps:
          type: float
          required: false
          default: 1.0e-06
          description: 'Convergence tolerance for Sinkhorn.'
        hvg_flavor:
          type: str
          required: false
          default: seurat_v3
          description: 'scanpy flavour for the reference HVG selection: seurat_v3 (ranks raw counts; needs scikit-misc), seurat or cell_ranger (rank the log-normalised matrix). The chosen flavour is the only one that runs; a missing dependency stops the run naming the package.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Drop reference cells whose label is NaN/empty instead of refusing them; the payload reports the count in params.n_cells_sc_unlabeled_dropped and data.n_cells_sc_used.'
  spatrio:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spatrio_mcp_server.py
    enabled: true
    env:
      SPATRIO_PYTHON: /opt/conda/envs/spatrio/bin/python
      SPATRIO_WORKER: /workspace/epic-fermat/agent/tools/spatrio_worker.py
    description: SpaTrio maps single cells onto the spots of a spatial slice via fused Gromov-Wasserstein optimal transport.
    tools:
    - spatialomicsgym_name: spatrio_align_multiomics
      description: 'Map single cells onto the spots of one spatial slice with SpaTrio (fused Gromov-Wasserstein optimal transport). Writes spatrio_aligned.csv, the transport plan in long format (one spot,cell,value
        row per spot-cell pair), under output_files alignment_csv (aligned_h5ad is kept as an alias of the same CSV); summary.coupling_shape is [n_spots, n_cells]. It is a mapping table: no coordinates are
        written and it is not a serial-section aligner. [DATA REQUIREMENTS] Input: spatial h5ad (rna_h5ad) with obsm[''spatial''] and raw integer counts in X (or in layer), plus a single-cell h5ad (other_h5ad)
        whose X holds raw RNA counts under the same gene names. The expression cost uses only the genes both share (a pair sharing none is refused), and SpaTrio normalises them itself, so normalised or log
        data is refused rather than normalised twice. The second modality (ATAC LSI, ADT PCA) goes in other_h5ad.obsm[''reduction'']; without it the cell graph is built from a PCA of the RNA counts and the
        run says so. Types for the type-aware distances come only from annotation_key; an input without that column runs untyped and the run reports it. SC reference: required, supplied as other_h5ad
        (single-cell RNA counts).'
      parameters:
        rna_h5ad:
          type: str
          required: true
          description: 'Path to the spatial RNA AnnData (.h5ad) with obsm[spatial_key] coordinates and raw integer counts in X (or in layer). Spots with obs[''in_tissue''] == 0 (background glass, as CELLxGENE Visium exports carry) are left out of the plan and counted in params.in_tissue_filter; data.n_spots_rna_input is the count supplied.'
        other_h5ad:
          type: str
          required: true
          description: 'Path to the single-cell (multi-omics) AnnData (.h5ad) whose cells are mapped onto the spots: raw RNA counts in X (or in layer) sharing gene names with rna_h5ad, optionally obsm[''reduction'']
            holding an embedding of the second modality.'
        output_dir:
          description: Directory where SpaTrio outputs will be saved.
          type: str
          required: true
        spatial_key:
          description: obsm key for spatial coordinates.
          type: str
          required: false
          default: spatial
        alpha:
          description: SpaTrio's fused Gromov-Wasserstein trade-off between the graph term and the expression term, 0..1.
          type: float
          required: false
          default: 0.1
        seed:
          description: Random seed (numpy, and the PCA computed as obsm['reduction'] when none is supplied).
          type: int
          required: false
          default: 0
        annotation_key:
          type: str
          required: false
          default: 'cell_type'
          description: 'obs column giving spots/cells a type for SpaTrio''s type-aware graph distances, read from whichever input has it. An input without it runs untyped, reported in params.type_source_rna
            / type_source_other and a warning; no other column (not obs[''type''], not CellType) is read in its place. Empty string = untyped by request.'
        n_hvg:
          type: int
          required: false
          default: 2000
          description: 'Accepted for compatibility and not used: SpaTrio''s expression cost uses every gene the two inputs share. Listed in params.ignored.'
        numItermax:
          type: int
          required: false
          default: 200
          description: 'Maximum iterations for the OT solver.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'An observation whose annotation_key label is NaN/empty is not a type. False: such an input is refused with the count. True: those spots/cells are left out and data.n_unlabeled_dropped_rna
            / n_unlabeled_dropped_other say how many.'
        layer:
          type: str
          required: false
          default: ''
          description: 'Layer holding raw counts, read instead of X in each input that has it. Empty reads X. Either way the matrix must be raw integer counts: SpaTrio normalises it itself, so normalised or
            log data is refused.'
  ncem:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/ncem_mcp_server.py
    enabled: true
    description: 'NCEM-style neighbourhood model for cell communication from spatial transcriptomics: an sklearn Ridge regression of gene expression on neighbour cell-type composition (the ncem package is not run).'
    env:
      NCEM_PYTHON: /opt/conda/envs/ncem/bin/python
      NCEM_WORKER: /workspace/epic-fermat/agent/tools/ncem_worker.py
    tools:
    - spatialomicsgym_name: ncem_cell_communication
      description: 'Estimate how neighbouring cell types shift gene expression with an NCEM-style linear model. This is NOT the ncem package: for every spot the fraction of each cell type among its n_neighbors nearest spatial neighbours is computed, and an sklearn Ridge(alpha=1.0) regression of the log-normalised expression of the top n_hvg highly variable genes on [one-hot own cell type | neighbourhood composition] is solved in closed form. The neighbourhood coefficients form a gene x cell-type communication matrix (ncem_communication_matrix.csv); effects are relative to the average neighbour type. params.method names this model; max_epochs, learning_rate and seed have no effect and are listed in params.ignored. Spots with obs[''in_tissue''] == 0 are left out and counted (params.in_tissue_filter). The dense spots x HVG targets are sized first against the available memory (MemAvailable, or the room under a container''s cgroup limit) and refused with the numbers if they cannot fit. Two-dimensional by design: the neighbourhood is built on two columns, so dims=3 is refused, and a file holding two or more sections is refused unless section_key names them (a 2D run would overlay them). With section_key the model is fitted per section: the four files per section in output_dir/section_<label>/ (the gene x cell-type matrix is per section only), and one long ncem_communication_strength.csv at the top level with a leading section column. params.mode is "per-section-2d" (or "2d" for one plane), params.sections lists the sections and params.frame the coordinates read; the same is written to sog_run_provenance.json. [DATA REQUIREMENTS] Input: h5ad with raw counts in X (an X with negative or NaN values is refused; use_raw_counts reads adata.raw instead), obsm[''spatial''] required and a cell-type column obs[annotation_key] (default ''cell_type'') with at least two types; a spot with no label stops the run unless drop_unlabeled is true. SC reference: not needed.'
      parameters:
        st_h5ad:
          type: str
          required: true
          description: 'Path to spatial transcriptomics .h5ad with raw counts in X, coordinates in obsm[spatial_key] and cell type annotations in obs[annotation_key]. An X with negative or NaN values (scaled data) is refused before anything is normalised, naming use_raw_counts when adata.raw holds counts; a non-integer X (log-normalised) runs with a warning.'
        output_dir:
          description: 'Directory where the outputs will be saved.'
          type: str
          required: true
        spatial_key:
          description: 'obsm key for spatial coordinates (two columns).'
          type: str
          required: false
          default: spatial
        annotation_key:
          description: 'obs column containing cell type annotations; at least two cell types are needed.'
          type: str
          required: false
          default: cell_type
        n_neighbors:
          description: 'Number of nearest spatial neighbours (the spot itself excluded) whose cell types form each spot''s neighbourhood composition.'
          type: int
          required: false
          default: 10
        n_hvg:
          description: 'Number of highly variable genes (Seurat flavour, on log-normalised data) used as regression targets.'
          type: int
          required: false
          default: 2000
        model_type:
          description: 'Only ''linear'' is implemented (the neighbourhood Ridge model).'
          type: str
          required: false
          default: linear
        seed:
          description: 'Accepted and ignored: nothing in the method is random (listed in params.ignored).'
          type: int
          required: false
          default: 0
        max_epochs:
          type: int
          required: false
          default: 50
          description: 'Accepted and ignored: the Ridge fit is closed-form, nothing is trained (listed in params.ignored).'
        learning_rate:
          type: float
          required: false
          default: 0.001
          description: 'Accepted and ignored: the Ridge fit is closed-form, nothing is trained (listed in params.ignored).'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'A spot with no label (NaN/empty) in obs[annotation_key] stops the run with the count by default. Set true to leave those spots out instead; the number dropped is reported in data.n_cells_dropped_unlabeled.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Normalise adata.raw.X instead of X (default false reads X). Use it for a CELLxGENE-style h5ad whose X is processed and whose counts are in adata.raw; refused when there is no adata.raw or it does not hold counts. params.expression_source says which matrix was used.'
        coords_key:
          type: str
          required: false
          default: spatial
          description: "The obsm key holding the coordinates (default 'spatial'; an aligned 3D frame such as 'spatial_3d_aligned')."
        dims:
          type: int
          required: false
          default: 2
          description: '2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z. For NCEM: dims=3 is refused ("NCEM builds its neighbourhood in two dimensions; run per section with `dims=2, section_key=<column>`.").'
        section_key:
          type: str
          required: false
          default: null
          description: 'The obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run.'
  deeplinc:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/deeplinc_mcp_server.py
    enabled: true
    description: 'Cell-type neighbourhood enrichment on a spatial k-NN graph with a label-permutation test, served under the DeepLinc name (the DeepLinc VGAE is not run).'
    env:
      DEEPLINC_PYTHON: /opt/conda/envs/deeplinc/bin/python
      DEEPLINC_WORKER: /workspace/epic-fermat/agent/tools/deeplinc_worker.py
    tools:
    - spatialomicsgym_name: deeplinc_cell_interactions
      description: 'Score which cell types sit next to which on a spatial k-NN graph (k = n_neighbors, symmetrised). Score = observed/expected undirected edges between two cell types, where expected is for random placement of the same labels on the same graph, so 1.0 = random, above 1.0 enriched, below 1.0 avoided. Significance is a one-sided 100-permutation label test, p = (1 + #permuted >= observed)/101, and a pair is reported when p < 0.05 and score > 1.0. The tool keeps the DeepLinc name, but the DeepLinc VGAE is NOT run (params.method = knn_edge_type_enrichment_label_permutation, params.deeplinc_model_run = false) and gene expression is not used. Outputs deeplinc_interaction_scores.csv, deeplinc_pvalues.csv, deeplinc_significant_interactions.csv (header even when empty), deeplinc_adjacency_edges.csv (cell_a, cell_b) and, up to 20,000 cells, a dense deeplinc_adjacency.csv. Two-dimensional by design: the k-NN graph is built on two columns, so dims=3 is refused, and a file holding two or more sections is refused unless section_key names them (a 2D run would overlay them). With section_key the run is per section: each section''s files in output_dir/section_<label>/, and one long deeplinc_significant_interactions.csv at the top level with a leading section column. params.mode is "per-section-2d" (or "2d" for one plane), params.sections lists the sections and params.frame the coordinates read; the same is written to sog_run_provenance.json. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] and a cell-type column in obs (annotation_key); the expression matrix is not read. Spots with obs[''in_tissue''] == 0 (background glass, labelled ''unknown'' in CELLxGENE exports) are left out before the graph is built and counted in data.n_spots_off_tissue_dropped. A cell with a missing label stops the run unless drop_unlabeled is true. Required obs: cell-type column (annotation_key). SC reference: not needed. Image: not needed.'
      parameters:
        st_h5ad:
          type: str
          required: true
          description: 'Path to spatial .h5ad with cell type annotations. Spots with obs[''in_tissue''] == 0 are left out and counted in data.n_spots_off_tissue_dropped.'
        output_dir:
          description: Directory where DeepLinc outputs will be saved.
          type: str
          required: true
        annotation_key:
          description: obs column containing cell type annotations.
          type: str
          required: false
          default: cell_type
        spatial_key:
          description: obsm key for spatial coordinates.
          type: str
          required: false
          default: spatial
        n_neighbors:
          description: Number of spatial neighbors for building the interaction graph.
          type: int
          required: false
          default: 10
        n_hvg:
          description: 'Accepted for compatibility and ignored: no expression is read, so there are no genes to select. Listed in params.ignored.'
          type: int
          required: false
          default: 2000
        seed:
          description: Random seed for the label permutations.
          type: int
          required: false
          default: 0
        drop_unlabeled:
          description: If true, leave out cells whose label is missing (NaN/empty) and report how many in data.n_cells_dropped_unlabeled. If false (default), a missing label stops the run with the count; it is never scored as a cell type.
          type: bool
          required: false
          default: false
        coords_key:
          type: str
          required: false
          default: spatial
          description: "The obsm key holding the coordinates (default 'spatial'; an aligned 3D frame such as 'spatial_3d_aligned')."
        dims:
          type: int
          required: false
          default: 2
          description: '2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z. For DeepLinc: dims=3 is refused ("DeepLinc builds its neighbourhood in two dimensions; run per section with `dims=2, section_key=<column>`.").'
        section_key:
          type: str
          required: false
          default: null
          description: 'The obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run.'
    - spatialomicsgym_name: deeplinc_cell_interactions_csv
      description: 'Same k-NN cell-type edge enrichment as deeplinc_cell_interactions, read from three CSV files (the DeepLinc VGAE is NOT run and expression values are not used). Only cells present in all three files are analysed, and data.n_cells_in_counts, n_cells_in_coords and n_cells_in_cell_types say what each file held. Two-dimensional by design: dims=3 is refused ("DeepLinc builds its neighbourhood in two dimensions; run per section with `dims=2, section_key=<column>`."); a coord_csv holding a z or section-like column (section, slice_id, ...) with two or more values is refused unless section_key names it, and the run is then per section as in deeplinc_cell_interactions. [DATA REQUIREMENTS] Input: 3 CSV files - counts_csv, coord_csv, cell_type_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first (its default genes x cells counts.csv is recognised, and its cell_type_key picks the label column), or call deeplinc_cell_interactions instead, which reads h5ad natively. SC reference: not needed. Image: not needed.'
      parameters:
        counts_csv:
          type: str
          required: true
          description: 'Path to a counts CSV with an index column. Only its cell IDs and gene count are read; the values are not used. Cells x genes is the documented layout; a genes x cells table (the convert_h5ad_to_csv default) is recognised by which axis carries the cell IDs of the other two files, and params.counts_orientation says which was found.'
        coord_csv:
          type: str
          required: true
          description: 'Path to coordinates CSV (cells as rows, cell names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is. The headerless tissue_positions_list.csv that Space Ranger before 2.0 writes is recognised from its first line and read with 10x''s column names (params.coord_header says how the file was read); a headerless file of another shape is refused. When the file has an in_tissue column (tissue_positions*.csv, or convert_h5ad_to_csv''s metadata.csv), spots with in_tissue == 0 are left out and counted in data.n_spots_off_tissue_dropped.'
        cell_type_csv:
          type: str
          required: true
          description: Path to cell type CSV (cells as rows, cell names in the first column, labels in the next).
        output_dir:
          description: Directory where DeepLinc outputs will be saved.
          type: str
          required: true
        n_neighbors:
          description: Number of spatial neighbors for building the interaction graph.
          type: int
          required: false
          default: 10
        seed:
          description: Random seed for the label permutations.
          type: int
          required: false
          default: 0
        drop_unlabeled:
          description: If true, leave out cells whose label is missing (NaN/empty) and report how many in data.n_cells_dropped_unlabeled. If false (default), a missing label stops the run with the count; it is never scored as a cell type.
          type: bool
          required: false
          default: false
        dims:
          type: int
          required: false
          default: 2
          description: '2; dims=3 is refused ("DeepLinc builds its neighbourhood in two dimensions; run per section with `dims=2, section_key=<column>`.").'
        section_key:
          type: str
          required: false
          default: null
          description: "A column of coord_csv naming each cell's section; the run is then per section, as in deeplinc_cell_interactions."
  spark_spatial:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spark_mcp_server.py
    enabled: true
    description: SPARK spatially variable gene detection via kernel-based statistical tests.
    env:
      SPARK_PYTHON: /opt/conda/envs/spark_spatial/bin/Rscript
      SPARK_WORKER: /workspace/epic-fermat/agent/tools/spark_worker.R
    tools:
    - spatialomicsgym_name: spark_svg_detection
      description: 'Identify spatially variable genes (SVGs) using SPARK kernel-based tests (Gaussian + periodic kernels). Input is CSV format (genes x spots counts matrix + coordinates). [DATA REQUIREMENTS] Input: CSV format (genes x spots matrix of raw integer counts), NOT h5ad. SPARK fits a Poisson count model, so a missing, negative or non-integer value (normalised or scaled data) stops the run with the count and an example; nothing is rounded. Requires separate counts CSV and coordinates CSV. Use convert_h5ad_to_csv to prepare from h5ad (it writes adata.X, so X must hold the raw counts). When the coordinates CSV carries Space Ranger''s in_tissue flag, spots flagged 0 are left out and reported in params.in_tissue_filter. SC reference: not needed. Image: not needed.'
      parameters:
        counts_csv:
          type: str
          required: true
          description: 'Path to counts CSV (genes x spots, gene names as row index) of raw integer counts. A spots x genes table is recognised when none of its column names matches a coordinate row; it is then transposed, and params.counts_orientation plus a warning say so. A missing, negative or non-integer value stops the run with the count and an example (SPARK fits a Poisson model); nothing is rounded.'
        coords_csv:
          type: str
          required: true
          description: 'Path to coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is. The headerless tissue_positions_list.csv that Space Ranger 1 writes is recognised from its first line and read with SpotClean''s column names, so no spot is lost and the pixel coordinates are used. When the file carries Space Ranger''s in_tissue flag (tissue_positions.csv, or the second column of the headerless tissue_positions_list.csv), matched spots flagged 0 are background and are left out, reported in params.in_tissue_filter, data.n_spots_off_tissue_dropped, a warning and the analysis.'
        output_dir:
          description: Directory for SPARK output files (results CSV, significant SVGs).
          type: str
          required: true
        pval_cutoff:
          description: 'Cutoff applied to SPARK''s adjusted_pvalue (its Benjamini-Yekutieli correction of the combined kernel p-value) for identifying significant SVGs; params.pvalue_column names the column used.'
          type: float
          required: false
          default: 0.05
        seed:
          description: 'Accepted but has no effect: SPARK''s variance-component fit and kernel tests use no random-number generator. Listed under params.ignored.'
          type: int
          required: false
          default: 0
        n_top:
          type: int
          required: false
          default: 100
          description: 'Number of top SVGs to report in the summary file.'
        percentage:
          type: float
          required: false
          default: 0.1
          description: 'Minimum fraction of spots (0-1; 0.1 = 10%) in which a gene must be non-zero to be tested. SPARK drops genes below it; data.n_genes_used and the analysis report how many were tested.'
        min_total_counts:
          type: int
          required: false
          default: 10
          description: 'Minimum total count per SPOT, not per gene: after the percentage gene filter SPARK drops every spot whose total count over the retained genes is at or below this value. Dropped spots are reported in data.n_spots_used, a warning and the analysis.'
  spacexr:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spacexr_mcp_server.py
    enabled: true
    description: spacexr RCTD cell type deconvolution for spatial transcriptomics.
    env:
      SPACEXR_PYTHON: /opt/conda/envs/spacexr/bin/Rscript
      SPACEXR_WORKER: /workspace/epic-fermat/agent/tools/spacexr_worker.R
    tools:
    - spatialomicsgym_name: spacexr_rctd_deconvolution
      description: 'Run RCTD (Robust Cell Type Decomposition) from spacexr to deconvolve spatial transcriptomics spots into cell type proportions using a scRNA-seq reference. [DATA REQUIREMENTS] Input:
        4 separate CSV files - spatial counts CSV, spatial coords CSV, SC reference counts CSV, SC cell-types CSV. Raw counts required. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference
        required.'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: Path to spatial counts CSV (genes x spots).
        spatial_coords_csv:
          type: str
          required: true
          description: 'Path to spatial coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is, and so can the headerless tissue_positions_list.csv of Space Ranger 1 (a first line that is a spot is read as one). When the file has an in_tissue column, counts spots it marks 0 (background) are left out and counted in data.n_spots_off_tissue_dropped and params.in_tissue_filter.'
        ref_counts_csv:
          type: str
          required: true
          description: Path to scRNA-seq reference counts CSV (genes x cells).
        ref_celltypes_csv:
          type: str
          required: true
          description: 'Path to reference cell type annotation CSV (cell barcode as index). A one-label-column file is read as it is; a wider metadata table must have a column named celltype, cell_type, cell.type, annotation, annot, cluster or label (any case), and the column used is reported in data.celltype_column. Cells whose label is NA, empty, ''nan'', ''none'', ''na'' or ''<NA>'' (any case) are left out and counted in data.n_ref_cells_unlabeled. RCTD rejects ''/'' in a cell type name, so ''/'' and whitespace become ''_'' in every output; summary.renamed_cell_types maps the new names back, and two labels that would become the same name stop the run.'
        output_dir:
          description: 'Directory for RCTD output files. The worker writes: - proportions.csv (canonical prediction; rows=spots, cols=cell types, per-row normalized). In every mode this is RCTD''s unconstrained full-model fit (results$weights in doublet mode, the same fit full mode returns), so any number of cell types can be non-zero in a spot; data.proportions_source says so. - spacexr_weights.csv (legacy schema): full mode, the proportions plus a spot column; doublet mode, spot / first_type / second_type / spot_class; multi mode, spot / cell_types / n_types / confident_types. - spacexr_rctd_doublet_weights.csv (doublet mode only): the doublet call as a spots x cell types matrix with at most 2 non-zero types per spot (a singlet is 1 for its first_type; a reject spot is NA). - spacexr_rctd_multi_weights.csv (multi mode only): the multi-type decomposition, at most 4 cell types per spot. - spacexr_rctd.rds (full RCTD object for re-analysis; written as soon as the fit ends).'
          type: str
          required: true
        mode:
          type: str
          required: false
          default: doublet
          description: 'RCTD mode: ''doublet'' (classifies each spot as singlet / doublet / reject and fits at most 2 types per spot, written to spacexr_rctd_doublet_weights.csv), ''full'' (all types weighted) or ''multi'' (up to 4 types per spot, written to spacexr_rctd_multi_weights.csv). Any other value is refused before R starts. proportions.csv is the unconstrained full-model fit in all three modes.'
        max_cores:
          description: Number of parallel R workers for RCTD. 0 (default) auto-scales to the box (capped for memory). Each worker's BLAS is pinned to a single thread so the workers don't oversubscribe the cores (which otherwise thrashes and can time RCTD out on a many-core server).
          type: int
          required: false
          default: 0
        seed:
          description: 'Random seed for reproducibility (also picks the cells an n_max_cells cap keeps).'
          type: int
          required: false
          default: 0
        gene_cutoff:
          type: float
          required: false
          default: 0.000125
          description: 'Minimum normalized expression for gene filtering.'
        fc_cutoff:
          type: float
          required: false
          default: 0.5
          description: 'Minimum log-fold-change for gene filtering.'
        gene_cutoff_reg:
          type: float
          required: false
          default: 0.0002
          description: 'Minimum normalized expression for regression gene filtering. Must be >= gene_cutoff.'
        fc_cutoff_reg:
          type: float
          required: false
          default: 0.75
          description: 'Minimum log-fold-change for regression gene filtering. Must be >= fc_cutoff. RCTD restricts
            the spatial matrix to the genes the (gene_cutoff, fc_cutoff) pair selects, then indexes that same matrix
            with the genes the _reg pair selects; a lower _reg threshold selects genes that are no longer there and
            the run dies with ''subscript out of bounds''. The defaults satisfy this and are what every recorded
            Visium and Slide-seqV2 run used successfully. To loosen the regression filter, lower gene_cutoff/fc_cutoff
            by as much.'
        UMI_min:
          type: int
          required: false
          default: 100
          description: 'Minimum total UMI count per spot (spots below are excluded).'
        UMI_min_sigma:
          type: int
          required: false
          default: 100
          description: 'Minimum UMI for sigma estimation (RCTD''s choose_sigma_c). For low-UMI platforms like
            Slide-seqV2, set to 100 (default for RCTD is 300, which filters all beads on Slide-seq and causes "N_fit
            of 0" failure).'
        n_max_cells:
          type: int
          required: false
          default: 0
          description: 'Opt-in cap on reference cells per cell type. 0 (default) uses every reference cell. A positive value (at least 25, RCTD''s minimum per type) is passed to RCTD''s Reference(), which keeps that many cells drawn at random from each larger type; the number left out is reported in data.n_ref_cells_downsampled. RCTD''s own default was a silent 10,000.'
        ref_UMI_min:
          type: int
          required: false
          default: 100
          description: 'Minimum UMI count, over the genes the reference shares with the spatial data, for a reference cell to be used (RCTD Reference()''s min_UMI; default 100, its own default). Cells below it are left out and counted in data.n_ref_cells_below_umi. After this filter a cell type with fewer than 25 cells is dropped, named in summary.dropped_cell_types, and absent from every output; summary.n_ref_cells is the number of cells RCTD actually used.'
  mistyr:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/mistyr_mcp_server.py
    enabled: true
    description: mistyR multi-view intercellular spatial modeling framework.
    env:
      MISTYR_PYTHON: /opt/conda/envs/mistyr/bin/Rscript
      MISTYR_WORKER: /workspace/epic-fermat/agent/tools/mistyr_worker.R
    tools:
    - spatialomicsgym_name: mistyr_spatial_modeling
      description: 'Run MISTy (Multi-view Intercellular SpaTial modeling framework) to profile intra- and inter-cellular spatial relationships. Uses random forest models across multiple spatial views, one model per feature. Features that are constant across the spots analysed (common in a whole-transcriptome convert_h5ad_to_csv export) are left out before any view is built and counted in data.n_features_dropped_zero_variance; a non-numeric column or a missing value is refused by name. Run time grows with spots squared times features (the paraview) plus one random forest per feature. The cost is estimated before the run (params.cost_estimate) and a run over max_estimated_s (default 1800 s, SOG_MISTY_MAX_SECONDS) is refused with the numbers. Two-dimensional by design: the paraview is built in two dimensions, so dims=3 is refused, and a coordinates CSV holding two or more sections (a section-like column such as section, or a z column) is refused unless section_key names the column. With section_key the run is per section: one MISTy run per section in output_dir/section_<label>/, and mistyr_importances.csv, mistyr_top_interactions.csv, mistyr_performance.csv and mistyr_contributions.csv at the top level with a leading section column. params.mode is "per-section-2d" (or "2d" for one plane), params.sections lists the sections and params.frame the coordinates read; the same is written to sog_run_provenance.json. [DATA REQUIREMENTS] Input: 2 CSV files - expression_csv, coords_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: not needed. Image: not needed.'
      parameters:
        expression_csv:
          type: str
          required: true
          description: 'Path to expression matrix CSV (spots x genes; the genes x spots table convert_h5ad_to_csv writes is transposed when no row name matches a spot). Features constant across the spots analysed are left out and counted (data.n_features_dropped_zero_variance; params.zero_variance_features_dropped lists up to 20 names).'
        coords_csv:
          type: str
          required: true
          description: 'Path to spatial coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is. The headerless tissue_positions_list.csv that Space Ranger before 2.0 writes is recognised from its first line and read with 10x''s column names (params.coords_header; the columns used are params.coord_columns_used). When the file has an in_tissue column, spots with in_tissue == 0 are left out and counted in data.n_spots_off_tissue_dropped.'
        output_dir:
          description: Directory for mistyR output files.
          type: str
          required: true
        l:
          type: float
          required: false
          default: null
          description: 'Bandwidth of the paraview''s Gaussian kernel exp(-d^2/l^2), in the units of the coordinates (on Visium, full-resolution pixels). Unset (default) means 10x the median distance from a spot to its nearest other spot (mistyR''s own example uses l = 10 on a unit-spacing grid); the value used is reported as params.l_param, with params.l_auto and data.spot_spacing. An explicit l so small that even the closest pair of spots gets weight 0 is refused; one below the spot spacing runs with a warning.'
        bypass_intra:
          description: If True, skip the intraview and only model inter-cellular (paraview) interactions.
          type: boolean
          required: false
          default: false
        seed:
          description: 'Random seed passed to mistyR::run_misty, which draws the cross-validation folds and seeds ranger with it. 0 (the default) runs as mistyR''s own default seed 42, because ranger reads a seed of 0 as "no seed" and would give different forests on every run; the seed used is reported as params.seed_used beside the one asked for (params.seed). It must fit R''s 32-bit integer range; a larger value is refused.'
          type: int
          required: false
          default: 0
        n_top:
          type: int
          required: false
          default: 20
          description: 'Number of top interactions to report in the summary file (an integer >= 0; a negative value is refused).'
        coords_key:
          type: str
          required: false
          default: spatial
          description: "The obsm key holding the coordinates (default 'spatial'; an aligned 3D frame such as 'spatial_3d_aligned'). For MISTy: the coordinates come from coords_csv, so coords_key stays 'spatial' (any other key is refused -- write that frame's two columns into coords_csv instead)."
        dims:
          type: int
          required: false
          default: 2
          description: '2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z. For MISTy: dims=3 is refused.'
        section_key:
          type: str
          required: false
          default: null
          description: 'The obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run. For MISTy: section_key names a column of coords_csv.'
        max_estimated_s:
          type: float
          required: false
          default: null
          description: 'The wall-time budget in seconds the run''s estimate must fit. MISTy''s paraview weighs every pair of spots in a section, so a run costs about spots^2 x features per section; the cost is estimated before any worker runs and reported as params.cost_estimate, and a run estimated over the budget is refused with every number (one 30,532-spot section x 6 features is about 25 min). Unset: the host''s SOG_MISTY_MAX_SECONDS, else 1800 s. 0 or less means no budget.'
        l_um:
          type: float
          required: false
          default: null
          description: "Refused. A bandwidth in micrometres needs the coordinates' units, and coords_csv declares none, so any l_um is refused (\"l_um needs the coordinates' units; a CSV carries none — pass `l` in the CSV's own units.\"). Give the bandwidth as l."
  spvc:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spvc_mcp_server.py
    enabled: true
    description: spVC spatially variable gene detection via quasi-Poisson GAMs with spatially varying coefficients.
    env:
      SPVC_PYTHON: /opt/conda/envs/spvc/bin/Rscript
      SPVC_WORKER: /workspace/epic-fermat/agent/tools/spvc_worker.R
    tools:
    - spatialomicsgym_name: spvc_svg_detection
      description: 'Identify spatially variable genes using spVC''s quasi-Poisson generalized additive model with spatially varying coefficients (test.spVC reduced model, a spatially varying intercept with no covariates). Every spot is analysed unless max_spots is set, except spots that coords_csv marks in_tissue == 0, which are background outside the tissue and are left out first (data.n_spots_off_tissue_dropped of data.n_spots_supplied, params.in_tissue_filter); the payload counts the spots and genes test.spVC''s own filters drop (data.n_spots_fitted, data.n_genes_fitted) and the genes tied at its 2e-17 p-value floor (data.n_genes_at_pvalue_floor). [DATA REQUIREMENTS] Input: 2 CSV files - counts_csv, coords_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: not needed. Image: not needed.'
      parameters:
        counts_csv:
          type: str
          required: true
          description: 'Path to a counts CSV of raw counts (genes x spots, gene names in the first column). A negative value (scaled or centred expression) is refused before spVC runs, with the count; non-integer values (normalised data) are fitted as supplied, counted in data.n_values_non_integer and warned about. A CELLxGENE-style h5ad keeps its raw counts in adata.raw, so export those.'
        coords_csv:
          type: str
          required: true
          description: 'Path to coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is, and so can the headerless tissue_positions_list.csv of Space Ranger before 2.0 (params.coordinates_header says how the file was read). When the file has an in_tissue column, spots marked 0 are background and are left out (data.n_spots_off_tissue_dropped, params.in_tissue_filter, a warning).'
        output_dir:
          description: Directory for spVC output files (incl. predicted_genes.json).
          type: str
          required: true
        pval_cutoff:
          description: 'Benjamini-Hochberg adjusted p-value cutoff used only for spvc_significant_svgs.csv. Not applied to predicted_genes.json (which uses top-N ranking, matching the manual benchmark runner). A value that is not a finite number is refused.'
          type: float
          required: false
          default: 0.05
        seed:
          description: 'Random seed for reproducibility. It seeds the random spot draw when max_spots is set; spVC''s own fit draws no random numbers.'
          type: int
          required: false
          default: 0
        n_top:
          type: int
          required: false
          default: 100
          description: 'Number of spatially variable genes, sorted ascending by p-value, written to predicted_genes.json; ties (such as genes at spVC''s 2e-17 p-value floor) are ranked by count variance, highest first. With the default max_genes of 1000 this reports the top 10% of the tested pool. Must be a whole number of 0 or more; anything else is refused.'
        max_genes:
          type: int
          required: false
          default: 1000
          description: 'Cap on the highly-variable-gene pool spVC is run on, selected by variance. Lower values (200, say) speed up the BPST mesh construction but leave far fewer candidate SVGs. Genes cut by this cap are absent from the output tables, not ranked last in them. Must be a whole number of at least 1; anything else is refused.'
        max_spots:
          type: int
          required: false
          description: 'Optional cap on the number of spots analysed. Omit it (the default) and every spot is analysed. When set, a slide with more spots than this has a random subset of this size drawn (seeded by seed), the rest of the slide is not tested, and the payload''s warnings say how much was left out. Must be a whole number of at least 1. spVC fits a bivariate spline over the spot set, so runtime grows with the number of spots.'
  redeconve:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/redeconve_mcp_server.py
    enabled: true
    description: Redeconve spatial deconvolution at single-cell resolution via quadratic programming.
    env:
      REDECONVE_PYTHON: /opt/conda/envs/redeconve/bin/Rscript
      REDECONVE_WORKER: /workspace/epic-fermat/agent/tools/redeconve_worker.R
    tools:
    - spatialomicsgym_name: redeconve_deconvolution
      description: 'Deconvolve spatial transcriptomics spots into cell type proportions with Redeconve: per spot, a non-negative abundance for every reference cell by quadratic programming (deconvoluting(), default hyperparameter), summed per cell type into proportions. Every reference cell and every spot is used; the dense cells x cells Hessian makes memory grow with the square of the number of reference cells. Genes: every gene the reference and the slide share by default (n_top_genes=0); a positive n_top_genes keeps that many shared genes with the highest log1p(CPM) variance across the reference cells, and data.n_genes_used and params.gene_selection report what ran. seed has no effect (listed in params.ignored). Reference cells with a missing label are refused unless drop_unlabeled is true. A spot whose abundances all come back zero is counted in data.n_spots_without_estimate. [DATA REQUIREMENTS] Input: 3 CSV files - spatial_counts_csv, ref_counts_csv, ref_celltypes_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: required, supplied as ref_counts_csv + ref_celltypes_csv (not h5ad).'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: Path to spatial counts CSV (genes x spots).
        ref_counts_csv:
          type: str
          required: true
          description: Path to scRNA-seq reference counts CSV (genes x cells).
        ref_celltypes_csv:
          type: str
          required: true
          description: Path to cell type annotations CSV (cell_id, cell_type).
        output_dir:
          description: Directory for Redeconve output files (proportions CSV).
          type: str
          required: true
        n_top_genes:
          description: 'Genes passed to Redeconve. 0 (default) = every gene the reference and the spatial data share (Redeconve genemode default). A positive value below the shared count keeps that many shared genes with the highest log1p(CPM) variance across the reference cells (genemode customized); a value at or above the shared count keeps them all. Reported as data.n_genes_used and params.gene_selection.'
          type: int
          required: false
          default: 0
        seed:
          description: 'Accepted and set, but Redeconve draws no random numbers, so it has no effect on the result; listed in params.ignored with a warning.'
          type: int
          required: false
          default: 0
        drop_unlabeled:
          description: Reference cells whose label is missing (NA, empty, nan) are refused by default, because a missing label is not a cell type. True leaves them out and reports the count (data.n_ref_cells_unlabeled) with a warning.
          type: bool
          required: false
          default: false
  neighborseq:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/neighborseq_mcp_server.py
    enabled: true
    description: Neighbor-seq cell-cell interaction network reconstruction from scRNA-seq multiplet detection.
    env:
      NEIGHBORSEQ_PYTHON: /opt/conda/envs/neighborseq/bin/Rscript
      NEIGHBORSEQ_WORKER: /workspace/epic-fermat/agent/tools/neighborseq_worker.R
    tools:
    - spatialomicsgym_name: neighborseq_interaction_network
      description: 'Reconstruct cell-cell physical interaction networks with Neighbor-seq (Neighborseq::neighborseq): an xgboost random-forest classifier (200 trees, fixed upstream) is trained on artificial doublets built from the labelled cells, each cell or spot is assigned a singlet or doublet class, and every predicted cell-type pair is tested for enrichment (pval and padj per pair). [DATA REQUIREMENTS] Input: counts CSV (genes x cells or cells x genes) + clusters CSV (barcode, cluster label). Does NOT accept h5ad directly; use convert_h5ad_to_csv first. Gene panel: FindAllMarkers top 50 markers per cluster, tested on all cells (no downsampling). Labels with spaces or punctuation are tokenised for Neighborseq and decoded back in every output (mapping in neighborseq_label_map.csv). SC reference: not needed. The run''s cost is estimated from clusters_csv before the worker starts (params.cost_estimate) and a run over its budget (max_estimated_s) is refused with the estimate.'
      parameters:
        counts_csv:
          type: str
          required: true
          description: 'Path to a comma-separated counts CSV with a header row (genes x cells or cells x genes; the orientation is detected from the barcodes). It is read in blocks of rows straight into a sparse matrix, so the whole table is never held dense.'
        clusters_csv:
          type: str
          required: true
          description: Path to cluster assignments CSV (cell_id, cluster).
        output_dir:
          description: Directory for Neighborseq output files.
          type: str
          required: true
        n_trees:
          description: 'Accepted but not used: Neighborseq fixes its forest at 200 trees (xgboost num_parallel_tree = 200) and no argument reaches it; listed under params.ignored.'
          type: int
          required: false
          default: 500
        pval_cutoff:
          description: 'Accepted but not used: Neighborseq applies no p-value cutoff and writes every tested pair with its pval and padj; listed under params.ignored.'
          type: float
          required: false
          default: 0.05
        seed:
          description: Random seed for reproducibility.
          type: int
          required: false
          default: 0
        n_top:
          type: int
          required: false
          default: 20
          description: 'Number of top interactions (lowest padj) to report.'
        allow_hvg_panel_fallback:
          type: bool
          required: false
          default: false
          description: 'When FindAllMarkers finds no marker gene the run stops. True trains on the top 100 variable features instead and reports params.used_fallback = true.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Leave out cells whose label is missing (NA or empty) instead of failing; the count is reported in data.n_unlabeled_dropped.'
        drop_singleton_clusters:
          type: bool
          required: false
          default: false
          description: 'Leave out clusters with exactly one cell instead of failing (Neighborseq cannot sample a one-cell cluster correctly); they are named in data.dropped_singleton_clusters.'
        max_estimated_s:
          type: float
          required: false
          default: null
          description: 'The wall-time budget, in seconds, the run''s estimate must fit. Neighbor-seq''s cost grows with cells x clusters and with the square of its classes (every cluster and every pair: k(k+3)/2 for k clusters); the cost is estimated from clusters_csv before the worker starts and reported as params.cost_estimate, and a run estimated over the budget is refused with the estimate and the ways to bring it down (fewer cells, fewer and coarser clusters). Default: the host''s SOG_NEIGHBORSEQ_MAX_SECONDS, else 1800 s. 0 or less means no budget.'
  celltrek:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/celltrek_mcp_server.py
    enabled: true
    description: CellTrek spatial cell mapping via co-embedding of scRNA-seq and spatial transcriptomics.
    env:
      CELLTREK_PYTHON: /opt/conda/envs/celltrek/bin/Rscript
      CELLTREK_WORKER: /workspace/epic-fermat/agent/tools/celltrek_worker.R
    tools:
    - spatialomicsgym_name: celltrek_spatial_mapping
      description: 'Map single cells to spatial coordinates using CellTrek''s co-embedding approach with Seurat transfer anchors and random forest modeling. [DATA REQUIREMENTS] Input: 2 Seurat RDS objects - sc_data, st_data. Does NOT accept h5ad directly; use convert_h5ad_to_seurat_rds first. SC reference: required, supplied as sc_data (not h5ad). The two objects must name genes the same way (both symbols or both Ensembl IDs); a pair with no gene in common is refused. Each object is log-normalised by the worker when it carries no normalised layer (params.normalisation says which). In celltrek_mapped_coords.csv coord_x is the image row and coord_y the image column; summary.n_mapped_cells counts cells and summary.n_placements the rows (CellTrek places a cell at up to 5 spots or interpolated points). summary.n_sc_cells_unmapped counts the cells CellTrek''s mutual nearest-neighbour pruning left without a position (each cell keeps its 5 nearest spots or interpolated points, each of those its 5 nearest cells, and a pair survives only when both keep it); CellTrek''s distance cut (ntree x dist_thresh = 1000 x 0.55 = 550) lies above every randomForestSRC distance, which is in [0, 1], so it removes nothing -- params.distance_cut and a warning say so.'
      parameters:
        sc_data:
          type: str
          required: true
          description: Path to scRNA-seq Seurat RDS object.
        st_data:
          type: str
          required: true
          description: 'Path to spatial transcriptomics Seurat RDS object. Spots whose in_tissue metadata is 0 (background glass: convert_h5ad_to_seurat_rds carries obs[''in_tissue''] across, and a CELLxGENE Visium h5ad holds every array spot) are left out before mapping, so no cell is charted onto them; params.in_tissue_filter and a warning count them, data.n_st_spots is the spots mapped onto and data.n_st_spots_supplied the object as given. A counts matrix with negative or NaN values (a scaled X converted as is) and no normalised layer is refused. Spot positions come from its own Visium image (matched to the spots by name; an object whose first image covers only some of its spots, as a merged multi-section object does, is refused), else from the spatial reduction or x_coord/y_coord metadata that convert_h5ad_to_seurat_rds writes (x = image column, y = image row).'
        output_dir:
          description: Directory for output files.
          type: str
          required: true
        celltype_col:
          description: Column in scRNA-seq metadata with cell type labels.
          type: str
          required: false
          default: cell_type
        n_components:
          description: 'Number of components of the chosen reduction that CellTrek''s random forest is trained on: 2 to 50 for pca, exactly 2 for umap. Values outside that range are refused before the run starts.'
          type: int
          required: false
          default: 30
        reduction:
          description: 'Which embedding built by CellTrek''s traint() on the joint object to use: pca (50 components) or umap (2 components). Any other name is refused.'
          type: str
          required: false
          default: pca
        seed:
          description: 'Random seed for CellTrek''s own random steps (interpolated points, random forest, charting); traint()''s Seurat steps (CCA, PCA, UMAP) use Seurat''s fixed seed 42 regardless. A multi-threaded random forest is not bit-reproducible, so placements differ between runs at one seed unless the worker runs with RF_CORES=1 (params.random_forest_threads says which applied).'
          type: int
          required: false
          default: 42
  squidpy:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/squidpy_mcp_server.py
    enabled: true
    description: Squidpy spatial graph analysis toolkit for spatial transcriptomics (neighborhood enrichment, co-occurrence, autocorrelation, Ripley's statistics, centrality scores).
    env:
      SQUIDPY_PYTHON: /opt/conda/envs/moscot/bin/python
      SQUIDPY_WORKER: /workspace/epic-fermat/agent/tools/squidpy_worker.py
    tools:
    - spatialomicsgym_name: squidpy_spatial_neighbors
      description: 'Build a spatial neighborhood graph using squidpy.gr.spatial_neighbors. Prerequisite step for most other squidpy spatial analyses. Spots that obs[''in_tissue''] marks 0 (background outside the tissue; CELLxGENE Visium exports keep every array spot) are left out before the graph is built, so the written h5ad holds the in-tissue spots only; params.in_tissue_filter and a warning say how many. Graph knobs squidpy does not read under the chosen coord_type and delaunay (n_rings off the grid path, n_neighs when delaunay is true) are listed in params.ignored with a warning, and summary.graph names the graph that was built. coords_key: the obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). dims: 2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z. section_key: the obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run. params.mode ("3d", "per-section-2d" or "2d") and params.frame (coords_key, dims, units_per_axis_um, z_source, section_key, sections) say which ran. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] required. Tool builds spatial neighborhood graph as prerequisite for other squidpy analyses. Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        h5ad_path:
          type: str
          required: true
          description: Path to AnnData (.h5ad) with spatial coordinates in obsm.
        output_dir:
          type: str
          required: true
          description: Directory to write outputs (annotated h5ad with spatial graph).
        cluster_key:
          type: str
          required: false
          default: cluster
          description: Column in adata.obs containing cell type / cluster labels. The graph does not depend on it and a missing column is not an error; when present it is stored as categorical in the written h5ad.
        coord_type:
          type: str
          required: false
          default: generic
          description: 'Coordinate type: ''generic'' or ''grid'' (for Visium-like data).'
        n_neighs:
          type: int
          required: false
          default: 6
          description: 'Number of neighbors for the spatial graph (generic: nearest neighbours; grid: neighbouring tiles per ring, 6 on a Visium hexagonal array). Not read when delaunay is true, and then reported in params.ignored.'
        n_rings:
          type: int
          required: false
          default: 1
          description: 'Number of rings of neighbors, read only when coord_type=''grid''. A value other than 1 on a generic graph is not used and is reported in params.ignored.'
        delaunay:
          type: boolean
          required: false
          default: false
          description: 'Whether to use Delaunay triangulation for building the graph; each spot''s neighbours are then set by the triangulation, not by n_neighs.'
        spatial_key:
          type: str
          required: false
          default: spatial
          description: Key in adata.obsm containing spatial coordinates.
        coords_key:
          type: str
          required: false
          default: spatial
          description: 'The obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). The older spatial_key names the same thing; set one of them.'
        dims:
          type: int
          required: false
          default: 2
          description: '2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z.'
        section_key:
          type: str
          required: false
          default: null
          description: 'The obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run (data.cross_section_edge_fraction).'
    - spatialomicsgym_name: squidpy_nhood_enrichment
      description: 'Run neighborhood enrichment analysis using squidpy. Computes neighborhood enrichment z-scores between cell types. Spots that obs[''in_tissue''] marks 0 (background outside the tissue) are left out first and counted in params.in_tissue_filter with a warning; a label carried only by those spots is removed with them (summary.labels_only_off_tissue). coords_key: the obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). dims: 2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z. section_key: the obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run. params.mode ("3d", "per-section-2d" or "2d") and params.frame (coords_key, dims, units_per_axis_um, z_source, section_key, sections) say which ran. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] required and categorical labels in obs[cluster_key] required for enrichment computation (the default ''cluster'' is absent from the library samples, so pass the real column, e.g. cluster_key=''cell_type''; a cell with a missing label stops the run unless drop_unlabeled is true). Spatial graph is built automatically from obsm[''spatial''] (running squidpy_spatial_neighbors first is optional). SC reference: not needed. Image: not needed.'
      parameters:
        h5ad_path:
          type: str
          required: true
          description: Path to AnnData (.h5ad) with spatial coordinates.
        output_dir:
          type: str
          required: true
          description: Directory for output files (enrichment CSV, annotated h5ad).
        cluster_key:
          type: str
          required: false
          default: cluster
          description: 'Column in adata.obs with categorical cell type / cluster labels. The default ''cluster'' is absent from the library samples, so pass the real column (e.g. ''cell_type'').'
        coord_type:
          type: str
          required: false
          default: generic
          description: 'Coordinate type: ''generic'' or ''grid''.'
        n_neighs:
          type: int
          required: false
          default: 6
          description: Number of neighbors for the spatial graph.
        n_perms:
          type: int
          required: false
          default: 1000
          description: Number of permutations for the enrichment test.
        spatial_key:
          type: str
          required: false
          default: spatial
          description: Key in adata.obsm containing spatial coordinates.
        seed:
          type: int
          required: false
          default: 0
          description: Random seed for reproducibility.
        drop_unlabeled:
          type: boolean
          required: false
          default: false
          description: 'Leave out cells whose obs[cluster_key] label is missing (NaN / empty / ''nan'') instead of stopping the run; the payload reports n_cells_dropped_unlabeled.'
        coords_key:
          type: str
          required: false
          default: spatial
          description: 'The obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). The older spatial_key names the same thing; set one of them.'
        dims:
          type: int
          required: false
          default: 2
          description: '2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z.'
        section_key:
          type: str
          required: false
          default: null
          description: 'The obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run (data.cross_section_edge_fraction).'
    - spatialomicsgym_name: squidpy_co_occurrence
      description: 'Compute cell type co-occurrence probability at varying spatial distances using squidpy.gr.co_occurrence. Spots that obs[''in_tissue''] marks 0 (background outside the tissue) are left out first and counted in params.in_tissue_filter with a warning; a label carried only by those spots is removed with them (summary.labels_only_off_tissue). coords_key: the obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). dims: 2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z. section_key: the obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run. params.mode ("3d", "per-section-2d" or "2d") and params.frame (coords_key, dims, units_per_axis_um, z_source, section_key, sections) say which ran. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] required and categorical labels in obs[cluster_key] required (the default ''cluster'' is absent from the library samples, so pass the real column, e.g. cluster_key=''cell_type''; a cell with a missing label stops the run unless drop_unlabeled is true). Computes co-occurrence probability at varying spatial distances. SC reference: not needed. Image: not needed. The run''s cost is estimated before squidpy starts (params.cost_estimate) and a run over its budget (max_estimated_s) is refused with the estimate.'
      parameters:
        h5ad_path:
          type: str
          required: true
          description: Path to AnnData (.h5ad) with spatial coordinates.
        output_dir:
          type: str
          required: true
          description: Directory for output files (co-occurrence CSV, annotated h5ad).
        cluster_key:
          type: str
          required: false
          default: cluster
          description: 'Column in adata.obs with categorical cell type / cluster labels. The default ''cluster'' is absent from the library samples, so pass the real column (e.g. ''cell_type'').'
        spatial_key:
          type: str
          required: false
          default: spatial
          description: Key in adata.obsm containing spatial coordinates.
        n_steps:
          type: int
          required: false
          default: 50
          description: Number of distance interval steps for the co-occurrence computation.
        drop_unlabeled:
          type: boolean
          required: false
          default: false
          description: 'Leave out cells whose obs[cluster_key] label is missing (NaN / empty / ''nan'') instead of stopping the run; the payload reports n_cells_dropped_unlabeled.'
        coords_key:
          type: str
          required: false
          default: spatial
          description: 'The obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). The older spatial_key names the same thing; set one of them.'
        dims:
          type: int
          required: false
          default: 2
          description: '2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z.'
        section_key:
          type: str
          required: false
          default: null
          description: 'The obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run (data.cross_section_edge_fraction).'
        max_estimated_s:
          type: float
          required: false
          default: null
          description: 'The wall-time budget, in seconds, the run''s estimate must fit. squidpy scans every pair of cells at each distance bin, so a run costs about cells^2 x (n_steps - 1) per plane (3D on 309,599 cells took 7,001 s); the cost is estimated before squidpy starts and reported as params.cost_estimate, and a run estimated over the budget is refused with the estimate and the ways to bring it down (fewer cells: a section or bounding-box subset, or per section; fewer intervals: n_steps). Default: the host''s SOG_SQUIDPY_COOCCURRENCE_MAX_SECONDS, else 1800 s. 0 or less means no budget.'
    - spatialomicsgym_name: squidpy_spatial_autocorr
      description: 'Compute spatial autocorrelation (Moran''s I or Geary''s C) for gene expression using squidpy.gr.spatial_autocorr. Spots that obs[''in_tissue''] marks 0 (background outside the tissue; their ambient counts would score the tissue-versus-background contrast as spatial autocorrelation) are left out first and counted in params.in_tissue_filter with a warning; data.n_spots is the in-tissue count. coords_key: the obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). dims: 2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z. section_key: the obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run. params.mode ("3d", "per-section-2d" or "2d") and params.frame (coords_key, dims, units_per_axis_um, z_source, section_key, sections) say which ran. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] required. Spatial graph is built automatically from obsm[''spatial''] (running squidpy_spatial_neighbors first is optional). Computes Moran''s I or Geary''s C on gene expression. Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        h5ad_path:
          type: str
          required: true
          description: Path to AnnData (.h5ad) with spatial coordinates.
        output_dir:
          type: str
          required: true
          description: Directory for output files (autocorrelation CSV, annotated h5ad).
        cluster_key:
          type: str
          required: false
          default: cluster
          description: 'Accepted for compatibility only: this task tests genes, not labels, and never reads it. A value other than the default is reported under params.ignored with a warning.'
        coord_type:
          type: str
          required: false
          default: generic
          description: 'Coordinate type: ''generic'' or ''grid''.'
        n_neighs:
          type: int
          required: false
          default: 6
          description: Number of neighbors for the spatial graph.
        mode:
          type: str
          required: false
          default: moran
          description: 'Autocorrelation metric: ''moran'' (Moran''s I) or ''geary'' (Geary''s C).'
        n_perms:
          type: int
          required: false
          default: 100
          description: 'Number of permutations for the permutation test (seeded by seed). When set, the permutation p-values (CSV column pval_sim) drive the significance count and the SVG filter; the
            smallest attainable permutation p is 1/(n_perms + 1). Pass null to skip the permutation test and use the analytic p-values (pval_norm). params.pvalue_column names the column read.'
        n_jobs:
          type: int
          required: false
          default: 1
          description: Number of parallel jobs.
        spatial_key:
          type: str
          required: false
          default: spatial
          description: Key in adata.obsm containing spatial coordinates.
        top_n:
          type: int
          required: false
          default: 200
          description: 'Maximum number of top spatially variable genes to write to predicted_genes.json. Genes are
            first filtered by pvalue_threshold, then ranked by Moran''s I (descending) or Geary''s C (ascending).'
        pvalue_threshold:
          type: float
          required: false
          default: 0.05
          description: 'P-value cutoff applied before the top-N ranking; only genes with positive spatial autocorrelation (Moran''s I above its expectation, Geary''s C below 1) pass. Set to a non-positive
            value to disable filtering (every gene is then ranked).'
        seed:
          type: int
          required: false
          default: 0
          description: Random seed for the permutation test (used when n_perms is set).
        use_fdr:
          type: boolean
          required: false
          default: false
          description: 'Apply Benjamini-Hochberg over the finite p-values of the chosen column before the significance count and the SVG filter (params.pvalue_correction); the CSV keeps squidpy''s own
            columns as written.'
        use_highly_variable:
          type: boolean
          required: false
          default: false
          description: 'Test only the genes flagged in adata.var[''highly_variable''] (reported as a reduction). Default false tests every gene.'
        coords_key:
          type: str
          required: false
          default: spatial
          description: 'The obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). The older spatial_key names the same thing; set one of them.'
        dims:
          type: int
          required: false
          default: 2
          description: '2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z.'
        section_key:
          type: str
          required: false
          default: null
          description: 'The obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run (data.cross_section_edge_fraction).'
    - spatialomicsgym_name: squidpy_ripley
      description: 'Compute Ripley''s statistics (F, G, or L function) for spatial point patterns using squidpy.gr.ripley. Spots that obs[''in_tissue''] marks 0 (background outside the tissue) are left out first and counted in params.in_tissue_filter with a warning; a label carried only by those spots is removed with them (summary.labels_only_off_tissue). coords_key: the obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). dims: 2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z. section_key: the obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run. params.mode ("3d", "per-section-2d" or "2d") and params.frame (coords_key, dims, units_per_axis_um, z_source, section_key, sections) say which ran. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] required. Computes Ripley''s F, G, or L function for spatial point patterns. Required obs: cluster column for per-group analysis. SC reference: not needed. Image: not needed.'
      parameters:
        h5ad_path:
          type: str
          required: true
          description: Path to AnnData (.h5ad) with spatial coordinates.
        output_dir:
          type: str
          required: true
          description: Directory for output files (Ripley's statistics CSV, annotated h5ad).
        cluster_key:
          type: str
          required: false
          default: cluster
          description: 'Column in adata.obs with categorical cell type / cluster labels. The default ''cluster'' is absent from the library samples, so pass the real column (e.g. ''cell_type'').'
        mode:
          type: str
          required: false
          default: L
          description: 'Ripley''s function type: ''F'', ''G'', or ''L''.'
        spatial_key:
          type: str
          required: false
          default: spatial
          description: Key in adata.obsm containing spatial coordinates.
        n_steps:
          type: int
          required: false
          default: 50
          description: Number of distance steps for Ripley's function evaluation.
        n_simulations:
          type: int
          required: false
          default: 100
          description: Number of simulations for the confidence envelope.
        drop_unlabeled:
          type: boolean
          required: false
          default: false
          description: 'Leave out cells whose obs[cluster_key] label is missing (NaN / empty / ''nan'') instead of stopping the run; the payload reports n_cells_dropped_unlabeled.'
        coords_key:
          type: str
          required: false
          default: spatial
          description: 'The obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). The older spatial_key names the same thing; set one of them.'
        dims:
          type: int
          required: false
          default: 2
          description: '2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z.'
        section_key:
          type: str
          required: false
          default: null
          description: 'The obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run (data.cross_section_edge_fraction).'
    - spatialomicsgym_name: squidpy_centrality_scores
      description: 'Compute graph centrality scores (closeness, degree, clustering coefficient) for cell types using squidpy.gr.centrality_scores. Spots that obs[''in_tissue''] marks 0 (background outside the tissue) are left out first and counted in params.in_tissue_filter with a warning; a label carried only by those spots is removed with them (summary.labels_only_off_tissue). coords_key: the obsm key holding the coordinates (default ''spatial''; an aligned 3D frame such as ''spatial_3d_aligned''). dims: 2 or 3; 3 builds the graph in the aligned frame in micrometres and needs a frame with recorded units and a measured or registered z. section_key: the obs column naming sections; required for a 2D run on a multi-section file (the run is per section) and for the cross-section edge count of a 3D run. params.mode ("3d", "per-section-2d" or "2d") and params.frame (coords_key, dims, units_per_axis_um, z_source, section_key, sections) say which ran. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] required and categorical labels in obs[cluster_key] required (the default ''cluster'' is absent from the library samples, so pass the real column, e.g. cluster_key=''cell_type''; a cell with a missing label stops the run unless drop_unlabeled is true). A category that labels no cell is left out (summary.empty_categories_removed). Spatial graph is built automatically from obsm[''spatial''] (running squidpy_spatial_neighbors first is optional). Computes graph centrality scores per cell type. SC reference: not needed. Image: not needed.'
