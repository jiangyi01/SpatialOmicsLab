    - spatialomicsgym_name: plot_marker_expression
      description: 'Marker genes across groups as a dot plot, violins or a heatmap, or the composition of one annotation
        across another. [DATA REQUIREMENTS] Input: one .h5ad with expression in X (or a named layer) and at least one
        categorical obs column to group by. Genes may be named, or left empty to take the top markers of each group from
        a stored uns[''rank_genes_groups''] -- and when they come from a ranking the caption says so. ''composition''
        draws no expression at all and needs only two categorical columns. Required obs: one categorical column (cell
        type, cluster or domain). SC reference: not needed. Image: not needed.'
      parameters:
        data_path:
          type: str
          required: true
          description: Path to the AnnData (.h5ad) to read, e.g. ./work/spatial_input/slide.h5ad.
        genes:
          type: str
          required: false
          default: ''
          description: Comma-separated gene symbols. Empty takes the top `top_n` markers of each group from a stored ranking,
            and refuses if the object holds none.
        groupby:
          type: str
          required: false
          default: ''
          description: Categorical obs column defining the groups. Empty uses the dataset's cell-type or cluster column.
        output_dir:
          type: str
          required: false
          default: ''
          description: Directory the figure, its record and the post-analysis manifest are written to. Empty resolves
            to ./work/spatial_viz (SOG_WORK_DIR honoured).
        kind:
          type: str
          required: false
          default: dotplot
          description: '''dotplot'' (colour is the group mean, dot area the fraction expressing), ''violin'' (one panel
            per gene), ''heatmap'' (group x gene means), or ''composition'' (stacked proportions of one annotation across
            another).'
        layer:
          type: str
          required: false
          default: ''
          description: Name a layer to read instead of X. Empty reads X, and routes to .raw when X holds negative values
            because it was scaled.
        use_raw:
          type: bool
          required: false
          default: false
          description: Read .raw.X instead of X. Refused when the object has no .raw.
        normalize:
          type: str
          required: false
          default: auto
          description: '''auto'' applies log1p only to integer counts and says so in the caption; ''none'' draws the stored
            values unchanged.'
        standardize:
          type: bool
          required: false
          default: false
          description: Z-score each gene across groups so colour is relative rather than a level. The caption states it
            and the colour map switches to a diverging one centred on zero.
        top_n:
          type: int
          required: false
          default: 5
          description: How many markers per group to take from a stored ranking when `genes` is empty.
        split_by:
          type: str
          required: false
          default: ''
          description: 'For ''composition'': the second categorical column the groups are broken down by. Empty picks
            the first other categorical column.'
        color_map:
          type: str
          required: false
          default: ''
          description: Override the colour map. Empty uses a sequential map for levels and a diverging one when standardized.
        title:
          type: str
          required: false
          default: ''
          description: Figure title. Empty composes one from the genes and the grouping.
        figure_format:
          type: str
          required: false
          default: png
          description: '''png'' for the chat card, ''svg'' for a vector figure with editable text.'
        dpi:
          type: int
          required: false
          default: 0
          description: Raster resolution. 0 chooses one from the canvas size.
        figure_id:
          type: str
          required: false
          default: ''
          description: A readable slug for the figure's file and identity. Empty derives one from the request.
    - spatialomicsgym_name: plot_pathway_results
      description: 'Enriched terms from a stored enrichment table, or per-spot pathway activity painted on the tissue.
        [DATA REQUIREMENTS] Input for ''enrichment'': the CSV/TSV a pathway tool wrote, carrying a term column and a significance
        column; a table with no significance column is refused rather than ranked by whatever number is left, and a table
        carrying only an uncorrected p-value is drawn and captioned as uncorrected. Input for ''activity'': the spatial
        .h5ad with obsm[''spatial''], plus either a scores CSV or an obsm activity matrix. This runs no enrichment of
        its own. Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        results_path:
          type: str
          required: false
          description: Path to the table a pathway tool wrote (enrichment_summary.csv, or a per-spot activity CSV).
          default: ''
        data_path:
          type: str
          required: false
          description: 'For ''activity'': the spatial AnnData (.h5ad) the scores belong to. Not used by ''enrichment''.'
          default: ''
        output_dir:
          type: str
          required: false
          description: Directory the figure, its record and the post-analysis manifest are written to. Empty resolves
            to ./work/spatial_viz (SOG_WORK_DIR honoured).
          default: ''
        kind:
          type: str
          required: false
          description: '''enrichment'' (a dot plot of terms) or ''activity'' (pathway scores on the tissue).'
          default: enrichment
        collection:
          type: str
          required: false
          description: Keep only this gene-set collection, when the table names one.
          default: ''
        method:
          type: str
          required: false
          description: Keep only this method, when the table names one (for example ora or gsea).
          default: ''
        pathways:
          type: str
          required: false
          description: 'For ''activity'': comma-separated pathway names to map. Empty maps the first few in the matrix.'
          default: ''
        obsm_key:
          type: str
          required: false
          description: 'For ''activity'': the obsm key holding the score matrix. Empty looks for one whose name says estimate
            or activity.'
          default: ''
        top_n:
          type: int
          required: false
          default: 15
          description: How many terms to draw, taken in order of significance.
        fdr_threshold:
          type: float
          required: false
          default: 0.05
          description: The line below which a term counts as passing; reported in the caption, never used to hide rows.
        library_id:
          type: str
          required: false
          description: Which section's coordinates to use when the object holds several.
          default: ''
        ncols:
          type: int
          required: false
          default: 3
          description: Panels per row for an activity map.
        color_map:
          type: str
          required: false
          description: Override the colour map. Empty uses a sequential map for terms and a diverging one for activity.
          default: ''
        title:
          type: str
          required: false
          description: Figure title. Empty composes one.
          default: ''
        figure_format:
          type: str
          required: false
          description: '''png'' for the chat card, ''svg'' for a vector figure with editable text.'
          default: png
        dpi:
          type: int
          required: false
          default: 0
          description: Raster resolution. 0 chooses one from the canvas size.
        figure_id:
          type: str
          required: false
          description: A readable slug for the figure's file and identity. Empty derives one from the request.
          default: ''
    - spatialomicsgym_name: plot_spatial_statistics
      description: 'How the tissue is organised: the spatial neighbour graph, or a statistic the spatial-statistics tool
        already computed. [DATA REQUIREMENTS] Input for ''graph'': .h5ad with obsm[''spatial''] holding true positions.
        Input for ''neighborhood'': .h5ad whose uns holds a neighbourhood-enrichment result. Input for ''autocorrelation''
        and ''cooccurrence'': the CSV that tool wrote. Only the graph is built here, from the coordinates; no statistic
        is recomputed. Required obs: a categorical column for ''neighborhood''. SC reference: not needed. Image: not needed.'
      parameters:
        data_path:
          type: str
          required: false
          description: The spatial AnnData (.h5ad). Needed by 'graph' and 'neighborhood'.
          default: ''
        results_path:
          type: str
          required: false
          description: The table a spatial-statistics tool wrote. Needed by 'autocorrelation' and 'cooccurrence'.
          default: ''
        output_dir:
          type: str
          required: false
          description: Directory the figure, its record and the post-analysis manifest are written to. Empty resolves
            to ./work/spatial_viz (SOG_WORK_DIR honoured).
          default: ''
        kind:
          type: str
          required: false
          description: '''graph'', ''neighborhood'', ''autocorrelation'' or ''cooccurrence''.'
          default: graph
        obs_key:
          type: str
          required: false
          description: The categorical column the neighbourhood enrichment was computed over. Empty uses the cell-type
            or cluster column.
          default: ''
        n_neighbors:
          type: int
          required: false
          default: 6
          description: Neighbours per spot in the drawn graph. Clamped to the number of spots available.
        top_n:
          type: int
          required: false
          default: 20
          description: How many features or label pairs to show.
        library_id:
          type: str
          required: false
          description: Which section's coordinates to use when the object holds several.
          default: ''
        color_map:
          type: str
          required: false
          description: Override the colour map.
          default: ''
        title:
          type: str
          required: false
          description: Figure title. Empty composes one.
          default: ''
        figure_format:
          type: str
          required: false
          description: '''png'' for the chat card, ''svg'' for a vector figure with editable text.'
          default: png
        dpi:
          type: int
          required: false
          default: 0
          description: Raster resolution. 0 chooses one from the canvas size.
        figure_id:
          type: str
          required: false
          description: A readable slug for the figure's file and identity. Empty derives one from the request.
          default: ''
    - spatialomicsgym_name: plot_trajectory
      description: 'A pseudotime another tool computed, drawn on an embedding, on the tissue, or as gene trends along
        the ordering. [DATA REQUIREMENTS] Input: .h5ad with a pseudotime column in obs (dpt_pseudotime or similar); the
        embedding view also needs an embedding in obsm, and the spatial view needs obsm[''spatial'']. Pseudotime is an
        ordering with no units: every caption says so and names the root when one is recorded. There is no spatial-trajectory
        family -- distance across a section is not elapsed time. Required obs: a numeric pseudotime column. SC reference:
        not needed. Image: not needed.'
      parameters:
        data_path:
          type: str
          required: true
          description: Path to the AnnData (.h5ad) holding the pseudotime.
        output_dir:
          type: str
          required: false
          description: Directory the figure, its record and the post-analysis manifest are written to. Empty resolves
            to ./work/spatial_viz (SOG_WORK_DIR honoured).
          default: ''
        kind:
          type: str
          required: false
          description: '''pseudotime'' (on an embedding), ''spatial'' (at each spot''s position) or ''gene_trend'' (expression
            against the ordering).'
          default: pseudotime
        pseudotime_key:
          type: str
          required: false
          description: The obs column holding the ordering. Empty uses the first column whose name says pseudotime or
            dpt.
          default: ''
        basis:
          type: str
          required: false
          description: Which embedding to draw on. 'auto' prefers a UMAP, then a t-SNE, then whatever is stored.
          default: auto
        genes:
          type: str
          required: false
          description: 'For ''gene_trend'': comma-separated genes whose trend to draw.'
          default: ''
        groupby:
          type: str
          required: false
          description: Reserved for grouping a trend; not required.
          default: ''
        layer:
          type: str
          required: false
          description: Name a layer to read instead of X.
          default: ''
        use_raw:
          type: bool
          required: false
          default: false
          description: Read .raw.X instead of X. Refused when the object has no .raw.
        normalize:
          type: str
          required: false
          description: '''auto'' applies log1p only to integer counts and says so; ''none'' draws stored values unchanged.'
          default: auto
        n_bins:
          type: int
          required: false
          default: 20
          description: Equal-width pseudotime bins a gene trend is averaged over.
        library_id:
          type: str
          required: false
          description: Which section's coordinates to use when the object holds several.
          default: ''
        point_size:
          type: float
          required: false
          default: 0.0
          description: Marker size. 0 chooses one from the number of points.
        color_map:
          type: str
          required: false
          description: Override the colour map. Empty uses a perceptually ordered one.
          default: ''
        title:
          type: str
          required: false
          description: Figure title. Empty composes one.
          default: ''
        figure_format:
          type: str
          required: false
          description: '''png'' for the chat card, ''svg'' for a vector figure with editable text.'
          default: png
        dpi:
          type: int
          required: false
          default: 0
          description: Raster resolution. 0 chooses one from the canvas size.
        figure_id:
          type: str
          required: false
          description: A readable slug for the figure's file and identity. Empty derives one from the request.
          default: ''
    - spatialomicsgym_name: plot_cell_communication
      description: 'A cell-communication result another tool inferred, as a sender-by-receiver matrix or a ranking of
        pairs. [DATA REQUIREMENTS] Input: the table a communication tool wrote (COMMOT, CellPhoneDB, NCEM, SpaOTsc and
        others), carrying a sender column, a receiver column and a score; a table with senders and receivers but no score
        is refused, because there would be nothing to weight the interactions by. Every caption says the interaction is
        inferred, not measured. Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        results_path:
          type: str
          required: true
          description: Path to the ligand-receptor table the communication tool wrote.
        output_dir:
          type: str
          required: false
          description: Directory the figure, its record and the post-analysis manifest are written to. Empty resolves
            to ./work/spatial_viz (SOG_WORK_DIR honoured).
          default: ''
        kind:
          type: str
          required: false
          description: '''interactions'' (sender by receiver heatmap) or ''ranked'' (the strongest pairs).'
          default: interactions
        source_column:
          type: str
          required: false
          description: Column naming the sending population. Empty sniffs source, sender or a ligand-cluster column.
          default: ''
        target_column:
          type: str
          required: false
          description: Column naming the receiving population. Empty sniffs target, receiver or a receptor-cluster column.
          default: ''
        score_column:
          type: str
          required: false
          description: Column holding the interaction score. Empty sniffs score, means, magnitude or probability.
          default: ''
        top_n:
          type: int
          required: false
          default: 20
          description: How many pairs to show in the ranked view.
        color_map:
          type: str
          required: false
          description: Override the colour map.
          default: ''
        title:
          type: str
          required: false
          description: Figure title. Empty composes one.
          default: ''
        figure_format:
          type: str
          required: false
          description: '''png'' for the chat card, ''svg'' for a vector figure with editable text.'
          default: png
        dpi:
          type: int
          required: false
          default: 0
          description: Raster resolution. 0 chooses one from the canvas size.
        figure_id:
          type: str
          required: false
          description: A readable slug for the figure's file and identity. Empty derives one from the request.
          default: ''
    - spatialomicsgym_name: plot_differential_expression
      description: 'Draw a stored differential-expression result, or refuse and say what is missing. [DATA REQUIREMENTS] Input: one .h5ad carrying uns[''rank_genes_groups'']. A volcano additionally needs logfoldchanges and pvals_adj in that result; a ranking that stores only names and a test statistic is refused with the call that would produce a complete one, because a test statistic is not an effect size. Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        data_path:
          type: str
          required: true
          description: 'Path to the AnnData (.h5ad) to read, e.g. ./work/spatial_input/slide.h5ad.'
        group:
          type: str
          required: false
          default: ''
          description: 'Which group of the stored ranking to draw. Empty uses the first; a name that is not in the result is refused with the list.'
        output_dir:
          type: str
          required: false
          default: ''
          description: 'Directory the figure, its record and the post-analysis manifest are written to. Empty resolves to ./work/spatial_viz (SOG_WORK_DIR honoured).'
        kind:
          type: str
          required: false
          default: 'volcano'
          description: 'For differential expression: ''volcano'' (needs fold changes and adjusted p-values) or ''ranked'' (works from whatever statistic is stored). For deconvolution: ''maps'', ''dominant'' or ''summary''.'
        top_n:
          type: int
          required: false
          default: 15
          description: 'How many genes or cell types to show.'
        fc_threshold:
          type: float
          required: false
          default: 1.0
          description: 'Absolute log2 fold change at which a gene is marked selected. A threshold, not a statement about importance.'
        p_threshold:
          type: float
          required: false
          default: 0.05
          description: 'Adjusted p-value below which a gene is marked selected.'
        title:
          type: str
          required: false
          default: ''
          description: 'Figure title. Empty derives one from what was drawn.'
        figure_format:
          type: str
          required: false
          default: 'png'
          description: '''png'', ''svg'' or ''pdf''. PNG and SVG display in the answer; PDF is download-only. Above 50,000 marks the point layer is rasterised inside a vector file so the export stays servable.'
        dpi:
          type: int
          required: false
          default: 0
          description: 'Raster resolution. 0 uses the repository default of 200.'
        figure_id:
          type: str
          required: false
          default: ''
          description: 'A short name for this figure, used later by update_visualization. Empty derives a stable one, so re-running the same request overwrites rather than accumulating.'
    - spatialomicsgym_name: plot_deconvolution
      description: 'Cell-type proportions from a deconvolution: per-type maps, the dominant type, or a summary. [DATA REQUIREMENTS] Input: one .h5ad with obsm[''spatial''], plus a proportions source -- either a proportions matrix in obsm whose rows sum to one, or the observations-by-cell-type CSV a deconvolution tool wrote. Required obs: none. SC reference: not needed (the deconvolution already used one). Image: not needed.'
      parameters:
        data_path:
          type: str
          required: true
          description: 'Path to the AnnData (.h5ad) to read, e.g. ./work/spatial_input/slide.h5ad.'
        obsm_key:
          type: str
          required: false
          default: ''
          description: 'The obsm matrix of per-spot cell-type proportions or abundances, by its key (e.g. ''proportions''); ''matrix:*'' is every column and ''matrix:column'' draws that one cell type. Empty uses the first obsm matrix whose rows sum to one. Rows that do not sum to one are drawn and captioned as abundances, never renormalised.'
        proportions_csv:
          type: str
          required: false
          default: ''
          description: 'A deconvolution''s own proportions table (observations by cell type). Empty reads a proportions matrix from obsm instead.'
        output_dir:
          type: str
          required: false
          default: ''
          description: 'Directory the figure, its record and the post-analysis manifest are written to. Empty resolves to ./work/spatial_viz (SOG_WORK_DIR honoured).'
        kind:
          type: str
          required: false
          default: 'maps'
          description: 'For differential expression: ''volcano'' (needs fold changes and adjusted p-values) or ''ranked'' (works from whatever statistic is stored). For deconvolution: ''maps'', ''dominant'' or ''summary''.'
        library_id:
          type: str
          required: false
          default: ''
          description: 'Which section or library to draw: a value of the object''s section column (library_id, slice_id, ...) or a key of uns[''spatial'']. Empty draws every observation. An image overlay on an object with several uns[''spatial''] libraries needs one named, and the refusal lists them.'
        ncols:
          type: int
          required: false
          default: 3
          description: 'Panels per row. At most 12 panels are drawn and the payload says how many were left out.'
        top_n:
          type: int
          required: false
          default: 9
          description: 'How many genes or cell types to show.'
        title:
          type: str
          required: false
          default: ''
          description: 'Figure title. Empty derives one from what was drawn.'
        figure_format:
          type: str
          required: false
          default: 'png'
          description: '''png'', ''svg'' or ''pdf''. PNG and SVG display in the answer; PDF is download-only. Above 50,000 marks the point layer is rasterised inside a vector file so the export stays servable.'
        dpi:
          type: int
          required: false
          default: 0
          description: 'Raster resolution. 0 uses the repository default of 200.'
        figure_id:
          type: str
          required: false
          default: ''
          description: 'A short name for this figure, used later by update_visualization. Empty derives a stable one, so re-running the same request overwrites rather than accumulating.'
    - spatialomicsgym_name: compose_figure
      description: 'Place several finished figures on one contact sheet that indexes them. [DATA REQUIREMENTS] Input:
        two or more .figspec.json records written beside figures this toolkit drew, comma separated. Each panel is an
        image of a figure drawn separately, on its own colour scale, so the caption states that panels are NOT comparable
        with one another. For a publication figure whose panels DO share a scale, draw it as one figure instead (for example
        plot_spatial_expression with several genes and share_scale). Required obs: none. SC reference: not needed. Image:
        not needed.'
      parameters:
        figure_specs:
          type: str
          required: true
          description: Comma-separated paths to the .figspec.json records of the figures to place.
        output_dir:
          type: str
          required: false
          description: Directory the figure, its record and the post-analysis manifest are written to. Empty resolves
            to ./work/spatial_viz (SOG_WORK_DIR honoured).
          default: ''
        ncols:
          type: int
          required: false
          default: 2
          description: Panels per row on the sheet.
        title:
          type: str
          required: false
          description: Sheet title. Empty composes one.
          default: ''
        figure_format:
          type: str
          required: false
          description: '''png'' for the chat card, ''svg'' for a vector figure with editable text.'
          default: png
        dpi:
          type: int
          required: false
          default: 0
          description: Raster resolution. 0 chooses one from the canvas size.
        figure_id:
          type: str
          required: false
          description: A readable slug for the figure's file and identity. Empty derives one from the request.
          default: ''
    - spatialomicsgym_name: export_visualization
      description: 'Re-render a figure for publication and ship the numbers it was drawn from beside it. [DATA REQUIREMENTS]
        Input: the .figspec.json record of a figure this toolkit drew; pass data_path as well to get a true re-render
        in the requested format rather than the file already on disk. SVG keeps text editable and is safe to serve inline;
        PDF is produced as a download because there is no viewer here. Required obs: none. SC reference: not needed. Image:
        not needed.'
      parameters:
        figure_spec:
          type: str
          required: true
          description: Path to the figure's .figspec.json record.
        output_dir:
          type: str
          required: false
          description: Directory the figure, its record and the post-analysis manifest are written to. Empty resolves
            to ./work/spatial_viz (SOG_WORK_DIR honoured).
          default: ''
        data_path:
          type: str
          required: false
          description: The dataset the figure was drawn from. Without it the export can only repackage the file already
            on disk, and says so.
          default: ''
        export_format:
          type: str
          required: false
          description: '''svg'' (vector, editable text), ''png'' (raster) or ''pdf'' (download).'
          default: svg
        dpi:
          type: int
          required: false
          default: 0
          description: Raster resolution. 0 chooses one from the canvas size.
        include_values:
          type: bool
          required: false
          default: true
          description: Write the plotted numbers beside the figure as a CSV.
        bundle:
          type: bool
          required: false
          default: false
          description: Also pack the figure, its values and its record into one zip.
    - spatialomicsgym_name: run_visualization_pipeline
      description: 'Inspect a dataset, draw the few figures worth drawing, and name what was left out. [DATA REQUIREMENTS]
        Input: one .h5ad. It starts from the recommendation rather than the catalogue and draws a small budgeted set --
        three for ''overview'', six for ''detailed'', two for ''focused'', four for ''publication'' -- so it never produces
        dozens of near-identical panels. Families that need you to name something (which genes, which result file) are
        reported under needs_a_choice rather than guessed at. This runs no analysis: every figure is drawn from what the
        dataset already holds. Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        data_path:
          type: str
          required: true
          description: Path to the AnnData (.h5ad) to report on.
        output_dir:
          type: str
          required: false
          description: Directory the figure, its record and the post-analysis manifest are written to. Empty resolves
            to ./work/spatial_viz (SOG_WORK_DIR honoured).
          default: ''
        depth:
          type: str
          required: false
          description: '''overview'' (3 figures), ''detailed'' (6), ''focused'' (2) or ''publication'' (4, vector by default).'
          default: overview
        question:
          type: str
          required: false
          description: What the reader wants to know. Used to order the recommendation, never to invent a figure.
          default: ''
        figure_format:
          type: str
          required: false
          description: '''png'' for the chat card, ''svg'' for a vector figure with editable text. Empty picks png, or svg at depth=''publication''.'
          default: ''
        dpi:
          type: int
          required: false
          default: 0
          description: Raster resolution. 0 chooses one from the canvas size.
    - spatialomicsgym_name: update_visualization
      description: 'Change an existing figure''s appearance or layout without redoing the analysis behind it. [DATA REQUIREMENTS] Input: the path of a .figspec.json this toolkit wrote, or of the figure beside it. The dataset is needed only for a change that selects different values, and only then. Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        figure_spec:
          type: str
          required: true
          description: 'Path to a figure''s .figspec.json, or to the figure itself -- the record beside it is used. Every figure this toolkit draws writes one.'
        set_params:
          type: str
          required: false
          default: ''
          description: 'Changes to apply, as ''key=value,key=value'' or a JSON object. A change of appearance or layout is served from the values frozen beside the figure and never reopens the dataset.'
        unset_params:
          type: str
          required: false
          default: ''
          description: 'Comma-separated parameter names to return to their default.'
        output_dir:
          type: str
          required: false
          default: ''
          description: 'Directory the figure, its record and the post-analysis manifest are written to. Empty resolves to ./work/spatial_viz (SOG_WORK_DIR honoured).'
        data_path:
          type: str
          required: false
          default: ''
          description: The dataset the figure was drawn from. A change of appearance or layout is redrawn
            from it as version two, beside version one; without it the new view is described but no image
            is written, and the reply says so.
        allow_reread:
          type: bool
          required: false
          default: true
          description: 'Whether a change that selects different values may reopen the dataset. False turns such a request into a refusal naming the parameter responsible, so a purely cosmetic edit is guaranteed free.'
    - spatialomicsgym_name: plot_spatial_3d
      description: 'Draw a reconstructed stack of serial sections in three dimensions -- the volume from three fixed angles, cells and mean value per depth, a value binned along an anatomical axis, or (view=interactive) the volume again plus a rotatable view for the portal. [DATA REQUIREMENTS] Input: one .h5ad holding more than one section. The z comes from a three-column coordinate key (obsm[''spatial_3d_aligned''], then obsm[''spatial_3d_raw'']) or, failing that, from the section axis in obs plus a recorded spacing; a stack with neither is refused rather than drawn at z = 0, 1, 2. Required obs: a section column when no three-column key exists. SC reference: not needed. Image: not used.'
      parameters:
        data_path:
          type: str
          required: true
          description: 'Path to the AnnData (.h5ad) holding the stack, e.g. ./work/spatial3d/aligned.h5ad.'
        view:
          type: str
          required: false
          default: scatter
          description: 'Which figure: ''scatter'' for the volume from three angles, ''depth'' for cells and mean value per z plane, ''axis'' for a value binned along one axis, ''interactive'' for the volume plus a data-only spec the portal renders in a frame the reader can turn (the static image is written too and is what the manifest declares).'
        genes:
          type: str
          required: false
          default: ''
          description: 'One gene symbol to colour the stack by. The first is used; these families paint one value across the whole volume rather than one panel per gene.'
        obs_key:
          type: str
          required: false
          default: ''
          description: 'An obs column to colour by instead of a gene. view=axis needs a continuous one and refuses a categorical column by name.'
        layer:
          type: str
          required: false
          default: ''
          description: 'Which layer to read the gene from. Empty resolves the slot and records why in the caption.'
        use_raw:
          type: bool
          required: false
          default: false
          description: 'Read .raw instead of X.'
        coords_key:
          type: str
          required: false
          default: ''
          description: 'Name the three-column obsm key to draw. Empty prefers spatial_3d_aligned, then spatial_3d_raw, then spatial_3d, and says in the caption which one fired.'
        section_key:
          type: str
          required: false
          default: ''
          description: 'The obs column naming each section. Empty looks for the usual names and for uns[''spatial_3d''][''slice_key''].'
        z_spacing:
          type: float
          required: false
          default: 0.0
          description: 'Distance between adjacent sections, in the units the coordinates are in. 0.0 means not given. It is used only when the object has no z of its own; a three-column coordinate key, a z column (obs[''slice_z''], obs[''z''], obs[''Bregma''], or the column uns[''spatial_3d''][''z_key''] names) and uns[''spatial_3d''][''z_spacing''] all come first. Numeric labels in any other section column (batch, library_id, slice_id) are ids, not positions. A stack with no z anywhere is refused, never stacked at those values.'
        axis:
          type: str
          required: false
          default: z
          description: 'Which axis view=axis bins along: x, y or z.'
        n_bins:
          type: int
          required: false
          default: 20
          description: 'How many bins the axis profile uses.'
        output_dir:
          type: str
          required: false
          default: ''
          description: 'Directory the figure, its record and the post-analysis manifest are written to. Empty resolves to ./work/spatial_viz (SOG_WORK_DIR honoured).'
        point_size:
          type: float
          required: false
          default: 0.0
          description: 'Marker size. 0.0 sizes it from the number of cells.'
        title:
          type: str
          required: false
          default: ''
          description: 'Figure title. Empty composes one from what is drawn.'
        figure_format:
          type: str
          required: false
          default: png
          description: 'png, pdf or svg.'
        dpi:
          type: int
          required: false
          default: 0
          description: 'Resolution. 0 uses the toolkit default.'
        figure_id:
          type: str
          required: false
          default: ''
          description: 'A readable slug for the figure''s file and identity. Empty derives one from the request.'
    - spatialomicsgym_name: plot_section_grid
      description: 'One panel per section, on one shared colour scale. [DATA REQUIREMENTS] Input: one .h5ad with obsm[''spatial''] and an obs column naming each section; an object holding a single section is refused, naming the plain tissue map instead. Use this on any multi-section object -- the tissue-map functions panel per gene, not per section, so a merged serial-section object comes out of them as every section overlaid in one frame. Required obs: a section column. SC reference: not needed. Image: not used.'
      parameters:
        data_path:
          type: str
          required: true
          description: 'Path to the AnnData (.h5ad) holding the sections.'
        genes:
          type: str
          required: false
          default: ''
          description: 'One gene symbol to paint in every panel.'
        obs_key:
          type: str
          required: false
          default: ''
          description: 'An obs column to paint instead of a gene. A categorical column is drawn by level.'
        layer:
          type: str
          required: false
          default: ''
          description: 'Which layer to read the gene from.'
        use_raw:
          type: bool
          required: false
          default: false
          description: 'Read .raw instead of X.'
        section_key:
          type: str
          required: false
          default: ''
          description: 'The obs column naming each section. Empty looks for the usual names.'
        ncols:
          type: int
          required: false
          default: 4
          description: 'Panels per row. The grid is capped and the number of sections left undrawn is named in the caption rather than silently truncated.'
        output_dir:
          type: str
          required: false
          default: ''
          description: 'Directory the figure, its record and the post-analysis manifest are written to.'
        title:
          type: str
          required: false
          default: ''
          description: 'Figure title. Empty composes one from what is drawn.'
        figure_format:
          type: str
          required: false
          default: png
          description: 'png, pdf or svg.'
        dpi:
          type: int
          required: false
          default: 0
          description: 'Resolution. 0 uses the toolkit default.'
        figure_id:
          type: str
          required: false
          default: ''
          description: 'A readable slug for the figure''s file and identity.'
    - spatialomicsgym_name: plot_alignment_qc
      description: 'One adjacent pair of sections, either side by side across two coordinate frames (mode=before_after) or overlaid at full size in one (mode=overlay), with the centroid offset of that pair reported in each. [DATA REQUIREMENTS] Input: one .h5ad with an obs column naming each section. mode=before_after needs TWO distinct coordinate frames -- typically obsm[''spatial_3d_raw''] and obsm[''spatial_3d_aligned''] -- and an object with only one is refused: an aligner that overwrote the coordinates it was given leaves nothing to compare, which is the same condition under which its alignment cannot be validated. mode=overlay needs only one frame, which is what makes it usable before any alignment has been run. Required obs: a section column. SC reference: not needed. Image: not used.'
      parameters:
        data_path:
          type: str
          required: true
          description: 'Path to the AnnData (.h5ad) holding the sections.'
        mode:
          type: str
          required: false
          default: before_after
          description: '''before_after'' draws two panels, one per coordinate frame. ''overlay'' draws the pair at full size in a single frame and needs only one set of coordinates.'
        coords_key:
          type: str
          required: false
          default: ''
          description: 'mode=overlay only: which obsm key to draw. Empty prefers the aligned frame, then the original, and the caption names the one that fired.'
        before_key:
          type: str
          required: false
          default: ''
          description: 'The obsm key holding the pre-alignment coordinates. Empty prefers spatial_3d_raw, then spatial.'
        after_key:
          type: str
          required: false
          default: ''
          description: 'The obsm key holding the aligned coordinates. Empty prefers spatial_3d_aligned, then spatial_aligned, then moscot_spatial_warp.'
        section_key:
          type: str
          required: false
          default: ''
          description: 'The obs column naming each section.'
        pair:
          type: str
          required: false
          default: ''
          description: 'Two section labels, comma-separated, e.g. S0,S1. Empty draws the first adjacent pair. A label the object does not have is refused with the list of the ones it does.'
        output_dir:
          type: str
          required: false
          default: ''
          description: 'Directory the figure, its record and the post-analysis manifest are written to.'
        title:
          type: str
          required: false
          default: ''
          description: 'Figure title. Empty composes one from the pair.'
        figure_format:
          type: str
          required: false
          default: png
          description: 'png, pdf or svg.'
        dpi:
          type: int
          required: false
          default: 0
          description: 'Resolution. 0 uses the toolkit default.'
        figure_id:
          type: str
          required: false
          default: ''
          description: 'A readable slug for the figure''s file and identity.'
  spatial3d:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spatial3d_mcp_server.py
    enabled: true
    benchmark_visible: false
    env:
      SPATIAL3D_PYTHON: /opt/conda/envs/spatialomicsgym_env/bin/python
      SPATIAL3D_WORKER: /workspace/epic-fermat/agent/tools/spatial3d_worker.py
    description: 'Decide whether a stack of serial sections needs aligning at all, and on what evidence, before anything moves a coordinate.'
    tools:
    - spatialomicsgym_name: diagnose_3d_stack
      description: 'Classify a stack of serial sections as A (already in a shared coordinate system), B (rigid misalignment), C (non-rigid deformation) or unknown, with the measured value and the calibrated threshold behind every criterion. Writes a diagnosis report and a per-pair metric table and modifies nothing. [DATA REQUIREMENTS] Input: one .h5ad holding two or more sections, with obsm[''spatial''] (two columns) and an obs column naming each cell''s section. Required obs: a section/slice column (slice_id, section, library_id, brain_section_label or Bregma are found automatically; name it with slice_key otherwise) and, for the section order, a z column (slice_z, z or Bregma) or an explicit slice_order. Without an order every adjacent-pair metric is refused, because which sections are adjacent is undefined. SC reference: not needed. Image: not needed.'
      parameters:
        data_path:
          type: str
          required: true
          description: Path to the multi-section .h5ad to diagnose. There is no default - pass the user's
            own file, for example ./work/spatial_input/serial_sections.h5ad.
        output_dir:
          type: str
          required: true
          description: Directory the diagnosis report and the per-pair metric table are written to. There
            is no default - pass a directory under the run's working directory, for example
            ./work/spatial3d_diagnosis.
        slice_key:
          type: str
          required: false
          default: ''
          description: 'The obs column naming each cell''s section. Empty searches slice_id, section, section_id, library_id, brain_section_label, Bregma and batch, and refuses listing the obs columns when none of them has two or more levels.'
        z_key:
          type: str
          required: false
          default: ''
          description: 'The obs column holding each section''s position along the stacking axis. Empty searches slice_z, z and Bregma. Without one the section order is unknown and the diagnosis asks for it rather than assuming the order rows appear in.'
        slice_order:
          type: str
          required: false
          default: ''
          description: 'Comma-separated section labels in physical order, when there is no z column. The order IS the stacking axis, so a wrong order is a wrong reconstruction that still produces a picture.'
        coords_key:
          type: str
          required: false
          default: spatial
          description: 'The obsm key holding the in-plane coordinates. Two columns; the third dimension comes from the section, never from this key.'
        n_genes:
          type: int
          required: false
          default: 8
          description: 'How many robust genes the expression-agreement metric uses. A gene qualifies only if it is detected in every section and its per-section mean is stable, so a gene carrying a batch effect is routed to the batch report instead.'
        skip_expression:
          type: bool
          required: false
          default: false
          description: 'Measure geometry only. The geometric verdict stands without it; what is lost is the check that matched locations agree biologically, which is what separates "these outlines coincide" from "this is the same tissue, continued".'
  spatial3d_inspector:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spatial3d_inspector_mcp_server.py
    enabled: true
    benchmark_visible: false
    env:
      SPATIAL3D_PYTHON: /opt/conda/envs/spatialomicsgym_env/bin/python
      SPATIAL3D_WORKER: /workspace/epic-fermat/agent/tools/spatial3d_worker.py
    description: 'Read what an object already says about its own 3D coordinates, and what the coordinate contract requires. Writes nothing.'
    tools:
    - spatialomicsgym_name: inspect_3d_coordinates
      description: 'List the coordinate keys an object holds, their shapes, which are three-column frames, whether a provenance block is present, and which contract rules the object currently breaks. [DATA REQUIREMENTS] Input: one .h5ad. Required obs: none. SC reference: not needed. Image: not needed. Writes nothing.'
      parameters:
        data_path:
          type: str
          required: true
          description: Path to the .h5ad to read. There is no default - pass the user's own file.
        coords_key:
          type: str
          required: false
          default: spatial
          description: 'The obsm key expected to hold the in-plane coordinates.'
    - spatialomicsgym_name: explain_3d_contract
      description: 'The 3D coordinate keys, roles, units and rules, so a caller need not infer them - including the rule that obsm[''spatial''] stays two columns and is never overwritten. [DATA REQUIREMENTS] Input: none. Required obs: none. SC reference: not needed. Image: not needed. Writes nothing.'
      parameters: {}
    - spatialomicsgym_name: list_aligner_adapters
      description: 'Where each shipped alignment tool leaves its answer, or the reason it cannot be read - which obsm key to open, whether the coordinates it was given can still be recovered from its output, and whether it exposed a random seed at all. [DATA REQUIREMENTS] Input: none. Required obs: none. SC reference: not needed. Image: not needed. Writes nothing.'
      parameters: {}
  paste2:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/paste2_mcp_server.py
    enabled: true
    benchmark_visible: false
    env:
      PASTE2_PYTHON: /opt/conda/envs/paste2/bin/python
      PASTE2_WORKER: /workspace/epic-fermat/agent/tools/paste2_worker.py
    description: 'PASTE2 partial optimal transport: align serial sections that overlap only partially, where PASTE''s full-overlap assumption drags the fit.'
    tools:
    - spatialomicsgym_name: paste2_partial_align
      description: 'Align serial sections that overlap only PARTIALLY, using PASTE2''s partial optimal transport. Use this instead of paste_pairwise_align when a section was torn, trimmed, or runs out along the axis - PASTE matches every spot to something, which drags the whole fit when the two sections do not cover the same tissue. [DATA REQUIREMENTS] Input: two or more .h5ad files in physical section order, each with obsm[''spatial''] (two columns) and expression in X. Required obs: none. SC reference: not needed. Image: not needed. Output: obsm[''spatial''] is left byte-identical to the input and the aligned coordinates go to obsm[''spatial_3d_aligned''] (three columns) when z_spacing is given, or obsm[''spatial_aligned''] (two columns) when it is not.'
      parameters:
        slice_h5ads:
          type: array
          required: true
          description: Two or more .h5ad paths in physical section order. There is no default - pass
            the user's own files. A comma-separated string is also accepted.
        output_dir:
          type: str
          required: true
          description: Directory the aligned slices, the coupling matrices and the overlap table are
            written to. There is no default - pass a directory under the run's working directory,
            for example ./work/paste2_alignment.
        s:
          type: float
          required: false
          default: 0.0
          description: 'Overlap fraction in (0, 1]: how much of the two sections actually covers the same tissue. 0.0 is the sentinel for ESTIMATE IT per adjacent pair - zero is not a legal overlap, so it cannot be confused with a request for none. The value used is reported per pair either way, because a pair aligned at 0.9 and a pair aligned at 0.3 are different claims about the tissue. The estimate always runs GLM-PCA (latent_dim=50) and 20 partial OT solves per pair, whatever dissimilarity is chosen; give s to skip it.'
        alpha:
          type: float
          required: false
          default: 0.1
          description: 'Weight on the spatial term against the expression term, as in PASTE.'
        dissimilarity:
          type: str
          required: false
          default: glmpca
          description: 'Expression dissimilarity: glmpca (upstream''s default, and an order of magnitude the slowest), kl, or euclidean. kl/euclidean speed up the alignment only, not the s=0.0 estimate.'
        armijo:
          type: bool
          required: false
          default: false
          description: 'Use an Armijo line search in the solver.'
        norm:
          type: bool
          required: false
          default: true
          description: 'Rescale the spatial distances so their maximum equals the maximum expression dissimilarity, which keeps alpha weighing comparable terms. It does not touch the expression matrices.'
        random_seed:
          type: int
          required: false
          default: 0
          description: 'PASTE2 exposes no seed of its own; this seeds numpy, which is what glmpca''s initialisation draws from.'
        z_spacing:
          type: float
          required: false
          default: 0.0
          description: 'Physical distance between consecutive sections, in the coordinates'' own units. 0.0 means NOT DECLARED, not zero apart: PASTE2 aligns in plane and cannot supply a z itself, and this package has no default spacing anywhere.'
    - spatialomicsgym_name: paste2_estimate_overlap
      description: 'Measure how much of each adjacent pair actually overlaps, and align nothing. A value near 1 means PASTE''s full-overlap assumption holds and PASTE is the cheaper tool; a low value is the evidence that it does not. [DATA REQUIREMENTS] Input: two or more .h5ad files in physical section order, each with obsm[''spatial''] and expression in X. Required obs: none. SC reference: not needed. Image: not needed. Output: overlap_fractions.csv only - no coordinates are written and no file is modified.'
      parameters:
        slice_h5ads:
          type: array
          required: true
          description: Two or more .h5ad paths in physical section order. There is no default - pass
            the user's own files.
        output_dir:
          type: str
          required: true
          description: Directory overlap_fractions.csv is written to. There is no default - pass a
            directory under the run's working directory.
        alpha:
          type: float
          required: false
          default: 0.1
          description: 'Weight on the spatial term, as in the alignment itself.'
  cast:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/cast_mcp_server.py
    enabled: true
    benchmark_visible: false
    env:
      CAST_PYTHON: /opt/conda/envs/cast/bin/python
      CAST_WORKER: /workspace/epic-fermat/agent/tools/cast_worker.py
    description: 'CAST: graph-neural embedding plus affine and free-form registration of serial sections at single-cell resolution.'
    tools:
    - spatialomicsgym_name: cast_align_slices
      description: 'Register serial sections onto a reference with CAST, allowing NON-RIGID deformation. Learns a graph-neural embedding per section, then fits an affine transform followed by a free-form deformation. Use when the diagnosis says class C - tearing, stretching or a deformation one global transform cannot undo - especially at single-cell resolution. Unlike stalign_align_points it consumes and produces AnnData rather than bare point clouds. [DATA REQUIREMENTS] Input: two or more .h5ad files in physical section order, each with obsm[''spatial''] (two columns) and expression in X; only genes present in EVERY slice are used, because the embedding is joint. Background spots (obs[''in_tissue''] == 0) are left out. Required obs: none. SC reference: not needed. Image: not needed. Output: obsm[''spatial''] is left byte-identical and the aligned coordinates go to obsm[''spatial_3d_aligned''] when z_spacing is given, or obsm[''spatial_aligned''] when it is not.'
      parameters:
        slice_h5ads:
          type: array
          required: true
          description: Two or more .h5ad paths in physical section order. There is no default - pass
            the user's own files.
        output_dir:
          type: str
          required: true
          description: Directory the aligned slices and the displacement table are written to. There
            is no default - pass a directory under the run's working directory, for example
            ./work/cast_alignment. CAST's own intermediate artefacts go to a cast_intermediate/
            subdirectory so they cannot be mistaken for the answer.
        reference_index:
          type: int
          required: false
          default: 0
          description: 'Which slice stays fixed, as an index into slice_h5ads. Every other section is warped onto it, so this choice changes the result.'
        epochs:
          type: int
          required: false
          default: 400
          description: 'Training epochs for the graph-neural embedding. Upstream''s default; measured at 61 s for two sections of 1,415 cells on CPU.'
        affine_iterations:
          type: int
          required: false
          default: 500
          description: 'Iterations of the affine stage.'
        ffd_iterations:
          type: int
          required: false
          default: 400
          description: 'Iterations of the free-form deformation. 0 gives an affine-only, rigid-ish alignment - the right setting when the diagnosis said class B rather than class C, because the free-form stage is what a rigid misalignment does not need.'
        graph_strategy:
          type: str
          required: false
          default: delaunay
          description: 'delaunay (this portal''s default: pure scipy and networkx, measured ~20x faster) or convex (upstream''s default, which routes through libpysal and emits a deprecation warning). The divergence is recorded in tuning/configs/official_defaults.yaml.'
        n_hvg:
          type: int
          required: false
          default: 3000
          description: 'Highly variable genes kept before embedding, chosen once across all slices so every slice is embedded over the same genes in the same order.'
        random_seed:
          type: int
          required: false
          default: 0
          description: 'Seeds numpy and torch.'
        z_spacing:
          type: float
          required: false
          default: 0.0
          description: 'Physical distance between consecutive sections, in the coordinates'' own units. 0.0 means NOT DECLARED, not zero apart: CAST registers in plane and cannot supply a z itself.'
