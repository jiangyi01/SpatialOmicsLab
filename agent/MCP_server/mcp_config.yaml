  gpsa:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/gpsa_mcp_server.py
    enabled: true
    description: GPSA (Gaussian Process Spatial Alignment) for aligning spatial transcriptomics slices into a shared latent space.
    env:
      GPSA_PYTHON: /opt/conda/envs/gpsa/bin/python
      GPSA_WORKER: /workspace/epic-fermat/agent/tools/gpsa_worker.py
    tools:
    - spatialomicsgym_name: gpsa_align_slices
      description: 'Align two spatial transcriptomics slices using GPSA (upstream gpsa.VariationalGPSA). Slice 1 is held fixed as the template and slice 2 is warped onto it, driven by n_top_genes highly variable genes chosen jointly over both slices with hvg_flavor. Spots with obs[''in_tissue''] == 0 (background glass in CELLxGENE Visium exports) are left out of both slices first and counted in params.in_tissue_filter and params.in_tissue_dropped_per_slice; the outputs and data.n_spots_slice1/2 cover the in-tissue spots only. Training is full-batch; batch_size is accepted and ignored. Aligned coordinates (gpsa_aligned_coordinates.csv and obsm[''spatial_aligned''] of both output h5ads) are in the units of obsm[spatial_key]; the [0, 1] training-frame values are kept in obsm[''spatial_aligned_normalized'']. Each output h5ad holds the genes both slices share, with X log-normalised. [DATA REQUIREMENTS] Input: two h5ad files with obsm[''spatial''] required and expression in X, or in the layer named by layer_key in both slices, or in adata.raw with use_raw_counts (raw counts for the default hvg_flavor seurat_v3). The expression is normalised as counts: negative or non-finite values are refused, non-integer values run with a warning. SC reference: not needed. Image: not needed.'
      parameters:
        slice1_h5ad:
          type: str
          required: true
          description: Path to the first AnnData (.h5ad) spatial slice.
        slice2_h5ad:
          type: str
          required: true
          description: Path to the second AnnData (.h5ad) spatial slice.
        output_dir:
          type: str
          required: true
          description: Directory for output files (aligned coordinates CSV, annotated h5ad).
        n_spatial_dims:
          type: int
          required: false
          default: 2
          description: Number of spatial dimensions (typically 2 for 2D tissue sections).
        n_latent_gps:
          type: int
          required: false
          default: 3
          description: Number of latent Gaussian processes for the alignment model.
        num_epochs:
          type: int
          required: false
          default: 500
          description: Number of training epochs for the variational GPSA model.
        learning_rate:
          type: float
          required: false
          default: 0.001
          description: Learning rate for the Adam optimizer.
        batch_size:
          type: int
          required: false
          default: 128
          description: 'Accepted for compatibility and ignored: GPSA trains full-batch (every spot of both slices at every step). Reported under params.ignored.'
        n_top_genes:
          type: int
          required: false
          default: 2000
          description: 'Number of highly variable genes, chosen jointly over both slices, that drive the alignment (capped at the number of shared genes).'
        layer_key:
          type: str
          required: false
          default: ''
          description: 'AnnData layer holding the expression, present in both slices (raw counts for the default hvg_flavor seurat_v3). A layer missing from either slice is an error. Empty string uses adata.X.'
        spatial_key:
          type: str
          required: false
          default: spatial
          description: Key in adata.obsm containing spatial coordinates.
        random_seed:
          type: int
          required: false
          default: 0
          description: Random seed for reproducibility.
        hvg_flavor:
          type: str
          required: false
          default: 'seurat_v3'
          description: 'Scanpy flavour for the joint HVG selection over both slices: seurat_v3 ranks raw counts and needs scikit-misc; seurat or cell_ranger rank log-normalised data. A flavour that cannot run stops the run; no other flavour is substituted.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Read both slices'' expression from adata.raw.X (raw counts) instead of X. Refused together with layer_key, or when a slice has no adata.raw or its adata.raw does not hold counts. Left false, X (or the layer_key layer) is used, and a negative or non-finite matrix is refused, naming this parameter when adata.raw holds counts. params.expression_source records the matrix used.'
  stalign:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/stalign_mcp_server.py
    enabled: true
    description: STalign spatial alignment via LDDMM diffeomorphic registration for point clouds and tissue images.
    env:
      STALIGN_PYTHON: /opt/conda/envs/stalign/bin/python
      STALIGN_WORKER: /workspace/epic-fermat/agent/tools/stalign_worker.py
    tools:
    - spatialomicsgym_name: stalign_align_points
      description: 'Align two point clouds using STalign LDDMM diffeomorphic registration. Rasterizes each cloud into a density image and jointly fits an affine transform and a diffeomorphism by matching the two images; no landmarks or point correspondences are used, so the two files may hold different points in any order. LDDMM starts from the identity with STalign''s default step sizes: offsets of a few percent of the clouds'' extent are recovered, a large translation or rotation only partly, so centre far-apart clouds first. Quality is reported as summary.density_overlap_before / _after (overlap of the smoothed point densities, 1 = identical, 0 = disjoint). [DATA REQUIREMENTS] Input: CSV point clouds with coordinates in (y,x) order, NOT (x,y). Does NOT use h5ad. Requires two point cloud files. Tool uses LDDMM diffeomorphic registration. SC reference: not needed. Image: not needed.'
      parameters:
        source_csv:
          type: str
          required: true
          description: Path to CSV with source point cloud coordinates (y, x columns).
        target_csv:
          type: str
          required: true
          description: Path to CSV with target point cloud coordinates (y, x columns).
        output_dir:
          type: str
          required: true
          description: Directory where outputs will be written (aligned CSV, transform, overlay plot).
        niter:
          type: int
          required: false
          default: 200
          description: Number of LDDMM iterations.
        a:
          type: float
          required: false
          description: 'LDDMM kernel width: the smoothness scale of the velocity field, in the coordinates'' units (must be positive). If omitted, one tenth of the larger extent of the two clouds (at least 1).'
    - spatialomicsgym_name: stalign_align_to_image
      description: 'Align a point cloud to a tissue image using STalign LDDMM registration. Rasterizes the point cloud into a density image and registers it against the grayscale tissue image on that image''s own pixel grid (row = y, column = x), with no landmarks, so point coordinates must be in the image''s pixel units. LDDMM runs with STalign''s default step sizes and no landmark initialisation, so its affine part barely moves; no alignment-quality measure is computed, so check stalign_overlay.png before using the coordinates. [DATA REQUIREMENTS] Input: point cloud CSV (y,x order) + tissue image. Tool rasterizes points and aligns to image via LDDMM registration. Does NOT use h5ad for points. SC reference: not needed. Image: required (target tissue image).'
      parameters:
        points_csv:
          type: str
          required: true
          description: Path to CSV with point cloud coordinates (y, x columns).
        image_path:
          type: str
          required: true
          description: Path to a tissue image (PNG, JPEG, or TIFF).
        output_dir:
          type: str
          required: true
          description: Directory where outputs will be written (aligned CSV, transform, overlay plot).
        niter:
          type: int
          required: false
          default: 200
          description: Number of LDDMM iterations.
  slat:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/slat_mcp_server.py
    enabled: true
    description: scSLAT graph neural network-based spatial alignment for matching cells/spots across two tissue slices.
    env:
      SLAT_PYTHON: /opt/conda/envs/slat/bin/python
      SLAT_WORKER: /workspace/epic-fermat/agent/tools/slat_worker.py
    tools:
    - spatialomicsgym_name: slat_align_slices
      description: 'Align two spatial transcriptomics slices using scSLAT. Learns spatial-aware embeddings via a graph convolutional network (run_SLAT) and matches every spot of the smaller slice to its most similar spot in the larger one (spatial_match, cosine nearest neighbour, no spatial smoothing); it pairs spots and moves no coordinates. [DATA REQUIREMENTS] Input: two h5ad files with obsm[''spatial''] required and raw counts in X; scSLAT normalises, log-transforms and selects genes (seurat_v3) itself, on the genes the two slices share. SC reference: not needed. Image: not needed. Output: slat_matching.csv with columns slice1_idx and slice2_idx (0-based row positions in slice 1 and slice 2), one row per spot of the smaller slice (slice 2 when the two are equal); params.matching_query_slice names the enumerated slice. params.feature_type and params.method name the features that ran, and params.n_genes_used the genes they were built from. Spots with obs[''in_tissue''] == 0 (background glass) are aligned like tissue, because the matching indexes the rows of the input files; params.n_spots_off_tissue_slice1 and params.n_spots_off_tissue_slice2 count them and a warning says so.'
      parameters:
        h5ad_path_1:
          type: str
          required: true
          description: Path to the first spatial AnnData (.h5ad) slice.
        h5ad_path_2:
          type: str
          required: true
          description: Path to the second spatial AnnData (.h5ad) slice.
        output_dir:
          type: str
          required: true
          description: Directory where outputs will be written (matching CSV, embeddings, alignment plot).
        k_cutoff:
          type: int
          required: false
          default: 10
          description: Number of neighbors for spatial graph construction.
        feature_type:
          type: str
          required: false
          default: DPCA
          description: 'Feature type for load_anndatas. One of ''DPCA'', ''PCA'', ''HVG''. DPCA is a dual PCA (50 dims) over the 12,000 most variable shared genes (seurat_v3, fixed inside scSLAT); PCA is
            a joint PCA (50 dims) over the 2,500 most variable. ''HVG'' fails in scSLAT 0.3.0 on every input (an upstream bug in load_anndatas), so it stops the run unless allow_feature_fallback is true.'
        epochs:
          type: int
          required: false
          default: 80
          description: Number of training epochs for the GAN model. scSLAT's own run_SLAT default is 6, the value its tutorials use, and its docstring advises not exceeding 10.
        allow_feature_fallback:
          type: bool
          required: false
          default: false
          description: 'Default false: when the requested feature_type cannot be built the run stops with scSLAT''s error. true: the run continues on the next type (DPCA -> PCA -> raw, PCA -> raw, HVG -> PCA
            -> raw; raw is the dense expression matrix of every shared gene), and params.feature_type, params.method and params.used_fallback say which one ran.'
  spiral:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spiral_mcp_server.py
    enabled: true
    description: 'SPIRAL spatial transcriptomics integration (batch correction by graph-based adversarial domain adaptation), and a two-slice coordinate mapping built on it (this wrapper''s per-cluster fused Gromov-Wasserstein; SPIRAL''s CoordAlignment is not run).'
    env:
      SPIRAL_PYTHON: /opt/conda/envs/spiral/bin/python
      SPIRAL_WORKER: /workspace/epic-fermat/agent/tools/spiral_worker.py
    tools:
    - spatialomicsgym_name: spiral_integrate
      description: 'Run SPIRAL batch correction / integration of multiple spatial transcriptomics slices (upstream spiral.main.SPIRAL_integration). Jointly embeds the slices into a shared latent space using a graph-based adversarial domain adaptation model, then clusters the embedding: leiden or louvain at resolution, or mclust with exactly n_clusters. louvain is scanpy''s sc.tl.louvain and needs the ''louvain'' package; where the SPIRAL environment cannot import it the run is refused before any training (use leiden), and no other method is substituted. [DATA REQUIREMENTS] Input: two or more h5ad files, each with obsm[''spatial''] holding (x, y); a third column is accepted only when it is constant within the slice (one plane) and refused when it varies. Spots marked obs[''in_tissue''] == 0 (background) are left out as each slice is read and counted in params.in_tissue_filter. X is used as given (no normalisation or gene selection) on the genes every slice shares; SPIRAL min-max scales each spot and holds that table dense, and a table this machine cannot hold is refused with the numbers rather than cut down. Required obs: none; cell-type labels are not used. SC reference: not needed. Image: not needed. Output: embeddings, corrected expression in SPIRAL''s per-spot min-max [0, 1] space (not counts), clusters, and an integrated h5ad whose obsm[''spatial''] is each slice''s own coordinates stacked, not a common frame. params.method names what ran; params.batch_size_effective and params.hidden_width give the values training used.'
      parameters:
        h5ad_paths:
          type: list
          required: true
          description: List of paths to .h5ad files, one per spatial slice. Each must have obsm['spatial']. At least 2 slices required.
        output_dir:
          type: str
          required: true
          description: Directory where SPIRAL outputs will be written.
        n_epochs:
          type: int
          required: false
          default: 200
          description: Number of training epochs for the integration model.
        hidden_dim:
          type: int
          required: false
          default: 32
          description: 'Hidden size unit: the autoencoder and GraphSAGE hidden layers are hidden_dim x 16 wide (512 at the default 32, the width of every upstream SPIRAL demo); reported as params.hidden_width.'
        latent_dim:
          type: int
          required: false
          default: 32
          description: Latent embedding dimension.
        knn:
          type: int
          required: false
          default: 6
          description: Number of nearest neighbors for spatial graph construction.
        batch_size:
          type: int
          required: false
          default: 1024
          description: Training batch size. A value not below the total spot count is halved so SPIRAL's neighbour extension can grow the batch; the value training used is params.batch_size_effective.
        n_clusters:
          type: int
          required: false
          default: 7
          description: Number of spatial domains, used by cluster_method 'mclust' only. leiden and louvain are resolution-driven and ignore it (listed in params.ignored).
        cluster_method:
          type: str
          required: false
          default: leiden
          description: 'Clustering method: ''leiden'', ''louvain'', or ''mclust''. ''louvain'' is scanpy''s sc.tl.louvain and needs the ''louvain'' package; where it cannot be imported the run is refused before training rather than failing after it.'
        device:
          type: str
          required: false
          default: auto
          description: 'Compute device: "auto", "cpu", "gpu"/"cuda", or "cuda:N" to pick a specific GPU. "auto" follows the hardware; a GPU request on a machine without CUDA degrades to CPU rather than failing.'
        resolution:
          type: float
          required: false
          default: 0.8
          description: Clustering resolution for cluster_method 'leiden' or 'louvain'; higher gives more domains. Ignored by 'mclust' (listed in params.ignored).
    - spatialomicsgym_name: spiral_align
      description: 'Map a second spatial slice into the first slice''s coordinate frame. Runs the same SPIRAL integration as spiral_integrate, clusters the joint embedding, then for each cluster present in both slices solves a fused Gromov-Wasserstein transport (POT) and moves each slice-2 spot to the transport-weighted mean of its slice-1 partners. This mapping is the wrapper''s own implementation: SPIRAL''s CoordAlignment, which also places slice-specific clusters with a Procrustes fit, is not run, and params.method says so. [DATA REQUIREMENTS] Input: two h5ad files, each with obsm[''spatial''] holding (x, y); spots marked obs[''in_tissue''] == 0 (background) are left out of both slices and counted in params.in_tissue_filter. Required obs: none; cell-type labels are not used. SC reference: not needed. Image: not needed. Output: slice-2 spots outside every shared cluster, or in a shared cluster with fewer than 2 spots in a slice, are not placed; their rows in the aligned coordinate table and obsm[''spatial_aligned''] are NaN, obs[''spiral_aligned''] is False, and data.n_spots_unaligned_slice_1 counts them. A run that places no spot fails.'
      parameters:
        h5ad_path_1:
          type: str
          required: true
          description: Path to the first (reference) spatial slice .h5ad; its coordinates are kept as they are.
        h5ad_path_2:
          type: str
          required: true
          description: Path to the second spatial slice .h5ad, the one that is moved.
        output_dir:
          type: str
          required: true
          description: Directory where alignment outputs will be written.
        n_epochs:
          type: int
          required: false
          default: 200
          description: Number of training epochs for the integration model.
        hidden_dim:
          type: int
          required: false
          default: 32
          description: 'Hidden size unit: the hidden layers are hidden_dim x 16 wide (512 at the default 32); reported as params.hidden_width.'
        latent_dim:
          type: int
          required: false
          default: 32
          description: Latent embedding dimension.
        knn:
          type: int
          required: false
          default: 6
          description: Number of nearest neighbors for spatial graph construction.
        batch_size:
          type: int
          required: false
          default: 1024
          description: Training batch size. A value not below the total spot count of both slices is halved; the value training used is params.batch_size_effective.
        n_clusters:
          type: int
          required: false
          default: 7
          description: Number of clusters to align through, used by cluster_method 'mclust' only; leiden and louvain ignore it (listed in params.ignored).
        cluster_method:
          type: str
          required: false
          default: leiden
          description: 'Clustering method: ''leiden'', ''louvain'', or ''mclust''. Only clusters present in both slices are mapped. ''louvain'' needs the ''louvain'' package; where it cannot be imported the run is refused before training.'
        alpha:
          type: float
          required: false
          default: 0.5
          description: Tradeoff in the fused Gromov-Wasserstein transport between expression cost and spatial structure (0 = expression only, 1 = spatial structure only).
        device:
          type: str
          required: false
          default: auto
          description: 'Compute device: "auto", "cpu", "gpu"/"cuda", or "cuda:N" to pick a specific GPU. "auto" follows the hardware; a GPU request on a machine without CUDA degrades to CPU rather than failing.'
        resolution:
          type: float
          required: false
          default: 0.8
          description: Clustering resolution for cluster_method 'leiden' or 'louvain'; higher gives more clusters to align through. Ignored by 'mclust' (listed in params.ignored).
  spatialglue:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spatialglue_mcp_server.py
    enabled: true
    description: SpatialGlue multi-omics spatial integration using graph attention networks with cross-modality correspondence learning.
    env:
      SPATIALGLUE_PYTHON: /opt/conda/envs/spatialglue/bin/python
      SPATIALGLUE_WORKER: /workspace/epic-fermat/agent/tools/spatialglue_worker.py
    tools:
    - spatialomicsgym_name: spatialglue_integrate
      description: 'Run SpatialGlue multi-omics spatial integration (the upstream Train_SpatialGlue trainer). Integrates two spatial omics modalities (RNA + protein, or RNA + ATAC/epigenome) into a unified latent embedding using a graph attention network, then clusters it (leiden/louvain at a fixed resolution, or mclust to n_clusters). louvain needs the louvain package and mclust needs rpy2 and an R with the mclust package: the chosen cluster_method is tried on a 40-point toy embedding before any data is read, and one that cannot run in the tool environment is refused then, naming what is missing, instead of after the training run; no other method is substituted. Spots are paired between the two inputs by barcode, never by row position. Preprocessing follows the upstream tutorials: RNA gets 3000 seurat_v3 highly variable genes, normalize_total, log1p, scale and PCA; protein gets CLR, scale and PCA; the ''Spatial-epigenome-transcriptome'' datatype runs LSI on the second modality instead of CLR. A combined 10x file (e.g. CytAssist Gene Expression + Antibody Capture in one X) is passed as both rna_h5ad and protein_h5ad and split by var[''feature_types'']. [DATA REQUIREMENTS] Input: spatial h5ad per modality with obsm[''spatial''] and raw counts in X (RNA counts; raw ADT counts for protein), or in adata.raw with use_raw_counts=true, or one combined 10x h5ad whose var[''feature_types''] separates the modalities. Multi-omics: two modalities (e.g., RNA + protein, RNA + ATAC). SC reference: not needed. Image: not needed.'
      parameters:
        rna_h5ad:
          type: str
          required: true
          description: 'Path to the first omics AnnData (.h5ad), spatial transcriptomics (RNA). Must have obsm[''spatial''] and raw counts in X (non-integer or negative values are refused; when the counts sit in adata.raw the refusal says so, and use_raw_counts=true reads them). If var has ''feature_types'' (10x), only the ''Gene Expression'' features are used. Spots either input marks obs[''in_tissue''] == 0 (background outside the tissue) are left out of both modalities and counted in data.n_spots_off_tissue_dropped, params.in_tissue_filter and a warning.'
        protein_h5ad:
          type: str
          required: true
          description: 'Path to the second omics AnnData (.h5ad): protein (CITE-seq/SPOTS/10x Antibody Capture, raw ADT counts in X) or ATAC/epigenome. Must have obsm[''spatial'']. Pass the same path as rna_h5ad for one combined 10x file; it is split by var[''feature_types''], and a file with nothing to split by is refused.'
        output_dir:
          type: str
          required: true
          description: Directory where SpatialGlue outputs will be written.
        datatype:
          type: str
          required: false
          default: 10X
          description: 'Upstream SpatialGlue preset, matched case-insensitively: ''10x'' (also ''10X''), ''SPOTS'', ''Stereo-CITE-seq'', ''Spatial-epigenome-transcriptome''; any other value is refused. It sets the loss weight factors (reported as params.weight_factors) and the second modality''s kind: the first three are protein, ''Spatial-epigenome-transcriptome'' is ATAC/epigenome (LSI).'
        epochs:
          type: int
          required: false
          default: 600
          description: Number of training epochs, always honoured. The upstream presets carry their own epoch counts (10x 200, SPOTS 600, Stereo-CITE-seq 1500, Spatial-epigenome-transcriptome 1600); that value is reported as params.epochs_preset and does not override this one.
        dim_output:
          type: int
          required: false
          default: 64
          description: Dimension of the output latent embedding.
        n_clusters:
          type: int
          required: false
          default: 7
          description: Number of spatial domains, used by cluster_method='mclust' only. Leiden and Louvain run at the given resolution and do not read it (it is then listed in params.ignored).
        n_neighbors:
          type: int
          required: false
          default: 3
          description: Nearest neighbours per spot for the spatial graph. Upstream fixes it at 6 for 'Stereo-CITE-seq' and 'Spatial-epigenome-transcriptome' (params.n_neighbors_spatial_effective reports the value used, and n_neighbors is then listed in params.ignored). The feature graph always uses k=20, fixed upstream.
        cluster_method:
          type: str
          required: false
          default: leiden
          description: 'Clustering method: ''leiden'' (needs leidenalg), ''louvain'' (scanpy''s default ''vtraag'' flavour, needs the louvain package) or ''mclust'' (needs rpy2 and an R with the mclust package). The chosen method is tried on a 40-point toy embedding before any data is read; one whose packages are missing in the tool environment is refused then, naming them, instead of after the training run. No other method is substituted.'
        resolution:
          type: float
          required: false
          default: 1.0
          description: Resolution parameter for leiden/louvain clustering; mclust does not read it.
        device:
          type: str
          required: false
          default: auto
          description: 'Compute device: "auto", "cpu", "gpu"/"cuda", or "cuda:N" to pick a specific GPU. "auto" follows the hardware; a GPU request on a machine without CUDA degrades to CPU rather than failing.'
        seed:
          type: int
          required: false
          default: 2022
          description: Random seed for numpy, torch and Python's random (PCA, model initialisation, training), set through SpatialGlue's fix_seed. Leiden/Louvain keep scanpy's fixed random_state=0 and mclust its fixed seed.
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Default false. True reads the counts of each input that carries adata.raw from it (refused when adata.raw does not hold counts); an input without adata.raw keeps its X, with a warning. For a CELLxGENE-style h5ad whose X is normalised or scaled. params.expression_source (RNA) and params.expression_source_omics2 report the matrix read ("X" or "raw.X"). The epigenome modality (LSI) reads X as supplied unless this asks for adata.raw.'
  stacker:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/stacker_mcp_server.py
    enabled: true
    description: 'Tissue section image registration: ANTsPy affine or SyN called directly, or a VoxelMorph VxmDense network whose trained weights the caller supplies (no upstream Stacker package runs).'
    env:
      STACKER_PYTHON: /opt/conda/envs/stacker/bin/python
      STACKER_WORKER: /workspace/epic-fermat/agent/tools/stacker_worker.py
    tools:
    - spatialomicsgym_name: stacker_register
      description: 'Register one tissue section image to another. No upstream Stacker package runs: mode ''affine'' and ''deformable'' call ANTsPy ants.registration (Affine / SyN) directly, and ''synthmorph'' runs a VoxelMorph VxmDense network whose trained weights you supply in model_path (none ship with the tool; without one the call stops unless allow_untrained_model_fallback is true). Writes stacker_warped.nii.gz, plus stacker_transform_<i>.<ext> (ANTs modes) or stacker_warp_field.npy (synthmorph, the full-resolution displacement field), all in image pixel space, not spot coordinates. params.method names what ran. [DATA REQUIREMENTS] Input: two tissue section images (PNG, JPEG, TIFF or NIfTI), not h5ad. SC reference: not needed. Image: tissue section images required.'
      parameters:
        moving_image_path:
          type: str
          required: true
          description: Path to the moving image file (PNG, JPEG, TIFF, or NIfTI). This image will be warped to align with the fixed image. Colour images are converted to 8-bit grayscale; single-channel 16- or 32-bit images are read at their full range.
        fixed_image_path:
          type: str
          required: true
          description: Path to the fixed (reference) image file (PNG, JPEG, TIFF, or NIfTI).
        output_dir:
          type: str
          required: true
          description: 'Directory where outputs will be written: stacker_warped.nii.gz, plus stacker_transform_<i>.<ext> (affine: stacker_transform_0.mat; deformable: stacker_transform_0.nii.gz and stacker_transform_1.mat) or stacker_warp_field.npy (synthmorph).'
        mode:
          type: str
          required: false
          default: affine
          description: 'Registration mode: ''affine'' (ANTsPy affine), ''deformable'' (ANTsPy SyN), or ''synthmorph'' (the VoxelMorph VxmDense network in model_path; the moving image is resampled onto the fixed shape and both are zero-padded to the multiple the U-Net needs, 16 by default, then cropped back).'
        model_path:
          type: str
          required: false
          description: 'Path to a trained 2-D VoxelMorph VxmDense model (.h5), for example one trained with SynthMorph. Required when mode=''synthmorph'': no weights ship with the tool, and a path that does not exist is an error. Ignored (listed in params.ignored) in the ANTsPy modes.'
        allow_untrained_model_fallback:
          type: bool
          required: false
          default: false
          description: 'mode=''synthmorph'' without model_path stops with an error by default. true runs a randomly initialised VxmDense instead (a near-identity warp, not a registration), flagged as params.used_fallback=true and params.model_trained=false. Ignored in the ANTsPy modes.'
  svca:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/svca_mcp_server.py
    enabled: true
    description: 'SVCA (Spatial Variance Component Analysis): an exact two-component FaST-LMM REML fit of each gene''s expression variance into a spatial fraction and residual noise, over every in-tissue spot of the slide (spots with obs[''in_tissue''] == 0 are background and are left out and reported). The environmental / cell-cell-interaction component of the published SVCA model is not estimated.'
    env:
      SVCA_PYTHON: /opt/conda/envs/spatialomicsgym_e1/bin/python
      SVCA_WORKER: /workspace/epic-fermat/agent/tools/svca_worker.py
    tools:
    - spatialomicsgym_name: svca_variance_decomposition
      description: 'Decompose gene expression variance into spatial components using SVCA. Fits an exact two-component FaST-LMM REML model per gene over every in-tissue spot of the slide: the spatial fraction (column intrinsic) and residual noise, which sum to 1. Spots with obs[''in_tissue''] == 0 are background outside the tissue and are left out first; params.in_tissue_filter, a warning and the analysis say how many. The environmental (cell-cell interaction) component of the published SVCA model is NOT estimated; that column is written empty. Reveals which genes have spatially structured expression patterns. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] (or the key named by spatial_key) and expression in X or raw.X. Tool decomposes gene expression variance into spatial components. Required obs: none (an optional obs[''in_tissue''] 0/1 flag marks background spots). SC reference: not needed. Image: not needed.'
      parameters:
        h5ad_path:
          type: str
          required: true
          description: 'Path to the spatial transcriptomics AnnData (.h5ad) file. Must contain spatial coordinates in obsm[spatial_key] and counts in X or raw.X (see use_raw_counts). An optional obs[''in_tissue''] 0/1 flag marks background spots (0), which are left out and reported in params.in_tissue_filter. The output column total_variance is the variance (ddof=1) of each gene''s normalised expression over the analysed spots.'
        output_dir:
          type: str
          required: true
          description: Directory where SVCA outputs will be written (variance decomposition CSV, summary CSV).
        spatial_key:
          type: str
          required: false
          default: spatial
          description: 'Key in adata.obsm storing spatial coordinates. A key that is not in obsm is an error that lists the keys the file has; no other key is substituted.'
        n_genes:
          type: int
          required: false
          description: 'Number of top highly variable genes to analyze. Leave it unset to analyze all genes; that is the right choice for almost every request, not just for benchmarking. Values below 100 are replaced with analyze-all-genes before the run, so a smaller cap is not honoured; the payload then lists n_genes under params.ignored with a warning. Capping picks genes by ranking them on variance, which biases any mean or range reported over the analysed genes upward -- a 649-gene MERFISH slide capped at 100 reported a mean intrinsic fraction of 0.38 where the whole slide gives 0.127 -- and lowers recall and F1 against curated SVG ground truth. Only set it when runtime is genuinely the bottleneck, and then use 500 or more.'
        seed:
          type: int
          required: false
          default: 0
          description: 'Seed for the random spot subset drawn when max_spots is set below the slide''s spot count. On such a run it decides which spots are analysed, so two runs with different seeds decompose different tissue and the subset cannot be recovered without it. No effect when every spot is analysed (the default); a non-zero seed on such a run is listed under params.ignored.'
        max_spots:
          type: int
          required: false
          description: 'Optional cap on the number of spots analysed. Leave unset (the default) to analyse every spot of the slide that is in tissue (spots with obs[''in_tissue''] == 0 are background and are always left out). When set below that count, a random subset of this many in-tissue spots (drawn with seed) is analysed instead, and the payload says so in params.subsampled_spots, a warning and the analysis text, which names the spot count and percentage because a random 3.2% of a slide reads exactly like all of it. The estimator is exact: it eigendecomposes a dense spot-by-spot kernel, holding about three n x n float64 matrices at once (24 n^2 bytes: ~0.6 GB at 5000 spots, ~9.6 GB at 20000) with time that grows as n^3. Before reading the expression matrix the worker estimates that memory and, if it exceeds what is available, refuses with both numbers; it never subsamples on its own.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Decompose adata.raw.X instead of X. Use it when X is log-normalised or scaled and the integer counts sit in adata.raw (CELLxGENE Visium exports). Refused when the file has no adata.raw or it does not hold counts. Without it X is used (raw.X when the file has no X); SVCA normalises the matrix as counts, so negative or non-finite values are refused, naming use_raw_counts when raw.X holds counts, and a non-integer matrix runs with a warning that it was normalised twice. params.expression_source and params.x_matrix_kind say which matrix ran and what X held.'
  spacet:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spacet_mcp_server.py
    enabled: true
    description: SpaCET hierarchical cell-type deconvolution of the tumor microenvironment with optional cell-cell interaction analysis.
    env:
      SPACET_PYTHON: /opt/conda/envs/spacet/bin/Rscript
      SPACET_WORKER: /workspace/epic-fermat/agent/tools/spacet_worker.R
    tools:
    - spatialomicsgym_name: spacet_deconvolution
      description: 'Run SpaCET cell-type deconvolution on spatial transcriptomics data. Performs hierarchical deconvolution of the tumor microenvironment, first inferring malignant cell fractions from the cancer_type signatures, then decomposing non-malignant cells into immune and stromal subtypes. Only the requested cancer type''s own copy-number and expression signatures are used; if neither marks a cluster malignant the run stops unless allow_signature_fallback is true, and the signature that ran is reported in params.malignant_signature and params.used_fallback. Outputs: spacet_proportions.csv (cell types x spots, for the spots left after SpaCET''s QC drops those with no detected gene; two levels in one table -- major lineages that sum to 1 per spot, named in data.major_lineages, and sub-lineages that split B cell, T CD4, T CD8, cDC and Macrophage, named in data.sub_lineages), spacet_object.rds, and with run_cci spacet_cci_colocalization.csv. Memory: SpaCET''s first stage holds the genes x spots matrix dense at every slide size, with at least three full copies at once (8 bytes per entry per copy: ~2.9 GB for 18,000 genes x 20,000 spots; from 20,001 spots SpaCET keeps only its ~17k reference genes, still ~69 GB per copy on a 507,684-bin VisiumHD slide); a run whose lower bound exceeds the available memory stops before SpaCET starts, with the numbers. [DATA REQUIREMENTS] Input: a Space Ranger folder (visium_path: filtered_feature_bc_matrix.h5 or filtered_feature_bc_matrix/ beside spatial/) or CSV files - counts_csv, coords_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. Raw counts required. SC reference: not needed (uses built-in reference profiles).'
      parameters:
        output_dir:
          type: str
          required: true
          description: 'Directory for SpaCET output files: spacet_proportions.csv, spacet_object.rds and, with run_cci, spacet_cci_colocalization.csv.'
        visium_path:
          type: str
          required: false
          description: 'Path to a 10X Visium Space Ranger output folder: filtered_feature_bc_matrix/ or filtered_feature_bc_matrix.h5 beside spatial/ (tissue_positions.csv, tissue_positions_list.csv with or
            without a header row, or tissue_positions.parquet). A .h5 is converted by the portal to a Matrix Market folder (the SpaCET env has no HDF5 reader). Only in-tissue spots are deconvolved, spots
            keep their barcodes, and only Gene Expression features are used. Use this OR counts_csv+coords_csv.'
        counts_csv:
          type: str
          required: false
          description: 'Path to gene expression counts CSV (genes x spots), raw counts, read block-wise into a sparse matrix. Use with coords_csv as alternative to visium_path. Missing or negative values are refused; non-integer values are named in a warning (SpaCET normalises its input itself).'
        coords_csv:
          type: str
          required: false
          description: 'Path to spot coordinates CSV (spots as rows, spot names in the first column). Rows are matched to the counts columns by name, in any order: rows for spots the counts do not have (e.g. off-tissue spots) are unused, and counts spots with no row are left out and reported. Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is, and so can Space Ranger 1''s headerless tissue_positions_list.csv (a first line that is a spot is read as one). When the file has an in_tissue column, counts spots it marks 0 (background) are left out, counted in data.n_spots_off_tissue and params.in_tissue_filter, and named in a warning.'
        cancer_type:
          type: str
          required: false
          default: BRCA
          description: 'Cancer type whose signatures SpaCET uses to find the malignant spots (e.g., ''BRCA'', ''LIHC'', ''PDAC'', ''CRC'', ''OV'', ''PRAD''; ''PANCAN'' for the pan-cancer expression
            signature). Its copy-number signature is tried first, then its expression signature; if neither marks a cluster malignant the run stops unless allow_signature_fallback is true. The signature
            used is reported as params.malignant_signature. From 20,000 spots SpaCET uses the copy-number signature alone, so the type must have one (PANCAN does not).'
        platform:
          type: str
          required: false
          default: Visium
          description: 'Spatial platform: ''Visium'', ''oldST'', or ''hiresST''.'
        organism:
          type: str
          required: false
          default: human
          description: 'Organism: ''human'' or ''mouse'' (mouse genes are mapped to human by SpaCET).'
        core_no:
          type: int
          required: false
          default: 1
          description: Number of CPU cores for parallel computation.
        run_cci:
          type: boolean
          required: false
          default: false
          description: 'If true, also run cell-cell interaction colocalization analysis and write spacet_cci_colocalization.csv. If that step fails the deconvolution is still returned, with the error
            in summary.cci_error, a warning and the analysis.'
        seed:
          type: int
          required: false
          default: 0
          description: 'Accepted and recorded, but it has no effect: SpaCET seeds its only random step itself (set.seed(123)), so the payload lists it under params.ignored.'
        allow_signature_fallback:
          type: boolean
          required: false
          default: false
          description: 'Whether to let SpaCET''s own signature cascade continue past the requested cancer type. Default false: if neither the copy-number nor the expression signature of cancer_type marks a
            cluster malignant, the run stops and says so. true accepts the pan-cancer expression signature and then, when nothing matches (as on non-tumour tissue), the 5% of spots with the most detected
            genes as the malignant reference (seq_depth); the payload names the signature in params.malignant_signature and sets params.used_fallback. No effect from 20,000 spots, where SpaCET has no
            cascade (then listed in params.ignored).'
  precast:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/precast_mcp_server.py
    enabled: true
    description: PRECAST spatially-aware clustering and multi-sample integration for spatial transcriptomics.
    env:
      PRECAST_PYTHON: /opt/conda/envs/precast/bin/Rscript
      PRECAST_WORKER: /workspace/epic-fermat/agent/tools/precast_worker.R
    tools:
    - spatialomicsgym_name: precast_spatial_clustering
      description: 'Run PRECAST spatially-aware clustering and multi-sample integration. Identifies shared spatial domains across samples even with batch effects. [DATA REQUIREMENTS] Input: 2 lists of CSV files, one entry per sample - counts_csvs, coords_csvs. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: not needed. Image: not needed. Neighbours: with platform=''auto'' (default) a coordinates file carrying array_row/array_col (Space Ranger tissue_positions.csv or the headerless tissue_positions_list.csv, or the converter''s metadata.csv) runs PRECAST''s Visium or ST grid, and pixel x/y (the converter''s coordinates.csv) runs its radius search (Other_SRT); the payload reports the platform that ran (params.platform) and the median neighbours per spot (data.median_neighbors). Spots with in_tissue == 0 in the coordinates file (background outside the tissue; the converter''s metadata.csv carries in_tissue, its coordinates.csv does not) are left out and reported (params.in_tissue_filter). Genes: CreatePRECASTObject selects up to gene_number spatially variable genes per sample with SPARK-X and lowers it, with a warning, when a sample has fewer; params.gene_number_used and data.n_genes_used report the genes the fit used, data.n_genes_read the genes in the counts.'
      parameters:
        counts_csvs:
          type: list
          required: true
          description: List of paths to gene expression count CSV files, one per sample (genes x spots).
        coords_csvs:
          type: list
          required: true
          description: 'List of paths to coordinate CSV files, one per sample (spots as rows, spot names in the first column, matching that sample''s counts columns). Must have same length as counts_csvs. Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is, and so can the headerless tissue_positions_list.csv (a first line that is a barcode followed only by numbers is read as a spot; six columns get Space Ranger''s names, three are read as barcode, x, y, and any other width is refused). The ST and Visium neighbour definitions read array_row/array_col when the file has them. When the file has an in_tissue column, spots with in_tissue == 0 (background outside the tissue) are left out and reported (params.in_tissue_filter and a warning); the converter''s metadata.csv carries in_tissue and array_row/array_col, its coordinates.csv only x/y. Spots in the counts with no coordinates row are left out and counted (data.n_spots_without_coordinates).'
        output_dir:
          type: str
          required: true
          description: Directory for PRECAST output files (cluster CSV, RDS object).
        K:
          type: int
          required: false
          default: 7
          description: Number of spatial domains (clusters) to identify.
        platform:
          type: str
          required: false
          default: auto
          description: 'How each spot''s neighbours are found: ''auto'', ''ST'', ''Visium'' or ''Other_SRT''. ''auto'' (default) reads the coordinates -- array_row/array_col (or an integer x/y pair) on a square grid runs ''ST'', on a hexagonal grid ''Visium'', anything else (e.g. the converter''s pixel coordinates.csv) ''Other_SRT'', PRECAST''s radius search. ''ST'' and ''Visium'' match neighbours at exact array-index offsets and stop with an error when the coordinates give none. params.platform is the definition that ran; data.median_neighbors describes the graph.'
        gene_number:
          type: int
          required: false
          default: 2000
          description: 'Number of spatially variable genes SPARK-X selects per sample (CreatePRECASTObject keeps the ones shared across samples, then filters genes seen in fewer than 15 spots). PRECAST lowers it, with a warning in the payload, when a sample has fewer; params.gene_number is the request, params.gene_number_used / data.n_genes_used the genes the fit used and data.n_genes_read the genes in the counts.'
        core_num:
          type: int
          required: false
          default: 1
          description: Number of CPU cores for parallel computation.
        max_iter:
          type: int
          required: false
          default: 50
          description: Maximum number of EM iterations.
        sigma_equal:
          type: boolean
          required: false
          default: false
          description: If true, assume equal covariance matrices across clusters.
        seed:
          type: int
          required: false
          default: 0
          description: Random seed for reproducibility; handed to PRECAST's own initialisation (AddParSetting seed=), which re-seeds itself before fitting.
        allow_fixed_number_fallback:
          type: boolean
          required: false
          default: false
          description: If true and the Other_SRT radius search fails ("radius.upper is too smaller", common below about 1,000 spots), build the graph from each spot's 6 nearest neighbours instead; the payload then reports params.adjacency_type='fixed_number', params.used_fallback=true and a warning. If false (default) that failure is an error naming this switch.
  cellpose_seg:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/cellpose_mcp_server.py
    enabled: true
    description: Cellpose cell segmentation for microscopy images.
    env:
      CELLPOSE_PYTHON: /opt/conda/envs/cellpose_env/bin/python
      CELLPOSE_WORKER: /workspace/epic-fermat/agent/tools/cellpose_worker.py
    tools:
    - spatialomicsgym_name: run_cellpose_segmentation
      description: 'Run Cellpose 4.x cell segmentation on a microscopy image (TIFF/PNG/JPG) with its one shipped model, cpsam (Cellpose-SAM), on CPU with float32 weights. Returns segmentation masks, cell outlines, cell count, and size statistics; the payload names the model that ran (params.model) and the rescale factor applied (params.image_scaling). The image is segmented at full resolution, never downscaled. [DATA REQUIREMENTS] Input: microscopy image (TIFF/PNG/JPG). NOT h5ad. SC reference: not needed. Image: required (microscopy image is the primary input).'
      parameters:
        image_path:
          type: str
          required: true
          description: 'Path to input image file (TIFF via tifffile; PNG, JPG and other formats via imageio). Read at full resolution: Pillow''s decompression-bomb limit is lifted for this file (a warning says so), and a run whose estimated memory exceeds what is available stops before loading, with the numbers.'
        output_dir:
          type: str
          required: false
          default: ./work
          description: Directory to save segmentation results.
        model_type:
          type: str
          required: false
          default: cpsam
          description: 'Kept for compatibility. Cellpose 4.x ships one model, cpsam, and selects nothing by this value: cyto3, nuclei, cyto2 or a model path do not change the result. A value other than cpsam is listed under params.ignored with a warning.'
        diameter:
          type: float
          required: false
          default: 30.0
          description: 'Typical cell diameter in pixels; the image is rescaled by 30/diameter before the network (cpsam is trained at 30 px). 0 means no rescaling, identical to 30: cellpose 4.x has no size model, so nothing is estimated. Negative values are refused.'
        channels:
          type: str
          required: false
          default: '[0,0]'
          description: 'Kept for compatibility. Cellpose 4.x takes no channel selection: cpsam reads the first 3 channels of the image as given. The value is echoed and listed under params.ignored.'
        flow_threshold:
          type: float
          required: false
          default: 0.4
          description: Flow error threshold for mask filtering.
        cellprob_threshold:
          type: float
          required: false
          default: 0.0
          description: Cell probability threshold (higher = fewer, more confident cells).
  clustermap:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/clustermap_mcp_server.py
    enabled: true
    description: ClusterMap cell segmentation for spatial transcriptomics spot data.
    env:
      CLUSTERMAP_PYTHON: /opt/conda/envs/clustermap_env/bin/python
      CLUSTERMAP_WORKER: /workspace/epic-fermat/agent/tools/clustermap_worker.py
    tools:
    - spatialomicsgym_name: run_clustermap
      description: 'Run ClusterMap cell segmentation on spatial transcriptomics spots. Assigns RNA spots to cells using density peak clustering on gene-weighted spatial coordinates, optionally guided by
        DAPI image. [DATA REQUIREMENTS] Input: transcript-level spots CSV, one row per molecule (spot_location_1, spot_location_2, gene; spot_location_3 for 3D). Tool assigns RNA spots to cells using
        density peak clustering; the assignments CSV keeps the genes and coordinates as supplied, with the input row as molecule_index. SC reference: not needed. Image: optional DAPI nuclear stain via
        dapi_image_path for nucleus-guided segmentation, in which case the coordinates must be whole 1-based pixel indices of that image; without one, nuclei are taken from a synthetic uniform grid
        over the spots and the coordinates are rounded to whole units, both reported in the payload.'
      parameters:
        spots_csv:
          type: str
          required: true
          description: 'Path to spots CSV, one row per molecule, with columns: spot_location_1, spot_location_2, gene (names or integer IDs), plus spot_location_3 for 3D.'
        output_dir:
          type: str
          required: false
          default: ./work
          description: Directory to save segmentation results.
        xy_radius:
          type: float
          required: false
          default: 1.0
          description: XY neighborhood radius for clustering.
        z_radius:
          type: float
          required: false
          default: 1.0
          description: Z neighborhood radius for 3D data. ClusterMap's density-peak search uses max(xy_radius, z_radius) even in 2D, so a z_radius above xy_radius widens a 2D search.
        num_dims:
          type: int
          required: false
          default: 2
          description: Number of spatial dimensions (2 or 3).
        min_spots:
          type: int
          required: false
          default: 5
          description: 'Smallest cell kept after segmentation: cells with fewer than min_spots assigned spots are erased.'
        dapi_image_path:
          type: str
          required: false
          default: ''
          description: Optional path to a single-channel DAPI image (TIFF) for DAPI-guided segmentation, (y, x) for 2D or (y, x, z) with z last for 3D. Spot coordinates must be whole 1-based pixel indices inside it; they are checked, never rounded.
  spicemix:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spicemix_mcp_server.py
    enabled: true
    description: SpiceMix spatial factorization for spatial transcriptomics.
    env:
      SPICEMIX_PYTHON: /opt/conda/envs/spicemix_env/bin/python
      SPICEMIX_WORKER: /workspace/epic-fermat/agent/tools/spicemix_worker.py
    tools:
    - spatialomicsgym_name: run_spicemix
      description: 'Run SpiceMix to decompose spatial gene expression into K metagene factors, jointly learning a metagene dictionary and per-spot factor loadings while accounting for spatial neighborhood structure (an undirected 6-nearest-neighbour graph over the spot coordinates). Each spot''s dominant factor is written to obs[''spicemix_factor'']. Spots with obs[''in_tissue''] == 0 (background outside the tissue) are left out and reported (params.in_tissue_filter). Integer counts in X are normalised as SpiceMix specifies, log(1 + 1e4 * E / spot total); genes detected in fewer than min_spots_per_gene spots are left out and counted (data.n_genes used, data.n_genes_input read). SpiceMix holds the spots x genes matrix densely in float64, so a matrix larger than the memory available (MemAvailable, or the room left under the cgroup memory limit) is refused with the numbers. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] (or obsm[''X_spatial'']) and raw counts (or non-negative log-normalised expression) in X. Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        spatial_h5ad_path:
          type: str
          required: true
          description: 'Path to spatial AnnData .h5ad with expression in .X and coordinates in obsm[''spatial''] (or obsm[''X_spatial'']). Non-negative integer counts are normalised as SpiceMix specifies, log(1 + 1e4 * E / spot total); any other non-negative X is used as supplied (taken to be normalised already, with a warning). Negative or non-finite values are refused. Spots with obs[''in_tissue''] == 0 are left out and reported (params.in_tissue_filter); data.n_spots counts the spots factorised.'
        output_dir:
          type: str
          required: false
          default: ./work
          description: Directory to save factorization results.
        K:
          type: int
          required: false
          default: 10
          description: Number of latent factors (metagenes) to learn.
        n_epochs:
          type: int
          required: false
          default: 100
          description: 'Total optimisation iterations: min(10, n_epochs // 2) NMF warm-up iterations (2 when n_epochs <= 5), then the rest (at least 1) with the spatial prior. Both counts are reported
            in params (init_nmf_iter, main_iter).'
        device:
          type: str
          required: false
          default: cpu
          description: 'Compute device: ''cpu'' or ''cuda''. A GPU request on a machine without CUDA runs on CPU, and the payload says so (params.device_requested and a warning).'
        min_spots_per_gene:
          type: int
          required: false
          default: 1
          description: 'Leave out genes detected (non-zero) in fewer than this many spots. The default 1 drops only genes that are zero in every spot; 0 keeps every gene. SpiceMix holds the spots x genes matrix densely in float64, so raising this is the knob that shrinks it; data.n_genes reports the genes used and data.n_genes_input the genes read. Every in-tissue spot is kept.'
  bidcell:
    enabled: true
    description: 'BIDCell deep learning cell segmentation for spatial transcriptomics imaging data. Runs a FastMCP wrapper in the spatialomicsgym_env environment and delegates segmentation to a dedicated BIDCell
      conda environment.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/bidcell_mcp_server.py
    env:
      BIDCELL_PYTHON: /opt/conda/envs/bidcell_env/bin/python
      BIDCELL_WORKER: /workspace/epic-fermat/agent/tools/bidcell_worker.py
    tools:
    - spatialomicsgym_name: run_bidcell
      description: "Run BIDCell cell segmentation on subcellular spatial transcriptomics data (a DAPI image plus a table of detected transcripts). BIDCell segments nuclei with Cellpose, trains its network on the sample itself for total_steps steps, and writes a cell label image and a cell x gene count matrix; the payload lists the files where BIDCell wrote them, and a run that wrote no segmentation is an error. Without config_path the worker builds the config from BIDCell's own Xenium template (transcript columns x_location, y_location, feature_name; 0.2125 um DAPI pixels; coordinates in um) and BIDCell writes under output_dir/bidcell_data; with config_path BIDCell reads every input and setting from that YAML file and the auto-config parameters are ignored. [DATA REQUIREMENTS] Input: input_dir holding one DAPI image (.tif) and one transcript table (.csv or .csv.gz in the Xenium layout), or a BIDCell YAML config via config_path. SC reference: required - a BIDCell-format reference CSV via sc_reference_csv plus pos_markers_csv and neg_markers_csv (or named inside config_path); BIDCell has no default reference. Image: required (a 2-D DAPI nuclear stain; an image with several focal planes is refused, see dapi_path).\n"
      parameters:
        input_dir:
          type: str
          required: true
          description: Directory holding one DAPI image (a .tif/.tiff whose name contains "dapi" or "morphology") and one transcript table (.csv/.csv.gz/.tsv/.tsv.gz whose name contains "transcript"). Read only; not used when config_path is given.
        output_dir:
          type: str
          required: true
          description: 'Directory for the auto-config and BIDCell''s working data (bidcell_data/): the cell label image is bidcell_data/model_outputs/<run>/test_output/epoch_1_step_<total_steps>_connected.tif and the cell x gene matrix bidcell_data/cell_gene_matrices/<run>/expr_mat.csv. Use a new directory per run.'
        config_path:
          type: str
          required: false
          default: ''
          description: Optional BIDCell YAML config file, used as is (inputs, reference, training settings and data_dir; outputs land under its files.data_dir). A path that is not a file is an error. When given, the auto-config parameters are ignored and listed in params.ignored.
        model_type:
          type: str
          required: false
          default: default
          description: 'Segmentation network, written to model_params.name. ''default'' is BIDCell''s own network (or the config file''s model_params.name with config_path); ''custom'' is BIDCell''s own network (needs patch_size divisible by 16); any other value must be a segmentation_models_pytorch encoder name such as ''resnet34'' (an untrained U-Net with that encoder, which needs patch_size divisible by 32).'
        sc_reference_csv:
          type: str
          required: false
          default: ''
          description: BIDCell single-cell reference CSV (one row per cell type, gene columns, then ct_idx, cell_type and atlas). Required unless config_path is given.
        pos_markers_csv:
          type: str
          required: false
          default: ''
          description: BIDCell positive-marker CSV (cell types x genes). Required unless config_path is given.
        neg_markers_csv:
          type: str
          required: false
          default: ''
          description: BIDCell negative-marker CSV (cell types x genes). Required unless config_path is given.
        dapi_path:
          type: str
          required: false
          default: ''
          description: 'DAPI image to use. Empty finds the single matching image in input_dir; several candidates (e.g. Xenium morphology.ome.tif and morphology_mip.ome.tif) are an error that asks for this parameter. The image must be 2-D (BIDCell reads its first two axes as height and width); a Z-stack such as Xenium morphology.ome.tif, found or given, is refused with its shape; use the maximum projection morphology_mip.ome.tif.'
        transcripts_path:
          type: str
          required: false
          default: ''
          description: Transcript table to use. Empty finds the single matching table in input_dir.
        elongated_cell_types:
          type: str
          required: false
          default: ''
          description: Comma-separated reference cell types that BIDCell treats as elongated (e.g. Endothelial,Fibroblasts,Myofibroblasts,SMC). Each must be a cell_type in the reference. Empty treats none as elongated.
        total_steps:
          type: int
          required: false
          default: 4000
          description: Training steps (BIDCell's default 4000); prediction uses the checkpoint saved at this step. Must be at most 1000 or a multiple of 1000, and smaller than the number of training patches the image yields, or the run stops with the counts.
        patch_size:
          type: int
          required: false
          default: 48
          description: 'Side in pixels of the transcript-map patches the network sees (48 in BIDCell''s Xenium template). BIDCell''s own network (model_type default or custom) needs a multiple of 16 and a segmentation_models_pytorch encoder a multiple of 32; any other value is refused before preprocessing starts.'
        shift_to_origin:
          type: bool
          required: false
          default: false
          description: Shift transcript coordinates so their minimum is (0, 0). True when the DAPI image is a crop that starts at the first transcript; False for a whole Xenium slide.
  stdgcn:
    enabled: true
    description: 'STdGCN spatial deconvolution via graph convolutional network. Estimates cell-type proportions for each spatial spot using a single-cell RNA-seq reference. Runs a FastMCP wrapper in spatialomicsgym_env
      and delegates computation to the STdGCN conda environment.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/stdgcn_mcp_server.py
    env:
      STDGCN_PYTHON: /opt/conda/envs/stdgcn_env/bin/python
      STDGCN_WORKER: /workspace/epic-fermat/agent/tools/stdgcn_worker.py
    tools:
    - spatialomicsgym_name: run_stdgcn
      description: 'Run STdGCN spatial deconvolution using a graph convolutional network to estimate cell-type proportions for each spatial spot, given a single-cell RNA-seq reference dataset. The spatial graph is built in spot pitches: obsm[''spatial''] is divided by its median nearest-neighbour distance and spots closer than 1.9 pitches are linked, whatever the platform''s unit; the payload reports params.spot_pitch and summary.n_spatial_edges, and two spots at one position are refused. STdGCN holds its graphs as dense matrices over every spot and pseudo-spot (10 per spot, at most 30000), so a run that cannot fit them in memory is refused with the numbers as soon as the slide is read, before anything is staged, never subsampled. Spots with obs[''in_tissue''] == 0 (background) are left out and counted in params.in_tissue_filter. Reference cells with a missing label are refused unless drop_unlabeled=true. [DATA REQUIREMENTS] Input: spatial h5ad with obsm[''spatial''] (two columns) and expression in X. SC reference: h5ad with cell-type labels in obs[cell_type_key]. Image: not needed.'
      parameters:
        spatial_h5ad_path:
          type: str
          required: true
          description: 'Path to spatial transcriptomics AnnData (.h5ad) with counts in .X and spatial coordinates in obsm[''spatial''].

            '
        sc_h5ad_path:
          type: str
          required: true
          description: 'Path to annotated single-cell reference AnnData (.h5ad) with cell-type labels in obs[cell_type_key].

            '
        output_dir:
          type: str
          required: true
          description: 'Directory to write deconvolution outputs (proportions CSV, dominant cell type CSV, annotated h5ad). The CSVs keep the reference''s cell-type labels; in the h5ad''s obs a label containing ''/'' (which HDF5 cannot hold as a key) is spelled with ''_'' instead, listed in params.annotated_h5ad_obs_columns_renamed.'
        cell_type_key:
          type: str
          required: false
          default: cell_type
          description: Column name in sc_h5ad.obs containing cell-type labels.
        n_epochs:
          type: int
          required: false
          default: 200
          description: Number of training epochs for the STdGCN model.
        device:
          type: str
          required: false
          default: CPU
          description: 'Compute device: ''CPU'' or ''GPU''.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Reference cells with a missing (NaN/empty) label are refused by default; true leaves them out and reports the count in params.n_reference_cells_dropped_unlabeled.'
  sedr:
    enabled: true
    description: 'SEDR spatial embedding via a variational graph autoencoder, then KMeans on that embedding for spatial domains (the domain labels are KMeans labels in both DEC modes). Runs a FastMCP
      wrapper in spatialomicsgym_env and delegates computation to the SEDR conda environment.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/sedr_mcp_server.py
    env:
      SEDR_PYTHON: /opt/conda/envs/sedr_env/bin/python
      SEDR_WORKER: /workspace/epic-fermat/agent/tools/sedr_worker.py
    tools:
    - spatialomicsgym_name: run_sedr
      description: 'Run SEDR spatial embedding, then KMeans(k=n_clusters) on that embedding for spatial domains. SEDR jointly models gene expression and a spatial kNN graph (k=12) with a variational graph autoencoder; the domain labels are KMeans labels in both modes -- using_dec=True only lets SEDR''s Deep Embedding Clustering refine the embedding toward 10 centroids (upstream''s default, not n_clusters). The payload names what ran under params.method and params.clustering_method. Spots with obs[''in_tissue''] == 0 (background outside the tissue, which CELLxGENE Visium exports ship beside it) are left out before anything runs and reported under params.in_tissue_filter with a warning; data.n_spots is the supplied count and data.n_spots_used the analysed one. Preprocessing is this wrapper''s own, not the upstream SEDR tutorial''s: genes detected in fewer than 3 spots are dropped, counts are normalised to 1e4 and log1p-transformed, the 3,000 most highly variable genes by hvg_flavor are kept (a cap fixed by the tool), and the scaled matrix is fed to SEDR densely with no PCA; the steps are listed under params.preprocessing. The payload reports the supplied panel as n_genes and the analysed panel as n_genes_used. Upstream SEDR builds its graph from dense spot-by-spot matrices (about 24 bytes x n_spots^2 at peak, measured); a slide that cannot fit in the memory available to the run (a cgroup limit included, its reclaimable page cache counted as free) is refused up front with the numbers, never subsampled. When the spatial plot cannot be drawn, output_files.spatial_plot_png is null and a warning says why. The preprocessing normalises X as counts, so X is checked before it runs: a negative or non-finite X (scaled or z-scored data, e.g. a CELLxGENE export whose counts sit in adata.raw) is refused, and the error says whether adata.raw holds counts; a non-negative non-integer X (already normalised or log-transformed) runs as before but is normalised a second time, with a warning; use_raw_counts=true runs on adata.raw.X instead. params.expression_source and params.x_matrix_kind say which matrix ran. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] required and raw counts in X (or in adata.raw, with use_raw_counts=true). Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        spatial_h5ad_path:
          type: str
          required: true
          description: 'Path to spatial transcriptomics AnnData (.h5ad) with raw counts in .X (or in adata.raw, with use_raw_counts=true) and spatial coordinates in obsm[''spatial''].'
        output_dir:
          type: str
          required: true
          description: 'Directory to write SEDR outputs (embedding, clusters CSV, annotated h5ad, spatial domain plot).

            '
        n_clusters:
          type: int
          required: false
          default: 7
          description: 'Number of spatial domains: the k of the KMeans run on the SEDR embedding. Must be between 1 and the number of in-tissue spots (checked before training).'
        using_dec:
          type: boolean
          required: false
          default: true
          description: 'Whether SEDR''s Deep Embedding Clustering step refines the embedding before KMeans. It does not change which method assigns the domains (always KMeans), and its centroid count
            is upstream''s default of 10, not n_clusters.'
        device:
          type: str
          required: false
          default: cuda
          description: 'PyTorch device string: ''cuda'' (preferred) or ''cpu''.'
        hvg_flavor:
          type: str
          required: false
          default: seurat
          description: 'Scanpy highly_variable_genes flavour for the top-3,000 gene selection: seurat (default; dispersion on log-normalised data, needs no extra package), cell_ranger, or seurat_v3
            (on the raw counts, as upstream SEDR does; needs scikit-misc, which the SEDR environment does not ship). A flavour whose dependency is missing stops the run with an error naming the package;
            the flavour is never switched silently.'
        use_raw_counts:
          type: boolean
          required: false
          default: false
          description: 'Run on the counts in adata.raw.X instead of X (obs and obsm are kept). Use it for a CELLxGENE-style h5ad whose X is log-normalised or scaled and whose integer counts sit in adata.raw; an h5ad without adata.raw, or whose adata.raw does not hold counts, is refused. Without it, a negative or non-finite X is refused and a non-integer X runs with a warning. Reported as params.expression_source ("X" or "raw.X") and params.use_raw_counts.'
  dstg:
    enabled: true
    description: 'DSTG-style spatial deconvolution with a TensorFlow 1.x graph convolutional network: a two-layer GCN over a kNN graph of spots + reference cells, trained on the reference cell-type labels
      (SpatialOmicsLab reimplementation; the upstream DSTG pseudo-spot pipeline is not run). Runs a FastMCP wrapper in spatialomicsgym_env and delegates computation to the DSTG conda environment (Python 3.7,
      TF 1.15.5).

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/dstg_mcp_server.py
    env:
      DSTG_PYTHON: /opt/conda/envs/dstg_env/bin/python
      DSTG_WORKER: /workspace/epic-fermat/agent/tools/dstg_worker.py
    tools:
    - spatialomicsgym_name: run_dstg
      description: 'DSTG-style deconvolution: a two-layer graph convolutional network over a kNN graph joining the spatial spots and the reference cells, trained on the reference cell-type labels and read out on the spots as per-type probabilities (SpatialOmicsLab reimplementation in the spirit of DSTG; the upstream DSTG pseudo-spot pipeline is NOT run, and the payload says so under params.method). Accepts .h5ad files and pre-formatted DSTG CSV directories. Spots whose obs[''in_tissue''] is 0 (background glass) are left out of the graph and of both CSVs and counted in params.in_tissue_filter. [DATA REQUIREMENTS] Input: spatial h5ad with expression in X. SC reference: h5ad with a cell-type label column (name it with cell_type_key unless it is one of cell_type / CellType / celltype / cell_type_key / annotation); a reference cell with a missing label is refused unless drop_unlabeled=true. Gene identifiers must match between the two inputs.'
      parameters:
        spatial_data_path:
          type: str
          required: true
          description: 'Path to spatial data: an AnnData .h5ad file or a directory containing DSTG-formatted files (mix_count.csv, mix_coord.csv).

            '
        sc_data_path:
          type: str
          required: true
          description: 'Path to single-cell reference data: an AnnData .h5ad file or a directory containing DSTG-formatted files (sc_count.csv, sc_labels.csv).

            '
        output_dir:
          type: str
          required: true
          description: 'Directory to write deconvolution outputs (dstg_proportions.csv, dstg_dominant_celltype.csv). No annotated h5ad is written.

            '
        n_clusters:
          type: int
          required: false
          default: 7
          description: k of the kNN graph over spots + reference cells that the GCN propagates on (the name is historical; reported as params.knn_k).
        learning_rate:
          type: float
          required: false
          default: 0.01
          description: Learning rate for the GCN training.
        epochs:
          type: int
          required: false
          default: 200
          description: Number of training epochs.
        cell_type_key:
          type: str
          required: false
          default: ''
          description: obs column of the single-cell reference holding the cell-type labels. Leave empty to try the conventional names (cell_type, CellType, celltype, cell_type_key, annotation); the run fails if none exists.
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Reference cells with a missing label (NaN/empty, or a categorical code of -1) are refused by default; true leaves them out and reports the count in params.n_reference_cells_dropped_unlabeled. A missing label is never fitted as a cell type.'
  spacel:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spacel_mcp_server.py
    enabled: true
    env:
      SPACEL_PYTHON: /opt/conda/envs/spacel_env/bin/python3.9
      SPACEL_WORKER: /workspace/epic-fermat/agent/tools/spacel_worker.py
    description: SPACEL multi-task spatial analysis (Splane for domain identification, Scube for 3D alignment).
    tools:
    - spatialomicsgym_name: run_spacel_splane
      description: 'Run SPACEL Splane for spatial domain identification on a single spatial transcriptomics AnnData (.h5ad). Splane clusters a graph-convolutional embedding of per-spot CELL-TYPE PROPORTIONS, not of gene expression: the h5ad must carry uns[''celltypes''] naming one float proportion column per cell type (e.g. from a deconvolution step), or pass celltype_key naming an obs label column to one-hot encode as a coarse stand-in. A spot with no label (NaN/empty in obs[celltype_key], or a NaN proportion in the uns[''celltypes''] columns) stops the run unless drop_unlabeled=true, which leaves it out and reports the count in data.n_spots_unlabeled_dropped. Spots with obs[''in_tissue''] == 0 (background) are left out and counted in params.in_tissue_filter; data.n_spots is the number supplied and data.n_spots_used the number clustered. Writes obs[''splane_cluster'']. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] and cell-type proportions in obs (see above). Required obs: proportion columns or the celltype_key column. SC reference: not needed. Image: not needed.'
      parameters:
        spatial_h5ad_path:
          type: str
          required: true
          description: Path to the spatial AnnData (.h5ad) file.
        output_dir:
          type: str
          required: true
          default: ./work
          description: Directory to write Splane outputs.
        n_clusters:
          type: int
          required: false
          default: 7
          description: Number of spatial domains to identify (KMeans on Splane's latent features).
        resolution:
          type: float
          required: false
          default: 1.0
          description: Accepted for backward compatibility and ignored; Splane has no resolution knob (reported under params.ignored).
        celltype_key:
          type: str
          required: false
          default: ''
          description: obs column of per-spot cell-type labels to one-hot encode into Splane's proportion input. Leave empty when the h5ad already carries uns['celltypes'] with proportion columns.
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'A spot with no label (NaN/empty in obs[celltype_key], or a NaN proportion in the uns[''celltypes''] columns) is refused by default; true leaves those spots out and reports the count in data.n_spots_unlabeled_dropped.'
    - spatialomicsgym_name: run_spacel_scube
      description: 'Run SPACEL Scube for 3D alignment of two or more spatial transcriptomics slices. Takes comma-separated h5ad paths. Scube aligns on a label column shared by every slice (cluster_key, or a conventional label column present in all slices); with none, set allow_joint_leiden to cluster the slices jointly first (params.used_fallback is then true). A spot with no label in that column stops the run unless drop_unlabeled=true, which leaves it out of its slice and reports the count in data.n_spots_unlabeled_dropped. Spots with obs[''in_tissue''] == 0 (background) are left out of every slice and counted in params.in_tissue_filter; the aligned slices (spacel_scube_aligned_slice_<i>.h5ad, obsm[''spatial_aligned'']) do not contain them. [DATA REQUIREMENTS] Input: comma-separated h5ad paths, each with obsm[''spatial'']. Required obs: a shared label column, or allow_joint_leiden. SC reference: not needed. Image: not needed.'
      parameters:
        spatial_h5ad_paths:
          type: str
          required: true
          description: Comma-separated paths to two or more spatial AnnData (.h5ad) files for 3D alignment.
        output_dir:
          type: str
          required: true
          default: ./work
          description: Directory to write Scube outputs.
        cluster_key:
          type: str
          required: false
          default: ''
          description: 'obs column present in every slice to align on. Empty: a conventional label column shared by all slices is used if one exists.'
        allow_joint_leiden:
          type: bool
          required: false
          default: false
          description: When no shared label column exists, cluster all slices jointly (one Leiden over the concatenated slices) and align on those labels. Off by default because the alignment then depends on those clusters.
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Spots with a missing (NaN/empty) label in the column the slices are aligned on are refused by default; true leaves them out of their slice and reports the count in data.n_spots_unlabeled_dropped.'
  cytospace:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/cytospace_mcp_server.py
    enabled: true
    description: CytoSPACE linear-assignment (lapjv) cell-to-spot assignment for spatial transcriptomics.
    env:
      CYTOSPACE_PYTHON: /opt/conda/envs/cytospace_env/bin/python3.9
      CYTOSPACE_WORKER: /workspace/epic-fermat/agent/tools/cytospace_worker.py
    tools:
    - spatialomicsgym_name: run_cytospace
      description: 'Run CytoSPACE to assign single cells from an scRNA-seq reference to spatial locations by linear assignment (lapjv) on a correlation cost. Converts h5ad inputs to tab-delimited text internally. How many cells of each type are placed is fixed in advance by a cell-type fractions table; upstream estimates it from the spatial data with R/Seurat, which this environment cannot run, so by default the fractions are the reference''s own label frequencies and the assigned composition mirrors the reference (params.cell_type_fraction_source says which source was used; pass cell_type_fractions_path to set it from the slide). Spot mode (default) places about mean_cell_numbers cells per location; set single_cell=true for segmented cells or Visium HD bins of 8 um or less. Locations with obs[''in_tissue''] == 0 (background) receive no cells; they are left out and counted in params.in_tissue_filter. A run whose estimated memory peak does not fit is refused with the numbers before anything is staged, never subsampled. [DATA REQUIREMENTS] Input: spatial h5ad with obsm[''spatial'']. SC reference: h5ad with cell-type labels in obs[cell_type_key]; every reference cell is used unless n_cells sets a cap.'
      parameters:
        sc_h5ad_path:
          type: str
          required: true
          description: Path to the scRNA-seq AnnData (.h5ad) with cell type annotations.
        spatial_h5ad_path:
          type: str
          required: true
          description: Path to the spatial AnnData (.h5ad) file.
        output_dir:
          type: str
          required: true
          default: ./work
          description: Directory to write CytoSPACE outputs.
        cell_type_key:
          type: str
          required: false
          default: cell_type
          description: Column in sc_h5ad.obs containing cell type labels.
        n_cells:
          type: int
          required: false
          default: 0
          description: 'Optional cap on reference cells. 0 (default) uses every cell; a positive value keeps that many, drawn at random with seed, and the cut is reported in the payload.'
        n_top_genes:
          type: int
          required: false
          default: 5000
          description: 'Match on the top N genes shared by both inputs, ranked by raw spatial variance (not a highly-variable-gene selection). Reduces the problem size for large panels. Set to 0 to match on every shared gene.'
        seed:
          type: int
          required: false
          default: 0
          description: Random seed for reproducibility.
        single_cell:
          type: bool
          required: false
          default: false
          description: 'Place exactly one reference cell per location (CytoSPACE --single-cell): use for segmented-cell data (Xenium, CosMx, MERFISH) and Visium HD bins of 8 um or less. False: Visium spot mode, several cells per location.'
        mean_cell_numbers:
          type: int
          required: false
          default: 5
          description: 'Spot mode only: mean number of cells per location (CytoSPACE --mean-cell-numbers; 5 suits Visium, about 20 legacy ST). Ignored, and listed in params.ignored, when single_cell is true.'
        cell_type_fractions_path:
          type: str
          required: false
          default: ''
          description: 'Optional table of cell-type fractions estimated from the spatial data: one row with cell types as columns, a spots x cell types proportion table (e.g. a deconvolution result; summed per type), or one column indexed by cell type. Types must be reference labels; a name that is the ''/''->''_'' rewrite deconvolution tools apply to exactly one reference label (SPOTlight''s Treg_Tfr for Treg/Tfr) is matched to it and listed in params.cell_type_fraction_names_matched. The spot-identifier column is found wherever it sits (first and unnamed, or named spot, barcode, spot_id, cell_id), so run_spotlight and run_card output (trailing spot column) is read as it is. A row with no value at all (a spot the deconvolution left without a composition) is left out and counted in params.cell_type_fraction_rows_without_values; a partly empty row is refused. Empty: the reference''s own label frequencies are used.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Leave out reference cells whose label is missing (NaN/empty) instead of stopping the run; the payload reports the count in data.n_sc_cells_unlabeled.'
        timeout_s:
          type: int
          required: false
          default: 1100
          description: 'Seconds the CytoSPACE solver subprocess may run before it is stopped (0 = no limit). The agent''s per-call budget also bounds the call.'
  celloscope:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/celloscope_mcp_server.py
    enabled: true
    description: Celloscope probabilistic deconvolution of spatial transcriptomics.
    env:
      CELLOSCOPE_PYTHON: /opt/conda/envs/celloscope_env/bin/python3.8
      CELLOSCOPE_WORKER: /workspace/epic-fermat/agent/tools/celloscope_worker.py
    tools:
    - spatialomicsgym_name: run_celloscope
      description: 'Run Celloscope, a Bayesian marker-gene model fitted by MCMC, to estimate cell-type proportions in spatial spots. The sampler is the upstream Celloscope code (one chain); its inputs are prepared by this wrapper. The binary marker matrix is derived from the single-cell reference (per cell type, the genes whose library-size-normalised mean is highest in that type, ranked by fold change over the next type, at most n_markers_per_type each, among genes counted on the slide; only those genes reach the model) and ends with the all-zero dummy type Celloscope requires. Each spot cell number comes from n_cells_csv or is the constant n_cells_per_spot (default 5), and is the centre of a Normal(n, 2) prior. Output: celloscope_proportions.csv (spots x reference cell types, rows sum to 1) from the point estimate chain01/thetas_est.csv, with the dummy type share removed and each spot renormalised; celloscope_h_with_dummy_type.csv keeps that share; chain01/result_h.csv is the MCMC trace, not a result. Memory: neither counts table is held whole; each is read a block of rows at a time (about 64 MB of values), so what stays in memory is the marker genes x spots matrix the model reads. [DATA REQUIREMENTS] Input: 3 CSV files - spatial_counts_csv (raw integer counts), sc_counts_csv, cell_type_labels_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: required, supplied as sc_counts_csv + cell_type_labels_csv (not h5ad), with at least two labelled cell types.'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: Path to spatial counts CSV (spots x genes), spot IDs in the first column. Raw integer counts; fractional, negative or missing values are refused.
        sc_counts_csv:
          type: str
          required: true
          description: Path to single-cell counts CSV (cells x genes), cell IDs in the first column.
        cell_type_labels_csv:
          type: str
          required: true
          description: Path to CSV with cell type labels for single-cell data. Cell IDs in the first column, matched to sc_counts_csv by ID; the label in the first data column. Unlabelled cells are left out of marker selection and counted in the payload.
        output_dir:
          type: str
          required: true
          default: ./work
          description: Directory to write Celloscope outputs.
        n_iterations:
          type: int
          required: false
          default: 1000
          description: Number of MCMC iterations (at least 6). The first max(5, n_iterations // 2) are burn-in; the estimate averages every max(1, n_iterations // 10)-th iteration after that. Celloscope's own example runs 15000; with too few the estimate stays near the sampler's random start, which the payload reports as data.mcmc_start_correlation and warns about above 0.5.
        n_markers_per_type:
          type: int
          required: false
          default: 20
          description: At most this many marker genes per cell type in the marker matrix.
        n_cells_per_spot:
          type: int
          required: false
          default: 5
          description: Cell-number estimate used for every spot when n_cells_csv is not given (1 suits single-cell-resolution data). Not used when n_cells_csv is given; a value other than 5 is then listed in params.ignored.
        n_cells_csv:
          type: str
          required: false
          default: ''
          description: Optional per-spot cell-number estimates, e.g. from nuclei segmentation. Spot IDs in the first column, then one count column or a cellCount column; must cover every spot with a whole number.
  scresolve:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/scresolve_mcp_server.py
    enabled: true
    description: 'Reference marker-gene scoring per spatial spot (tool name run_scresolve; upstream scResolve is not run and no resolution enhancement happens).'
    env:
      SCRESOLVE_PYTHON: /opt/conda/envs/scresolve/bin/python3.8
      SCRESOLVE_WORKER: /workspace/epic-fermat/agent/tools/scresolve_worker.py
    tools:
    - spatialomicsgym_name: run_scresolve
      description: 'Score every spatial spot for each reference cell-type marker signature. Upstream scResolve is NOT run: it super-resolves a slide from its paired histology image, which this tool does not take. No resolution enhancement happens; the output keeps one row per input spot (ratio 1.0), after spots with obs[''in_tissue''] == 0 (background glass, as in CELLxGENE Visium exports) are left out and counted in params.in_tissue_filter. What runs: Wilcoxon markers per reference cell type (scanpy rank_genes_groups, top 20, on the genes shared with the spatial data after normalize_total + log1p), then one score_<cell type> obs column per type on the spots (scanpy score_genes). [DATA REQUIREMENTS] Input: spatial h5ad with raw counts in X; Ensembl var_names are mapped to the reference''s symbols through the first gene-symbol var column (SYMBOL, feature_name, gene_symbols, gene_name, GeneName), named in params.gene_symbol_column. SC reference: h5ad with cell-type labels in obs (at least 2 types, 2 cells each). Output: scresolve_enhanced.h5ad (historical name), the spatial input plus the score columns; params.method names the method.'
      parameters:
        spatial_h5ad_path:
          type: str
          required: true
          description: 'Path to the spatial AnnData (.h5ad) file; raw counts in X are expected (a non-count X is flagged in the payload warnings). When its var_names are Ensembl IDs and the reference''s are symbols, they are mapped through its first gene-symbol var column (SYMBOL, feature_name, gene_symbols, gene_name, GeneName), named in params.gene_symbol_column; spots with obs[''in_tissue''] == 0 are left out and counted.'
        sc_h5ad_path:
          type: str
          required: true
          description: 'Path to the scRNA-seq AnnData (.h5ad) reference; its labelled cell types define the marker signatures.'
        output_dir:
          type: str
          required: true
          default: ./work
          description: 'Directory to write the output h5ad (scresolve_enhanced.h5ad).'
        cell_type_key:
          type: str
          required: false
          default: cell_type
          description: Column in sc_h5ad.obs containing cell type labels.
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Drop reference cells whose cell_type_key label is missing (NaN/empty) and report how many. Default false: a missing label stops the run, because it is not a cell type.'
  cellpie:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/cellpie_mcp_server.py
    enabled: true
    description: 'CellPie intNMF: a reference-free topic model of a spatial slide (spot x topic loadings, not cell types).'
    env:
      CELLPIE_PYTHON: /opt/conda/envs/cellpie_env/bin/python3.9
      CELLPIE_WORKER: /workspace/epic-fermat/agent/tools/cellpie_worker.py
    tools:
    - spatialomicsgym_name: run_cellpie
      description: 'Run CellPie intNMF, a reference-free topic model of a spatial transcriptomics slide. It factorises the spot x gene expression (normalize_total + log1p) jointly with a spot x image-feature matrix in obsm[''features''] into n_components non-negative topics. cellpie_proportions.csv has one row per in-tissue spot and columns topic_0..topic_{n-1} (row-normalised loadings); topics are latent expression programmes, NOT cell types, and no scRNA-seq reference is used (sc_h5ad_path and cell_type_key are accepted for compatibility and listed in params.ignored). Background spots (obs in_tissue == 0, as CELLxGENE Visium exports carry them) are left out before fitting and reported in params.in_tissue_filter; data.n_spots counts the spots factorised and data.n_spots_supplied the spots in the file. [DATA REQUIREMENTS] Input: spatial h5ad with raw counts in X (or in adata.raw, with use_raw_counts=true). An X with negative or NaN values (scaled / z-scored) is refused and the error says whether adata.raw holds counts; a non-integer X (log-normalised) runs with a warning; params.expression_source / x_matrix_kind say which matrix ran. Without obsm[''features''] (true of every library slide) the run stops unless the caller opts in: allow_expression_only_fallback=true runs upstream''s expression-only mode (mod1_skew=2); allow_pca_image_fallback=true lets |PCA of expression| stand in for image features. Either is reported in params.method with params.used_fallback=true.'
      parameters:
        spatial_h5ad_path:
          type: str
          required: true
          description: Path to the spatial AnnData (.h5ad) file.
        sc_h5ad_path:
          type: str
          required: false
          default: ''
          description: 'Optional, accepted for compatibility only. CellPie is reference-free: the file is not read, and
            when given it is listed in params.ignored.'
        output_dir:
          type: str
          required: true
          default: ./work
          description: Directory to write CellPie outputs.
        n_components:
          type: int
          required: false
          default: 10
          description: Number of NMF topics (the topic_0..topic_{n-1} columns of the proportions table).
        cell_type_key:
          type: str
          required: false
          default: cell_type
          description: Accepted for compatibility only; no reference is read, so it has no effect (listed in params.ignored
            when a reference is passed or the value is changed).
        epochs:
          type: int
          required: false
          default: 20
          description: intNMF optimisation epochs (upstream default 20).
        allow_expression_only_fallback:
          type: bool
          required: false
          default: false
          description: 'If true and the spatial h5ad has no obsm[''features''], run upstream''s expression-only mode (mod1_skew=2)
            instead of stopping. Reported as params.used_fallback=true.'
        allow_pca_image_fallback:
          type: bool
          required: false
          default: false
          description: 'If true and the spatial h5ad has no obsm[''features''], let |PCA of the log-normalised expression| stand
            in for image features (the expression is then factorised twice). Expression-only wins when both are true. Reported
            as params.used_fallback=true.'
        hvg_flavor:
          type: str
          required: false
          default: seurat
          description: 'HVG flavour used only by the PCA image-feature fallback: seurat (default) or seurat_v3 (needs a working
            scikit-misc in the cellpie env; a broken or missing package stops the run rather than switching flavour).'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Factorise the counts in adata.raw.X instead of X. Use it for a CELLxGENE-style h5ad whose X is log-normalised or scaled and whose integer counts sit in adata.raw; an h5ad without adata.raw, or whose adata.raw does not hold counts, is refused. params.expression_source says which matrix ran (X or raw.X).'
  destvi:
    enabled: true
    label: "DestVI \u2013 scvi-tools deconvolution"
    description: 'DestVI (Destination Variational Inference) is a deconvolution method from scvi-tools that uses a conditional deep generative model to estimate cell-type proportions per spatial spot. It
      first trains a CondSCVI model on a scRNA-seq reference to learn cell-type-specific gene expression distributions, then uses DestVI to map those distributions onto spatial transcriptomics data. Outputs
      include cell-type proportions per spot and an annotated spatial h5ad.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/destvi_mcp_server.py
    env:
      PYTHONUNBUFFERED: '1'
      DESTVI_PYTHON: /opt/conda/envs/destvi_env/bin/python
      DESTVI_WORKER: /workspace/epic-fermat/agent/tools/destvi_worker.py
    tools:
    - spatialomicsgym_name: run_destvi
      description: 'Run DestVI (scvi-tools) deconvolution to infer cell-type proportions from spatial transcriptomics data using a scRNA-seq reference. Trains CondSCVI on the reference, then DestVI on the spatial data. Outputs: destvi_proportions.csv (cell-type fractions per in-tissue spot) and destvi_spatial.h5ad (annotated spatial AnnData with proportions in obsm). Spatial spots with obs[''in_tissue''] == 0 (background) are left out and reported in params.in_tissue_filter; data.n_spots_supplied is the slide supplied and data.n_spots the in-tissue spots deconvolved (the rows of the outputs). Both models fit their input as counts: an input with negative or NaN values (a scaled X) is refused, and the error says whether its adata.raw holds counts; a fractional one (e.g. log-normalised) runs with a warning; use_raw_counts=true reads adata.raw of each input that has one. The matrix each input was read from is params.expression_source / x_matrix_kind (slide) and params.reference_expression_source / reference_x_matrix_kind (reference). [DATA REQUIREMENTS] Input: spatial h5ad with raw counts in X (or in adata.raw, with use_raw_counts=true). SC reference: h5ad with raw counts in X (or in adata.raw) and cell-type labels in an obs column (specified via cell_type_key, default ''cell_type''); reference cells with a missing label stop the run unless drop_unlabeled is true. Genes: the reference''s most variable genes by hvg_flavor (default seurat), reported as params.hvg_flavor. batch_key is accepted for compatibility only and never used: CondSCVI is always trained without a batch covariate. Spots with no counts in the model genes cannot be fitted (DestVI''s likelihood turns NaN on them), so they are left out of the fit and keep an all-zero proportions row, which is not a composition; they are counted in data.n_spots_no_counts_in_model_genes (data.n_spots_fitted counts the spots fitted) and named in warnings.'
      parameters:
        sc_h5ad_path:
          type: str
          required: true
          description: Path to the scRNA-seq reference AnnData (.h5ad) with cell-type labels.
        spatial_h5ad_path:
          type: str
          required: true
          description: Path to the spatial transcriptomics AnnData (.h5ad), e.g. 10x Visium.
        output_dir:
          type: str
          required: false
          default: ./work
          description: Directory where DestVI results will be saved.
        cell_type_key:
          type: str
          required: false
          default: cell_type
          description: obs column in scRNA AnnData containing cell-type labels.
        batch_key:
          type: str
          required: false
          default: batch
          description: 'Accepted for compatibility only; it never reaches the model. CondSCVI is always trained without a batch
            covariate (DestVI.from_rna_model cannot load a batch-aware decoder), so no batch correction is applied whether or not
            the column exists. When the column exists in the reference, or another value is passed, it is listed under params.ignored.'
        max_epochs_sc:
          type: int
          required: false
          default: 100
          description: Max training epochs for CondSCVI on single-cell data.
        max_epochs_st:
          type: int
          required: false
          default: 2000
          description: Max training epochs for DestVI on spatial data.
        n_top_genes:
          type: int
          required: false
          default: 2000
          description: Number of highly variable genes to select for training.
        hvg_flavor:
          type: str
          required: false
          default: seurat
          enum:
          - seurat
          - cell_ranger
          - seurat_v3
          description: 'scanpy flavour that ranks the reference genes: seurat (default; log-normalised dispersion, what every
            earlier run in destvi_env used), cell_ranger, or seurat_v3 (raw counts; needs scikit-misc, which destvi_env does not
            ship, so a missing package stops the run rather than switching flavour). CondSCVI always trains on raw counts. The
            flavour that ran is params.hvg_flavor.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Default false: reference cells whose cell_type_key label is missing (NaN, empty, ''nan'') stop the run
            with their count. True leaves them out and reports how many (params.n_reference_cells_dropped_unlabeled,
            data.n_cells_sc_used).'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Read counts from adata.raw instead of X, for each of the two inputs that carries an adata.raw (an input without one keeps X, with a warning; when neither has one the parameter is listed in params.ignored). Use it when an h5ad''s X is log-normalised or scaled and its integer counts sit in adata.raw (CELLxGENE exports). params.expression_source (slide) and params.reference_expression_source (reference) say which matrix each input was read from.'
  celldart:
    enabled: true
    label: "CellDART \u2013 domain adaptation deconvolution"
    description: 'CellDART uses adversarial domain adaptation to transfer cell-type annotations from a scRNA-seq reference to spatial transcriptomics spots. It predicts cell-type fractions per spot using
      a neural network with domain adaptation loss. CellDART works well when the reference and spatial data come from different distributions.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/celldart_mcp_server.py
    env:
      PYTHONUNBUFFERED: '1'
      CELLDART_PYTHON: /opt/conda/envs/celldart_env/bin/python
      CELLDART_WORKER: /workspace/epic-fermat/agent/tools/celldart_worker.py
    tools:
    - spatialomicsgym_name: run_celldart
      description: 'Run CellDART domain-adaptation deconvolution on spatial transcriptomics data using a scRNA-seq reference. CellDART trains on a marker panel, not on the full gene panels: the union of each cell type''s top num_markers Wilcoxon markers in the reference that are also on the spatial panel; both objects are cut to it before pseudo-spots are mixed. The payload reports the supplied panels as n_genes_sc / n_genes, the ranked markers as n_marker_genes and the genes trained on as n_genes_used. Spatial spots with obs[''in_tissue''] == 0 (background) are left out and reported in params.in_tissue_filter; n_spots is the slide supplied and n_spots_used the in-tissue spots deconvolved (the rows of the outputs). CellDART normalises both inputs as counts (normalize_total, then log1p): an input with negative or NaN values (a scaled X) is refused, a fractional one (e.g. log-normalised) runs with a warning, and use_raw_counts=true reads adata.raw of each input that has one (reported as params.counts_source). Cell-type labels that become one name once ''/'' and '' '' turn into ''_'' (''T cell'' and ''T_cell'') are refused before training. Outputs: celldart_proportions.csv (cell-type fractions per in-tissue spot); celldart_spatial.h5ad (annotated spatial AnnData with proportions in obsm); celldart_marker_genes.csv (gene, marker_for, used_for_training). [DATA REQUIREMENTS] Input: spatial h5ad with raw counts in X (or in adata.raw, with use_raw_counts=true). SC reference: h5ad with cell-type labels and raw counts in X (or in adata.raw); reference cells whose label is missing, ''nan'' or empty are dropped before training, and the payload reports the supplied count as n_cells_sc and the trained-on count as n_cells_sc_used. Tool uses domain adaptation for deconvolution.'
      parameters:
        sc_h5ad_path:
          type: str
          required: true
          description: Path to the scRNA-seq reference AnnData (.h5ad) with cell-type labels.
        spatial_h5ad_path:
          type: str
          required: true
          description: Path to the spatial transcriptomics AnnData (.h5ad), e.g. 10x Visium.
        output_dir:
          type: str
          required: false
          default: ./work/celldart_output
          description: Directory where CellDART results will be saved.
        cell_type_key:
          type: str
          required: false
          default: cell_type
          description: obs column in scRNA AnnData containing cell-type labels.
        gpu:
          type: bool
          required: false
          default: false
          description: Whether to use GPU for training (default false = CPU only).
        num_markers:
          type: int
          required: false
          default: 20
          description: 'Top Wilcoxon marker genes kept per cell type. CellDART trains on the union of these that are on the spatial panel (at most num_markers x the number of cell types genes), reported as n_genes_used.'
        nmix:
          type: int
          required: false
          default: 20
          description: 'Number of single cells mixed per synthetic pseudo-spot. Default 20 is this wrapper''s choice; the CellDART tutorial uses 8 and pred_cellf_celldart defaults to 10.'
        npseudo:
          type: int
          required: false
          default: 20000
          description: 'Total number of pseudo-spots synthesized for training (paper: 20000).'
        alpha:
          type: float
          required: false
          default: 0.6
          description: 'Adversarial domain-classifier loss weight (paper: 0.6).'
        alpha_lr:
          type: int
          required: false
          default: 5
          description: 'Learning-rate multiplier on the domain classifier (paper: 5).'
        emb_dim:
          type: int
          required: false
          default: 64
          description: 'Embedding dimension of the shared feature extractor.'
        batch_size:
          type: int
          required: false
          default: 64
          description: 'Mini-batch size for adversarial training. Default 64 is this wrapper''s choice; the CellDART tutorial and pred_cellf_celldart use 512.'
        n_iterations:
          type: int
          required: false
          default: 3000
          description: 'Adversarial training iterations (paper: 3000). Lower values (e.g. 500) produce systematically
            degraded predictions.'
        init_train_epoch:
          type: int
          required: false
          default: 10
          description: 'Pre-training epochs on the source-only classifier (paper: 10).'
        seed_num:
          type: int
          required: false
          default: 0
          description: 'Seed for the pseudo-spot mixing (which cells go into each pseudo-spot). CellDART does not seed its network weights or its minibatch draws, and it orders the marker genes through a Python set, so two runs with the same seed_num can differ.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Read counts from adata.raw instead of X, for each of the two inputs that carries an adata.raw (an input without one keeps X, with a warning). Use it when an h5ad''s X is log-normalised or scaled and its integer counts sit in adata.raw (CELLxGENE exports). params.counts_source says which matrix each input was read from.'
  bulk2space:
    enabled: true
    label: "Bulk2Space - NNLS spot deconvolution (upstream Bulk2Space not run)"
    description: 'Per-spot cell-type proportions by non-negative least squares (NNLS) against the scRNA-seq reference''s per-cell-type mean expression. Upstream Bulk2Space is NOT run: no VAE, no generated single cells, no bulk profile and no single-cell-resolution mapping; params.method names NNLS. Runs in a Python 3.8 environment with older numpy/pandas pins.'
    command:
    - python
    - /workspace/epic-fermat/agent/tools/bulk2space_mcp_server.py
    env:
      PYTHONUNBUFFERED: '1'
      BULK2SPACE_PYTHON: /opt/conda/envs/bulk2space_env/bin/python
      BULK2SPACE_WORKER: /workspace/epic-fermat/agent/tools/bulk2space_worker.py
    tools:
    - spatialomicsgym_name: run_bulk2space
      description: 'Estimate per-spot cell-type proportions by NNLS on the scRNA-seq reference''s cell-type mean expression (upstream Bulk2Space is not run; the output is a per-spot proportion table, not single-cell resolution). Gene selection: the max_genes shared genes with the highest variance across reference cells (default 1000; 0 keeps every shared gene), reported in params and the analysis text. Background spots (obs[''in_tissue''] == 0, every array spot of a CELLxGENE Visium export) are left out and counted (params.in_tissue_filter, data.n_spots_supplied); they have no row in either output. Spatial coordinates are not read; no cells or spots are subsampled. Outputs: bulk2space_proportions.csv (cell-type fractions per spot) and bulk2space_spatial.h5ad (spatial AnnData with the proportions in obsm[''bulk2space_proportions''] and one obs column per cell type). [DATA REQUIREMENTS] Input: spatial h5ad with expression in X, on the same scale as the reference (NNLS does not normalise it, so normalised data is accepted). SC reference: h5ad with cell-type labels in obs (cell_type_key).'
      parameters:
        sc_h5ad_path:
          type: str
          required: true
          description: Path to the scRNA-seq reference AnnData (.h5ad) with cell-type labels.
        spatial_h5ad_path:
          type: str
          required: true
          description: Path to the spatial transcriptomics AnnData (.h5ad), e.g. 10x Visium.
        output_dir:
          type: str
          required: false
          default: ./work
          description: Directory where Bulk2Space results will be saved.
        cell_type_key:
          type: str
          required: false
          default: cell_type
          description: obs column in scRNA AnnData containing cell-type labels.
        max_genes:
          type: int
          required: false
          default: 1000
          description: 'Number of shared genes, ranked by variance across reference cells, that the NNLS is solved on. Set 0 to keep every shared gene. The selection is reported in params (max_genes, gene_selection, n_genes_used) and in the analysis text.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Reference cells with a missing label (NaN/empty) stop the run by default; true leaves them out and reports how many were dropped (params.n_cells_sc_unlabeled_dropped).'
  spatialscope:
    enabled: true
    label: "SpatialScope \u2013 single-cell resolution spatial deconvolution"
    description: 'SpatialScope Stage-1 Cell-Type Identification (CTI): the upstream WarmStart (utils_pyRCTD create_RCTD + run_RCTD, doublet_mode=full, an RCTD port) run on CPU through a ray pool, giving
      per-spot cell-type proportions. Stage-2 diffusion decomposition to single cells is GPU-only and is not run; no TensorFlow or PyTorch model and no pretrained weights are used. If the SpatialScope
      checkout, its utils_pyRCTD module or its extdata likelihood tables are unusable the tool returns status=dep_missing; the NNLS substitute runs only with allow_nnls_fallback=True and is then named
      in params.method.'
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spatialscope_mcp_server.py
    env:
      PYTHONUNBUFFERED: '1'
      SPATIALSCOPE_PYTHON: /opt/conda/envs/spatialscope_env/bin/python
      SPATIALSCOPE_WORKER: /workspace/epic-fermat/agent/tools/spatialscope_worker.py
    tools:
    - spatialomicsgym_name: run_spatialscope
      description: 'Run SpatialScope Stage-1 Cell-Type Identification (CTI WarmStart, RCTD-style, CPU) for spot-level deconvolution of spatial transcriptomics data with a scRNA-seq reference. Outputs: spatialscope_proportions.csv (cell-type fractions per scored spot) and spatialscope_spatial.h5ad (annotated spatial AnnData with proportions in obsm). [DATA REQUIREMENTS] Input: spatial h5ad with counts in X (or log1p, see input_scale; or in adata.raw, with use_raw_counts=true) and obsm[''spatial'']. SC reference: h5ad with cell-type labels. A matrix with negative or NaN values (scaled / z-scored) is refused and the error says whether adata.raw holds counts; a non-integer matrix taken as counts is named in warnings. Background spots (obs in_tissue == 0) are left out and reported in params in_tissue_filter; duplicated barcodes or gene names are renamed and reported. RCTD scores a spot only when its UMI total over the shared genes is at least UMI_min = min(100, UMI_min_sigma), published as params UMI_min; unscored spots are counted in data n_spots_scored and in a warning. Per-spot proportions only: the single-cell-resolution Stage-2 is GPU-only and is not run. Memory: upstream needs dense shared-genes x spots and shared-genes x cells frames; they are priced before allocation against the memory available (MemAvailable, capped by a cgroup memory limit) and the run refuses with the numbers when they do not fit. Nothing is subsampled.'
      parameters:
        sc_h5ad_path:
          type: str
          required: true
          description: Path to the scRNA-seq reference AnnData (.h5ad) with cell-type labels.
        spatial_h5ad_path:
          type: str
          required: true
          description: Path to the spatial transcriptomics AnnData (.h5ad), e.g. 10x Visium.
        output_dir:
          type: str
          required: false
          default: ./work/spatialscope_output
          description: Directory where SpatialScope results will be saved.
        cell_type_key:
          type: str
          required: false
          default: cell_type
          description: obs column in scRNA AnnData containing cell-type labels.
        UMI_min_sigma:
          type: int
          required: false
          default: 300
          description: 'The UMI total a spot needs to take part in fitting the noise parameter sigma of the RCTD step SpatialScope warm-starts from (SpatialScope''s own default is 300). On a low-UMI platform such as Slide-seqV2 a 300-UMI floor can leave no spots for that estimate and fail the run; lower it (100 is what the standalone RCTD tool uses) for those slides. It is not the scoring floor: a spot is scored only when its UMI total over the shared genes is at least UMI_min = min(100, UMI_min_sigma), published as params.UMI_min; the spots below it are counted in a warning.'
        n_cpus:
          type: int
          required: false
          description: 'Number of ray workers. Default leaves 2 CPUs of headroom on whatever this process is actually
            allowed (affinity mask / cgroup quota, not the machine''s core count). Each worker''s BLAS is pinned to
            one thread, so the workers do not oversubscribe the cores.'
        allow_nnls_fallback:
          type: bool
          required: false
          default: false
          description: 'If True, fall back to scipy.optimize.nnls per-spot regression when SpatialScope cannot run: the
            source or its likelihood tables are missing, utils_pyRCTD cannot be imported, or the CTI run itself raises
            (the reason is in warnings). Off by default: enabling this changes the reported method name to ''SpatialScope
            (NNLS fallback)'' and sets params.used_fallback so downstream consumers can tell the difference.
            Recommended: leave off.'
        input_scale:
          type: str
          required: false
          default: auto
          description: 'Scale of X in both h5ads. auto (default) follows upstream SpatialScope: a matrix whose maximum is below 30 is taken as log1p and un-logged with expm1 (the reference is then re-normalised), except that a matrix whose values are all whole numbers is always kept as counts. counts never un-logs; log1p always un-logs and refuses a matrix whose maximum is 30 or more. A non-integer matrix taken as counts (maximum 30 or more under auto, or on request under counts) runs with a warning; a matrix with negative or NaN values is refused under every setting. The decision for each matrix is reported in params (spatial_scale, reference_scale, spatial_unlogged, reference_unlogged, spatial_matrix_kind, reference_matrix_kind) and in warnings.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Default false: reference cells with a missing cell-type label (NaN or empty) stop the run with an
            error naming the count. true leaves them out and reports how many (params.n_unlabeled_dropped).'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Run on adata.raw.X instead of X. The spatial h5ad must carry an adata.raw holding counts (refused otherwise); the reference is read from its adata.raw when it has one, and a warning says when it has none. Use it for CELLxGENE-style exports whose X is log-normalised or scaled. params.expression_source and params.reference_expression_source say which matrix each input ran on (X or raw.X).'
  spotlight:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spotlight_mcp_server.py
    enabled: true
    description: SPOTlight NMF-based cell type deconvolution for spatial transcriptomics using a scRNA-seq reference.
    env:
      SPOTLIGHT_PYTHON: /opt/conda/envs/spotlight_env/bin/Rscript
      SPOTLIGHT_WORKER: /workspace/epic-fermat/agent/tools/spotlight_worker.R
    tools:
    - spatialomicsgym_name: run_spotlight
      description: 'Run SPOTlight NMF deconvolution to estimate cell type proportions per spatial spot using seeded non-negative matrix factorization with a scRNA-seq reference. SPOTlight pairs NMF topics with cell types by position, so the worker hands the reference cells over grouped in sorted cell-type order (params.reference_cells_regrouped_by_type); a cell type left with no seed gene (no marker expressed in both datasets, or every top-n_top marker also in another type''s top list) starts unseeded and is listed in summary.cell_types_without_usable_markers. [DATA REQUIREMENTS] Input: 4 CSV files - spatial_counts_csv, spatial_coords_csv, ref_counts_csv, ref_celltypes_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: required, supplied as ref_counts_csv + ref_celltypes_csv (not h5ad).'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: Path to spatial counts CSV (genes x spots).
        spatial_coords_csv:
          type: str
          required: true
          description: 'Path to spatial coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is, and so can the headerless tissue_positions_list.csv of Space Ranger 1 (params.coordinates_header says how the first line was read). When the file carries an in_tissue column, spots of the counts marked 0 (background) are left out and counted in params.in_tissue_filter and the warnings.'
        ref_counts_csv:
          type: str
          required: true
          description: Path to scRNA-seq reference counts CSV (genes x cells).
        ref_celltypes_csv:
          type: str
          required: true
          description: Path to cell type annotations CSV (cell_id, cell_type).
        output_dir:
          type: str
          required: true
          description: Directory for SPOTlight output files.
        n_top:
          type: int
          required: false
          default: 100
          description: 'Number of top marker genes per cell type, ranked by mean.AUC, that seed the NMF topic of that cell type (passed to SPOTlight as n_top). A cell type with fewer markers uses all of them.'
        min_cont:
          type: float
          required: false
          default: 0.09
          description: 'Per-spot proportion threshold in [0, 1], passed to SPOTlight as min_prop. In each spot a cell type whose share is below it is set to zero and the remaining shares are rescaled to sum to 1; a spot in which every cell type falls below it is written as NA and counted in summary.n_spots_without_proportions.'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Reference cells whose label is missing (NA, empty, nan, none) are refused by default; true leaves them out and reports the count in data.n_ref_cells_unlabeled_dropped.'
  celina:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/celina_mcp_server.py
    enabled: true
    description: CELINA cell type-specific spatially variable gene detection.
    env:
      CELINA_PYTHON: /opt/conda/envs/celina_env/bin/Rscript
      CELINA_WORKER: /workspace/epic-fermat/agent/tools/celina_worker.R
    tools:
    - spatialomicsgym_name: run_celina
      description: 'Run CELINA to detect spatially variable genes whose spatial expression patterns are associated with specific cell types. Requires pre-computed cell type proportions (e.g. from SPOTlight or RCTD). Only the counts spots that have a coordinate row, are on the tissue (a 0/1 in_tissue flag in the coordinates file) and have a proportion row are tested; data.n_spots_in_counts, data.n_spots_without_coordinates, data.n_spots_off_tissue_dropped and data.n_spots_without_proportions account for every counts spot, and any cut adds a warning and a NOTE to the analysis (RCTD and CARD leave low-count spots out of their proportions). [DATA REQUIREMENTS] Input: 5 CSV files - spatial_counts_csv, spatial_coords_csv, cell_proportions_csv, sc_counts_csv, sc_celltype_labels_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: REQUIRED -- CELINA derives the marker gene list for each cell type from it; ALSO supply pre-computed proportions as cell_proportions_csv (e.g. from run_spotlight or spacexr_rctd_deconvolution). Image: not needed.'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: Path to spatial counts CSV (genes x spots).
        spatial_coords_csv:
          type: str
          required: true
          description: 'Path to spatial coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so a Space Ranger tissue-positions file can be passed as it is, headed (tissue_positions.csv) or headerless (tissue_positions_list.csv). A chosen axis that is named twice or named by a number, or that is constant, is refused. A 0/1 tissue flag (in_tissue, or the second field of the headerless file) marks background spots, which are left out (params.tissue_flag_column, params.in_tissue_filter); a column of that name holding text is not used as a flag.'
        cell_proportions_csv:
          type: str
          required: true
          description: 'Path to pre-computed cell type proportions CSV (spots x cell types). Every column besides the spot identifier is a cell type and must be numeric. The identifier column is found by name wherever it sits (an unnamed first column, spot, barcode, spot_id, cell, cell_id), so run_card and run_spotlight output (trailing "spot" column) and spacexr_rctd_deconvolution or converter output (spot names first) are read as they are. A missing or non-finite proportion in the column of a cell type that is tested is refused; a column with no reference cells is not tested and not read, and its missing values are only counted (data.n_untested_proportion_values_not_finite).'
        sc_counts_csv:
          type: str
          required: true
          description: 'Path to the single-cell reference counts CSV (genes x cells; cells as rows is also accepted and transposed). CELINA derives each cell type''s marker gene list from this reference, so it is required. Only genes shared with the slide are used, and only cells with a row in sc_celltype_labels_csv (data.n_reference_cells_without_label_row counts the others).'
        sc_celltype_labels_csv:
          type: str
          required: true
          description: 'Path to the single-cell cell type labels CSV -- cell barcodes in the first column, then the label column(s). A file with one label column (the converter''s celltypes.csv) is used as is; a file with several (the converter''s metadata.csv) is refused unless sc_celltype_column names one. Labels must use the same names as the columns of cell_proportions_csv; only cell types present in both are tested.'
        output_dir:
          type: str
          required: true
          description: Directory for CELINA output files.
        num_cores:
          type: int
          required: false
          default: 1
          description: Number of cores for CELINA's interaction tests. CELINA has no default for this argument.
        sc_celltype_column:
          type: str
          required: false
          default: ''
          description: 'Column of sc_celltype_labels_csv holding the cell type labels. Leave empty when the file has one label column besides the barcodes; a file with several is refused until one is named here.'
        drop_unlabeled:
          type: boolean
          required: false
          default: false
          description: 'Leave out reference cells whose label is missing (NA, empty, nan, None). False keeps inert blank labels (counted in data.n_reference_cells_unlabeled) and refuses an NA label or a missing-label spelling the proportions carry as a column; True drops them all and reports data.n_reference_cells_dropped.'
  spotclean:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spotclean_mcp_server.py
    enabled: true
    description: SpotClean ambient RNA contamination cleanup for spatial transcriptomics data.
    env:
      SPOTCLEAN_PYTHON: /opt/conda/envs/spotclean_env/bin/Rscript
      SPOTCLEAN_WORKER: /workspace/epic-fermat/agent/tools/spotclean_worker.R
    tools:
    - spatialomicsgym_name: run_spotclean
      description: 'Run SpotClean to model and remove ambient RNA contamination (bleeding) in spatial transcriptomics data by leveraging the spatial pattern of background signal. [DATA REQUIREMENTS]
        Input: 2 CSV files - spatial_counts_csv, spatial_coords_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. Raw counts required. SC reference: not needed. Image: not needed.'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: Path to spatial counts CSV (genes x spots).
        spatial_coords_csv:
          type: str
          required: true
          description: 'Path to spatial coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres or x/y -- so a Space Ranger tissue-positions file can be passed as it is, headed (v2) or headerless (v1). Give pixel coordinates rather than array indices -- SpotClean''s kernel bandwidth is a distance. A file with no pixel columns is read by its array indices (array_row/array_col, else row/col) only where they are distances: a square lattice''s are used as given, while Visium''s hexagonal indices (what the converter''s metadata.csv for a CELLxGENE Visium object carries) are refused unless allow_array_index_fallback is set; params.coordinate_kind says which. The tissue/background flag is read from a ''tissue'' or ''in_tissue'' column holding 0/1 (or TRUE/FALSE); a column of either name holding anything else (CELLxGENE''s text ''tissue'' label, for one) is set aside, named in warnings, and never read as a coordinate. params.tissue_flag_column names the column used; a spot with no flag value is refused by name. Without background (0) spots nothing is decontaminated, and the warning says why -- no flag column, a flag that marks every spot as tissue, background the counts do not carry (a filtered matrix; SpotClean needs Space Ranger''s raw_feature_bc_matrix), or background spot_cutoff removed -- counted in data.n_background_spots_in_coordinates, data.n_background_spots_not_in_counts and data.n_background_spots_removed_by_cutoff.'
        output_dir:
          type: str
          required: true
          description: Directory for SpotClean output files.
        gene_cutoff:
          type: int
          required: false
          default: 10
          description: Minimum total count per gene; genes below are filtered.
        spot_cutoff:
          type: int
          required: false
          default: 100
          description: 'Minimum total count per spot; spots below are filtered -- background spots too, which SpotClean estimates the ambient RNA from and which usually have few counts (data.n_background_spots_removed_by_cutoff counts them; 0 keeps every spot).'
        verbose:
          type: boolean
          required: false
          default: true
          description: Whether to print verbose progress messages.
        allow_array_index_fallback:
          type: boolean
          required: false
          default: false
          description: 'With no pixel columns in spatial_coords_csv, read Visium''s hexagonal array indices (array_row/array_col) as the lattice''s physical layout -- imagerow = array_row x sqrt(3), imagecol = array_col, which puts all six neighbours of a spot one pitch apart -- instead of refusing the file. Reported as params.used_fallback and params.coordinate_kind, with a warning. A square lattice''s indices are read as given without it.'
  spotsweeper:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spotsweeper_mcp_server.py
    enabled: true
    description: SpotSweeper spatially-aware QC for detecting local outliers and regional artifacts in spatial transcriptomics data.
    env:
      SPOTSWEEPER_PYTHON: /opt/conda/envs/spotsweeper_env2/bin/Rscript
      SPOTSWEEPER_WORKER: /workspace/epic-fermat/agent/tools/spotsweeper_worker.R
    tools:
    - spatialomicsgym_name: run_spotsweeper
      description: 'Run SpotSweeper to flag local outliers (low library size, low unique genes, high mito ratio) and regional artifacts in spot-based spatial transcriptomics data (e.g. 10x Visium) by comparing each spot''s QC metrics against its spatial neighbors; spots are flagged in the QC table, not removed. Spots the coordinates file marks in_tissue = 0 (background outside the tissue) are left out of the analysis and counted in data.n_spots_off_tissue and params.in_tissue_filter. Neighbourhoods are Euclidean, so Visium''s hexagonal array indices alone are refused unless allow_array_index_fallback converts them (params.coordinate_kind says what the axes were). Mitochondrial genes are recognised by an MT-/mt- name prefix (not Ensembl IDs); without them the mito-ratio test and findArtifacts are skipped, and a findArtifacts failure is named in artifact_summary rather than reported as missing genes. [DATA REQUIREMENTS] Input: 2 CSV files - spatial_counts_csv, spatial_coords_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: not needed. Image: not needed.'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: 'Path to spatial counts CSV (genes x spots), raw counts, read sparse. Missing or negative values are refused; non-integer values are named in a warning. Spots with no row in the coordinates file are left out and counted in data.n_spots_without_coords.'
        spatial_coords_csv:
          type: str
          required: true
          description: 'Path to spatial coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is. A file with no header row is read as Space Ranger''s headerless tissue_positions_list.csv (six columns: barcode, in_tissue, array_row, array_col, pxl_row_in_fullres, pxl_col_in_fullres) or, with three columns, as barcode, x, y; any other headerless layout is refused. When the file has an in_tissue column (Space Ranger''s positions files, the converter''s metadata.csv), spots it marks 0 are left out and counted in data.n_spots_off_tissue, params.in_tissue_filter and a warning. The axes must be positions: when the file names only array indices (array_row/array_col or row/col) and also carries x/y, x/y are read instead; a square lattice''s indices are read as they are; Visium''s hexagonal indices (the only positions in the converter''s metadata.csv for a CELLxGENE Visium object) are refused unless allow_array_index_fallback is set; params.coordinate_kind says which.'
        output_dir:
          type: str
          required: true
          description: Directory for SpotSweeper output files.
        n_neighbors:
          type: int
          required: false
          default: 36
          description: 'Number of nearest neighbors for local outlier detection (default 36, about three hexagonal rings of Visium spots: 6 + 12 + 18). On a slide with fewer spots it is capped at n_spots - 1, reported as n_neighbors_effective.'
        threshold:
          type: float
          required: false
          default: 3.0
          description: 'Modified z-score cutoff for calling outliers (default 3.0; must be finite).'
        allow_array_index_fallback:
          type: boolean
          required: false
          default: false
          description: 'With only Visium''s hexagonal array indices (array_row/array_col) for positions in spatial_coords_csv, read them as the lattice''s physical layout -- imagerow = array_row x sqrt(3), imagecol = array_col, which puts all six neighbours of a spot one pitch apart -- instead of refusing the file. Reported as params.used_fallback and params.coordinate_kind, with a warning. A square lattice''s indices are read as given without it.'
  bass:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/bass_mcp_server.py
    enabled: true
    description: BASS Bayesian multi-scale spatial domain analysis and cell type clustering.
    env:
      BASS_PYTHON: /opt/conda/envs/bass_env/bin/Rscript
      BASS_WORKER: /workspace/epic-fermat/agent/tools/bass_worker.R
    tools:
    - spatialomicsgym_name: run_bass
      description: 'Run BASS (Bayesian Analytics for Spatial Segmentation) to jointly model cell type composition and spatial domain structure via a Bayesian hierarchical framework with Markov random fields. n_clusters is the number of spatial domains (BASS R, the domain column of bass_domains.csv) and n_cell_types the number of cell-type clusters (BASS C, the cell_type column); data.n_clusters and data.n_cell_types report how many labels are occupied, which can be fewer than requested. Spots with zero total counts (off-tissue spots in CELLxGENE exports) are left out and counted in data.n_spots_empty. BASS log-normalises the counts, keeps the 3000 most significant SPARK-X genes when the file has more than 3000, and reduces them to 20 principal components (data.n_genes_used). [DATA REQUIREMENTS] Input: 2 CSV files - spatial_counts_csv (raw counts, genes x spots, at least 20 genes with counts), spatial_coords_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: not needed (BASS infers cell types; set n_cell_types). Image: not needed.'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: Path to spatial counts CSV (genes x spots), raw counts. Spots with zero total counts are left out and counted in data.n_spots_empty.
        spatial_coords_csv:
          type: str
          required: true
          description: 'Path to spatial coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is, and so can its headerless tissue_positions_list.csv (Space Ranger before 2.0), which is read under Space Ranger''s six column names (params.coordinates_header says which, params.coordinate_columns which two were read). Spots the file marks in_tissue = 0 (background outside the tissue) are left out and counted in data.n_spots_off_tissue_dropped, params.in_tissue_filter and a warning.'
        output_dir:
          type: str
          required: true
          description: Directory for BASS output files.
        n_clusters:
          type: int
          required: false
          default: 7
          description: Number of spatial domains (clusters) to identify, passed to BASS as R; the domain column holds at most this many labels.
        n_cell_types:
          type: int
          required: false
          default: 5
          description: Number of cell-type clusters for the composition model, passed to BASS as C; the cell_type column holds at most this many labels.
        burn_in:
          type: int
          required: false
          default: 2000
          description: Number of MCMC burn-in iterations.
        n_samples:
          type: int
          required: false
          default: 5000
          description: Number of posterior samples after burn-in.
        seed:
          description: Random seed for reproducibility.
          type: int
          required: false
          default: 0
  card:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/card_mcp_server.py
    enabled: true
    description: CARD spatially-informed cell type deconvolution for spatial transcriptomics using a scRNA-seq reference.
    env:
      CARD_PYTHON: /opt/conda/envs/card_env/bin/Rscript
      CARD_WORKER: /workspace/epic-fermat/agent/tools/card_worker.R
    tools:
    - spatialomicsgym_name: run_card
      description: 'Run CARD (Conditional Autoregressive-based Deconvolution) to estimate cell type proportions for each spatial location by combining a scRNA-seq reference with spatial correlation modeling. [DATA REQUIREMENTS] Input: 4 CSV files - spatial_counts_csv, spatial_coords_csv, ref_counts_csv, ref_celltypes_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. Background spots are left out when the coordinates file carries Space Ranger''s in_tissue flag: for an h5ad whose obs holds in_tissue, array_row and array_col (a CELLxGENE Visium export, which carries every array spot), pass the converter''s metadata.csv as spatial_coords_csv rather than coordinates.csv, which has no flag. Counts must be raw: negative, missing or non-numeric values are refused; non-integer values run with a warning. SC reference: required, supplied as ref_counts_csv + ref_celltypes_csv (not h5ad).'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: 'Path to spatial counts CSV (genes x spots). CARD models raw counts: a negative, missing (NA/empty) or non-numeric value on a spot CARD analyses stops the run naming this file; non-integer (normalised) values run with a warning. params.spatial_counts_kind says which.'
        spatial_coords_csv:
          type: str
          required: true
          description: 'Path to spatial coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is. Space Ranger 1''s headerless tissue_positions_list.csv is recognised too (its first line is a spot, not a header) and its pixel row/col are read; data.coord_columns names the two columns read. A chosen column whose name appears twice, a non-numeric coordinate on a matched spot, or every matched spot at one position stops the run. A counts spot with no coordinate row is left out and counted (data.n_spots_in_counts and the warnings). Background spots are left out too: a column named in_tissue (Space Ranger''s tissue_positions.csv, the converter''s metadata.csv) or the tissue flag of the headerless tissue_positions_list.csv marks them 0; they get no row in card_proportions.csv and are counted in data.n_spots_off_tissue_dropped, params.in_tissue_filter and the warnings. A text column named tissue in any other file is not a flag.'
        ref_counts_csv:
          type: str
          required: true
          description: 'Path to scRNA-seq reference counts CSV (genes x cells). A cell with no row in ref_celltypes_csv is left out of the reference and counted (data.n_ref_cells_in_counts and the warnings). Its values are checked as spatial_counts_csv''s are (params.ref_counts_kind).'
        ref_celltypes_csv:
          type: str
          required: true
          description: 'Path to reference cell type annotation CSV (cell barcode in the first column). With one other column, that column is the label. With several (e.g. the converter''s metadata.csv), the label column is chosen by name in tiers -- celltype/cell_type/cell.type, then annotation/annot, then label, then cluster (any case) -- and params.ref_celltype_column says which was read. A missing label (NA, empty, nan, none) stops the run unless drop_unlabeled is true.'
        output_dir:
          type: str
          required: true
          description: 'Directory for CARD output files: card_proportions.csv (one row per spot CARD kept, cell types as columns, spot names in a trailing spot column) and card_result.rds.'
        min_count_gene:
          type: int
          required: false
          default: 100
          description: 'CARD''s minCountGene, which despite its name is a SPOT filter: a spot whose total count (over the genes min_count_spot keeps) is below this value is dropped, as is any spot above 1e6. Dropped spots have no row in card_proportions.csv; data.n_spots_used, data.n_spots_below_min_count_gene and the warnings say how many and why. 0 turns the lower bound off.'
        min_count_spot:
          type: int
          required: false
          default: 5
          description: 'CARD''s minCountSpot, which despite its name is a GENE filter: a spatial gene that is non-zero in this many spots or fewer is dropped before deconvolution (data.n_genes_after_qc).'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Reference cells whose label is missing (NA, empty, nan, none) are not a cell type. False (default) stops the run with the count; true leaves them out of the reference and reports the count in data.n_ref_cells_unlabeled_dropped.'
  stdeconvolve:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/stdeconvolve_mcp_server.py
    enabled: true
    description: STdeconvolve reference-free LDA-based deconvolution for spatial transcriptomics. Identifies latent cell type topics without requiring a scRNA-seq reference.
    env:
      STDECONVOLVE_PYTHON: /opt/conda/envs/stdeconvolve_env/bin/Rscript
      STDECONVOLVE_WORKER: /workspace/epic-fermat/agent/tools/stdeconvolve_worker.R
    tools:
    - spatialomicsgym_name: run_stdeconvolve
      description: 'Run STdeconvolve reference-free LDA-based deconvolution on spatial transcriptomics data. No scRNA-seq reference needed -- uses Latent Dirichlet Allocation to identify cell type topics
        and their proportions per spot. Spots with zero counts, or with no counts in the over-dispersed genes kept for fitting, cannot be placed by LDA: they are left out, counted in
        data.n_spots_empty and data.n_spots_no_corpus_counts, named in warnings, and have no row in stdeconvolve_theta.csv (data.n_spots_used is its row count). [DATA REQUIREMENTS] Input: 1 CSV
        file - spatial_counts_csv, raw integer counts, genes x spots or spots x genes (the orientation is read off the identifiers; counts_orientation settles it when they cannot). Does NOT accept
        h5ad directly; use convert_h5ad_to_csv first. SC reference: NOT needed (reference-free LDA-based method).'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: 'Path to spatial gene expression counts CSV of raw integer counts, genes x spots or spots x genes, with
            identifiers in the first column and the header row. Which axis holds the genes is read off the identifiers (Ensembl IDs
            and gene symbols vs spot barcodes); when they do not settle it the run stops and asks for counts_orientation.'
        output_dir:
          type: str
          required: true
          description: Directory for STdeconvolve output files (theta and beta CSVs).
        n_topics:
          type: int
          required: false
          default: 10
          description: Number of LDA topics (cell types) to fit.
        n_top_genes:
          type: int
          required: false
          default: 1000
          description: Number of top over-dispersed genes to select for LDA fitting.
        seed:
          type: int
          required: false
          default: 42
          description: Random seed for reproducibility.
        remove_below:
          type: float
          required: false
          description: 'Minimum fraction of spots a gene must be detected in to be kept. Leave unset to let the worker
            choose from the data (0.01 when the median per-spot UMI of the spots with counts is below 500, as on Slide-seq
            and MERFISH, otherwise 0.05); the payload reports which one ran.'
        counts_orientation:
          type: str
          required: false
          default: auto
          enum:
          - auto
          - genes_x_spots
          - spots_x_genes
          description: 'auto (default) detects which axis of the counts CSV holds the genes from the row and column names;
            genes_x_spots or spots_x_genes says so outright. The payload reports the orientation used and how it was decided
            (params.counts_orientation, params.counts_orientation_source).'
  spatialdecon:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spatialdecon_mcp_server.py
    enabled: true
    description: 'SpatialDecon (Nanostring) spatial deconvolution using constrained log-normal regression against a profile matrix built from cell-level scRNA-seq counts.'
    env:
      SPATIALDECON_PYTHON: /opt/conda/envs/spatialdecon_env/bin/Rscript
      SPATIALDECON_WORKER: /workspace/epic-fermat/agent/tools/spatialdecon_worker.R
    tools:
    - spatialomicsgym_name: run_spatialdecon
      description: 'Run SpatialDecon (spatialdecon(), constrained log-normal regression) to estimate cell type abundances in spatial spots against a profile matrix the worker builds as the per-cell-type mean counts of the scRNA-seq reference cells, with a constant background of 0.1 (there are no negative probes outside GeoMx data; params.background and params.method say so). A ready-made genes x cell-types profile matrix is not accepted as ref_counts_csv. Reference cells with a missing label are refused unless drop_unlabeled is true. Spots with no counts on the shared genes are still fitted and are counted in data.n_spots_without_counts. Memory: both CSVs are read sparse and the reference is reduced to its profile without being made dense; the shared-genes x spots matrix is dense by necessity (spatialdecon() takes a base matrix), and a run whose lower bound (six copies, 8 bytes per entry) exceeds the available memory stops before SpatialDecon starts, with the numbers. [DATA REQUIREMENTS] Input: 3 CSV files - spatial_counts_csv, ref_counts_csv, ref_celltypes_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: required, supplied as ref_counts_csv + ref_celltypes_csv (not h5ad).'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: 'Path to spatial gene expression counts CSV (genes x spots; spots x genes is detected from the gene names). Missing or negative values are refused.'
        ref_counts_csv:
          type: str
          required: true
          description: 'Path to scRNA-seq reference counts CSV at cell level (genes x cells; cells x genes is detected), one column per cell barcode listed in ref_celltypes_csv, read sparse. A genes x cell-types profile matrix is refused, and so are missing or negative values.'
        ref_celltypes_csv:
          type: str
          required: true
          description: Path to cell type annotations CSV (cell_id, cell_type).
        output_dir:
          type: str
          required: true
          description: Directory for SpatialDecon output files.
        normalize:
          type: bool
          required: false
          default: true
          description: Whether to normalize spatial counts before deconvolution.
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: Reference cells whose label is missing (NA, empty, nan) are refused by default, because a missing label is not a cell type. True leaves them out of the profile and reports the count (data.n_ref_cells_unlabeled) with a warning.
  smart_spatial:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/smart_spatial_mcp_server.py
    enabled: true
    description: 'SMART keyword-assisted topic model (keyATM) deconvolution: marker genes seed one topic per cell type; no scRNA-seq reference is read.'
    env:
      SMART_PYTHON: /opt/conda/envs/smart_env/bin/Rscript
      SMART_WORKER: /workspace/epic-fermat/agent/tools/smart_spatial_worker.R
    tools:
    - spatialomicsgym_name: run_smart
      description: 'Run SMART keyword-assisted deconvolution. Fits a keyATM topic model on the spatial counts, using the marker gene list to seed one topic per cell type, and returns per-spot cell type proportions.
        [DATA REQUIREMENTS] Input: 2 CSV files - spatial_counts_csv, marker_genes_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: not required and not read - the topics
        are seeded by marker_genes_csv, so ref_counts_csv is not read; a non-empty value is reported under params.ignored. Needs raw integer counts (see round_counts). Marker cell types with no marker on
        the panel and counted in some spot get no topic and are listed in data.dropped_marker_types.'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: Path to spatial raw counts CSV (genes x spots). Must be non-negative integer counts unless round_counts is true.
        ref_counts_csv:
          type: str
          required: false
          default: ''
          description: Not read by SMART. The topics are seeded by marker_genes_csv; a path given here is not opened or checked and is reported under params.ignored with a warning. Leave it out.
        marker_genes_csv:
          type: str
          required: true
          description: 'Path to marker genes CSV: a gene column (gene/Gene/genes/Genes/gene_name/marker) and optionally a cell-type column (cell_type/celltype/cluster/Cluster/CellType/cell_type_name/type), one row per marker; each cell type seeds one topic. A file with several columns and no recognised gene column is refused.'
        output_dir:
          type: str
          required: true
          description: Directory for SMART output files.
        n_topics:
          type: int
          required: false
          default: 10
          description: 'Total number of keyATM topics: one per usable marker cell type plus unsupervised topics up to this total. Below the number of marker cell types (0 included) no unsupervised topics are added and the payload warns.'
        seed:
          type: int
          required: false
          default: 42
          description: Random seed for reproducibility.
        iterations:
          type: int
          required: false
          default: 500
          description: 'keyATM Gibbs-sampling iterations passed to SMART_base (at least 1). Upstream default is 2000; this portal defaults to 500, the value it has always run. Reported in params.iterations; run time grows linearly with it.'
        round_counts:
          type: bool
          required: false
          default: false
          description: 'keyATM models raw integer counts. False (default) refuses a matrix with non-integer or negative values and names this knob. True rounds to the nearest integer, clamps negatives to 0, and reports data.n_values_rounded and data.n_values_clamped with a warning.'
  spatialpca:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spatialpca_mcp_server.py
    enabled: true
    description: SpatialPCA spatially-aware dimensionality reduction that incorporates spatial location into PCA for improved downstream clustering.
    env:
      SPATIALPCA_PYTHON: /opt/conda/envs/spatialpca_env/bin/Rscript
      SPATIALPCA_WORKER: /workspace/epic-fermat/agent/tools/spatialpca_worker.R
    tools:
    - spatialomicsgym_name: run_spatialpca
      description: 'Run SpatialPCA spatially-aware dimensionality reduction. Builds a kernel-based latent variable model incorporating spatial coordinates into PCA, producing spatially informed embeddings.
        As published, its genes are the spatially variable genes SPARK selects (at most 3000); if that selection is unusable (SPARK fails, or selects fewer genes than n_components) the run stops and
        says what SPARK found, unless allow_hvg_fallback is true. params.method and params.used_fallback say which selection ran. [DATA REQUIREMENTS] Input: 2 CSV files - spatial_counts_csv,
        spatial_coords_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: not needed. Image: not needed.'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: Path to spatial gene expression counts CSV (genes x spots).
        spatial_coords_csv:
          type: str
          required: true
          description: 'Path to spatial coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is, and so can its headerless tissue_positions_list.csv (Space Ranger before 2.0), which is read under Space Ranger''s six column names (params.coordinates_header says which, params.coordinate_columns which two were read). Spots the file marks in_tissue = 0 (background outside the tissue) are left out and counted in data.n_spots_off_tissue_dropped, params.in_tissue_filter and a warning.'
        output_dir:
          type: str
          required: true
          description: Directory for SpatialPCA output files (PCs and loadings CSVs).
        n_components:
          type: int
          required: false
          default: 20
          description: 'Number of spatial principal components to compute. At most (selected genes - 1) and (analysed spots - 1) can be; a larger request is lowered with a warning. params.n_components
            is the number computed and params.n_components_requested the number asked for.'
        seed:
          type: int
          required: false
          default: 42
          description: 'Accepted and set, but it has no effect on the result: SpatialPCA reseeds its random steps itself (SCTransform with Seurat''s fixed seed.use, SpatialPCA_EstimateLoading with
            set.seed(1234)), and SPARK and the kernel steps draw no random numbers. Listed under params.ignored with a warning.'
        allow_hvg_fallback:
          type: bool
          required: false
          default: false
          description: 'When SPARK''s spatial gene selection is unusable, run SpatialPCA over highly variable genes (SCTransform, at most 3000) instead of stopping. That is a different analysis from
            SpatialPCA as published; a run that used it reports params.used_fallback=true, data.gene_selection=hvg, the reason, and a warning. Default false: the run stops with SPARK''s finding.'
  deepcell_seg:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/deepcell_mcp_server.py
    enabled: true
    description: DeepCell Mesmer and NuclearSegmentation cell segmentation for multiplexed fluorescence tissue images.
    env:
      DEEPCELL_PYTHON: /opt/conda/envs/deepcell_env/bin/python
      DEEPCELL_WORKER: /workspace/epic-fermat/agent/tools/deepcell_worker.py
    tools:
    - spatialomicsgym_name: run_deepcell_segmentation
      description: 'Run DeepCell segmentation on a fluorescence microscopy image (TIFF/PNG/JPEG). model_type=mesmer runs Mesmer (MultiplexSegmentation-9) for whole-cell and/or nuclear masks from a nuclear marker plus a membrane marker; model_type=nuclear runs NuclearSegmentation 1.0 (NuclearSegmentation-75) on the nuclear channel alone. Weights are cached from DeepCell''s public bucket (no access token). In a multi-channel image, nuclear_channel and membrane_channel pick the markers; left at 0 and 1 they read the first two channels (red and green of an RGB composite, which is usually not DAPI) and the warning lists every channel''s mean intensity. Trained on fluorescence, not brightfield H&E. image_mpp is the image''s microns per pixel: its default 0.5 is Mesmer''s training resolution, reported as an assumed value unless image_mpp_is_measured=True, and areas then stay in pixels; a Visium hires/lowres image with scalefactors_json.json beside it gets the implied value reported (from microns_per_pixel when present, else from the 100 um spot pitch measured on the tissue_positions file beside it, else approximately from spot_diameter_fullres as a 65 um spot, about 8% off on CytAssist slides; params.image_mpp_implied_basis says which; reported, not applied). Returns segmentation masks (.npy/.tif), an overlay PNG, cell count and size statistics. [DATA REQUIREMENTS] Input: microscopy image (TIFF/PNG/JPEG), read at full resolution. NOT h5ad. SC reference: not needed. Image: required (microscopy image is the primary input).'
      parameters:
        image_path:
          type: str
          required: true
          description: 'Path to input image file (TIFF, PNG, JPEG or other image format). Ideally 2-channel: ch0=nuclear (DAPI), ch1=membrane; otherwise pick the channels with nuclear_channel and membrane_channel.'
        output_dir:
          type: str
          required: false
          default: ./work
          description: Directory to save segmentation results.
        model_type:
          type: str
          required: false
          default: mesmer
          description: 'Model type: ''mesmer'' (Mesmer, whole-cell + nuclear, recommended) or ''nuclear'' (NuclearSegmentation 1.0 on nuclear_channel only; compartment and membrane_channel do not apply).'
        compartment:
          type: str
          required: false
          default: whole-cell
          description: 'Segmentation compartment (mesmer only): ''whole-cell'', ''nuclear'', or ''both''.'
        image_mpp:
          type: float
          required: false
          default: 0.5
          description: 'Microns per pixel of the image; DeepCell rescales the image by image_mpp / model_mpp before segmenting. The default 0.5 is Mesmer''s training resolution, not a measurement: a run at 0.5 reports params.image_mpp_source=assumed default and gives areas in pixels only, unless image_mpp_is_measured is True. Any other value is taken as the caller''s and also gives areas in um2. For a Visium hires/lowres image beside its scalefactors_json.json the implied value is reported in params.image_mpp_implied_by_scalefactors, with its basis in params.image_mpp_implied_basis.'
        nuclear_channel:
          type: int
          required: false
          default: 0
          description: Index of the nuclear-marker channel (e.g. DAPI) in a multi-channel image, counted from 0 after a channel-first stack is transposed.
        membrane_channel:
          type: int
          required: false
          default: 1
          description: Index of the membrane/whole-cell-marker channel (mesmer only). Equal to nuclear_channel uses that one channel as both markers (reported as such).
        image_mpp_is_measured:
          type: bool
          required: false
          default: false
          description: 'True when image_mpp is the image''s measured pixel size. Needed only when that measurement is 0.5, the default, which the value alone cannot tell from the default: the run is then reported as params.image_mpp_source=caller with areas in um2.'
  iris_spatial:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/iris_spatial_mcp_server.py
    enabled: true
    description: 'IRIS spatial domain identification, one slice per call, integrating gene expression with spatial coordinates: reference-based IRIS with a scRNA-seq reference, IRISfree without one.'
    env:
      IRIS_PYTHON: /opt/conda/envs/iris_spatial_env/bin/Rscript
      IRIS_WORKER: /workspace/epic-fermat/agent/tools/iris_spatial_worker.R
    tools:
    - spatialomicsgym_name: run_iris
      description: 'Run IRIS spatial domain identification on one slice. Integrates gene expression with spatial coordinates to identify spatial domains; each call takes one counts/coordinates pair and runs it as a single slice (IRIS''s multi-slice integration is not exposed). IRIS''s own QC leaves spots out: a spot needs min_spot_counts total counts over the genes detected in more than min_gene_spots spots, and spots with no counts on the genes IRIS models are dropped too. Those spots get no row in iris_domains.csv; data.n_spots is the number that got a domain, data.n_genes the informative genes the model ran on, and data.n_spots_input, data.n_spots_dropped and a warning account for the rest. [DATA REQUIREMENTS] Input: 2 CSV files - spatial_counts_csv, spatial_coords_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: optional, supplied as ref_counts_csv + ref_celltypes_csv together (not h5ad). With a reference this runs IRIS proper and also writes per-spot cell-type proportions; with neither it runs IRISfree, whose marker sets are derived from these spatial counts by gene variance, so its per-type columns are variance-rank gene blocks rather than cell types. Image: not needed.'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: Path to spatial gene expression counts CSV (genes x spots).
        spatial_coords_csv:
          type: str
          required: true
          description: 'Path to spatial coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is, and so can its headerless tissue_positions_list.csv (Space Ranger before 2.0), which is read under Space Ranger''s six column names (params.coordinates_header says which, params.coordinate_columns which two were read). Spots the file marks in_tissue = 0 (background outside the tissue) are left out and counted in data.n_spots_off_tissue_dropped, params.in_tissue_filter and a warning.'
        ref_counts_csv:
          type: str
          required: false
          default: ''
          description: Optional path to a scRNA-seq reference counts CSV (genes x cells), supplied together with ref_celltypes_csv. Giving both switches the tool from IRISfree to reference-based IRIS, which additionally writes per-spot cell-type proportions. Which axis holds the cells is read off ref_celltypes_csv rather than assumed, so a cells x genes table is transposed automatically.
        ref_celltypes_csv:
          type: str
          required: false
          default: ''
          description: 'Optional path to the cell type annotation CSV for ref_counts_csv, with the cell barcodes as row names; rows are matched to the counts by cell ID. The cell type column is the one ct_varname names. Left empty, the first of these rules with a single hit decides: a column named celltype or cell_type (any case), the only column whose name contains celltype or cell_type, a column named type, one named cluster, the only column whose name contains cluster, a lone column. Anything else is refused with the list of columns rather than guessed (the first column is never taken on trust). IRIS needs at least 3 cell types with two or more cells each. params.ct_varname and params.ct_varname_source say which column was used and why.'
        output_dir:
          type: str
          required: true
          description: Directory for IRIS output files.
        n_clusters:
          type: int
          required: false
          default: 7
          description: Number of spatial domains (clusters) to identify.
        seed:
          type: int
          required: false
          default: 42
          description: 'Accepted and recorded, but it has no effect: IRIS reseeds every random step itself (set.seed(islice) before its Dirichlet/LIGER start, set.seed(12345678) in its k-means helpers, rliger optimizeALS rand.seed = 1), so the run is deterministic. Listed in params.ignored with a warning.'
        ct_varname:
          type: str
          required: false
          default: ''
          description: Column of ref_celltypes_csv that holds the cell types. Empty matches it by name as described under ref_celltypes_csv, and refuses when no column or several columns qualify. Reference mode only; a value given without a reference is listed in params.ignored.
        sample_varname:
          type: str
          required: false
          default: ''
          description: Column of ref_celltypes_csv that holds each cell's sample (donor/batch); IRIS averages each cell type's reference profile over these samples. Empty uses the first column whose name contains sample, batch or donor (a warning names the others when several do), else treats all cells as one sample. Reference mode only; a value given without a reference is listed in params.ignored.
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Reference mode only. Reference cells with a missing label (NA, empty, or no row in ref_celltypes_csv) are refused by default; true leaves them out and reports the count in data.n_ref_cells_unlabeled. Set to true without a reference, it is listed in params.ignored.'
        min_spot_counts:
          type: int
          required: false
          default: 100
          description: 'IRIS QC (createIRISObject minCountGene): a spot is kept only when its total count over the genes that pass min_gene_spots is at least this. Default 100, IRIS''s own default; spots below it get no domain and are counted in data.n_spots_dropped. Lower it to keep low-count spots.'
        min_gene_spots:
          type: int
          required: false
          default: 5
          description: 'IRIS QC (createIRISObject minCountSpot): a gene is kept only when it is detected in more than this many spots. Default 5, IRIS''s own default.'
  gist:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/gist_mcp_server.py
    enabled: true
    description: GIST Bayesian spatial deconvolution using Rcpp and Stan for cell type proportion estimation from spatial transcriptomics data.
    env:
      GIST_PYTHON: /opt/conda/envs/gist_env/bin/Rscript
      GIST_WORKER: /workspace/epic-fermat/agent/tools/gist_worker.R
    tools:
    - spatialomicsgym_name: run_gist
      description: 'Run GIST Bayesian deconvolution to estimate cell type proportions for each spatial spot from a scRNA-seq reference. For every spot separately GIST fits a Stan model (rstan NUTS sampling) of the spot''s expression as a Student-t regression on the reference signature matrix (mean normalised expression per cell type) and reports the posterior mean of the proportions. GIST''s image-guided (enhanced) model needs a per-spot image-derived prior that this tool does not take, so the base model always runs (params.method) and prior_lambda has no effect (params.ignored). Runtime is one Stan fit per spot, n_chains x n_iter iterations each; num_cores spreads the spots over parallel R workers. [DATA REQUIREMENTS] Input: 4 CSV files - spatial_counts_csv, spatial_coords_csv, ref_counts_csv, ref_celltypes_csv. Does NOT accept h5ad directly; use convert_h5ad_to_csv first. SC reference: required, supplied as ref_counts_csv + ref_celltypes_csv (not h5ad). Image: not needed (this tool runs GIST''s base model, which takes no image).'
      parameters:
        spatial_counts_csv:
          type: str
          required: true
          description: Path to spatial counts CSV (genes x spots).
        spatial_coords_csv:
          type: str
          required: true
          description: 'Path to spatial coordinates CSV (spots as rows, spot names in the first column). Axis columns are matched by name -- imagerow/imagecol, pxl_row_in_fullres/pxl_col_in_fullres, array_row/array_col, row/col or x/y -- so Space Ranger''s tissue_positions.csv can be passed as it is, and so can the headerless tissue_positions_list.csv of Space Ranger 1 (a first line that is a spot is read as one). When the file has an in_tissue column, counts spots it marks 0 (background) are left out and counted in data.n_spots_off_tissue_dropped and params.in_tissue_filter.'
        ref_counts_csv:
          type: str
          required: true
          description: Path to scRNA-seq reference counts CSV (genes x cells).
        ref_celltypes_csv:
          type: str
          required: true
          description: 'Path to cell type annotations CSV (cell_id, cell_type). A cell whose label is missing (NA, empty, nan, <NA>) is an error unless drop_unlabeled is true.'
        output_dir:
          type: str
          required: true
          description: Directory for GIST output files.
        impute_st:
          type: bool
          required: false
          default: true
          description: Whether to apply KNN smoothing imputation to spatial counts.
        impute_k:
          type: int
          required: false
          default: 5
          description: 'Number of nearest neighbors for KNN smoothing. Used only when impute_st is true; otherwise listed under params.ignored with a warning.'
        impute_d:
          type: int
          required: false
          default: 10
          description: 'Number of principal components for KNN smoothing. Used only when impute_st is true; otherwise listed under params.ignored with a warning.'
        normalize:
          type: str
          required: false
          default: sct
          description: 'Normalization method: ''sct'', ''scale'', ''quantile'', or ''scale-quantile''. ''sct'' (SCTransform) keeps only the variable genes, chosen separately in the reference and in the spatial data, and GIST uses the genes both keep; the other methods keep every gene. The counts are reported as data.n_genes_ref_after_normalize, data.n_genes_spatial_after_normalize and data.n_genes_used.'
        prior_lambda:
          type: float
          required: false
          default: 50.0
          description: 'Accepted but not used. GIST reads prior_lambda only in its image-guided model, which needs a per-spot prior this tool does not take; the base model runs, and the payload lists prior_lambda under params.ignored with a warning.'
        num_cores:
          type: int
          required: false
          default: 1
          description: Number of cores for parallel spot processing.
        seed:
          type: int
          required: false
          default: 42
          description: 'Random seed: seeds R, the KNN-smoothing PCA and every per-spot Stan run, so a run is reproducible for any num_cores.'
        n_iter:
          type: int
          required: false
          default: 2000
          description: 'Stan iterations per chain for each spot, half of them warmup (rstan''s default, 2000). Lowering it shortens the run and makes each posterior mean noisier.'
        n_chains:
          type: int
          required: false
          default: 4
          description: 'Stan chains per spot (rstan''s default, 4).'
        drop_unlabeled:
          type: bool
          required: false
          default: false
          description: 'Reference cells whose label is missing (NA / empty / nan / <NA>) are refused by default; true leaves them out and reports the count in data.n_ref_cells_dropped_unlabeled.'
  stplus:
    enabled: true
    label: "stPlus \u2013 spatial gene imputation"
    description: 'stPlus imputes unmeasured genes in spatial transcriptomics data from a scRNA-seq reference. It trains an autoencoder on the spots and the reference cells together, using the genes
      they share as anchors plus the most variable reference genes, and predicts each spot''s unmeasured genes as a weighted average over its nearest reference cells in the learned embedding. NOTE:
      the stPlus package has hardcoded .cuda() calls; the worker redirects them to the device the caller resolves (the CPU on a machine without CUDA).

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/stplus_mcp_server.py
    env:
      PYTHONUNBUFFERED: '1'
      STPLUS_PYTHON: /opt/conda/envs/stplus_env/bin/python
      STPLUS_WORKER: /workspace/epic-fermat/agent/tools/stplus_worker.py
    tools:
    - spatialomicsgym_name: run_stplus
      description: 'Run stPlus spatial gene imputation to predict unmeasured gene expression in spatial transcriptomics spots using a scRNA-seq reference. Inputs can be h5ad, a 10x Cell Ranger / Space Ranger .h5 matrix (e.g. a sample''s filtered_feature_bc_matrix.h5, read with scanpy.read_10x_h5: gene symbols as columns, barcodes as rows) or delimited text (CSV/TSV). Spots whose obs[''in_tissue''] is 0 (background glass, which a CELLxGENE Visium h5ad carries) are left out of training and imputation; params.in_tissue_filter counts them, data.n_spots_supplied is the file as given and data.n_spots the spots imputed. stPlus is written for normalized, log-transformed input: with normalize=auto a matrix of raw counts is log1p(normalize_total(1e4))''d first and the payload says what was done to each input; imputed values are on the reference''s scale. Outputs, rows keyed by the spot barcodes: stplus_imputed.csv (imputed gene expression, spots x genes); stplus_combined.csv (measured genes as stPlus saw them + imputed genes); stplus_spatial.h5ad (annotated spatial AnnData with imputed values in obsm[''stplus_imputed''], gene names in uns[''stplus_imputed_genes'']). [DATA REQUIREMENTS] Input: spatial h5ad (or 10x .h5) with expression in X. SC reference: h5ad (or 10x .h5) with gene expression for imputation of unmeasured genes. Tool predicts spatial expression of genes not measured in spatial data.'
      parameters:
        spatial_df_path:
          type: str
          required: true
          description: 'Path to spatial transcriptomics data (.h5ad, a 10x .h5 matrix such as filtered_feature_bc_matrix.h5, or delimited text such as .csv/.tsv). Rows are spots, columns are genes. Spots with obs[''in_tissue''] == 0 are left out.'
        scrna_df_path:
          type: str
          required: true
          description: 'Path to scRNA-seq reference data (.h5ad, a 10x .h5 matrix, or delimited text such as .csv/.tsv). Rows are cells, columns are genes.'
        genes_to_impute_path:
          type: str
          required: true
          description: Path to gene list file (.txt one gene per line, or single-column .csv) listing genes to impute from scRNA-seq.
        output_dir:
          type: str
          required: false
          default: ./work
          description: Directory where stPlus results will be saved.
        n_neighbors:
          type: int
          required: false
          default: 50
          description: Number of nearest reference cells each spot's imputed values are averaged over (at least 2, at most the number of reference cells).
        n_epochs:
          type: int
          required: false
          default: 200
          description: Maximum number of training epochs for the autoencoder; stPlus stops earlier once the loss converges, and params.epochs_run reports how many it trained.
        batch_size:
          type: int
          required: false
          default: 512
          description: Batch size for autoencoder training.
        device:
          type: str
          required: false
          default: auto
          description: 'Compute device: "auto", "cpu", "gpu"/"cuda", or "cuda:N" to pick a specific GPU. "auto" follows the hardware; a GPU request on a machine without CUDA degrades to CPU rather than failing.'
        normalize:
          type: str
          required: false
          default: auto
          description: '"auto" (log1p(normalize_total(1e4)) a matrix of raw integer counts, use anything else as given), "always", or "never".'
        top_k:
          type: int
          required: false
          default: 2000
          description: Highly variable reference genes (neither anchors nor genes to impute) stPlus appends to the model; 2000 is stPlus's own default, 0 appends none.
  spaceflow:
    enabled: true
    description: 'SpaceFlow spatial domain identification via deep graph embedding. The server runs a FastMCP wrapper in the spatialomicsgym_env environment and delegates heavy computation to a dedicated SpaceFlow
      conda environment at /opt/conda/envs/spaceflow_env.

      '
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spaceflow_mcp_server.py
    env:
      SPACEFLOW_PYTHON: /opt/conda/envs/spaceflow_env/bin/python
      SPACEFLOW_WORKER: /workspace/epic-fermat/agent/tools/spaceflow_worker.py
    tools:
    - spatialomicsgym_name: spaceflow_spatial_domains
      description: 'Run SpaceFlow: preprocess, train a spatially regularized Deep Graph Infomax embedding, segment spatial domains with Leiden, and optionally compute the pseudo-Spatiotemporal Map (pSM). Spots with obs[''in_tissue''] == 0 (background) are left out and reported under params.in_tissue_filter; in generic_counts_coords mode the flag is the coords_csv''s in_tissue column when it has one, the counts h5ad''s own obs[''in_tissue''] when only it has one, and both together (tissue only where both say so) when both do (params.in_tissue_source), and spots of the counts h5ad with no coords_csv row are left out and counted in params.n_spots_without_coordinates. Genes with no counts in any remaining spot are left out and counted in params.n_genes_without_counts_dropped: their shared mean of 0 collapsed the cell_ranger mean bins of SpaceFlow''s own preprocessing on whole-transcriptome slides. SpaceFlow normalises the matrix as counts: an X with negative or NaN values (scaled data) is refused, and the error says whether adata.raw holds counts; a fractional X (already log-normalised) runs with a warning; use_raw_counts=true trains on adata.raw.X (params.expression_source). SpaceFlow''s own preprocessing (normalize, log1p, cell_ranger highly variable genes, alpha-complex spatial graph) then runs; if cell_ranger still fails ("Bin edges must be unique") the run stops with that error unless allow_preprocessing_fallback=true, which trains on this tool''s substitute preprocessing instead (scanpy genes by hvg_flavor and a k-nearest-neighbour spatial graph). params.method and params.used_fallback say which ran. SpaceFlow 1.0.4''s train() pairs each sampled spot''s coordinates with themselves in its default (accelerated) spatial regularization, so the term carries no spatial information, and restores its last epoch''s weights rather than its lowest-loss ones; this tool corrects both in upstream''s own code before training and lists them under params.train_corrections. params.device reports where training ran. [DATA REQUIREMENTS] Input: h5ad with obsm[''spatial''] and counts in X (sparse is fine), or in adata.raw with use_raw_counts=true. Tool preprocesses internally (normalize, log1p, HVG). Required obs: none (obs[''in_tissue''] is honoured when present). SC reference: not needed. Image: not needed.'
      parameters:
        output_dir:
          type: str
          required: true
          description: Directory where SpaceFlow results (h5ad, embedding CSV, domains TSV) will be saved.
        input_mode:
          type: str
          required: false
          default: h5ad
          description: 'Input format: ''h5ad'', ''visium_h5_spatial'', ''spaceranger_outs'', or ''generic_counts_coords''.'
        h5ad_path:
          type: str
          required: false
          description: Path to spatial AnnData (.h5ad) when input_mode='h5ad'. Must contain obsm['spatial'].
        visium_h5_path:
          type: str
          required: false
          description: Path to 10x Visium .h5 file when input_mode='visium_h5_spatial'.
        visium_spatial_dir:
          type: str
          required: false
          description: Path to Visium spatial/ directory when input_mode='visium_h5_spatial'.
        spaceranger_dir:
          type: str
          required: false
          description: Path to Space Ranger outs/ directory when input_mode='spaceranger_outs'.
        counts_h5ad_path:
          type: str
          required: false
          description: Path to counts h5ad when input_mode='generic_counts_coords'.
        coords_csv:
          type: str
          required: false
          description: 'Path to the coordinates CSV (barcode,x,y[,in_tissue]; the separator is sniffed) when input_mode=''generic_counts_coords''. Its in_tissue column, when present, is combined with the counts h5ad''s own obs[''in_tissue''] (a spot is tissue only where both say so); without one the h5ad''s flag is kept. Each barcode may appear once; spots of the counts h5ad with no row here are left out and counted in params.n_spots_without_coordinates.'
        sample_id:
          type: str
          required: false
          default: sample
          description: 'Sample identifier, recorded in the payload params and in the annotated h5ad''s uns[''spaceflow_run''].'
        coord_type:
          type: str
          required: false
          default: array
          description: 'Coordinate columns read from a Space Ranger tissue_positions file: ''array'' (array_col, array_row) or ''pixel'' (full-resolution pixels). Applies to input_mode ''visium_h5_spatial'' and ''spaceranger_outs'' only; the h5ad and generic_counts_coords modes use the coordinates as stored and list coord_type under params.ignored.'
        n_top_genes:
          type: int
          required: false
          default: 3000
          description: Number of highly variable genes kept before the embedding is trained; every
            other gene is discarded. The default of 3000 discards most of a whole-transcriptome slide
            (33538 genes -> 3000), so raise it to segment on a wider panel. The payload reports the
            supplied panel as `n_genes` and the trained-on panel as `n_genes_used`.
        spatial_regularization_strength:
          type: float
          required: false
          default: 0.1
          description: Weight of SpaceFlow's spatial consistency penalty, which pulls together the embeddings of spots that are close in space.
        z_dim:
          type: int
          required: false
          default: 50
          description: Dimensionality of the latent embedding.
        lr:
          type: float
          required: false
          default: 0.001
          description: Learning rate for training.
        epochs:
          type: int
          required: false
          default: 1000
          description: Number of training epochs.
        max_patience:
          type: int
          required: false
          default: 50
          description: Early stopping patience (epochs without improvement).
        min_stop:
          type: int
          required: false
          default: 100
          description: Minimum number of epochs before early stopping can trigger.
        random_seed:
          type: int
          required: false
          default: 42
          description: Random seed for reproducibility.
        gpu:
          type: int
          required: false
          default: 0
          description: 'CUDA device index to train on; -1 forces the CPU. Without a CUDA device SpaceFlow trains on the CPU; params.device and params.gpu report where training actually ran (gpu -1 = CPU).'
        regularization_acceleration:
          type: bool
          required: false
          default: true
          description: Estimate the spatial regularization loss each epoch from a random subset of
            cell pairs rather than from every pair. Leave it on unless you need the exact loss on a
            small slide; above 5000 spots SpaceFlow subsets regardless of this flag, and the payload
            warns when it overrode the flag. params.regularization_acceleration reports what ran.
        edge_subset_sz:
          type: int
          required: false
          default: 1000000
          description: How many cell pairs are drawn to estimate the spatial regularization loss
            while regularization_acceleration is on. Raising it lowers the variance of the estimate
            and costs time per epoch.
        seg_n_neighbors:
          type: int
          required: false
          default: 50
          description: Number of neighbors for segmentation KNN graph.
        target_n_clusters:
          type: int
          required: false
          default: 0
          description: 'Exact number of spatial domains to return. When > 0, `seg_resolution` is
            binary-searched until segmentation yields this many domains, so pass it whenever the
            number of domains is known or requested rather than tuning seg_resolution by hand. Leave
            at 0 to use `seg_resolution` as given, in which case the resulting domain count is
            whatever that resolution produces. When the search cannot reach the count, the payload
            warns and reports the count it produced.'
        seg_resolution:
          type: float
          required: false
          default: 1.0
          description: Leiden resolution for domain segmentation.
        run_psm:
          type: bool
          required: false
          default: false
          description: 'Compute the pseudo-Spatiotemporal Map (pSM): diffusion pseudotime on the embedding from the spot most distant from all others, chosen over every spot (params.psm_root names it). Written to pSM_values.tsv and obs[''spaceflow_pSM''].'
        psm_n_neighbors:
          type: int
          required: false
          default: 20
          description: Number of neighbors for pSM computation.
        psm_resolution:
          type: float
          required: false
          default: 1.0
          description: 'Accepted for compatibility and has no effect: SpaceFlow''s pSM is diffusion pseudotime from a root spot, and the Leiden clustering upstream runs at this resolution feeds nothing the pSM reads. Listed under params.ignored when run_psm is true.'
        allow_preprocessing_fallback:
          type: bool
          required: false
          default: false
          description: 'Allow this tool''s substitute preprocessing when SpaceFlow''s own fails (cell_ranger "Bin edges must be unique"): scanpy highly variable genes by hvg_flavor and a k-nearest-neighbour spatial graph in place of SpaceFlow''s alpha complex. Genes with no counts, the usual cause, are already left out before SpaceFlow runs, so this is needed only when many of the remaining genes still share one mean. Off by default, and the run then stops with the error. params.used_fallback reports whether the substitute ran.'
        hvg_flavor:
          type: str
          required: false
          default: seurat
          description: 'Highly-variable-gene flavour for the substitute preprocessing only (allow_preprocessing_fallback=true): seurat (default), cell_ranger, or seurat_v3 (ranks raw counts; needs scikit-misc, which the SpaceFlow environment does not ship, so it stops the run rather than switching flavour). SpaceFlow''s own preprocessing always uses cell_ranger; a non-default value that did not apply is listed under params.ignored.'
        use_raw_counts:
          type: bool
          required: false
          default: false
          description: 'Train on the counts in adata.raw.X instead of X, for an h5ad whose X is log-normalised or scaled and whose raw counts sit in adata.raw (a file without adata.raw, or whose raw is not counts, is refused). Read by input_mode ''h5ad'' and ''generic_counts_coords''; the two Space Ranger modes read the count matrix itself and list it in params.ignored. The matrix used is reported as params.expression_source (X or raw.X).'
  spatial_library:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/spatial_library_mcp_server.py
    enabled: true
    description: 'Search the built-in spatial transcriptomics dataset library. Contains human datasets across many tissues: mostly Visium / Visium CytAssist, plus Visium HD, Xenium and one single-cell atlas without spatial coordinates. Use when user asks about spatial analysis without providing data.'
    env:
      SPATIAL_LIBRARY_PYTHON: /opt/conda/bin/python
      SPATIAL_LIBRARY_WORKER: /workspace/epic-fermat/agent/tools/spatial_library_worker.py
    tools:
    - spatialomicsgym_name: search_spatial_datasets
      description: 'Search the built-in spatial transcriptomics dataset library for relevant datasets. Use when a user asks about spatial analysis but has NOT provided any data file path. Returns matching datasets with h5ad paths; a hit with available_for_spatial=false has no spatial coordinates. Supports filtering by organism, organ, disease, technology, and free-text keyword.'
      parameters:
        organism:
          type: str
          required: false
          default: ''
          description: Filter by organism (e.g. human, mouse)
        organ:
          type: str
          required: false
          default: ''
          description: Filter by organ/tissue (e.g. Brain, Lung, Breast)
        disease:
          type: str
          required: false
          default: ''
          description: Filter by disease keyword (e.g. cancer, glioblastoma, healthy)
        technology:
          type: str
          required: false
          default: ''
          description: Filter by platform (e.g. Visium, MERFISH)
        keyword:
          type: str
          required: false
          default: ''
          description: Free-text search across all metadata fields
        is_healthy:
          type: bool
          required: false
          default: null
          description: Filter healthy (true) or diseased (false) samples
        max_results:
          type: int
          required: false
          default: 5
          description: Maximum number of results to return
  pathway_enrichment:
    command:
    - python
    - /workspace/epic-fermat/agent/tools/pathway_enrichment_mcp_server.py
    enabled: true
    description: 'Gene-set enrichment (ORA + GSEA-prerank) on a ranked gene table, and per-spot pathway activity (PROGENy / MSigDB hallmark) on a spatial h5ad, via decoupler (gseapy optional for GSEA).'
    env:
      PATHWAY_ENRICHMENT_PYTHON: /opt/conda/envs/pathway_enrichment/bin/python
      PATHWAY_ENRICHMENT_WORKER: /workspace/epic-fermat/agent/tools/pathway_enrichment_worker.py
    tools:
    - spatialomicsgym_name: run_pathway_enrichment
      description: 'Run gene-set enrichment on a gene list. Over-representation analysis (Fisher exact, BH-adjusted "FDR p-value")
        on the top `top_n` genes of the ranking and, when `score_column` names a numeric column, GSEA-prerank on the whole ranked
        table (decoupler by default; gseapy prerank via gsea_backend=gseapy). Gene sets are MSigDB collections fetched from
        OmniPath (hallmark, go_bp, go_mf, go_cc, reactome, wikipathways; kegg is opt-in because of its licence) and cached as .gmt
        files after the first fetch; `collections` may also name a local .gmt path, which runs fully offline. Writes
        ora_<collection>.csv per collection, gsea_<collection>.csv per collection when a score column was given,
        enrichment_summary.csv across collections, enrichment_dotplot.png, and input_genes_used.txt (the exact list analysed).
        [DATA REQUIREMENTS] Input: exactly ONE of (a) `gene_table` -- a CSV/TSV with a gene-symbol column, e.g. the ranked
        tables the SVG tools write (prost_top_svg_genes.csv, spagft_top_svg_genes.csv, spatially_variable_genes.csv) or a
        rank_genes_groups export; (b) `h5ad_path` + `h5ad_key` -- one `group` of uns["rank_genes_groups"], or a boolean/numeric
        var column; (c) `genes` -- a short inline list for ad-hoc use (at most 2000 symbols; anything larger must be a file, the
        OS cannot pass it as an argument). Identifiers must be gene symbols (SPARC), not Ensembl IDs. Mouse symbols (Sparc) are
        matched to the human collections case-insensitively and the payload reports how many matched. Universe: `background`
        (a one-symbol-per-line file) or, when h5ad_path is given, its var_names; otherwise decoupler''s fixed n_background=20000,
        which the payload states. Network: outbound HTTPS to omnipathdb.org is needed ONLY the first time a collection is used
        on this machine; afterwards the cache is read. Required obs: none. SC reference: not needed. Image: not needed.'
      parameters:
        gene_table:
          type: str
          required: false
          default: ''
          description: Path to a CSV/TSV whose rows are genes in ranked order (best first), e.g. ./work/prost_svg/prost_top_svg_genes.csv. Preferred input for any list longer than a few hundred genes.
        gene_column:
          type: str
          required: false
          default: gene
          description: Column of `gene_table` holding gene symbols. Every ranked table the SVG tools write uses `gene`.
        score_column:
          type: str
          required: false
          default: ''
          description: Numeric column of `gene_table` to rank on for GSEA-prerank (higher = more spatially variable). A p-value-like column (pvalue, p_values, fdr, padj) is turned into -log10(p) automatically. Empty means the file order is the ranking and GSEA is skipped unless method=gsea.
        genes:
          type: str
          required: false
          default: ''
          description: Inline gene symbols separated by commas, spaces or newlines, for ad-hoc lists only (<= 2000 symbols). Larger lists must go through `gene_table`.
        h5ad_path:
          type: str
          required: false
          default: ''
          description: Spatial or single-cell AnnData to read markers from (with `h5ad_key`) and/or to use as the background universe (its var_names).
        h5ad_key:
          type: str
          required: false
          default: rank_genes_groups
          description: Where in the h5ad the genes are. A uns key written by scanpy rank_genes_groups (then `group` picks the cluster), or the name of a var column (True/1/non-zero rows are the list).
        group:
          type: str
          required: false
          default: ''
          description: Which group of uns[h5ad_key] to take (a spatial domain or cell type label). Required when h5ad_key is a rank_genes_groups result.
        top_n:
          type: int
          required: false
          default: 200
          description: How many genes from the top of the ranking enter the ORA. 0 means all rows. GSEA-prerank always uses the whole table.
        species:
          type: str
          required: false
          default: human
          description: '"human" or "mouse". Mouse symbols are upper-cased and matched to the human MSigDB collections; the match rate is reported.'
        collections:
          type: str
          required: false
          default: hallmark,go_bp,reactome
          description: Comma-separated collections -- hallmark, go_bp, go_mf, go_cc, reactome, wikipathways, kegg (opt-in, KEGG licence) -- or a path to a local .gmt file. The default three are CC BY 4.0 MSigDB collections.
        method:
          type: str
          required: false
          default: ora
          description: '"ora", "gsea" or "both". gsea needs a score_column (or an h5ad rank_genes_groups group) and runs `permutations` permutations.'
        gsea_backend:
          type: str
          required: false
          default: decoupler
          description: '"decoupler" (get_gsea_df) or "gseapy" (prerank). Both are seeded; gseapy is the reference implementation, decoupler is faster.'
        background:
          type: str
          required: false
          default: ''
          description: Path to a file with one background gene symbol per line (the universe the list was drawn from, e.g. all genes tested by the SVG tool). Empty uses the h5ad var_names when h5ad_path is given, else n_background=20000.
        min_set_size:
          type: int
          required: false
          default: 5
          description: Gene sets with fewer genes present in the universe are skipped.
        max_set_size:
          type: int
          required: false
          default: 500
          description: Gene sets with more genes are skipped.
        permutations:
          type: int
          required: false
          default: 1000
          description: Permutations for GSEA-prerank. Fewer is faster and noisier.
        seed:
          type: int
          required: false
          default: 0
          description: Random seed for GSEA permutations; identical inputs and seed give identical tables.
        license:
          type: str
          required: false
          default: academic
          description: '"academic" or "commercial". Passed to OmniPath so resources not licensed for commercial use are dropped from the fetch. Commercial users must also review MSigDB terms themselves.'
        gene_sets_dir:
          type: str
          required: false
          default: ''
          description: Directory holding cached <collection>.human.gmt files. Empty uses $SOG_GENESET_CACHE, else ~/.spatialomicsgym/genesets. Point it at a pre-populated directory on an air-gapped host.
        output_dir:
          type: str
          required: false
          default: ''
          description: Where the tables and the dotplot are written. Empty resolves to ./work/pathway_enrichment (SOG_WORK_DIR honoured).
    - spatialomicsgym_name: run_pathway_activity
      description: 'Score pathway activity in every spot/cell of a spatial h5ad with decoupler: PROGENy (14 signalling pathways, weighted, univariate linear model) and/or MSigDB hallmark (50 sets) or any collection/.gmt. method=ulm fits the weighted model per spot; method=ora tests each spot''s top expressed genes. Writes pathway_activity.h5ad with obsm["<method>_estimate"] and obsm["<method>_pvals"], pathway_activity_scores.csv (spots x pathways), spatial_pathway_activity.png (the `top_k_maps` most variable pathways painted on the tissue), and, when `group_key` names an obs column, pathway_activity_by_group.csv (per-group mean) plus pathway_activity_group_tests.csv (decoupler rank_sources_groups t-test). [DATA REQUIREMENTS] Input: h5ad with expression in X or `layer`; raw counts are normalize_total + log1p''d, data that already looks log-normalized (non-integer, max < 50) is left alone, and the payload says which happened. obsm["spatial"] is used for the tissue map only -- without it the map is skipped and everything else runs. var_names must be gene symbols; mouse is matched case-insensitively to the human models. Network: the same one-time fetch from omnipathdb.org and cache as run_pathway_enrichment. Spots with obs["in_tissue"] == 0 (background) are left out before scoring; data.n_spots is the count scored, data.n_spots_input the count supplied, and params.in_tissue_filter with a warning says how many were left out. Required obs: none (`group_key` optional). SC reference: not needed. Image: not needed.'
      parameters:
        data_path:
          type: str
          required: true
          description: Path to the spatial AnnData (.h5ad) to score, e.g. ./work/spatial_input/V1_Human_Lymph_Node.h5ad.
        output_dir:
          type: str
          required: false
          default: ''
          description: Where the scored h5ad, tables and figure are written. Empty resolves to ./work/pathway_activity.
        collections:
          type: str
          required: false
          default: progeny
          description: Comma-separated -- progeny, hallmark, go_bp, reactome, ... -- or a local .gmt path. PROGENy is the only weighted model; .gmt sets get weight 1.
        species:
          type: str
          required: false
          default: human
          description: '"human" or "mouse" (case-insensitive match to the human models; match rate reported).'
        method:
          type: str
          required: false
          default: ulm
          description: '"ulm" (univariate linear model on set weights, one score per spot per pathway) or "ora" (per-spot over-representation of the spot''s top genes).'
        top_progeny:
          type: int
          required: false
          default: 500
          description: Number of top PROGENy target genes per pathway (decoupler get_progeny top=). Ignored for other collections.
        n_up:
          type: int
          required: false
          default: 0
          description: For method=ora, how many top expressed genes per spot are tested. 0 uses decoupler's default (the top 5%).
        min_set_size:
          type: int
          required: false
          default: 5
          description: Pathways with fewer genes present in the data are skipped (decoupler min_n).
        layer:
          type: str
          required: false
          default: ''
          description: Layer to score instead of X (e.g. "counts" or "log1p").
        normalize:
          type: str
          required: false
          default: auto
          description: '"auto" (normalize only integer counts), "always", or "never".'
        group_key:
          type: str
          required: false
          default: ''
          description: obs column of spatial domains or cell types to summarise activity by (e.g. spatial_domain). Empty skips the per-group tables.
        top_k_maps:
          type: int
          required: false
          default: 6
          description: How many pathways (highest variance across spots) are drawn on the tissue figure.
        seed:
          type: int
          required: false
          default: 0
          description: Random seed (decoupler ora ties); ulm is deterministic.
        license:
          type: str
          required: false
          default: academic
          description: As in run_pathway_enrichment.
        gene_sets_dir:
          type: str
          required: false
          default: ''
          description: As in run_pathway_enrichment.

  viz_inspector:
    command: [python, /workspace/epic-fermat/agent/tools/viz_inspector_mcp_server.py]
    enabled: true
    benchmark_visible: false
    description: 'Read a dataset and report what it holds and which figures can be drawn from it. Writes nothing.'
    env:
      VIZ_INSPECTOR_PYTHON: /opt/conda/envs/spatialomicsgym_env/bin/python
      VIZ_INSPECTOR_WORKER: /workspace/epic-fermat/agent/tools/viz_inspector_worker.py
    tools:
    - spatialomicsgym_name: inspect_dataset
      description: 'Report what a dataset holds and what can be drawn from it. Writes nothing. [DATA REQUIREMENTS] Input: one .h5ad path. Required obs: none. SC reference: not needed. Image: optional -- an embedded uns[''spatial''] image is reported when present and its absence is reported as a fact, not an error. Writes nothing.'
      parameters:
        data_path:
          type: str
          required: true
          description: 'Path to the AnnData (.h5ad) to read, e.g. ./work/spatial_input/slide.h5ad.'
        obs_keys:
          type: str
          required: false
          default: ''
          description: 'Comma-separated obs columns to characterise in full. Empty characterises every column.'
        var_names:
          type: str
          required: false
          default: ''
          description: 'Comma-separated gene symbols to check for presence. Empty checks none.'
        max_categories:
          type: int
          required: false
          default: 200
          description: 'A categorical column with more levels than this is reported with its level count only.'
        sample_spots:
          type: int
          required: false
          default: 5000
          description: 'Any positive value runs the counts and sparsity probes, which read a bounded sample of rows whatever number is given; 0 reads no expression data at all, and whether X holds counts is then reported as unknown.'
        include_capabilities:
          type: bool
          required: false
          default: true
          description: 'Also report, for every plot type, whether it can be drawn from this dataset and what blocks it.'
    - spatialomicsgym_name: list_visualization_capabilities
      description: 'List every plot this toolkit can draw, and for a named dataset which of them it can draw. [DATA REQUIREMENTS] Input: optionally one .h5ad path; with none the whole catalogue is listed without being evaluated. Required obs: none. SC reference: not needed. Image: not needed. Writes nothing.'
      parameters:
        data_path:
          type: str
          required: false
          default: ''
          description: 'Path to the AnnData (.h5ad) to read, e.g. ./work/spatial_input/slide.h5ad.'
        include_unsupported:
          type: bool
          required: false
          default: true
          description: 'Include the plots that cannot be drawn in this installation, each with the reason.'
    - spatialomicsgym_name: recommend_visualizations
      description: 'Suggest a short, ordered set of figures worth drawing for this dataset. [DATA REQUIREMENTS] Input: one .h5ad path. Required obs: none. SC reference: not needed. Image: not needed. Writes nothing.'
      parameters:
        data_path:
          type: str
          required: true
          description: 'Path to the AnnData (.h5ad) to read, e.g. ./work/spatial_input/slide.h5ad.'
        question:
          type: str
          required: false
          default: ''
          description: 'What the user is trying to find out, in their own words. Used to order the suggestions.'
        limit:
          type: int
          required: false
          default: 8
          description: 'How many suggestions to return.'
    - spatialomicsgym_name: validate_plot_request
      description: 'Check one plot request against a dataset before drawing it, and say what is missing. [DATA REQUIREMENTS] Input: one .h5ad path and a plot id. Required obs: none. SC reference: not needed. Image: not needed. Writes nothing.'
      parameters:
        data_path:
          type: str
          required: true
          description: 'Path to the AnnData (.h5ad) to read, e.g. ./work/spatial_input/slide.h5ad.'
        plot_id:
          type: str
          required: true
          description: 'The plot to check, as list_visualization_capabilities names it (for example spatial.expression).'
        params_json:
          type: str
          required: false
          default: ''
          description: 'The parameters that would be passed, as a JSON object. Empty checks only the dataset''s prerequisites.'

  spatial_viz:
    command: [python, /workspace/epic-fermat/agent/tools/spatial_viz_mcp_server.py]
    enabled: true
    benchmark_visible: false
    description: 'Draw publication-quality figures from a spatial or single-cell dataset, or from a result another tool wrote. Every figure is written with a record of how it was drawn and a manifest declaring it.'
    env:
      SPATIAL_VIZ_PYTHON: /opt/conda/envs/spatialomicsgym_env/bin/python
      SPATIAL_VIZ_WORKER: /workspace/epic-fermat/agent/tools/spatial_viz_worker.py
      SOG_WORK_DIR: "${SOG_WORK_DIR}"
    tools:
    - spatialomicsgym_name: plot_spatial_expression
      description: 'Paint continuous values on the tissue, optionally over the histology image. [DATA REQUIREMENTS] Input: one .h5ad with obsm[''spatial''] (an x/y pair in obs is used as a fallback and reported). Required obs: none. SC reference: not needed. Image: optional -- the embedded tissue image is drawn under the marks when image_key names one, and coordinates that look like array row and column indices are refused for an overlay rather than scaled by a factor that does not apply to them.'
      parameters:
        data_path:
          type: str
          required: true
          description: 'Path to the AnnData (.h5ad) to read, e.g. ./work/spatial_input/slide.h5ad.'
        genes:
          type: str
          required: false
          default: ''
          description: 'Comma-separated gene symbols, one panel each. Exactly one of genes, obs_key or obsm_key must be given. A symbol that appears twice in the object is reported as ambiguous rather than resolved to the first row.'
        obs_key:
          type: str
          required: false
          default: ''
          description: 'A numeric obs column to paint instead of a gene. For a categorical column use plot_spatial_annotation.'
        obsm_key:
          type: str
          required: false
          default: ''
          description: 'One column of an obsm matrix, written ''matrix:column'' (e.g. ulm_estimate:TGFb); ''matrix:*'' paints every column as a grid.'
        output_dir:
          type: str
          required: false
          default: ''
          description: 'Directory the figure, its record and the post-analysis manifest are written to. Empty resolves to ./work/spatial_viz (SOG_WORK_DIR honoured).'
        layer:
          type: str
          required: false
          default: ''
          description: 'Layer to read expression from instead of X (for example ''counts''). Empty lets the tool choose, and the caption says which slot it used.'
        use_raw:
          type: bool
          required: false
          default: false
          description: 'Read from .raw instead of X. Only honoured when .raw exists; the payload says if it did not.'
        library_id:
          type: str
          required: false
          default: ''
          description: 'Which section or library to draw: a value of the object''s section column (library_id, slice_id, ...) or a key of uns[''spatial'']. Empty draws every observation. An image overlay on an object with several uns[''spatial''] libraries needs one named, and the refusal lists them.'
        image_key:
          type: str
          required: false
          default: ''
          description: '''hires'' or ''lowres'' to draw the embedded tissue image under the marks. Empty draws no image. The image and its scalefactor are taken as a pair; an image whose scalefactor is missing is refused rather than registered with another resolution''s.'
        image_alpha:
          type: float
          required: false
          default: 1.0
          description: 'Opacity of the tissue image, 0 to 1. Ignored when image_key is empty.'
        spot_alpha:
          type: float
          required: false
          default: 1.0
          description: 'Opacity of the marks, 0 to 1. Around 0.7 lets the histology read through a dense section.'
        point_size:
          type: float
          required: false
          default: 0.0
          description: 'Marker area in points squared. 0 derives it from the observation count, so a Visium section and a Xenium section both come out readable.'
        color_map:
          type: str
          required: false
          default: ''
          description: 'Colour map for continuous values. Empty picks one suited to the quantity, and a signed quantity is centred on zero.'
        vmin:
          type: str
          required: false
          default: ''
          description: 'Lower colour limit: empty for the data minimum, a number, or a percentile such as p2. A clip is always stated in the caption.'
        vmax:
          type: str
          required: false
          default: ''
          description: 'Upper colour limit: empty for the data maximum, a number, or a percentile such as p98.'
        normalize:
          type: str
          required: false
          default: 'auto'
          description: '''auto'' log1p-transforms only an integer counts matrix and says so; ''none'' draws the values as stored; ''log1p'' and ''cpm_log1p'' force the transform.'
        share_scale:
          type: bool
          required: false
          default: false
          description: 'One colour scale across every panel, so panels are comparable. False gives each panel its own, and the caption then says the panels are NOT comparable.'
        ncols:
          type: int
          required: false
          default: 3
          description: 'Panels per row. At most 12 panels are drawn and the payload says how many were left out.'
        title:
          type: str
          required: false
          default: ''
          description: 'Figure title. Empty derives one from what was drawn.'
        figure_format:
          type: str
          required: false
          default: 'png'
          description: '''png'', ''svg'' or ''pdf''. PNG and SVG display in the answer; PDF is download-only. Above 50,000 marks the point layer is rasterised inside a vector file so the export stays servable.'
        dpi:
          type: int
          required: false
          default: 0
          description: 'Raster resolution. 0 uses the repository default of 200.'
        figure_id:
          type: str
          required: false
          default: ''
          description: 'A short name for this figure, used later by update_visualization. Empty derives a stable one, so re-running the same request overwrites rather than accumulating.'
    - spatialomicsgym_name: plot_spatial_annotation
      description: 'Paint a categorical annotation -- domain, cell type or cluster -- on the tissue. [DATA REQUIREMENTS] Input: one .h5ad with obsm[''spatial''] and at least one categorical obs column. Required obs: a categorical column; empty infers a domain, cluster or cell-type column. SC reference: not needed. Image: optional -- drawn under the marks when image_key names one.'
