# Read the Docs configuration for SpatialOmicsLab.
# Docs: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The build installs only docs/requirements.txt. The API reference is parsed from the source by
# sphinx-autoapi and the tool catalogue is generated from the tool specs and the MCP config, so the
# package and its scientific dependencies (torch, scanpy, R, ...) are never installed here.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  builder: html
  # The build is warning-free (warnings that originate in the package's docstrings are muted in conf.py), so a
  # broken link or directive in a hand-written page fails the build instead of silently shipping.
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt

formats:
  - htmlzip
